<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบแบบสอบถามกลาง · PHC37</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="svy-run.css">
<!-- PHC37 PWA 2.18.0 — svy.html (PHC37-SVY-APP-1.0.0 · 23 พ.ย. 2569) : ระบบแบบสอบถามกลาง (หน้าเจ้าหน้าที่ · เปิดในแอปผ่าน svy.js)
     เมนู: รอฉันตอบ · แบบสอบถามของกลุ่มงาน · สร้าง · ผลที่แชร์ถึงฉัน · ภาพรวมทั้งหมด (superadmin) · กลับหน้าหลัก
     ข้อตกลงผู้ใช้ 22–23 พ.ย. 2569 อยู่ในเอกสาร claude/PHC37_SurveyCenter.md -->
<style>
:root{--g:#15703A;--g2:#3DA852;--gl:#EAF6EC;--bg:#F4F6F4;--line:#DCE7DF;--ink:#1F3326;--mute:#5B6B60;--warn:#B45309;--warnbg:#FFF4E0;--red:#B42318;--redbg:#FDECEA;--blue:#1D4F91;--bluebg:#E8F1FB}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.app{display:flex;min-height:100%}
.side{width:236px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:var(--g);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.brand b{display:block;font-size:15px}.brand span{font-size:12px;color:var(--mute)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--ink);cursor:pointer;min-height:42px}
.nav button:hover{background:#F1F6F2}
.nav button.on{background:var(--gl);color:var(--g);font-weight:600}
.nav .bd{margin-left:auto;background:#E5484D;color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:0 7px;line-height:20px}
.side-foot{margin-top:auto;padding:8px 4px 0}
.who{font-size:12px;color:var(--mute);padding:0 8px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#B9CDBF}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.edit{background:#FFF1E2;border-color:#F8D7B0;color:#9A4A00}
.btn.view{background:var(--gl);border-color:#CDEBD3;color:var(--g)}
.btn.dan{background:#fff;border-color:#F4C7C3;color:var(--red)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
main{flex:1;min-width:0;padding:20px 22px 60px}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:22px;margin:0;line-height:1.35}
.head p{margin:2px 0 0;color:var(--mute);font-size:14px}
.head .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#B9CDBF}
.kpi span{display:block;font-size:13px;color:var(--mute)}
.kpi b{display:block;font-size:26px;line-height:1.25;margin-top:2px}
.kpi small{display:block;font-size:12px;color:var(--mute)}
.bar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:34px;padding:0 14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.search{margin-left:auto;min-width:220px;min-height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
table.tb{width:100%;border-collapse:collapse}
.tb th{font-size:13px;color:var(--mute);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#FAFCFA}
.tb td{padding:12px;border-bottom:1px solid #EEF3EF;vertical-align:middle;font-size:14px}
.tb tr:last-child td{border-bottom:0}
.tb .t b{display:block;font-size:15px}.tb .t small{color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st.open{background:#DCFCE7;color:#166534}.st.draft{background:#EEF1EF;color:#475569}.st.closed{background:#E5E7EB;color:#374151}.st.wait{background:var(--warnbg);color:var(--warn)}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
.empty .big{font-size:40px}
.inbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ib{padding:16px;display:flex;flex-direction:column;gap:6px}
.ib h3{margin:0;font-size:17px;line-height:1.4}
.ib p{margin:0;color:var(--mute);font-size:14px;white-space:pre-line}
.ib .meta{font-size:13px;color:var(--mute)}
.ib .btn{margin-top:8px}
/* ฟอร์มสร้าง */
.form{display:grid;gap:14px;max-width:880px}
.sec{padding:16px}
.sec h2{font-size:17px;margin:0 0 10px}
.sec .sub{font-size:13px;color:var(--mute);margin:-6px 0 10px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:13px;font-weight:600;color:var(--mute)}
.in,.ta,.sel{border:1px solid var(--line);border-radius:10px;min-height:40px;padding:6px 10px;background:#fff;color:var(--ink);width:100%}
.ta{min-height:70px;resize:vertical}
.in:focus,.ta:focus,.sel:focus{outline:3px solid #CFEAD5;border-color:var(--g2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;cursor:pointer;color:var(--ink);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--g);color:#fff}
.seg button:disabled{cursor:default;opacity:.6}
.hint{font-size:13px;color:var(--mute);line-height:1.5;margin:8px 0 0}
.note{font-size:13px;border-radius:10px;padding:8px 12px;line-height:1.5;margin:8px 0 0}
.note.info{background:var(--bluebg);color:var(--blue)}.note.warn{background:var(--warnbg);color:var(--warn)}.note.lock{background:#F1F5F9;color:#334155}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:36px}
.sw input{width:20px;height:20px;accent-color:var(--g)}
.masc{display:flex;gap:10px;flex-wrap:wrap}
.masc button{border:2px solid var(--line);background:#F3FBEF;border-radius:14px;padding:6px 8px 4px;cursor:pointer;width:104px;text-align:center}
.masc button.on{border-color:var(--g2);background:var(--gl)}
.masc svg{width:74px;height:80px}
.masc span{display:block;font-size:12px;color:var(--mute)}
.pick{border:1px dashed #C9D9CE;border-radius:12px;padding:10px;margin-top:8px;background:#FCFEFC}
.pick .gl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:#fff;min-height:32px;padding:0 10px;cursor:pointer;font-size:13px}
.tag.on{background:var(--gl);border-color:#9FD3AB;color:var(--g);font-weight:600}
.tag .x{font-weight:700;color:var(--mute)}
.pres{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:#fff}
.pres div{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;font-size:14px;border-bottom:1px solid #F0F4F1}
.pres div:hover{background:#F6FAF7}
.pres small{color:var(--mute);margin-left:auto}
/* คำถาม */
.qadd{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qi{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}
.qi.secq{background:#F6FAF7}
.qi-h{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.qi-h b{font-size:13px;color:var(--g)}
.qi-h .sp{flex:1}
.ib2{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:32px;min-height:32px;cursor:pointer}
.ib2:disabled{opacity:.4;cursor:default}
.opt{display:flex;gap:6px;align-items:center;margin-top:6px}
.opt .sel{width:64px;flex:none;padding:4px}
.styles{display:flex;gap:6px;flex-wrap:wrap}
.styles button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:40px}
.styles button.on{border-color:var(--g2);background:var(--gl);font-weight:600}
.styles svg{width:22px;height:22px}
.save-bar{position:sticky;bottom:0;background:rgba(244,246,244,.96);border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:880px;z-index:4}
.save-bar .sp{flex:1}
.dirty{font-size:13px;color:var(--warn)}
/* สรุป */
.qs{padding:16px;margin-bottom:12px}
.qs h3{margin:0 0 4px;font-size:16px}
.qs .meta{font-size:13px;color:var(--mute);margin-bottom:10px}
.hb{display:grid;grid-template-columns:120px 1fr 92px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.hb .tr{height:14px;background:#EEF3EF;border-radius:7px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:7px}
.hb .n{text-align:right;color:var(--mute);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tx{border-top:1px solid #EEF3EF;padding:10px 0}
.tx p{margin:0 0 4px;white-space:pre-line}
.tx small{color:var(--mute)}
.mini th,.mini td{padding:8px 10px}
/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(15,30,20,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mc{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:92vh;overflow:auto;position:relative}
.mc.wide{max-width:440px;background:transparent}
.mc .x{position:absolute;right:10px;top:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer;font-size:18px}
.mb{padding:20px}
.qrbox{display:flex;justify-content:center;margin:10px 0}
.qrbox svg{width:240px;height:240px}
.link{display:flex;gap:6px}
.link input{flex:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F3326;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:var(--red)}
.runwrap{max-width:560px;margin:0 auto;border-radius:22px;overflow:hidden;border:1px solid var(--line);min-height:70vh;display:flex}
.runwrap>.sr{flex:1}
/* หน้าเปิดระบบ (เส้นชีพจร) */
.p37b{position:fixed;inset:0;z-index:70;background:#F4F6F4;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .25s ease}
.p37b.out{opacity:0;pointer-events:none}
.p37b-card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:320px}
.p37b-logo{display:block;width:84px;height:84px;border-radius:20px;border:1px solid #D8DED9;background:#fff url(icons/icon-192.png) center/88% no-repeat;animation:p37bBeat 1.6s ease-in-out infinite}
.p37b-ecg{width:200px;height:44px;overflow:visible}
.p37b-ecg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.p37b-ecg-base{stroke:#D3E9D6;stroke-width:2.5}
.p37b-ecg-run{stroke:#3DA852;stroke-width:3;stroke-dasharray:90 310;stroke-dashoffset:400;animation:p37bRun 1.6s linear infinite}
.p37b-text{font-size:16px;font-weight:600;color:#15703A;min-height:24px;line-height:1.5}
.p37b-brand{font-size:13px;color:#4A5550;margin-top:6px}
@keyframes p37bRun{to{stroke-dashoffset:0}}
@keyframes p37bBeat{0%,100%{transform:scale(1)}52%{transform:scale(1)}58%{transform:scale(1.06)}66%{transform:scale(.99)}72%{transform:scale(1.03)}}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;align-items:center;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:4px}
  .brand,.who{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav button{white-space:nowrap;padding:8px 10px;min-height:38px}
  .side-foot{margin:0 0 0 4px;padding:0}
  .side-foot .btn{white-space:nowrap}
  main{padding:14px 12px 60px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row2,.grid2{grid-template-columns:1fr}
  .search{margin-left:0;min-width:0;width:100%}
  table.tb thead{display:none}
  table.tb,.tb tbody,.tb tr,.tb td{display:block;width:100%}
  .tb tr{border-bottom:1px solid var(--line);padding:8px 0}
  .tb td{border:0;padding:4px 12px}
  .tb td[data-l]:before{content:attr(data-l) ' · ';color:var(--mute);font-size:12px}
  .hb{grid-template-columns:90px 1fr 76px}
}
@media print{
  .side,.save-bar,.bar-row,.no-print,#toast{display:none!important}
  main{padding:0}
  .card,.kpi{break-inside:avoid}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){.p37b-logo,.p37b-ecg-run{animation:none}}
</style>
</head>
<body>
<div id="p37b" class="p37b" role="status" aria-live="polite"><div class="p37b-card"><span class="p37b-logo" role="img" aria-label="ตรา ศบส.37"></span>
<svg class="p37b-ecg" viewBox="0 0 180 40" aria-hidden="true"><path class="p37b-ecg-base" d="M0 22 H62 L70 22 L76 12 L82 22 L90 22 L96 4 L104 38 L110 16 L116 22 H180"/><path class="p37b-ecg-run" d="M0 22 H62 L70 22 L76 12 L82 22 L90 22 L96 4 L104 38 L110 16 L116 22 H180" pathLength="400"/></svg>
<div class="p37b-text" id="p37bText">กำลังเปิดระบบแบบสอบถาม</div><div class="p37b-brand">ศบส.37 ประสงค์ - สุดสาคร ตู้จินดา</div></div></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="lg">37</div><div><b>แบบสอบถามกลาง</b><span>PHC37</span></div></div>
    <nav class="nav" id="nav">
      <button type="button" data-v="inbox">📝 รอฉันตอบ <span class="bd" id="bd" hidden></span></button>
      <button type="button" data-v="mine">📋 ของกลุ่มงาน</button>
      <button type="button" data-v="create">➕ สร้างแบบสอบถาม</button>
      <button type="button" data-v="shared">🤝 ผลที่แชร์ถึงฉัน</button>
      <button type="button" data-v="all" id="nav-all" hidden>🌐 ภาพรวมทั้งหมด</button>
    </nav>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <button type="button" class="btn block" id="home">← กลับหน้าหลัก</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal" hidden><div class="mc" id="mc"><button type="button" class="x" id="mx" aria-label="ปิด">✕</button><div id="mbody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="svy-run.js"></script>
<script>
(function () {
  'use strict';
  var P = null; try { P = window.parent && window.parent.PHC37 ? window.parent.PHC37 : null; } catch (e) { P = null; }
  var $ = function (id) { return document.getElementById(id); };
  var main = $('main');
  var ST = { me: null, view: '', dirty: false, people: null, list: {}, filter: 'all', q: '' };
  var TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var ICONS = ['', '🩺', '💉', '👶', '🤰', '🦷', '💊', '🏥', '🏠', '📋', '🧪', '👴', '🚶', '⏱️', '📞', '💬', '✨', '😊', '⚡', '👍', '❤️', '❓'];
  var KIND_L = { rating: 'คะแนน', single: 'เลือกข้อเดียว', multi: 'เลือกหลายข้อ', text: 'ข้อความ', yesno: 'ใช่ / ไม่ใช่', section: 'หัวข้อส่วน' };
  var STYLE_L = { face5: 'หน้าอารมณ์ 5 หน้า', face3: 'หน้าอารมณ์ 3 หน้า', star: 'ดาว 1–5', words: 'ระดับคำ' };
  var MASC_L = { A: 'หมอน้อยคลาสสิก', B: 'หมอน้อยผู้หญิง', D: 'หมอหัวใจ' };
  var REACT_D = { hi: 'เย้! ขอบคุณมากนะคะ', mid: 'ขอบคุณที่แสดงความคิดเห็นค่ะ', lo: 'ขอบคุณที่แสดงความคิดเห็นค่ะ เราจะนำไปปรับปรุง' };

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }
  function btn(text, cls, fn) { var b = el('button', 'btn' + (cls ? ' ' + cls : ''), text); b.type = 'button'; if (fn) b.addEventListener('click', fn); return b; }
  function toast(t, err) { var x = $('toast'); x.textContent = t; x.className = 'show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(function () { x.className = ''; }, 3200); }
  function thDate(s) { if (!s) return ''; var p = String(s).slice(0, 10).split('-'); if (p.length < 3) return s; return (+p[2]) + ' ' + TH_M[+p[1] - 1] + ' ' + (+p[0] + 543); }
  function range(a, b) { if (!a && !b) return 'ไม่กำหนด'; if (a && b) return thDate(a) + ' – ' + thDate(b); return a ? 'ตั้งแต่ ' + thDate(a) : 'ถึง ' + thDate(b); }
  function gLabel(k) { var w = (ST.me && ST.me.workgroups) || []; for (var i = 0; i < w.length; i++) if (w[i].group_key === k) return w[i].label; return k || ''; }
  function api(action, data) {
    if (!P) return Promise.resolve({ ok: false, message: 'กรุณาเปิดผ่านแอป PHC37' });
    data = data || {}; data.token = P.token();
    return P.api(action, data).then(function (r) {
      if (r && !r.ok && r.code === 'unauthorized') { try { P.showLogin(r.message); } catch (e) {} }
      return r || { ok: false, message: 'ไม่มีการตอบกลับ' };
    }, function () { return { ok: false, message: 'เชื่อมต่อไม่ได้ กรุณาลองใหม่' }; });
  }
  function loading(t) { main.textContent = ''; var d = el('div', 'empty'); d.appendChild(el('div', 'big', '⏳')); d.appendChild(el('div', null, t || 'กำลังโหลด…')); main.appendChild(d); }
  function head(title, sub, right) {
    var h = el('div', 'head'), t = el('div');
    t.appendChild(el('h1', null, title)); if (sub) t.appendChild(el('p', null, sub));
    h.appendChild(t); h.appendChild(el('div', 'sp'));
    (right || []).forEach(function (b) { h.appendChild(b); });
    main.appendChild(h); return h;
  }

      if (S.audience !== 'staff' && S.status !== 'draft') right.push(btn('QR', '', function () { qr({ id: S.id, code: S.code, title: S.title, status: S.status }); }));
      right.push(btn('ส่งออก Excel', '', function () { exportCsv(S.id); }));
      right.push(btn('พิมพ์ / PDF', '', function () { window.print(); }));
      head(S.title, st[1] + ' · ' + audL(S.audience) + (S.audience !== 'public' ? ' · ' + (S.identity === 'named' ? 'ระบุตัวตน' : 'ไม่ระบุตัวตน') : '') + ' · ' + range(S.openOn, S.closeOn) + ' · ' + gLabel(S.owner), right);
      if (S.audience === 'both') {
        var bar = el('div', 'bar-row');
        [['all', 'ทั้งหมด'], ['staff', 'เจ้าหน้าที่'], ['public', 'ประชาชน']].forEach(function (a) {
          var c = el('button', 'chip' + (a[0] === ch ? ' on' : ''), a[1]); c.type = 'button'; c.addEventListener('click', function () { vSum(id, a[0]); }); bar.appendChild(c);
        });
        main.appendChild(bar);
      }
      var k = el('div', 'kpis');
      function kpi(label, val, small, color) { var c = el('div', 'kpi'); c.appendChild(el('span', null, label)); var b = el('b', null, val); if (color) b.style.color = color; c.appendChild(b); if (small) c.appendChild(el('small', null, small)); k.appendChild(c); }
      kpi('ผู้ตอบ', String(r.total), S.audience === 'both' ? 'เจ้าหน้าที่ ' + r.staffN + ' · ประชาชน ' + r.publicN : '');
      if (r.kpi && r.kpi.avg !== null) kpi('คะแนนเฉลี่ย (ข้อแรก)', r.kpi.avg.toFixed(2) + ' / ' + r.kpi.max, 'ระดับ "' + r.kpi.level + '"', 'var(--g)');
      else kpi('คะแนนเฉลี่ย', '—', 'ยังไม่มีคำถามคะแนน');
      if (r.kpi && r.kpi.goodPct !== null) kpi('ร้อยละพึงพอใจ', r.kpi.goodPct + '%', 'ให้ ' + (r.kpi.max === 3 ? '"พอใจ"' : '4–5 คะแนน') + ' (' + r.kpi.goodN + ' จาก ' + r.kpi.n + ')');
      else kpi('ร้อยละพึงพอใจ', '—', '');
      if (S.audience !== 'public') kpi('อัตราตอบ (เจ้าหน้าที่)', r.rate === null ? '—' : r.rate + '%', r.doneN + ' จาก ' + r.recipients + ' คนที่ได้รับแจก');
      else kpi('ตอบวันนี้ได้ที่', 'QR', 'สแกนจากจุดบริการ');
      main.appendChild(k);
      if (!r.total) { var e = el('div', 'card empty'); e.appendChild(el('div', 'big', '🌱')); e.appendChild(el('div', null, 'ยังไม่มีผู้ตอบ')); main.appendChild(e); return; }
      var n = 0;
      r.questions.forEach(function (q) {
        var c = el('div', 'card qs'); n++;
        c.appendChild(el('h3', null, 'ข้อ ' + n + ' · ' + q.title));
        if (q.kind === 'rating') {
          c.appendChild(el('div', 'meta', 'ตอบ ' + q.n + ' คน' + (q.avg !== null ? ' · เฉลี่ย ' + q.avg.toFixed(2) + ' (' + q.level + ') · พึงพอใจ ' + q.goodPct + '%' : '')));
          var labs = q.max === 3 ? ['ไม่พอใจ', 'เฉย ๆ', 'พอใจ'] : (q.style === 'face5' ? ['ไม่พอใจมาก', 'ไม่พอใจ', 'เฉย ๆ', 'พอใจ', 'พอใจมาก'] : ['น้อยที่สุด', 'น้อย', 'ปานกลาง', 'มาก', 'มากที่สุด']);
          for (var v = q.max; v >= 1; v--) hbar(c, v + ' ' + labs[v - 1], q.counts[v - 1], q.n, BAR_C[q.max === 3 ? [1, 3, 5][v - 1] : v]);
        } else if (q.kind === 'single' || q.kind === 'multi') {
          c.appendChild(el('div', 'meta', 'ตอบ ' + q.n + ' คน' + (q.kind === 'multi' ? ' · เลือกได้หลายข้อ' : '')));
          q.options.forEach(function (o) { hbar(c, (o.icon ? o.icon + ' ' : '') + o.label, o.n, q.n, '#3DA852'); });
        } else if (q.kind === 'yesno') {
          c.appendChild(el('div', 'meta', 'ตอบ ' + q.n + ' คน'));
          hbar(c, '👍 ใช่', q.yes, q.n, '#2EAD4B'); hbar(c, '👎 ไม่ใช่', q.no, q.n, '#F57C1F');
        } else if (q.kind === 'text') {
          c.appendChild(el('div', 'meta', q.items.length + (q.more ? '+' + q.more : '') + ' ข้อความ'));
          q.items.slice(0, 60).forEach(function (t) {
            var d = el('div', 'tx'); d.appendChild(el('p', null, '“' + t.text + '”'));
            d.appendChild(el('small', null, [t.channel === 'staff' ? 'เจ้าหน้าที่' : 'ประชาชน', t.name, t.group, t.band, thDate(t.date)].filter(Boolean).join(' · ')));
            c.appendChild(d);
          });
          if (q.items.length > 60) c.appendChild(el('div', 'hint', 'แสดง 60 ข้อความล่าสุด · ดูทั้งหมดได้จาก "ส่งออก Excel"'));
        }
        main.appendChild(c);
      });
      var g2 = el('div', 'grid2');
      if (r.byGroup.length) g2.appendChild(miniTable('เจ้าหน้าที่ · แยกกลุ่มงาน', ['กลุ่มงาน', 'ผู้ตอบ', 'เฉลี่ย'], r.byGroup.map(function (x) { return [x.group, x.n, x.avg === null ? '—' : x.avg.toFixed(2)]; }),
        S.identity === 'anon' ? 'แสดงทุกกลุ่มตามที่ตั้งไว้ · กลุ่มที่มีผู้ตอบน้อยอาจระบุตัวผู้ตอบได้ ใช้ผลอย่างระมัดระวัง' : ''));
      if (r.byAge.length) g2.appendChild(miniTable('ประชาชน · แยกช่วงอายุ', ['ช่วงอายุ', 'ผู้ตอบ', 'เฉลี่ย'], r.byAge.map(function (x) { return [x.band, x.n, x.avg === null ? '—' : x.avg.toFixed(2)]; }), 'จัดช่วงจากอายุที่กรอก · ปรับจุดแบ่งได้ในหน้าตั้งค่า'));
      if (g2.children.length) main.appendChild(g2);
    });
  }
  function hbar(c, label, n, total, color) {
    var row = el('div', 'hb'); row.appendChild(el('span', null, label));
    var tr = el('div', 'tr'), i = el('i'); i.style.width = (total ? Math.round(n * 100 / total) : 0) + '%'; i.style.background = color; tr.appendChild(i); row.appendChild(tr);
    row.appendChild(el('span', 'n', n + ' (' + (total ? Math.round(n * 1000 / total) / 10 : 0) + '%)')); c.appendChild(row);
  }
  function miniTable(title, cols, rows, note) {
    var c = el('div', 'card qs'); c.appendChild(el('h3', null, title));
    var t = el('table', 'tb mini'), th = el('thead'), tr = el('tr');
    cols.forEach(function (x) { tr.appendChild(el('th', null, x)); }); th.appendChild(tr); t.appendChild(th);
    var tb = el('tbody');
    rows.forEach(function (r) { var tr2 = el('tr'); r.forEach(function (v, i) { var td = el('td', null, String(v)); td.dataset.l = cols[i]; tr2.appendChild(td); }); tb.appendChild(tr2); });
    t.appendChild(tb); c.appendChild(t);
    if (note) c.appendChild(el('div', 'hint', note));
    return c;
  }
  function exportCsv(id) {
    toast('กำลังเตรียมไฟล์…');
    api('svy.export', { id: id }).then(function (r) {
      if (!r.ok) return toast(r.message, true);
      var q = function (v) { v = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      var lines = [r.head.map(q).join(',')].concat(r.rows.map(function (row) { return row.map(q).join(','); }));
      var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = (r.title || 'survey').replace(/[\\\/:*?"<>|]/g, '_').slice(0, 80) + '.csv';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('ส่งออกแล้ว ' + r.rows.length + ' แถว (เปิดด้วย Excel ได้)');
    });
  }

  // ---------- เริ่ม ----------
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) { b.addEventListener('click', function () { go(b.dataset.v); }); });
  $('home').addEventListener('click', function () { if (!confirmLeave()) return; ST.dirty = false; try { window.parent.PHC37.goHome(); } catch (e) {} });
  window.addEventListener('beforeunload', function (e) { if (ST.dirty) { e.preventDefault(); e.returnValue = ''; } });
  function hideBoot() { var b = $('p37b'); b.classList.add('out'); setTimeout(function () { b.style.display = 'none'; }, 300); }
  api('svy.boot', {}).then(function (r) {
    if (!r.ok) { $('p37bText').textContent = r.message || 'เปิดระบบไม่สำเร็จ'; return; }
    ST.me = r;
    $('who').textContent = 'เข้าใช้ในนาม: ' + r.user.name + ((r.groups || []).length ? ' · ' + r.groups.map(gLabel).join(', ') : '');
    $('nav-all').hidden = !r.isSuper;
    badge(r.inboxCount);
    hideBoot();
    var h = location.hash.slice(1);
    go(h || (r.inboxCount ? 'inbox' : 'mine'));
  });
})();
</script>
