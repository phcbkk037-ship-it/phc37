/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}
.phc-table .phc-num{text-align:right;font-variant-numeric:tabular-nums}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

function callRaw_(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(r=>{
      if(!r){ reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); return; }
      if(!r.ok){ { const mm=String(r.message||''); if(mm.indexOf('Session')>=0||mm.indexOf('เปิดระบบใหม่')>=0) sessionLost(); } reject(new Error(r.message||'เกิดข้อผิดพลาด')); return; }
      resolve(r.data !== undefined ? r.data : r);
    }).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}
/* PHC37Load (UI Kit 1.2.0): เส้นวิ่งด้านบนระหว่างรอเซิร์ฟเวอร์ (ขึ้นเมื่อรอเกิน 0.3 วินาที) */
function call(fn, ...args){
  const L=window.PHC37Load; if(L) L.line.start();

}

  if(S.inboxErr&&S.inboxCount==null){ el.innerHTML=`<h3>📥 รับจากระบบส่งต่อ</h3><p class="muted">ตรวจระบบส่งต่อกลางไม่ได้: ${esc(S.inboxErr)}</p><button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="S.inboxErr='';refreshInboxCount();drawInboxCard()">ลองใหม่</button>`; return; }

/* ---------- registry ---------- */
async function loadList(force){ if(S.list&&!force) return S.list; S.list=await api('apiEpisodes'); return S.list; }
async function renderRegistry(){
  if(!S.list) loading('กำลังโหลดรายชื่อ…');
  try{ await loadList(true); }catch(e){ if(!S.list){ errBox(e); return; } toast(e.message,true); }
  if(S.page!=='registry') return;
  const f=S.filters, comms=[...new Set(S.list.map(r=>r.CommunityName||'ไม่ระบุชุมชน'))].sort((a,b)=>a.localeCompare(b,'th'));
  $('content').innerHTML=`<div class="page-head"><div><h2>ผู้ป่วย IMC</h2><p>1 แถว = 1 รอบการดูแล · กดที่แถวเพื่อเปิดแฟ้ม</p></div>
    <div class="actions"><button class="phc-btn phc-btn--secondary" onclick="printRegistry()">🖨️ พิมพ์รายชื่อ</button>${can('add')?`<button class="phc-btn" onclick="admitForm()">➕ รับผู้ป่วยเข้าโปรแกรม</button>`:''}</div></div>
  <div class="toolbar"><input class="phc-input grow" id="fq" placeholder="ค้นชื่อ / HN / เลข IMC" value="${esc(f.q)}" oninput="S.filters.q=this.value;drawRegistry()">
    <select class="phc-select" onchange="S.filters.s=this.value;drawRegistry()">${opt('ACTIVE','อยู่ในการดูแล',f.s==='ACTIVE')}${opt('CLOSED','ปิดแล้ว',f.s==='CLOSED')}${opt('','ทุกสถานะ',!f.s)}</select>
    <select class="phc-select" onchange="S.filters.d=this.value;drawRegistry()">${opt('','ทุกกลุ่มโรค',!f.d)}${S.text.diseases.map(x=>opt(x[0],tx('diseaseShort',x[0]),f.d===x[0])).join('')}</select>
    <select class="phc-select" onchange="S.filters.c=this.value;drawRegistry()">${opt('','ทุกชุมชน',!f.c)}${comms.map(c=>opt(c,c,f.c===c)).join('')}</select></div>
  <div id="regBody"></div>`;
  drawRegistry();
}
function regRows(){ const f=S.filters, q=norm(f.q); return S.list.filter(r=>(!f.s||r.Status===f.s)&&(!f.d||r.Disease===f.d)&&(!f.c||(r.CommunityName||'ไม่ระบุชุมชน')===f.c)&&(!q||norm(r.FullName+r.HN+r.EpisodeNo).indexOf(q)>=0)); }
function drawRegistry(){
  const rows=regRows(), el=$('regBody'); if(!el) return;
  el.innerHTML=`<p class="muted small">${esc(rows.length)} รายการ</p>${rows.length?`<div class="table-wrap"><table class="t rt"><thead><tr><th>ผู้ป่วย</th><th>โรค</th><th class="hide-sm">รับเข้า / ครบกำหนด</th><th>BI แรกรับ → ล่าสุด</th><th class="hide-sm">นัดถัดไป</th><th>สถานะ / ต้องติดตาม</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" onclick="openFile('${esc(r.EpisodeID)}','registry')">
    <td><b>${esc(r.FullName)}</b><small>${esc(r.EpisodeNo)} · HN ${esc(r.HN||'-')} · ${esc(ageSex(r))}</small><small>${esc(r.CommunityName||'')}</small></td>
    <td>${dzChip(r)}${r.Source==='REFER'?'<small>📥 จากระบบส่งต่อ</small>':''}</td>
    <td class="hide-sm">${esc(shortDate(r.AdmitDate))}<small>ครบ ${esc(shortDate(r.EndDue))}</small>${r.Status==='ACTIVE'?dayBar(r):''}</td>
    <td>${biText(r)}</td><td class="hide-sm">${r.Status==='ACTIVE'?(r.NextAppt?esc(shortDate(r.NextAppt)):'<span class="muted">-</span>'):'<span class="muted">-</span>'}</td>
    <td>${r.Status==='CLOSED'?stChip(r)+'<small>'+esc(shortDate(r.CloseDate))+'</small>':flagChips(r.flags,2)||chip('ปกติ','success')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">ไม่พบรายการตามตัวกรอง</div>'}`;
}
function printRegistry(){
  const rows=regRows(), f=S.filters;
  kitPrint({ title:'ทะเบียนผู้ป่วยฟื้นฟูสมรรถภาพระยะกลาง (IMC)', orientation:'landscape', docDate:shortDate(todayKey()),
    meta:[['สถานะ',f.s==='ACTIVE'?'อยู่ในการดูแล':(f.s==='CLOSED'?'ปิดแล้ว':'ทุกสถานะ')],['กลุ่มโรค',f.d?tx('diseaseShort',f.d):'ทั้งหมด'],['จำนวน',rows.length+' รายการ']],
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>#</th><th>เลข IMC</th><th>ชื่อ-สกุล</th><th>HN</th><th>อายุ</th><th>โรค</th><th>รับเข้า</th><th>ครบกำหนด</th><th>BI แรกรับ</th><th>BI ล่าสุด</th><th>นัดถัดไป</th><th>สถานะ</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="phc-p-num">${i+1}</td><td>${esc(r.EpisodeNo)}</td><td>${esc(r.FullName)}</td><td>${esc(r.HN||'-')}</td><td class="phc-p-num">${esc(r.Age)}</td><td>${esc(dzShort(r))}</td><td>${esc(shortDate(r.AdmitDate))}</td><td>${esc(shortDate(r.EndDue))}</td><td class="phc-p-num">${esc(r.BIAdmit)}</td><td class="phc-p-num">${esc(r.Status==='CLOSED'&&r.BIClose!==''?r.BIClose:r.BILatest)}</td><td>${r.Status==='ACTIVE'&&r.NextAppt?esc(shortDate(r.NextAppt)):'-'}</td><td>${r.Status==='CLOSED'?'ปิด '+esc(shortDate(r.CloseDate))+' ('+esc(tx('closeMap',r.CloseReason))+')':esc((r.flags||[]).map(x=>x.text).join(', ')||'อยู่ในการดูแล')}</td></tr>`).join('')}</tbody></table>` });
}

/* ---------- admit (search central record -> form) ---------- */
async function ensureComms(){ if(S.comms) return; try{ S.comms=await api('apiCommunities',false); }catch(e){ S.comms=[]; } }
function commSelect(id, cur){ const list=S.comms||[]; const has=!cur||list.some(c=>c.CommunityName===cur); return `<select class="phc-select" id="${id}">${opt('','ไม่ระบุ',!cur)}${list.map(c=>opt(c.CommunityName,c.CommunityName,c.CommunityName===cur)).join('')}${has?'':opt(cur,cur,true)}</select>`; }
function cidOk(c){ if(!allDigits(c,13)) return false; let s=0; for(let i=0;i<12;i++) s+=Number(c[i])*(13-i); return (11-(s%11))%10===Number(c[12]); }
function addMonths(k, n){ if(!k) return ''; let [y,m,d]=k.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} const last=new Date(Date.UTC(y,m,0)).getUTCDate(); return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(d,last)).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000); }
function refBox(r){
  if(!r) return '';
  const f=r.InternalForm||{}, rows=[['เลขส่งต่อ',r.ReferralSN],['จากกลุ่มงาน',r.FromWorkGroup+(r.FromUserName?' · '+r.FromUserName:'')],['วันที่ส่ง',shortDate(r.ReferralDate)],['ความเร่งด่วน',r.PriorityTH||r.Priority],['โรค',f.disease],['อาการ / Lab',f.symptomsLab],['ปัญหา / ความต้องการ',r.ReferralReason]].filter(x=>x[1]);
  const extra=(r.SourceData||[]).filter(sec=>sec&&sec.title!=='แบบส่งต่อภายใน').map(sec=>`<div class="sub">${esc(sec.title)}</div><dl class="kv">${(sec.rows||[]).map(x=>`<dt>${esc(x.label)}</dt><dd>${esc(x.value)}</dd>`).join('')}</dl>`).join('');
  return `<div class="refbox"><b>📥 ใบส่งต่อจากระบบส่งต่อกลาง</b><dl class="kv" style="margin-top:6px">${rows.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl>${extra}</div>`;
}
async function admitForm(ref){
  S.adm={ ref:ref||null, pick:null, isNew:false, rows:[] };
  openModal(ref?'รับเข้าโปรแกรม IMC จากใบส่งต่อ '+ref.ReferralSN:'รับผู้ป่วยเข้าโปรแกรม IMC', `${refBox(ref)}
    <p class="muted small" style="margin:0 0 8px">ขั้นที่ 1 ค้นหาผู้ป่วยในเวชระเบียนกลาง (HN / เลขบัตรประชาชน / ชื่อ)</p>
    <div class="toolbar"><input class="phc-input grow" id="psKey" placeholder="พิมพ์ HN / เลขบัตร / ชื่อ แล้วกด Enter" onkeydown="if(event.key==='Enter')searchPatients()"><button class="phc-btn" id="psBtn" onclick="searchPatients()">🔍 ค้นหา</button></div>
    <div id="psRes"></div>`, '', 'lg');

async function searchPatients(){
  const k=val('psKey'), b=$('psBtn'); if(k.length<2){ toast('กรุณาพิมพ์อย่างน้อย 2 ตัวอักษร',true); return; }

    const rows=await api('apiSearchPatients',k); S.adm.rows=rows; const ref=S.adm.ref;
    $('psRes').innerHTML=`${rows.length?`<div class="stack" style="gap:6px">${rows.map((r,i)=>{ const p=r.patient, act=r.active;
      const right=act?(ref&&!act.hasReferral?`<span class="chip tone-warning">มีรอบเปิดอยู่ ${esc(act.EpisodeNo)}</span>`:`<span class="chip tone-warning">มีรอบเปิดอยู่ ${esc(act.EpisodeNo)}</span>`):(r.registered?`<span class="chip tone-info">เคยรับเข้า ${esc(r.registered.episodes)} รอบ</span>`:'');
      return `<div class="pick" onclick="${act?`activeHit(${i})`:`pickPatient(${i})`}"><div><b>${esc(p.FullName)}</b><span>HN ${esc(p.HN||'-')} · ${esc(p.CIDMasked||'ไม่มีเลขบัตร')} · ${esc([r.age!==''?r.age+' ปี':'',SEX_TH[p.Sex]||''].filter(Boolean).join(' '))} · ${esc(p.CommunityName||'')}</span></div>${right}</div>`; }).join('')}</div>`:'<p class="muted">ไม่พบในเวชระเบียนกลาง</p>'}
      <div style="margin-top:10px"><button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="admitPerson(null,true)">➕ ไม่พบ — เพิ่มผู้ป่วยใหม่ (เพิ่มเข้าเวชระเบียนกลางด้วย)</button></div>`;
  }catch(e){ $('psRes').innerHTML=`<p style="color:var(--phc-danger)">${esc(e.message)}</p>`; } finally{ setBusy(b,false); }

function activeHit(i){
  const r=S.adm.rows[i], act=r.active, ref=S.adm.ref;
  if(ref&&!act.hasReferral){ confirmBox('เชื่อมใบส่งต่อกับรอบที่เปิดอยู่', `<b>${esc(r.patient.FullName)}</b> มีรอบการดูแล <b>${esc(act.EpisodeNo)}</b> ที่ยังเปิดอยู่<br>ต้องการรับงานใบส่งต่อ <b>${esc(ref.ReferralSN)}</b> และเชื่อมกับรอบนี้หรือไม่ (ถ้าประเมินแรกรับไปแล้ว ระบบจะส่งผลกลับให้ทันที)`, 'รับงานและเชื่อม').then(async ok=>{ if(!ok) return;

  confirmBox('มีรอบการดูแลที่เปิดอยู่', `<b>${esc(r.patient.FullName)}</b> มีรอบการดูแล <b>${esc(act.EpisodeNo)}</b> ที่ยังเปิดอยู่ (เปิดซ้อนกันไม่ได้)`, 'เปิดแฟ้ม').then(ok=>{ if(ok){ closeModal(); openFile(act.EpisodeID,'registry'); } });

function pickPatient(i){ const r=S.adm.rows[i]; S.adm.pick=r.patient; S.adm.isNew=false; admitPerson(r.patient,false); }

async function saveAdmit(confirmLate, force){
  const r=PK.read('pk',{mode:S.adm.isNew?'new':'edit'}); if(r.err){ toast(r.err,true); $('admErr').innerHTML=`<div class="sec-err">${esc(r.err)}</div>`; return; }
  const b=$('admBtn'), ref=S.adm.ref, p=Object.assign(episodeVal(),{ person:r.person, phones:r.phones });
  if(!S.adm.isNew&&S.adm.pick) p.PatientID=S.adm.pick.PatientID;
  if(force) p.forceCreate=true;
  if(confirmLate) p.confirmLate=true;
  if(ref) p.ReferralID=ref.ReferralID;
  setBusy(b,true);
  try{
    const d=await api(ref?'apiReceiveReferral':'apiAdmit',p);
    closeModal(); toast(ref?'รับงานและรับเข้าโปรแกรมแล้ว '+d.file.episode.EpisodeNo:'รับเข้าโปรแกรมแล้ว '+d.file.episode.EpisodeNo); if(d.warn) toast(d.warn,true); S.list=null;
    if(ref){ S.inbox=null; refreshInboxCount(); }
    showFile(d.file,ref?'inbox':'registry');
  }catch(e){
    setBusy(b,false);
    const m=String(e.message||'');
    if(m.indexOf('LATE:')===0){ const ok=await confirmBox('เลยระยะ IMC',esc(m.slice(5))+'<br>ยืนยันรับเข้าโปรแกรมหรือไม่','ยืนยันรับเข้า'); if(ok) saveAdmit(true,force); return; }
    if(m.indexOf('DUP:')===0){ let dp={}; try{ dp=JSON.parse(m.slice(4)); }catch(x){} S.dupRows=dp.matches||[]; $('pkDup').innerHTML=PK.dupHtml(dp,'dupPick',dp.canForceCreate?'dupConfirm':''); $('pkDup').scrollIntoView({block:'start'}); return; }
    $('admErr').innerHTML=`<div class="sec-err">${esc(m)}</div>`; toast(m,true);
  }
}

function readAssess(){
  const o={}; S.text.biItems.forEach(it=>{ o['bi_'+it[0]]=segVal('as_bi_'+it[0]); });

async function saveVisit(){
  const k=segVal('vfKind'), t=segVal('vfType'), full=k==='ADMIT'||k==='CLOSE', e=S.file.episode;

    if(full&&miss.length){ $('vfErr').innerHTML=`<div class="sec-err">${esc(tx('kinds',k))}ต้องประเมินครบชุดหลัก — ยังขาด ${esc(miss.length)} ช่อง (ไฮไลต์สีแดง)</div>`; toast('ยังประเมินไม่ครบ '+miss.length+' ช่อง (ไฮไลต์สีแดง)',true); const m=document.querySelector('#asBox .miss'); if(m) m.scrollIntoView({behavior:'smooth',block:'center'}); return; }

  <div class="card" style="max-width:720px"><div class="form-grid">
    ${field('ระยะเวลาดูแล IMC (เดือน)',`<input class="phc-input" id="sDur" inputmode="numeric" value="${esc(s.DURATION_MONTHS)}"><small class="muted xs">นับจากวันจำหน่าย รพ. (ไม่มี = วันเกิดโรค) · เปลี่ยนแล้วคำนวณวันครบกำหนดของรอบที่เปิดอยู่ใหม่</small>`,'',true)}
    ${field('แจ้งใกล้ครบกำหนดล่วงหน้า (วัน)',`<input class="phc-input" id="sNear" inputmode="numeric" value="${esc(s.NEAR_END_DAYS)}">`,'',true)}
    ${field('รับเข้าแล้วยังไม่ประเมินแรกรับ แจ้งเร่งด่วนเมื่อเกิน (วัน)',`<input class="phc-input" id="sNoAd" inputmode="numeric" value="${esc(s.NO_ADMIT_DAYS)}">`,'',true)}
    ${field('สถานที่ให้บริการ',`<input class="phc-input" id="sLoc" value="${esc(s.SERVICE_LOCATION)}">`)}</div>
    <div class="actions" style="margin-top:14px;justify-content:flex-end"><button class="phc-btn" id="setSave" onclick="saveSettings()">💾 บันทึก</button></div></div>`;
}
async function saveSettings(){ const b=$('setSave'); setBusy(b,true);
  try{ const d=await api('apiSaveSettings',{ DURATION_MONTHS:val('sDur'), NEAR_END_DAYS:val('sNear'), NO_ADMIT_DAYS:val('sNoAd'), SERVICE_LOCATION:val('sLoc') }); S.settings=d.settings; afterDash(d.dashboard); S.list=null; toast('บันทึกแล้ว'); renderSettings(); }catch(e){ toast(e.message,true); } finally{ setBusy(b,false); } }

/* ---------- print (PHC37Print) ---------- */
function kitPrint(o){ if(!window.PHC37Print){ toast('ไม่พบชุดพิมพ์มาตรฐาน',true); return; } PHC37Print.print(PHC37Print.document(Object.assign({systemName:'ระบบฟื้นฟูสมรรถภาพผู้ป่วยระยะกลาง (IMC)',systemShort:'IMC',printedBy:S.user.fullName},o)),{onDone:e=>{ if(e) toast('เปิดหน้าพิมพ์ไม่สำเร็จ: '+e.message,true); }}); }
function pAssess(a){
  if(!a) return '<p class="phc-p-note">ไม่ได้ประเมิน</p>';
  const m=a.mmt||{}, c=k=>m[k]===undefined?'-':m[k], yn=v=>v==='YES'?'มี':(v==='NO'?'ไม่มี':'-');
  return `<div class="phc-p-grid2"><div><table class="phc-p-table"><thead><tr><th>Barthel Index</th><th>คะแนน</th></tr></thead><tbody>${a.biTotal!==''?S.text.biItems.map(it=>`<tr><td>${esc(it[1])}</td><td class="phc-p-num">${esc(a.bi[it[0]])}/${it[2]}</td></tr>`).join('')+`<tr><th>รวม</th><th class="phc-p-num">${esc(a.biTotal)}/20 (${esc(LV_TH[a.level])})</th></tr>`:'<tr><td colspan="2">ไม่ได้ประเมิน</td></tr>'}</tbody></table></div>
    <div><table class="phc-p-table"><thead><tr><th>กำลังกล้ามเนื้อ</th><th>ขวา</th><th>ซ้าย</th></tr></thead><tbody><tr><td>แขน ส่วนต้น</td><td class="phc-p-num">${esc(c('armRP'))}</td><td class="phc-p-num">${esc(c('armLP'))}</td></tr><tr><td>แขน ส่วนปลาย</td><td class="phc-p-num">${esc(c('armRD'))}</td><td class="phc-p-num">${esc(c('armLD'))}</td></tr><tr><td>ขา ส่วนต้น</td><td class="phc-p-num">${esc(c('legRP'))}</td><td class="phc-p-num">${esc(c('legLP'))}</td></tr><tr><td>ขา ส่วนปลาย</td><td class="phc-p-num">${esc(c('legRD'))}</td><td class="phc-p-num">${esc(c('legLD'))}</td></tr></tbody></table>
    <table class="phc-p-kv" style="margin-top:6px"><tbody><tr><th>ทรงตัว นั่ง / ยืน</th><td>${esc(balShort(a.balanceSit))} / ${esc(balShort(a.balanceStand))}</td></tr><tr><th>การเคลื่อนที่</th><td>${esc(mobTh(a.mobility))}</td></tr><tr><th>อุปกรณ์ช่วย</th><td>${esc((a.aids||[]).map(k=>k==='OTHER'?(a.aidOther||'อื่น ๆ'):tx('aidMap',k)).join(', ')||'-')}</td></tr>
      <tr><th>แผลกดทับ</th><td>${a.pu?(a.pu==='0'?'ไม่มี':'ระดับ '+esc(a.pu)+' '+esc(a.puSite||'')):'-'}</td></tr><tr><th>ข้อติด / สำลัก / หกล้ม</th><td>${esc(yn(a.contracture))} / ${esc(yn(a.aspiration))} / ${esc(yn(a.fall))}</td></tr><tr><th>MAS / ปวด</th><td>${esc(a.mas||'-')} ${esc(a.masSite||'')} / ${a.pain===''||a.pain===undefined?'-':esc(a.pain)}</td></tr></tbody></table></div></div>`;
}
function pHeadMeta(){ const F=S.file, e=F.episode, p=F.patient||{}; return [['ชื่อ-สกุล',p.FullName],['HN',p.HN||'-'],['อายุ / เพศ',ageSex(p)],['โรค',dzShort(e)],['เลข IMC',e.EpisodeNo]]; }
function printVisit(id){
  const F=S.file, e=F.episode, v=F.visits.find(x=>x.VisitID===id);
  kitPrint({ title:'แบบบันทึกการเยี่ยม/ฟื้นฟูสมรรถภาพ (IMC) · '+tx('kinds',v.Kind), docNo:e.EpisodeNo, docDate:shortDate(v.VisitDate), density:'compact', meta:pHeadMeta(),
    bodyHtml:`<div class="phc-p-section"><h2>การให้บริการ</h2><table class="phc-p-kv"><tbody><tr><th>วันที่ / รูปแบบ</th><td>${esc(thDate(v.VisitDate,true))} · ${esc(vtTh(v.VisitType))}</td></tr><tr><th>กิจกรรม</th><td>${esc(actsTh(v.Activities)||'-')}${v.ActivityNote?'<br>'+esc(v.ActivityNote):''}</td></tr><tr><th>ปัญหาที่พบ</th><td>${esc(v.Problem||'-')}</td></tr><tr><th>แผน / คำแนะนำ</th><td>${esc(v.Plan||'-')}</td></tr><tr><th>นัดครั้งถัดไป</th><td>${esc(v.NextAppt?thDate(v.NextAppt,true):'-')} ${esc(v.NextApptNote||'')}</td></tr></tbody></table></div>
      <div class="phc-p-section"><h2>ผลการประเมิน</h2>${pAssess(v.assess)}</div>`, signatures:['ผู้ให้บริการ','ผู้ป่วย / ผู้ดูแล'] });
}
function printEpisode(){
  const F=S.file, e=F.episode, p=F.patient||{}, av=F.visits.filter(v=>v.assess&&v.assess.biTotal!=='');
  const biTbl=av.length?`<table class="phc-p-table"><thead><tr><th>Barthel Index</th>${av.map(v=>`<th>${esc(shortDate(v.VisitDate))}</th>`).join('')}</tr></thead><tbody>${S.text.biItems.map(it=>`<tr><td>${esc(it[1])} (${it[2]})</td>${av.map(v=>`<td class="phc-p-num">${esc(v.assess.bi[it[0]])}</td>`).join('')}</tr>`).join('')}<tr><th>รวม</th>${av.map(v=>`<th class="phc-p-num">${esc(v.assess.biTotal)}</th>`).join('')}</tr></tbody></table>`:'<p class="phc-p-note">ยังไม่มีผล BI</p>';
  const la=lastAssessVisit();
  kitPrint({ title:'แบบบันทึกการฟื้นฟูสมรรถภาพผู้ป่วยระยะกลาง (IMC)', docNo:e.EpisodeNo, docDate:shortDate(todayKey()), density:'compact', meta:pHeadMeta(),
    bodyHtml:`<div class="phc-p-section"><h2>ข้อมูลผู้ป่วยและการเจ็บป่วย</h2><table class="phc-p-kv"><tbody><tr><th>ที่อยู่ / โทร</th><td>${esc(p.AddressText||'-')} · ${esc(p.CommunityName||'')} · ${esc(p.Phone||'-')}</td></tr><tr><th>โรค</th><td>${esc(dzFull(e))}${e.Diagnosis?' · '+esc(e.Diagnosis):''}${e.AffectedSide?' · '+esc(SIDE_TH[e.AffectedSide]):''}</td></tr>
      <tr><th>เกิดโรค / จำหน่าย รพ.</th><td>${esc(thDate(e.OnsetDate,true))} / ${esc(e.HospitalDischargeDate?thDate(e.HospitalDischargeDate,true):'-')} ${esc(e.Hospital||'')}</td></tr><tr><th>ที่มา</th><td>${esc(tx('sourceMap',e.Source))}${e.ReferralSN?' · '+esc(e.ReferralSN)+' จาก '+esc(e.ReferralFrom):''}</td></tr>
      <tr><th>รับเข้า / ครบกำหนด</th><td>${esc(thDate(e.AdmitDate,true))} / ${esc(thDate(e.EndDue,true))}</td></tr><tr><th>ผู้ดูแลหลัก</th><td>${esc([e.CaregiverName,e.CaregiverRelation,e.CaregiverPhone].filter(Boolean).join(' · ')||'-')}</td></tr><tr><th>เป้าหมาย</th><td>${esc(e.Goal||'-')}</td></tr>
      <tr><th>สถานะ</th><td>${e.Status==='CLOSED'?'ปิดการดูแล '+esc(thDate(e.CloseDate,true))+' · '+esc(tx('closeMap',e.CloseReason))+(e.CloseNote?' — '+esc(e.CloseNote):''):'อยู่ในการดูแล (วันที่ '+esc(e.DayNo)+' / '+esc(e.TotalDays)+')'}</td></tr></tbody></table></div>
      <div class="phc-p-section phc-p-avoid"><h2>Barthel Index ตามครั้งที่ประเมิน</h2>${biTbl}</div>
      <div class="phc-p-section phc-p-avoid"><h2>ผลประเมินล่าสุด ${la?esc(shortDate(la.VisitDate)):''}</h2>${pAssess(la&&la.assess)}</div>
      <div class="phc-p-section"><h2>การเยี่ยม / ให้บริการ (${esc(F.visits.length)} ครั้ง)</h2><table class="phc-p-table"><thead><tr><th>วันที่</th><th>รูปแบบ</th><th>ชนิด</th><th>BI</th><th>กิจกรรม / แผน</th><th>นัดถัดไป</th><th>ผู้บันทึก</th></tr></thead><tbody>${F.visits.map(v=>`<tr><td>${esc(shortDate(v.VisitDate))}</td><td>${esc(vtTh(v.VisitType))}</td><td>${esc(tx('kinds',v.Kind))}</td><td class="phc-p-num">${esc(v.BI)}</td><td>${esc(actsTh(v.Activities))}${v.Plan?'<br>'+esc(v.Plan):''}</td><td>${esc(v.NextAppt?shortDate(v.NextAppt):'-')}</td><td>${esc(v.CreatedByName||'')}</td></tr>`).join('')||'<tr><td colspan="7">-</td></tr>'}</tbody></table></div>
      ${F.referrals.length?`<div class="phc-p-section"><h2>การส่งต่อ</h2><table class="phc-p-table"><thead><tr><th>เลขส่งต่อ</th><th>วันที่</th><th>ส่งถึง</th><th>เหตุผล</th><th>สถานะ / ผล</th></tr></thead><tbody>${F.referrals.map(r=>`<tr><td>${esc(r.ReferralSN||'-')}</td><td>${esc(shortDate(r.CreatedAt))}</td><td>${esc(r.ToWorkGroup)}</td><td>${esc(r.Reason)}</td><td>${esc(r.RemoteStatusTH||r.Status)}${r.RemoteResult?' · '+esc(r.RemoteResult):''}</td></tr>`).join('')}</tbody></table></div>`:''}`,
    signatures:['นักกายภาพบำบัด','หัวหน้ากลุ่มงาน'] });
}

boot();
</script>
<script>
/* ปุ่ม "กลับหน้าหลัก" → หน้าหลักของแอป PHC37 */
window.goGateway = function () { try { if ('imc1.session') sessionStorage.removeItem('imc1.session'); } catch (e) {} try { window.parent.PHC37.goHome(); } catch (e) {} };
</script>
