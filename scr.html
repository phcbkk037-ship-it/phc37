  /* สีพื้นและตัวอักษร */

/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';
  }

  function documentHtml(o){
    o = o || {};
    if (!o.title) throw new Error('PHC37Print.document: ต้องระบุ title');
    return '<!doctype html><html lang="th"><head><meta charset="utf-8">'
      + '<title>' + esc(o.title) + (o.docNo ? ' ' + esc(o.docNo) : '') + '</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">'
      + '<style>' + baseCss(o) + (o.extraCss || '') + '</style></head><body>'
      + '<div class="phc-p-page">'
      // หัวกระดาษอยู่ใน thead: เบราว์เซอร์พิมพ์ซ้ำทุกหน้า
      + '<table class="phc-p-frame" role="presentation"><thead><tr><td>' + letterhead(o) + '</td></tr></thead><tbody><tr><td>'
      + '<h1 class="phc-p-title">' + esc(o.title) + '</h1>'
      + (o.bodyHtml || '')
      + signatures(o.signatures)
      + '</td></tr></tbody></table>'
      + '</div></body></html>';
  }

  // พิมพ์ผ่าน iframe ซ่อน รอฟอนต์โหลดก่อนสั่งพิมพ์ (ฟอนต์ไม่มาภายใน 2.5 วินาทีก็พิมพ์ต่อ)
  function printHtml(html, opts){
    opts = opts || {};
    var frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('title', 'พิมพ์เอกสาร');
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(frame);
    var doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    var done = false;
    var go = function(){
      if (done) return; done = true;
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
        if (typeof opts.onDone === 'function') opts.onDone(null);
      } catch (err) {
        if (typeof opts.onDone === 'function') opts.onDone(err);
      }
      setTimeout(function(){ try { frame.remove(); } catch (e) {} }, 60000);
    };
    var waitFonts = function(){
      try {
        if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function(){ setTimeout(go, 50); });
        else setTimeout(go, 400);
      } catch (e) { setTimeout(go, 400); }
      setTimeout(go, 2500);
    };
    if (doc.readyState === 'complete') waitFonts();
    else frame.onload = waitFonts;
  }

  window.PHC37Print = {
    VERSION: 'PHC37-PRINT-1.0.3',
    CONFIDENTIAL: CONFIDENTIAL,
    ORG: ORG,
    LOGO: LOGO,
    esc: esc,
    thaiNow: thaiNow,
    document: documentHtml,
    print: printHtml
  };
})();

function esc(v){ const s=String(v==null?'':v); let o=''; for(const ch of s) o+=ESC[ch]||ch; return o; }
function digits(s){ return String(s==null?'':s).split('').filter(ch=>ch>='0'&&ch<='9').join(''); }

function cidOk(c){ c=digits(c); if(c.length!==13) return false; let t=0; for(let i=0;i<12;i++) t+=Number(c[i])*(13-i); return (11-t%11)%10===Number(c[12]); }
function pad2(n){ return ('0'+n).slice(-2); }

/* ---------- วันที่ (key = yyyy-MM-dd ค.ศ. · แสดง พ.ศ.) ---------- */
function todayKey(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function isKey(v){ const p=String(v||'').split('-'); return p.length===3&&p[0].length===4&&p[1].length===2&&p[2].length===2; }
/** "dd/MM/yyyy(พ.ศ.) HH:mm:ss" → key */
function beKey(t){ t=String(t||'').trim(); if(!t) return ''; if(isKey(t.slice(0,10))) return t.slice(0,10); const p=t.split(' ')[0].split('/'); if(p.length!==3) return ''; let y=Number(p[2]); if(y>2400) y-=543; if(!y) return ''; return y+'-'+pad2(Number(p[1]))+'-'+pad2(Number(p[0])); }
function timeOf(t){ const p=String(t||'').trim().split(' '); return p.length>1?p[1].slice(0,5):''; }
function thDate(k,full){ if(!k) return '-'; const p=k.split('-').map(Number); return p[2]+' '+(full?TH_M:TH_MS)[p[1]-1]+' '+(p[0]+543); }
function shortDate(k){ if(!k) return ''; const p=k.split('-'); return p[2]+'/'+p[1]+'/'+(Number(p[0])+543); }

function birthKeyFromBE(t){ t=String(t||'').trim(); if(!t) return ''; const p=t.split('/'); if(p.length!==3) return null; let d=Number(p[0]),m=Number(p[1]),y=Number(p[2]); if(!d||!m||!y) return null; if(y>2400) y-=543; if(y<1890||m<1||m>12||d<1||d>31) return null; const dt=new Date(Date.UTC(y,m-1,d)); if(dt.getUTCDate()!==d) return null; return y+'-'+pad2(m)+'-'+pad2(d); }
function ageYears(k){ if(!k) return null; const a=k.split('-').map(Number), t=todayKey().split('-').map(Number); return t[0]-a[0]-((t[1]<a[1]||(t[1]===a[1]&&t[2]<a[2]))?1:0); }

/* ---------- เรียกเซิร์ฟเวอร์ ---------- */
function callRaw_(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(r=>{
      if(!r){ reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); return; }
      if(!r.ok){ reject(new Error(r.message||'เกิดข้อผิดพลาด')); return; }
      resolve(r.data);
    }).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))))[fn](...args);
  });
}
/* PHC37Load (UI Kit 1.2.0): เส้นวิ่งด้านบนระหว่างรอเซิร์ฟเวอร์ (ขึ้นเมื่อรอเกิน 0.3 วินาที) */
function call(fn, ...args){
  const L=window.PHC37Load; if(L) L.line.start();
  return callRaw_(fn, ...args).then(v=>{ if(L) L.line.done(); return v; }, e=>{ if(L) L.line.fail(); throw e; });
}

function setBusy(btn, on, text){ if(!btn) return;
  if(on){ if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.setAttribute('aria-busy','true');
    const plain=btn.classList.contains('phc-btn--secondary')||btn.classList.contains('phc-btn--ghost')||btn.classList.contains('phc-btn--edit')||btn.classList.contains('phc-btn--danger-soft')||!btn.classList.contains('phc-btn');
    const t=text||'กำลังบันทึก…'; btn.innerHTML=String(t).indexOf('spinner')>=0?t:'<span class="phc-spin'+(plain?'':' phc-spin--light')+'" aria-hidden="true"></span> '+t; }
  else { btn.disabled=false; btn.removeAttribute('aria-busy'); delete btn.dataset.busy; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }

/* ---------- ปฏิทิน พ.ศ. ---------- */
let CAL=null;
function dateField(id, key, o){ o=o||{}; return '<div class="date-field"><input class="phc-input" id="'+id+'" data-key="'+esc(key||'')+'" data-max="'+esc(o.max||'')+'" data-min="'+esc(o.min||'')+'" value="'+(key?esc(shortDate(key)):'')+'" readonly placeholder="'+esc(o.ph||'วว/ดด/ปปปป')+'" onclick="openCal(\''+id+'\')">'+(o.clear?'<button type="button" class="xbtn" title="ล้างวันที่" aria-label="ล้างวันที่" onclick="setDate(\''+id+'\',\'\')">✕</button>':'')+'</div>'; }
function dateVal(id){ const el=$(id); return el?(el.dataset.key||''):''; }
function setDate(id,k){ const el=$(id); if(!el) return; el.dataset.key=k||''; el.value=k?shortDate(k):''; el.dispatchEvent(new Event('change')); closeCal(); }
function openCal(id){ closeCal(); const el=$(id); let k=el.dataset.key||todayKey(); if(el.dataset.max&&k>el.dataset.max) k=el.dataset.max; const p=k.split('-').map(Number); CAL={id:id,y:p[0],m:p[1]}; renderCal(); }
function closeCal(){ const c=document.getElementById('calPop'); if(c) c.remove(); CAL=null; }
function calMove(n){ let m=CAL.m+n,y=CAL.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;} CAL.y=y; CAL.m=m; renderCal(); }
function renderCal(){
  let c=document.getElementById('calPop'); if(!c){ c=document.createElement('div'); c.id='calPop'; c.className='cal'; document.body.appendChild(c); }
  const el=$(CAL.id), sel=el.dataset.key, t=todayKey(), mx=el.dataset.max||'', mn=el.dataset.min||'', first=new Date(Date.UTC(CAL.y,CAL.m-1,1)).getUTCDay(), days=new Date(Date.UTC(CAL.y,CAL.m,0)).getUTCDate();
  let h='<div class="cal-head"><button type="button" onclick="calMove(-1)" aria-label="เดือนก่อน">‹</button><b>'+TH_M[CAL.m-1]+' '+(CAL.y+543)+'</b><button type="button" onclick="calMove(1)" aria-label="เดือนถัดไป">›</button></div><div class="cal-grid">'+['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>'<span>'+x+'</span>').join('');
  for(let i=0;i<first;i++) h+='<span></span>';
  for(let d=1;d<=days;d++){ const k=CAL.y+'-'+pad2(CAL.m)+'-'+pad2(d), w=(first+d-1)%7, dis=(mx&&k>mx)||(mn&&k<mn); h+='<button type="button" '+(dis?'disabled':'')+' class="'+(k===sel?'sel ':'')+(k===t?'today ':'')+(w===0||w===6?'we':'')+'" onclick="setDate(\''+CAL.id+'\',\''+k+'\')">'+d+'</button>'; }
  h+='</div><div class="cal-foot"><button type="button" class="phc-btn phc-btn--ghost phc-btn--sm" '+((mx&&t>mx)||(mn&&t<mn)?'disabled':'')+' onclick="setDate(\''+CAL.id+'\',\''+t+'\')">วันนี้</button><button type="button" class="phc-btn phc-btn--secondary phc-btn--sm" onclick="closeCal()">ปิด</button></div>';
  c.innerHTML=h;
  const r=el.getBoundingClientRect(); let top=r.bottom+4, left=r.left; if(top+340>innerHeight) top=Math.max(8,r.top-344); if(left+300>innerWidth) left=Math.max(8,innerWidth-308); c.style.top=top+'px'; c.style.left=left+'px';
}
document.addEventListener('mousedown',e=>{ const c=document.getElementById('calPop'); if(c&&!c.contains(e.target)&&!(e.target.closest&&e.target.closest('.date-field'))) closeCal(); });

/* ---------- เปิดระบบ ---------- */
function phcRetryBoot(){ $('errGate').classList.add('hidden'); $('gate').classList.remove('hidden'); boot(); }
async function boot(){
  try{
    const r=await call('swApiBootstrap', BOOT.launchToken);
    S.token=r.sessionToken; S.user=r.user; S.lists=r.lists||{}; S.settings=r.settings||{}; S.dw=r.dateWindow; S.home=r.home;
    $('uName').textContent=S.user.fullName; $('avatar').textContent=initial(S.user.fullName);
    $('uMeta').textContent=[S.user.workGroup, S.user.isAdmin?'ผู้ดูแลระบบ':(S.user.canEdit?'แก้ไขได้':(S.user.canAdd?'บันทึกได้':'ดูอย่างเดียว'))].filter(Boolean).join(' · ');
    $('navSettings').classList.toggle('hidden',!S.user.isAdmin);
    $('fyBadge').textContent='ปีงบประมาณ '+S.dw.fy;
    document.querySelectorAll('#nav button[data-page]').forEach(b=>b.addEventListener('click',()=>{ toggleSide(false); go(b.dataset.page); }));
    window.__swBooted=true; $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
    let last='home'; try{ last=sessionStorage.getItem('swcr3.page')||'home'; }catch(e){}
    go(TITLES[last]&&(last!=='settings'||isAdmin())?last:'home');
    refreshInboxBadge();
  }catch(e){ $('gate').classList.add('hidden'); $('errText').textContent=e.message; $('errGate').classList.remove('hidden'); }
}
function initial(name){ let n=String(name||'?'); ['นางสาว','นาย','นาง','ดร.'].forEach(p=>{ if(n.indexOf(p)===0) n=n.slice(p.length); }); return n.trim().charAt(0)||'?'; }
function go(page, keep){
  S.page=page; try{ sessionStorage.setItem('swcr3.page',page); }catch(e){}
  document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  $('pageTitle').textContent=TITLES[page]; closeModal(); window.scrollTo(0,0);
  ({home:renderHome,clients:()=>renderClients(keep),history:()=>renderHistory(keep),inbox:renderInbox,report:renderReport,settings:renderSettings}[page])();
}

async function renderHome(){
  if(!S.home) loading();
  else drawHome();
  try{ S.home=await api('swApiHome'); if(S.page==='home') drawHome(); }catch(e){ if(!S.home) errBox(e); }
}

    +'<div class="grid g4">'
    +'<div class="stat link" onclick="histPreset({fy:'+h.fy+'})"><span>การให้บริการปีงบนี้</span><b>'+num(k.visits)+' ครั้ง</b><i>เดือนนี้ '+num(k.monthVisits)+' ครั้ง</i></div>'
    +'<div class="stat"><span>ผู้ใช้บริการปีงบนี้</span><b>'+num(k.patients)+' คน</b><i>เคสใหม่ '+num(k.newCase)+' ราย</i></div>'
    +'<div class="stat link" onclick="histPreset({from:\''+h.today+'\',to:\''+h.today+'\'})"><span>บันทึกวันนี้</span><b>'+num(k.todayVisits)+' งาน</b><i>ของฉัน '+num(k.myToday)+' งาน</i></div>'
    +'<div class="stat link" onclick="go(\'inbox\')"><span>ใบส่งต่อรอดำเนินการ</span><b id="homeInbox">'+(S.inboxNew==null?'…':num(S.inboxNew))+'</b><i>จากระบบส่งต่อกลาง</i></div>'
    +'</div>'
    +(alerts.length?'<div class="grid" style="gap:8px;margin-top:12px">'+alerts.map(t=>'<div class="alert-row '+t[0]+'"><b>'+esc(t[1])+'</b>'+(t[2]?'<span>'+esc(t[2])+'</span>':'')+(t[3]?'<button class="phc-btn phc-btn--secondary phc-btn--sm go" type="button" onclick="'+t[3]+'">'+esc(t[4])+'</button>':'')+'</div>').join('')+'</div>':'')
    +'<div class="card" style="margin-top:14px"><div class="card-head"><h3>งานล่าสุด</h3><button class="phc-btn phc-btn--ghost phc-btn--sm" type="button" onclick="go(\'history\')">ดูประวัติงานทั้งหมด</button></div>'+visitTable(h.recent||[], 'ยังไม่มีงานที่บันทึก')+'</div>';
}
/** ตารางงาน (ใช้ร่วม: ภาพรวม · ประวัติ · แฟ้ม · รายงาน) */
function visitTable(rows, emptyText, noPatient){
  if(!rows.length) return '<div class="empty">'+esc(emptyText||'ไม่พบข้อมูล')+'</div>';
  return '<div class="table-wrap"><table class="t rt"><thead><tr><th>วันที่รับเรื่อง</th>'+(noPatient?'':'<th>ผู้ใช้บริการ</th>')+'<th>เรื่อง</th><th>กลุ่มเป้าหมาย</th><th class="hide-sm">เลขที่</th><th class="hide-sm">ผู้บันทึก</th></tr></thead><tbody>'
    +rows.map(r=>'<tr class="click" onclick="openVisit(\''+esc(r.VisitID)+'\')"><td><b class="nowrap">'+esc(thDate(r.ReceivedKey))+'</b><small>'+esc(timeOf(r.CaseReceivedAt))+' · ครั้งที่ '+esc(r.VisitNo||'-')+'</small></td>'
      +(noPatient?'':'<td><b>'+esc(r.PatientName||'-')+'</b><small>'+(r.HN?'HN '+esc(r.HN):'')+(r.CIDMasked?' · '+esc(r.CIDMasked):'')+'</small></td>')
      +'<td class="reason">'+esc(r.ServiceReason||'-')+refChip(r)+'</td><td>'+(r.TargetGroup?esc(r.TargetGroup):'-')+(r.WelfareGroup?'<small>สวัสดิการ: '+esc(r.WelfareGroup)+'</small>':'')+'</td>'
      +'<td class="hide-sm nowrap">'+esc(r.VisitSN||'')+'<small>เคส '+esc(r.CaseSN||'')+'</small></td><td class="hide-sm">'+esc(r.CreatedByName||'-')+'</td></tr>').join('')
    +'</tbody></table></div>';
}
function refChip(r){ if(!r.RefReferralSN) return ''; const st=r.RefResultStatus; return '<div style="margin-top:4px">'+chip('📥 '+r.RefReferralSN, 'info')+(st==='FAILED'?chip('ส่งผลกลับไม่สำเร็จ','danger'):(st==='SENT'?chip('ส่งผลกลับแล้ว','success'):''))+'</div>'; }

function renderClients(keep){
  if(keep==='file'&&S.file){ drawFile(); return; }
  if(keep==='form'&&S.form){ drawForm(); return; }
  S.form=null;
  $('content').innerHTML='<div class="page-head"><div><h2>ค้นหาผู้ใช้บริการ</h2><p>ค้นจากเวชระเบียนกลาง ด้วย HN / เลขบัตรประชาชน / ชื่อ–นามสกุล</p></div><div class="actions">'+(canAdd()?'<button class="phc-btn phc-btn--secondary" type="button" onclick="newPatientForm()">➕ เพิ่มผู้ป่วยใหม่</button>':'')+'</div></div>'
    +(S.pendingRef?'<div class="ref-banner"><b>📥 กำลังบันทึกงานจากใบส่งต่อ '+esc(S.pendingRef.ReferralSN)+'</b> — '+esc(S.pendingRef.PatientName||'')+(S.pendingRef.HN?' (HN '+esc(S.pendingRef.HN)+')':'')+'<br><span class="small">ค้นหาและเลือกผู้ป่วยให้ตรงกับใบส่งต่อ แล้วกด "บันทึกงานใหม่"</span> <button class="phc-btn phc-btn--ghost phc-btn--sm" type="button" onclick="S.pendingRef=null;renderClients()">ยกเลิกใบส่งต่อ</button></div>':'')
    +'<div class="card"><form class="toolbar" onsubmit="event.preventDefault();doSearch()" style="margin:0"><input class="phc-input grow" id="q" value="'+esc(S.q)+'" placeholder="พิมพ์ HN / เลขบัตร 13 หลัก / ชื่อ หรือ นามสกุล" autocomplete="off"><button class="phc-btn" type="submit" id="qBtn">🔍 ค้นหา</button></form></div>'
    +'<div id="found" style="margin-top:12px"></div>';
  if(S.found) drawFound(); setTimeout(()=>{ const q=$('q'); if(q) q.focus(); },30);
}
async function doSearch(){
  const q=val('q'); S.q=q;
  if(q.length<2){ toast('กรุณาพิมพ์อย่างน้อย 2 ตัวอักษร',true); return; }
  const b=$('qBtn'); setBusy(b,true,'<span class="spinner sm"></span> กำลังค้นหา…');
  try{ S.found=await api('swApiSearch', q); drawFound(); }catch(e){ toast(e.message,true); }
  finally{ setBusy(b,false); }
}
function drawFound(){
  const box=$('found'); if(!box) return; const rows=S.found||[];
  box.innerHTML=rows.length?'<div class="muted small" style="margin-bottom:6px">พบ '+rows.length+' คน'+(rows.length>=30?' (แสดง 30 คนแรก พิมพ์ให้เจาะจงขึ้น)':'')+'</div><div class="grid" style="gap:8px">'+rows.map(p=>'<button type="button" class="pick" onclick="openFile(\''+esc(p.PatientID)+'\')"><div><b>'+esc(p.FullName)+'</b><span>'+[p.HN?'HN '+p.HN:'', p.CIDMasked, p.Gender, p.AgeText].filter(Boolean).map(esc).join(' · ')+'</span><br><span>'+esc(p.AddressText||'ไม่มีที่อยู่')+(p.Phone?' · 📞 '+esc(p.Phone):'')+'</span></div><div class="r">'+(p.sw?chip('เคยรับบริการ '+p.sw.visits+' ครั้ง','success')+'<br><span>ล่าสุด '+esc(thDate(p.sw.last))+'</span>':chip('ยังไม่เคยรับบริการ','neutral'))+'</div></button>').join('')+'</div>'
    :'<div class="card empty"><p>ไม่พบในเวชระเบียนกลาง</p>'+(canAdd()?'<button class="phc-btn" type="button" onclick="newPatientForm()">➕ เพิ่มผู้ป่วยใหม่</button>':'')+'</div>';
}
async function openFile(pid, quiet){
  if(!quiet) loading('กำลังดึงข้อมูลล่าสุดจากเวชระเบียนกลาง…');
  try{ S.file=await api('swApiPatient', pid); S.form=null; if(S.page!=='clients'){ go('clients','file'); } else drawFile(); }
  catch(e){ errBox(e, "openFile('"+esc(pid)+"')"); }
}
function adpChip(a){ if(!a||!a.found) return a&&a.error?chip('อ่านข้อมูลผ้าอ้อมไม่ได้','neutral'):''; return chip('🩲 ผ้าอ้อม: '+a.text, a.status==='ACTIVE'?(a.validNow?'success':'warning'):(a.status==='RESERVE'?'info':'neutral'))+(a.status==='ACTIVE'?(a.validNow?'<span class="xs muted"> ผลประเมินถึง '+esc(thDate(a.validUntil))+'</span>':'<span class="xs muted"> ยังไม่มีผลประเมินที่ใช้ได้</span>'):''); }
function contactsView(list){

function isMinor(){ const k=birthKeyFromBE(val('pBd')); const a=k?ageYears(k):null; if(a!==null&&a<18) return true; if(a===null){ if(has(val('vTg'),'เด็ก')||val('vWelfare')==='เด็ก 0-12 ปี') return true; } return false; }

function readContacts(){
  const out=[], seen={}; let err='';
  document.querySelectorAll('#ctBox .ctc').forEach((card,i)=>{
    const g=c=>{ const el=card.querySelector(c); return el?el.value.trim():''; };
    const role=card.querySelector('.ct-role').value, rel=g('.ct-rel'), pre=g('.ct-pre'), fn=g('.ct-fn'), ln=g('.ct-ln'), cid=digits(g('.ct-cid'));
    let primary=''; const phones=[];
    card.querySelectorAll('.ph-row').forEach(r=>{ const ph=r.querySelector('.ct-ph').value.trim(); if(!ph) return; const dg=digits(ph);
      if(dg.length<6||dg.length>15) err=err||('เบอร์ '+ph+' ไม่ถูกต้อง'); if(seen[dg]) err=err||('เบอร์ '+ph+' ซ้ำกัน'); seen[dg]=1; phones.push(ph); if(r.querySelector('input[type=radio]').checked) primary=ph; });
    const roleTH=(S.lists.contactRoles.find(x=>x.value===role)||{}).label||role;
    if(role!=='SELF'&&!fn&&!ln&&!phones.length&&!cid&&!rel) return; /* การ์ดว่าง = ข้าม */
    if(role!=='SELF'&&!fn&&!ln&&!phones.length) err=err||('ผู้ติดต่อ ('+roleTH+'): กรุณากรอกชื่อหรือเบอร์โทร');
    if((role==='RELATIVE'||role==='OTHER')&&!rel) err=err||('ผู้ติดต่อ ('+roleTH+'): กรุณาระบุความเกี่ยวข้อง เช่น ป้า / ยาย');
    if(cid&&!cidOk(cid)) err=err||('เลขบัตรประชาชนของผู้ติดต่อ ('+roleTH+') ไม่ถูกต้อง');
    out.push({ContactID:card.dataset.id||'', Role:role, Relation:rel, Prefix:pre, FirstName:fn, LastName:ln, CID:cid, Phones:phones, PrimaryPhone:primary});
  });
  return {list:out, err:err};
}

function formErr(msg, elId){ toast(msg,true); const el=elId&&$(elId); if(el){ el.focus(); el.scrollIntoView({block:'center'}); } }
async function savePatient(force){
  const isNew=S.form.mode==='patientNew', p=readPerson(isNew?'new':'edit'); if(p.err){ formErr(p.err,p.el); return; }
  const ct=readContacts(); if(ct.err){ formErr(ct.err); return; }
  const b=$('saveBtn'); setBusy(b,true);
  try{
    if(isNew){
      const r=await api('swApiRegisterPatient',{person:p.person, Contacts:ct.list, forceCreate:!!force});
      if(r.duplicate){ dupBox(r); return; }
      S.file=r.file; S.form=null; toast('เพิ่มผู้ป่วยใหม่เข้าเวชระเบียนกลางแล้ว'); if(r.warn) toast(r.warn,true); drawFile();
    } else {
      const r=await api('swApiUpdatePatient',{PatientID:S.file.central.PatientID, person:p.person, Contacts:ct.list});
      S.file=r.file; S.form=null; toast(r.changed.length?'บันทึกแล้ว · อัปเดตเวชระเบียนกลาง: '+r.changed.map(fieldTH).join(', '):'บันทึกแล้ว (ข้อมูลเวชระเบียนกลางไม่เปลี่ยน)'); if(r.warn) toast(r.warn,true); drawFile();
    }
  }catch(e){ toast(e.message,true); }
  finally{ setBusy(b,false); }
}

function readVisit(){

  v.RegisterAddressMode=reg?'ระบุที่อยู่อื่น':'ใช้ที่อยู่ปัจจุบัน';
  ADDR.forEach(a=>{ v['Register'+a[0]]=reg?val('vRegister'+a[0]):''; v['Contact'+a[0]]=con?val('vContact'+a[0]):''; });
  if(reg&&!ADDR.some(a=>v['Register'+a[0]])) return {err:'กรุณากรอกที่อยู่ตามทะเบียนบ้าน (หรือเอาเครื่องหมาย "ต่างจากที่อยู่ปัจจุบัน" ออก)', el:'vRegisterHouseNo'};

  if(err) return {err:err, el:el};

}
async function saveVisit(){

  const body={PatientID:S.file.central.PatientID, person:p.person, Contacts:ct.list, visit:pv.visit, ReceivedDate:dateVal('vDate')};
  if(F.ref){ body.RefReferralID=F.ref.ReferralID; body.RefReferralSN=F.ref.ReferralSN; body.RefFromWorkGroup=F.ref.FromWorkGroup; }
  const b=$('saveBtn'); setBusy(b,true);

    else r=await api('swApiSaveVisit',body);

    toast((F.edit?'แก้ไขงาน ':'บันทึกงาน ')+r.VisitSN+' แล้ว'+(r.centralChanged&&r.centralChanged.length?' · อัปเดตเวชระเบียนกลาง: '+r.centralChanged.map(fieldTH).join(', '):''));
    if(r.warn) toast(r.warn,true);
    if(r.refer){ if(r.refer.ok) toast('ส่งผลกลับระบบส่งต่อกลางแล้ว (ใบส่งต่อ '+F.ref.ReferralSN+')'); else toast('บันทึกงานแล้ว แต่ส่งผลกลับระบบส่งต่อไม่สำเร็จ: '+r.refer.message+' — กดส่งอีกครั้งได้','warn'); }
    if(F.ref){ S.pendingRef=null; S.inbox=null; refreshInboxBadge(); }
    drawFile(); showVisit(r.detail);
  }catch(e){ toast(e.message,true); }
  finally{ setBusy(b,false); }
}

  if(S.rptMode==='range'){ S.rFrom=dateVal('rFrom'); S.rTo=dateVal('rTo'); if(!S.rFrom||!S.rTo){ toast('กรุณาเลือกวันที่ให้ครบทั้งสองช่อง',true); return; } if(S.rFrom>S.rTo){ toast('วันที่เริ่มต้องไม่เกินวันที่สิ้นสุด',true); return; } f.fromDate=keyToBE(S.rFrom); f.toDate=keyToBE(S.rTo); }
  const box=$('rptBox'); box.innerHTML='<div class="card empty"><div class="spinner"></div><p>กำลังคำนวณรายงาน…</p></div>'; $('rptDrill').innerHTML='';
  try{ S.report=await api('swApiReport',f); if(S.page==='report') drawReport(); }catch(e){ box.innerHTML='<div class="card empty bad-t">'+esc(e.message)+'</div>'; }
}
function rptDelta(v){ if(v===null||v===undefined||v==='') return ''; v=Number(v); return (v>0?'▲':(v<0?'▼':'■'))+' '+Math.abs(v).toLocaleString('th-TH',{maximumFractionDigits:1})+'%'; }
function rptPcts(rows, base, dec){ const f=Math.pow(10,dec||0); return (rows||[]).map(r=>{ if(!base) return null; const x=Math.round(Number(r.value||0)/base*100*f)/f; return dec?x.toFixed(dec):String(x); }); }
function rptBars(rows, type, title, base, dec){
  rows=(rows||[]).slice(); if(!rows.length) return '<p class="rpt-note">ไม่มีข้อมูลในช่วงนี้</p>';
  const top=Math.max.apply(null, rows.map(r=>Number(r.value||0)).concat([1])), pcts=rptPcts(rows,base,dec);
  return '<div class="rpt-bars">'+rows.map((r,i)=>{ const v=Number(r.value||0), w=Math.min(100,Math.max(2,Math.round(v/(base||top)*100)));
    return '<button type="button" class="rpt-bar" data-t="'+esc(type)+'" data-l="'+esc(r.label)+'" data-h="'+esc(title)+'" onclick="drill(this)" aria-label="'+esc(r.label)+' '+v+' ดูรายการ"><span class="rpt-bar-name"><span>'+esc(r.label)+'</span><span class="rpt-track"><span class="rpt-fill" style="width:'+w+'%"></span></span></span><span class="rpt-bar-v">'+num(v)+'</span><span class="rpt-bar-p">'+(base?pcts[i]+'%':'')+'</span></button>'; }).join('')+'</div>';
}
function drawReport(){
  const d=S.report, box=$('rptBox'); if(!box) return;
  const y=$('rFy'); if(y){ y.innerHTML=(d.availableFiscalYears||[]).map(v=>opt(v,v,Number(v)===Number(d.fiscalYearBE))).join(''); }
  $('rptInfo').textContent=(d.periodLabel||'')+' · '+(d.periodRangeText||'')+' · ข้อมูล ณ '+(d.generatedAtBE||'');
  const k=d.kpi||{}, dp=d.kpiDeltaPercent, prev=d.kpiPrevious;
  const kpis=[['ผู้ใช้บริการ',k.patients,'คน','totalPatients','patients'],['การให้บริการ',k.visits,'ครั้ง','allVisits','visits'],['Case ใหม่',k.newCase,'ราย','newCases','newCase'],['Case เดิม',k.oldCase,'ราย','oldCases','oldCase']];
  const kpiHtml=kpis.map(x=>{ let delta=''; if(dp){ const t=rptDelta(dp[x[4]]); delta='<span class="rpt-kpi-delta">'+(t?'<b>'+t+'</b> จาก'+esc(d.compareLabel):'เทียบไม่ได้ ('+esc(d.compareLabel)+' = '+num(prev?prev[x[4]]:0)+')')+'</span>'; }
    return '<button type="button" class="rpt-kpi" data-t="'+x[3]+'" data-l="ทั้งหมด" data-h="'+esc(x[0])+'" onclick="drill(this)"><span class="rpt-kpi-label">'+esc(x[0])+'</span><span><span class="rpt-kpi-value">'+num(x[1])+'</span><span class="rpt-kpi-unit">'+esc(x[2])+'</span></span>'+delta+'</button>'; }).join('');
  const months=d.months||[], mMax=Math.max.apply(null, months.map(m=>Number(m.value||0)).concat([0]));
  const cross=months.length>12||(months.length&&months[0].yearShort!==months[months.length-1].yearShort&&months.length<12);
  let marked=false;
  const monthHtml=months.map(m=>{ const v=Number(m.value||0), isMax=!marked&&v===mMax&&v>0; if(isMax) marked=true; const h=mMax?Math.max(2,Math.round(v/mMax*190)):2;
    return '<div class="rpt-col"><span class="rpt-col-v">'+num(v)+'</span><div class="rpt-col-bar'+(isMax?' is-max':'')+'" style="height:'+h+'px"></div><span class="rpt-col-l">'+esc(m.label)+(cross?' '+esc(m.yearShort):'')+'</span></div>'; }).join('');
  const avg=months.length?Number(k.visits||0)/months.length:0, periods=d.periods||[];
  const sum=periods.reduce((a,p)=>({visits:a.visits+Number(p.visits||0), newCase:a.newCase+Number(p.newCase||0)}),{visits:0,newCase:0});
  const tableHtml='<table class="rpt-table"><thead><tr><th scope="col">ช่วง</th><th scope="col">ผู้ใช้บริการ</th><th scope="col">ครั้ง</th><th scope="col">Case ใหม่</th></tr></thead><tbody>'
    +periods.map(p=>'<tr><th scope="row">'+esc(p.label)+(p.range?'<span class="rpt-sub">'+esc(p.range)+'</span>':'')+'</th><td>'+num(p.patients)+'</td><td>'+num(p.visits)+'</td><td>'+num(p.newCase)+'</td></tr>').join('')
    +'</tbody><tfoot><tr><th scope="row">รวม</th><td>'+num(k.patients)+'*</td><td>'+num(sum.visits)+'</td><td>'+num(sum.newCase)+'</td></tr></tfoot></table><p class="rpt-note">* นับคนไม่ซ้ำทั้งช่วง จึงไม่เท่ากับผลรวมแต่ละแถว</p>';
  const base=Number(k.visits||0), c=d.charts||{}, sumOf=rows=>(rows||[]).reduce((a,r)=>a+Number(r.value||0),0);
  const chart=(title,rows,type,multi)=>{ const b=multi?sumOf(rows):base; return '<div class="rpt-card"><div class="rpt-card-head"><h3>'+esc(title)+'</h3><span>'+(multi?'% ของรายการที่เลือกทั้งหมด '+num(b)+' รายการ':'% ของการให้บริการ '+num(b)+' ครั้ง')+'</span></div>'+rptBars(rows,type,title,b,multi?1:0)+(multi&&(rows||[]).length?'<p class="rpt-note">1 ครั้งเลือกได้หลายข้อ · ตัวเลขคือจำนวนครั้งที่เลือกข้อนั้น</p>':'')+'</div>'; };
  box.innerHTML='<div class="rpt-body"><section class="rpt-kpis" aria-label="ตัวชี้วัดหลัก">'+kpiHtml+'</section>'
    +'<section class="rpt-row"><div class="rpt-card"><div class="rpt-card-head"><h3>จำนวนการให้บริการรายเดือน</h3><span>หน่วย: ครั้ง</span></div><div class="rpt-chart" role="img" aria-label="กราฟแท่งจำนวนการให้บริการรายเดือน รวม '+base+' ครั้ง">'+monthHtml+'</div>'
      +'<div class="rpt-legend"><span><span class="rpt-dot"></span>การให้บริการ</span><span><span class="rpt-dot is-max"></span>เดือนที่สูงที่สุด</span><span>เฉลี่ย '+avg.toLocaleString('th-TH',{maximumFractionDigits:1})+' ครั้ง/เดือน</span></div></div>'
      +'<div class="rpt-card"><div class="rpt-card-head"><h3>'+esc(d.periodTableTitle||'สรุป')+'</h3></div>'+tableHtml+'</div></section>'
    +'<section class="rpt-grid2">'+chart('กลุ่มเป้าหมาย',c.targetGroups,'targetGroups')+chart('ช่องทางรับเรื่อง',c.receiveChannels,'receiveChannels')+chart('กิจกรรม / บริการ',c.activities,'activities',true)+chart('การช่วยเหลือด้านทรัพยากร',c.resourceSupports,'resourceSupports',true)+'</section>'
    +'<p class="rpt-note">กดการ์ดตัวเลขหรือแถบกราฟเพื่อดูรายชื่อ'+(Number(d.undatedCount||0)?' · มี '+num(d.undatedCount)+' รายการที่ไม่มีวันที่ ไม่ถูกนับในรายงานนี้':'')+'</p></div>';
}
async function drill(el){
  const type=el.dataset.t, label=el.dataset.l, title=el.dataset.h, box=$('rptDrill');
  box.innerHTML='<div class="card" style="margin-top:14px"><p class="muted small" style="margin:0 0 10px">กำลังโหลดรายชื่อ '+esc(title)+' : '+esc(label)+'</p>'+phcSk(5)+'</div>'; box.scrollIntoView({behavior:'smooth',block:'start'});
  try{ const r=await api('swApiDrilldown',Object.assign({},S.report.drilldownFilter||{},{type:type,label:label,limit:300}));
    box.innerHTML='<div class="card" style="margin-top:14px"><div class="card-head"><h3>รายชื่อ: '+esc(title)+' / '+esc(label)+' <span class="muted small">('+num(r.total||r.rows.length)+' รายการ'+(r.total>r.rows.length?' · แสดง '+r.rows.length:'')+')</span></h3><button class="xbtn" type="button" onclick="$(\'rptDrill\').innerHTML=\'\'" aria-label="ปิดรายชื่อ">×</button></div>'+visitTable(r.rows,'ไม่พบข้อมูลในยอดนี้')+'</div>'; }
  catch(e){ box.innerHTML='<div class="card empty bad-t" style="margin-top:14px">'+esc(e.message)+'</div>'; }
}
function printReport(){
  const d=S.report; if(!d){ toast('ยังไม่มีรายงานสำหรับพิมพ์',true); return; }
  const k=d.kpi||{}, dp=d.kpiDeltaPercent, baseV=Number(k.visits||0);

  const tableHtml='<table class="phc-p-table"><thead><tr><th>ช่วง</th><th class="phc-p-num">ผู้ใช้บริการ</th><th class="phc-p-num">ครั้ง</th><th class="phc-p-num">Case ใหม่</th></tr></thead><tbody>'
    +periods.map(p=>'<tr><td>'+esc(p.label)+(p.range?' <span class="rp-u">'+esc(p.range)+'</span>':'')+'</td><td class="phc-p-num">'+num(p.patients)+'</td><td class="phc-p-num">'+num(p.visits)+'</td><td class="phc-p-num">'+num(p.newCase)+'</td></tr>').join('')
    +'<tr><td><b>รวม</b></td><td class="phc-p-num"><b>'+num(k.patients)+'*</b></td><td class="phc-p-num"><b>'+num(sumV)+'</b></td><td class="phc-p-num"><b>'+num(sumN)+'</b></td></tr></tbody></table><div class="rp-u">* นับคนไม่ซ้ำทั้งช่วง</div>';
  const c=d.charts||{};
  const bars=(title,rows,multi)=>{ rows=(rows||[]).slice(); const base=multi?rows.reduce((a,r)=>a+Number(r.value||0),0):baseV, top=Math.max.apply(null,rows.map(r=>Number(r.value||0)).concat([1])), pcts=rptPcts(rows,base,multi?1:0);
    return '<div class="rp-box"><h2>'+esc(title)+'</h2>'+(rows.length?rows.map((r,i)=>{ const v=Number(r.value||0); return '<div class="rp-bar"><span class="rp-bn"><span>'+esc(r.label)+'</span><span class="rp-track"><i style="width:'+Math.min(100,Math.max(2,Math.round(v/(base||top)*100)))+'%'+(i===0?';background:#15703A':'')+'"></i></span></span><b>'+num(v)+'</b><span class="rp-u">'+(base?pcts[i]+'%':'')+'</span></div>'; }).join('')+'<div class="rp-u" style="margin-top:3px">'+(multi?'% ของรายการที่เลือกทั้งหมด '+num(base)+' รายการ (1 ครั้งเลือกได้หลายข้อ)':'% ของการให้บริการ '+num(base)+' ครั้ง')+'</div>':'<div class="rp-u">ไม่มีข้อมูล</div>')+'</div>'; };
  const body=kpiHtml+'<div class="rp-row"><div class="rp-box"><h2>จำนวนการให้บริการรายเดือน (ครั้ง)</h2>'+chartHtml+'</div><div class="rp-box"><h2>'+esc(d.periodTableTitle||'สรุป')+'</h2>'+tableHtml+'</div></div>'
    +'<div class="rp-grid4">'+bars('กลุ่มเป้าหมาย',c.targetGroups)+bars('ช่องทางรับเรื่อง',c.receiveChannels)+bars('กิจกรรม / บริการ',c.activities,true)+bars('การช่วยเหลือด้านทรัพยากร',c.resourceSupports,true)+'</div>';

    extraCss:'.rp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}.rp-kpi{border:1px solid #A9B3AD;border-radius:6px;padding:5px 9px;display:flex;flex-direction:column}.rp-l{font-size:11px;color:#4A5550;font-weight:600}.rp-v{font-size:22px;line-height:1.15}.rp-u{font-size:11px;color:#4A5550}'
      +'.rp-row{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-bottom:8px}.rp-box{border:1px solid #A9B3AD;border-radius:6px;padding:6px 10px;break-inside:avoid}.rp-box h2{margin:0 0 4px;font-size:13px}'
