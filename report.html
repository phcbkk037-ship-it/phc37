<script>
/* PHC37 PWA 2.2.0 — หน้าเดิมของทะเบียนครุภัณฑ์คอมพิวเตอร์และแจ้งซ่อม (ITA1 ITA1-1.3.0) ทำงานบนระบบใหม่
 * google.script.run.<ฟังก์ชันเดิม>(...) → Edge ita.pub (ตรรกะเดิมทุกบรรทัด) */
(function () {
  var CFG = window.PHC37_CONFIG || {};
  function send(fn, args) {
    if (!CFG.API_URL) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ config.js'));
    var ctrl = ('AbortController' in window) ? new AbortController() : null, timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 30000);
    return fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'ita.pub', data: { fn: fn, args: args } }),
      signal: ctrl ? ctrl.signal : undefined }).then(function (r) { clearTimeout(timer); return r.json(); });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (t, k) {
      if (k === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (k === 'withFailureHandler') return function (f) { return runner(ok, f); };
      if (k === 'withUserObject') return function () { return runner(ok, fail); };
      return function () {
        var args = [].slice.call(arguments);
        send(String(k), args).then(function (r) { if (ok) ok(r); }, function (e) { if (fail) fail(e); });
      };
    } });
  }
  window.google = { script: { run: runner(null, null), host: { close: function () {} } } };
})();
</script>

/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}
.phc-table .phc-num{text-align:right;font-variant-numeric:tabular-nums}

<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="mk" role="img" aria-label="ตรา ศบส.37"></span><div><b>แจ้งซ่อมคอมพิวเตอร์</b><span>ศบส.37 · ไม่ต้องเข้าสู่ระบบ</span></div></div>
  <nav class="tabs" id="tabs"><button type="button" class="tab on" data-t="rep" onclick="setTab('rep')">แจ้งซ่อม</button><button type="button" class="tab" data-t="mine" onclick="setTab('mine')">งานที่แจ้งจากเครื่องนี้<span class="n hidden" id="nMine"></span></button></nav>
</div></header>
<main class="wrap" id="main"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
<div id="over" class="over hidden" role="status" aria-live="polite"><div class="spin"></div><b id="overT">กำลังส่ง…</b><span class="muted small" id="overS">อย่าปิดหน้านี้</span></div>
<div id="toastBox"></div>
<script>
const BOOT = (function(){ var q=new URLSearchParams(location.search), c=String(q.get('a')||q.get('asset')||'').toUpperCase().slice(0,12), ok=c.indexOf('IT-')===0&&c.length>=4; for(var i=3;ok&&i<c.length;i++){ var ch=c.charAt(i); if(ch<'0'||ch>'9') ok=false; } return {"version":"ITA1-1.3.0","appName":"ทะเบียนครุภัณฑ์คอมพิวเตอร์และแจ้งซ่อม",assetCode:ok?c:''}; })();
const LS = { dev:'ita1.pub.dev', me:'ita1.pub.me', sent:'ita1.pub.sent', draft:'ita1.pub.draft' };
const P = { d:null, tab:'rep', me:null, pickG:'', q:'', aq:'', assetId:'', other:false, dev:'', loc:'', sym:'', urg:'NORMAL', phone:'', key:'', done:null, jobs:[], busy:false, cancelFor:'' };
const ICON = {
  PC:'<rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path>',
  LAPTOP:'<rect x="5" y="5" width="14" height="10" rx="1.5"></rect><path d="M2 19h20l-2-4H4z"></path>',
  PRINTER:'<path d="M7 9V4h10v5"></path><rect x="4" y="9" width="16" height="8" rx="2"></rect><rect x="7" y="14" width="10" height="6"></rect>',
  UPS:'<rect x="3" y="7" width="16" height="10" rx="2"></rect><path d="M21 10v4"></path><path d="M11.5 9l-2.5 3h4l-2.5 3"></path>',
  TABLET:'<rect x="4" y="2" width="16" height="20" rx="2.5"></rect><path d="M11 18h2"></path>',
  PHONE:'<rect x="7" y="2" width="10" height="20" rx="2.5"></rect><path d="M11 5h2M12 18h.01"></path>',
  MONITOR:'<rect x="3" y="5" width="18" height="12" rx="1.5"></rect><path d="M7 21h10M8 13l4-4"></path>',
  NETWORK:'<rect x="3" y="13" width="18" height="6" rx="2"></rect><path d="M7 16h.01M11 16h.01M12 13V10M8.5 7a5 5 0 0 1 7 0"></path>',
  OTHER:'<rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M9 12h6M12 9v6"></path>'
};
const ST = { NEW:'รอรับเรื่อง', ACCEPTED:'รับเรื่องแล้ว', DONE:'เสร็จ', CANCELLED:'ยกเลิก' };

function $(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?'':v).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;').split("'").join('&#39;'); }
function norm(v){ let t=String(v||'').toLowerCase(), o=''; for(let i=0;i<t.length;i++){ const c=t.charAt(i); if(c!==' '&&c!=='\t'&&c!=='\n'&&c!==' ') o+=c; } return o; }
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function rnd(n){ const a=new Uint8Array(n); try{ crypto.getRandomValues(a); }catch(e){ for(let i=0;i<n;i++) a[i]=Math.floor(Math.random()*256); } let s=''; for(let i=0;i<n;i++) s+=('0'+a[i].toString(16)).slice(-2); return s; }
function deviceId(){ let d=lsGet(LS.dev); if(!d||typeof d!=='string'||d.length<16){ d='d'+rnd(12); lsSet(LS.dev,d); } return d; }
function sentList(){ const a=lsGet(LS.sent); return Array.isArray(a)?a.filter(x=>x&&x.k):[]; }
function sentKeys(){ return sentList().map(x=>x.k).slice(0,60); }
function addSent(k,no){ const a=sentList().filter(x=>x.k!==k); a.unshift({k:k,no:no,at:Date.now()}); lsSet(LS.sent,a.slice(0,60)); }
function svg(inner,size,stroke){ return '<svg aria-hidden="true" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+(stroke||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>'; }
function typeInfo(t){ const T=(P.d&&P.d.types)||[]; for(const x of T){ if(x[0]===t) return x; } return ['OTHER','อื่น ๆ',false,'#6B7A72']; }
function devIcon(t,box){ const i=typeInfo(t), k=ICON[t]?t:'OTHER'; return '<span class="dev" role="img" aria-label="'+esc(i[1])+'" style="width:'+box+'px;height:'+box+'px;border-radius:'+Math.round(box*0.26)+'px;background:'+esc(i[3])+'">'+svg(ICON[k],Math.round(box*0.6),'#FFFFFF')+'</span>'; }
function title(a){ return typeInfo(a.Type)[1]+((a.Brand||a.Model)?' · '+[a.Brand,a.Model].filter(Boolean).join(' '):''); }
function sub(a){ return [a.AssetNo||a.AssetCode,a.Location,a.UserName].filter(Boolean).join(' · '); }
function byId(id){ return ((P.d&&P.d.assets)||[]).find(a=>a.AssetID===id)||null; }
function thDT(v){ const d=new Date(v); if(isNaN(d)) return ''; const p=n=>('0'+n).slice(-2); return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes())+' น.'; }
function toast(msg,bad){ const t=document.createElement('div'); t.className='toast'+(bad?' bad':''); t.setAttribute('role',bad?'alert':'status'); t.textContent=msg; $('toastBox').appendChild(t); setTimeout(()=>t.remove(),bad?5200:3000); }
function run(fn,arg){ return new Promise((res,rej)=>{ google.script.run.withSuccessHandler(r=>{ if(r&&r.ok) res(r); else rej(new Error((r&&r.message)||'เกิดข้อผิดพลาด')); }).withFailureHandler(()=>{ const x=new Error('เชื่อมต่อไม่สำเร็จ'); x.net=true; rej(x); })[fn](arg); }); }
function over(on,t,s){ $('over').classList.toggle('hidden',!on); if(t) $('overT').textContent=t; if(s!==undefined) $('overS').textContent=s; }
function fill(h){ $('main').innerHTML=h; }
function setTab(t){ P.tab=t; document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); render(); window.scrollTo(0,0); if(t==='mine') loadMine(); }
function setMineCount(){ const n=P.jobs.filter(j=>j.Status==='NEW'||j.Status==='ACCEPTED').length, el=$('nMine'); el.textContent=n||''; el.classList.toggle('hidden',!n); }

/* ---------- boot ---------- */
async function boot(){
  P.me=lsGet(LS.me); const dr=lsGet(LS.draft);
  if(dr&&dr.at&&Date.now()-dr.at<6*3600000){ P.sym=dr.sym||''; P.phone=dr.phone||''; P.urg=dr.urg==='URGENT'?'URGENT':'NORMAL'; P.key=dr.key||''; if(!BOOT.assetCode){ P.assetId=dr.assetId||''; P.other=!!dr.other; P.dev=dr.dev||''; P.loc=dr.loc||''; } }
  try{
    const r=await run('apiPubBoot',{DeviceID:deviceId(),keys:sentKeys()});
    if(!r.enabled){ fill('<div class="card center"><h2 style="justify-content:center">ปิดการแจ้งซ่อมผ่าน QR ชั่วคราว</h2><p class="muted">กรุณาแจ้งผ่านระบบ Gateway เมนู "ทะเบียนครุภัณฑ์คอมพิวเตอร์และแจ้งซ่อม" หรือติดต่องานสารสนเทศ</p></div>'); $('tabs').classList.add('hidden'); return; }
    P.d=r; P.jobs=r.jobs||[]; setMineCount();
    if(P.me&&(!P.me.g||(r.people[P.me.g]||[]).indexOf(P.me.n)<0)){ P.me=null; lsDel(LS.me); }
    if(BOOT.assetCode){ const a=(r.assets||[]).find(x=>x.AssetCode===BOOT.assetCode); if(a){ P.assetId=a.AssetID; P.other=false; } else toast('ไม่พบเครื่องรหัส '+BOOT.assetCode+' ในทะเบียน กรุณาเลือกเครื่อง',true); }
    if(P.assetId&&!byId(P.assetId)) P.assetId='';
    render();
  }catch(e){ fill('<div class="card center"><h2 style="justify-content:center">เปิดหน้าแจ้งซ่อมไม่สำเร็จ</h2><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">ลองใหม่</button></div>'); }
}
function keep(){ if($('fSym')) P.sym=$('fSym').value; if($('fPhone')) P.phone=$('fPhone').value; if($('fDev')) P.dev=$('fDev').value; if($('fLoc')) P.loc=$('fLoc').value; if($('aq')) P.aq=$('aq').value;
  lsSet(LS.draft,{at:Date.now(),sym:P.sym,phone:P.phone,urg:P.urg,key:P.key,assetId:P.assetId,other:P.other,dev:P.dev,loc:P.loc}); }
function render(){ if(!P.d) return; if(P.tab==='mine') renderMine(); else renderRep(); }

/* ---------- แจ้งซ่อม ---------- */
function pickGroup(g){ keep(); P.pickG=g; P.q=''; render(); setTimeout(()=>{ const el=$('nq'); if(el&&(P.d.people[g]||[]).length>12) el.focus(); },50); }
function pickName(n){ keep(); P.me={g:P.pickG,n:n}; lsSet(LS.me,P.me); P.pickG=''; render(); window.scrollTo(0,0); }
function changeMe(){ keep(); P.pickG=P.me?P.me.g:''; P.me=null; lsDel(LS.me); render(); }
function pickAsset(id){ keep(); P.assetId=id; P.other=false; render(); window.scrollTo(0,0); }
function setOther(on){ keep(); P.other=on; P.assetId=''; render(); }
function setUrg(u){ keep(); P.urg=u; render(); }
function addQuick(t){ const el=$('fSym'); const c=el.value.trim(); el.value=c?(c.indexOf(t)>=0?c:c+' '+t):t; keep(); el.focus(); }
function nameList(){
  const all=P.d.people[P.pickG]||[], q=norm(P.q), rows=all.filter(n=>!q||norm(n).indexOf(q)>=0);
  const box=$('nlist'); if(!box) return;
  box.innerHTML=rows.length?rows.map(n=>'<button type="button" class="opt" data-n="'+esc(n)+'" onclick="pickName(this.dataset.n)"><span class="av" aria-hidden="true">'+esc(n.replace('นาย','').replace('นางสาว','').replace('นาง','').trim().charAt(0))+'</span><span class="grow"><b>'+esc(n)+'</b></span></button>').join('')
    :'<p class="muted small" style="margin:4px 0">'+(all.length?'ไม่พบชื่อที่ค้นหา':'ยังไม่มีรายชื่อในกลุ่มงานนี้ กรุณาเลือกกลุ่มงานอื่น หรือติดต่องานสารสนเทศ')+'</p>';
}
function whoCard(){
  if(P.me) return '<section class="card"><div class="who"><span class="av" aria-hidden="true">'+svg('<circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>',22)+'</span><div class="grow"><div class="xs muted">ผู้แจ้ง</div><b>'+esc(P.me.n)+'</b><div class="small muted">'+esc(P.me.g)+'</div></div><button type="button" class="btn ghost" onclick="changeMe()">เปลี่ยน</button></div></section>';
  if(!P.pickG) return '<section class="card"><h2><span class="step">1</span>กลุ่มงานของคุณ</h2><div class="grid2">'+P.d.groups.map(g=>'<button type="button" class="opt" data-g="'+esc(g)+'" onclick="pickGroup(this.dataset.g)"><span class="grow"><b>'+esc(g)+'</b></span></button>').join('')+'</div></section>';
  return '<section class="card"><h2><span class="step">2</span>ชื่อของคุณ</h2><p class="small" style="margin:-4px 0 10px">กลุ่มงาน: <b>'+esc(P.pickG)+'</b> <button type="button" class="btn ghost" onclick="pickGroup(\'\')">เปลี่ยนกลุ่มงาน</button></p>'
    +((P.d.people[P.pickG]||[]).length>8?'<input class="in" id="nq" placeholder="พิมพ์ค้นหาชื่อ" autocomplete="off" aria-label="ค้นหาชื่อ" value="'+esc(P.q)+'" oninput="P.q=this.value;nameList()" style="margin-bottom:8px">':'')
    +'<div class="list" id="nlist"></div></section>';
}
function assetPick(a, extra){ return '<button type="button" class="opt" data-id="'+esc(a.AssetID)+'" onclick="pickAsset(this.dataset.id)">'+devIcon(a.Type,44)+'<span class="grow"><b>'+esc(title(a))+'</b><small>'+esc(extra||sub(a))+'</small></span></button>'; }
function deviceSection(){
  const A=P.d.assets||[], a=P.assetId?byId(P.assetId):null;
  if(a){
    const ups=A.filter(x=>x.Type==='UPS'&&x.LinkedAssetID===a.AssetID), host=a.Type==='UPS'?byId(a.LinkedAssetID):null, prs=A.filter(x=>x.Type==='PRINTER'&&(x.SharedWith||[]).indexOf(a.AssetID)>=0);
    return '<section class="card" style="border-color:#BFDCCB"><div class="who">'+devIcon(a.Type,56)+'<div class="grow"><div class="xs muted">เครื่องที่แจ้ง</div><b style="font-size:17px">'+esc(title(a))+'</b><div class="small muted">'+esc([a.AssetNo||a.AssetCode,a.Location,a.WorkGroup].filter(Boolean).join(' · '))+'</div></div>'+(P.me?'<button type="button" class="btn ghost" onclick="pickAsset(\'\')">เปลี่ยน</button>':'')+'</div>'
      +ups.map(u=>'<div class="note"><span>ถ้าปัญหาอยู่ที่เครื่องสำรองไฟ (UPS) ของเครื่องนี้</span><button type="button" class="btn sec" data-id="'+esc(u.AssetID)+'" onclick="pickAsset(this.dataset.id)">แจ้งที่ UPS</button></div>').join('')
      +prs.slice(0,3).map(p=>'<div class="note"><span>ถ้าปัญหาอยู่ที่เครื่องพิมพ์ '+esc([p.Brand,p.Model].filter(Boolean).join(' '))+'</span><button type="button" class="btn sec" data-id="'+esc(p.AssetID)+'" onclick="pickAsset(this.dataset.id)">แจ้งที่เครื่องพิมพ์</button></div>').join('')
      +(host?'<div class="note"><span>UPS นี้ต่อกับ '+esc(title(host))+'</span><button type="button" class="btn sec" data-id="'+esc(host.AssetID)+'" onclick="pickAsset(this.dataset.id)">แจ้งที่เครื่องหลัก</button></div>':'')+'</section>';
  }
  if(!P.me) return '';
  if(P.other) return '<section class="card"><h2><span class="step">3</span>อุปกรณ์ที่มีปัญหา</h2><label class="lbl" for="fDev">อุปกรณ์ *</label><input class="in" id="fDev" maxlength="200" value="'+esc(P.dev)+'" placeholder="เช่น อินเทอร์เน็ตทั้งห้อง, เครื่องสแกนบัตร" oninput="keep()">'
    +'<div class="fld"><label class="lbl" for="fLoc">จุดที่ใช้งาน</label><input class="in" id="fLoc" maxlength="160" value="'+esc(P.loc)+'" placeholder="เช่น ห้องตรวจ 2" oninput="keep()"></div><button type="button" class="btn ghost" style="margin-top:8px" onclick="setOther(false)">กลับไปเลือกจากรายการเครื่อง</button></section>';
  const me=norm(P.me.n), mine=A.filter(x=>me&&norm(x.UserName)===me), mineIds=mine.map(x=>x.AssetID);
  const grp=A.filter(x=>mineIds.indexOf(x.AssetID)<0&&(x.WorkGroup===P.me.g||(x.Type==='PRINTER'&&(x.SharedWith||[]).some(id=>mineIds.indexOf(id)>=0))));
  grp.sort((x,y)=>(x.Location||'').localeCompare(y.Location||'','th'));
  const q=norm(P.aq), found=q?A.filter(x=>norm([x.AssetCode,x.AssetNo,x.Brand,x.Model,x.Location,x.UserName,x.WorkGroup,typeInfo(x.Type)[1]].join(' ')).indexOf(q)>=0).slice(0,30):[];
  return '<section class="card"><h2><span class="step">3</span>เครื่องที่มีปัญหา</h2>'
    +'<div class="sub" style="margin-top:0">เครื่องของคุณ ('+mine.length+')</div>'+(mine.length?'<div class="list">'+mine.map(x=>assetPick(x)).join('')+'</div>':'<p class="muted small" style="margin:0">ไม่มีเครื่องที่ระบุชื่อคุณเป็นผู้ใช้หลัก</p>')
    +'<div class="sub">เครื่องอื่นใน'+esc(P.me.g)+' ('+grp.length+')</div>'+(grp.length?'<div class="list">'+grp.map(x=>assetPick(x)).join('')+'</div>':'<p class="muted small" style="margin:0">ไม่มีเครื่องอื่นในกลุ่มงานนี้</p>')
    +'<div class="sub">ค้นหาเครื่องอื่น</div><input class="in" id="aq" value="'+esc(P.aq)+'" placeholder="เลขครุภัณฑ์ รหัสบนสติกเกอร์ ยี่ห้อ จุดใช้งาน" autocomplete="off" aria-label="ค้นหาเครื่อง" oninput="P.aq=this.value;drawFound()"><div class="list" id="found" style="margin-top:8px">'+foundHtml(found,q)+'</div>'
    +'<button type="button" class="btn sec" style="width:100%;margin-top:14px" onclick="setOther(true)">อุปกรณ์อื่น / ไม่อยู่ในรายการ</button></section>';
}
function foundHtml(found,q){ return q?(found.length?found.map(x=>assetPick(x)).join(''):'<p class="muted small" style="margin:0">ไม่พบเครื่องที่ค้นหา</p>'):''; }
function drawFound(){ const A=P.d.assets||[], q=norm(P.aq), f=q?A.filter(x=>norm([x.AssetCode,x.AssetNo,x.Brand,x.Model,x.Location,x.UserName,x.WorkGroup,typeInfo(x.Type)[1]].join(' ')).indexOf(q)>=0).slice(0,30):[]; $('found').innerHTML=foundHtml(f,q); }
function formSection(){
  if(!P.me||!(P.assetId||P.other)) return '';
  const quick=P.d.quick||[];
  return '<section class="card"><h2><span class="step">'+(P.assetId&&!P.other?'3':'4')+'</span>อาการที่พบ</h2>'
    +'<label class="lbl" for="fSym">เล่าอาการสั้น ๆ *</label><textarea class="in" id="fSym" maxlength="1000" placeholder="เช่น เปิดเครื่องแล้วจอไม่ขึ้นภาพ" oninput="keep()">'+esc(P.sym)+'</textarea>'
    +(quick.length?'<div class="fld"><div class="lbl">อาการที่พบบ่อย (แตะเพื่อเติม)</div><div class="quick">'+quick.map(q=>'<button type="button" class="chip-q" data-q="'+esc(q)+'" onclick="addQuick(this.dataset.q)">'+esc(q)+'</button>').join('')+'</div></div>':'')
    +'<div class="fld"><div class="lbl">ความเร่งด่วน</div><div class="urg"><button type="button" class="'+(P.urg==='NORMAL'?'on':'')+'" onclick="setUrg(\'NORMAL\')">ปกติ</button><button type="button" class="'+(P.urg==='URGENT'?'on u':'')+'" onclick="setUrg(\'URGENT\')">ด่วน · ทำงานไม่ได้</button></div></div>'
    +'<div class="fld"><label class="lbl" for="fPhone">เบอร์ติดต่อกลับ</label><input class="in" id="fPhone" maxlength="40" inputmode="tel" value="'+esc(P.phone)+'" placeholder="เบอร์ภายใน / มือถือ" oninput="keep()"></div>'
    +'<button type="button" class="btn big" id="sendBtn" onclick="send()">ส่งแจ้งซ่อม</button><div class="err hidden" id="sendErr"></div></section>';
}
function renderRep(){
  if(P.done){ const d=P.done;
    fill('<div class="card done"><div class="ok">'+svg('<path d="M5 12l5 5 9-10"></path>',40,'#FFFFFF')+'</div><h2 style="justify-content:center;margin:14px 0 4px;font-size:22px">ส่งแจ้งซ่อมแล้ว</h2><p style="margin:0;font-size:18px">เลขที่ <b>'+esc(d.no)+'</b></p><p class="muted small" style="margin:8px 0 18px">งานสารสนเทศ / ธุรการ จะรับเรื่องและดำเนินการ<br>ดูสถานะได้ที่ "งานที่แจ้งจากเครื่องนี้"</p><div class="list"><button type="button" class="btn" onclick="setTab(\'mine\')">ดูงานที่แจ้ง</button><button type="button" class="btn sec" onclick="P.done=null;P.assetId=\'\';P.other=false;render()">แจ้งเครื่องอื่น</button></div></div>'); return; }
  fill(deviceSection_top()+whoCard()+deviceSection_rest()+formSection());
  if(!P.me&&P.pickG) nameList();
}
function deviceSection_top(){ return P.assetId&&!P.other?deviceSection():''; }
function deviceSection_rest(){ return P.assetId&&!P.other?'':deviceSection(); }
async function send(){
  if(P.busy) return; keep();
  const err=$('sendErr'), a=P.assetId?byId(P.assetId):null;
  const show=m=>{ err.textContent=m; err.classList.remove('hidden'); };
  err.classList.add('hidden');
  if(!a&&P.dev.trim().length<2){ show('กรุณาระบุอุปกรณ์ที่มีปัญหา'); return; }
  if(P.sym.trim().length<3){ show('กรุณาระบุอาการที่พบ'); $('fSym').focus(); return; }
  if(!P.key){ P.key='k'+rnd(12); keep(); }
  const req={ClientKey:P.key,DeviceID:deviceId(),WorkGroup:P.me.g,Name:P.me.n,AssetID:a?a.AssetID:'',DeviceText:a?'':P.dev.trim(),Location:a?'':P.loc.trim(),Symptom:P.sym.trim(),Urgency:P.urg,ContactPhone:P.phone.trim()};
  P.busy=true; $('sendBtn').disabled=true; over(true,'กำลังส่ง…','อย่าปิดหน้านี้');
  const slow=setTimeout(()=>over(true,'สัญญาณช้า กำลังส่งต่อ…','อย่าปิดหน้านี้ ข้อมูลยังอยู่ในเครื่อง'),8000);
  let r=null, last=null;
  for(let i=0;i<3&&!r;i++){ try{ r=await run('apiPubSubmit',req); }catch(e){ last=e; if(!e.net) break; await new Promise(z=>setTimeout(z,1500)); } }
  clearTimeout(slow); over(false); P.busy=false;
  if(!r){ const b=$('sendBtn'); if(b) b.disabled=false; show(last&&last.net?'ส่งไม่สำเร็จ สัญญาณไม่ดี กดส่งอีกครั้งได้ (ระบบไม่สร้างงานซ้ำ)':(last?last.message:'ส่งไม่สำเร็จ')); return; }
  addSent(P.key,r.RepairNo); lsDel(LS.draft);
  try{ if(navigator.vibrate) navigator.vibrate(80); }catch(e){}
  P.done={no:r.RepairNo}; P.key=''; P.sym=''; P.urg='NORMAL'; P.dev=''; P.loc=''; P.aq='';
  render(); window.scrollTo(0,0); loadMine(true);
}

/* ---------- งานที่แจ้งจากเครื่องนี้ ---------- */
async function loadMine(quiet){
  if(!quiet&&P.tab==='mine'&&!P.jobs.length) fill('<div class="sk"></div><div class="sk"></div>');
  try{ const r=await run('apiPubMine',{DeviceID:deviceId(),keys:sentKeys()}); P.jobs=r.jobs||[]; setMineCount(); if(P.tab==='mine') renderMine(); }
  catch(e){ if(!quiet) toast(e.message,true); if(P.tab==='mine') renderMine(); }
}
function renderMine(){
  const J=P.jobs;
  fill('<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><p class="muted small" style="margin:0">งานที่แจ้งจากมือถือเครื่องนี้</p><button type="button" class="btn ghost" onclick="loadMine()">โหลดล่าสุด</button></div>'
    +(J.length?J.map(j=>'<div class="job"><div class="job-h">'+devIcon(j.AssetType||'OTHER',42)+'<div class="grow"><b>'+(j.Urgency==='URGENT'?'<span style="color:var(--phc-danger)">ด่วน · </span>':'')+esc(j.Symptom)+'</b><small>'+esc(j.AssetLabel)+'</small><small>'+esc(j.RepairNo)+' · '+esc(thDT(j.ReportedAt))+' · '+esc(j.ReportedByName)+'</small></div><span class="chip c-'+esc(j.Status)+'">'+esc(ST[j.Status]||j.Status)+'</span></div>'
      +(j.Status==='ACCEPTED'?'<div class="fix muted">รับเรื่องโดย '+esc(j.AcceptedByName)+' '+esc(thDT(j.AcceptedAt))+'</div>':'')
      +(j.Status==='DONE'?'<div class="fix"><b style="display:inline">ผลการซ่อม:</b> '+esc(j.FixText)+'<small>'+esc(j.DoneByName)+' '+esc(thDT(j.DoneAt))+'</small></div>':'')
      +(j.Status==='CANCELLED'?'<div class="fix muted">ยกเลิก: '+esc(j.CancelReason)+'</div>':'')
      +(j.Status==='NEW'?(P.cancelFor===j.ClientKey?'<div class="fix"><label class="lbl" for="cr">เหตุผลที่ยกเลิก</label><input class="in" id="cr" maxlength="300" placeholder="เช่น เครื่องกลับมาใช้ได้แล้ว"><div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="btn" data-k="'+esc(j.ClientKey)+'" onclick="cancelJob(this,this.dataset.k)">ยืนยันยกเลิก</button><button type="button" class="btn sec" onclick="P.cancelFor=\'\';renderMine()">ไม่ยกเลิก</button></div></div>'
        :'<div class="fix" style="text-align:right"><button type="button" class="btn ghost" data-k="'+esc(j.ClientKey)+'" onclick="P.cancelFor=this.dataset.k;renderMine();setTimeout(()=>$(\'cr\')&&$(\'cr\').focus(),30)">ยกเลิกงานนี้</button></div>'):'')+'</div>').join('')
      :'<div class="card center"><p class="muted" style="margin:0">ยังไม่มีงานที่แจ้งจากมือถือเครื่องนี้</p></div>')
    +'<p class="muted xs center" style="margin-top:14px">งานที่แจ้งจากมือถือเครื่องอื่น หรือผ่าน Gateway จะไม่แสดงที่นี่</p>');
}
async function cancelJob(btn,k){
  const r=$('cr').value.trim(); if(r.length<3){ toast('กรุณาระบุเหตุผลที่ยกเลิก',true); return; }
  btn.disabled=true;
  try{ const x=await run('apiPubCancel',{DeviceID:deviceId(),ClientKey:k,reason:r,keys:sentKeys()}); P.jobs=x.jobs||[]; P.cancelFor=''; setMineCount(); renderMine(); toast('ยกเลิกงานแล้ว'); }
  catch(e){ btn.disabled=false; toast(e.message,true); }
}
boot();
</script>
</body>
</html>
