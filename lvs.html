 * google.script.run.<ฟังก์ชันเดิม>(...) → Edge lvs.call ผ่านแอปแม่ (ตรรกะเดิมทุกบรรทัด · ข้อมูลระบุตัวตนเข้ารหัสที่ Edge) */
(function () {
  var P = null; try { P = window.parent && window.parent !== window ? window.parent.PHC37 : null; } catch (e) { P = null; }
  function send(fn, args) {
    if (!P) return Promise.reject(new Error('เปิดหน้านี้จากแอป PHC37 เท่านั้น'));
    return P.api('lvs.call', { token: P.token(), fn: fn, args: args }).then(function (r) {
      if (r && r.code === 'unauthorized') return new Promise(function () {});   // แอปแม่พาไปหน้าเข้าสู่ระบบ
      if (r && r.code === 'network') throw new Error(r.message);
      return r;
    });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (t, k) {
      if (k === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (k === 'withFailureHandler') return function (f) { return runner(ok, f); };
      if (k === 'withUserObject') return function () { return runner(ok, fail); };
      return function () {
        var args = [].slice.call(arguments);
        send(String(k), args).then(function (r) { if (ok) ok(r); }, function (e) { if (fail) fail(e); });
      };
    } });
  }
  window.google = { script: { run: runner(null, null), host: { close: function () {} } } };
})();

/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}
.phc-table .phc-num{text-align:right;font-variant-numeric:tabular-nums}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';
  }

  function documentHtml(o){
    o = o || {};
    if (!o.title) throw new Error('PHC37Print.document: ต้องระบุ title');
    return '<!doctype html><html lang="th"><head><meta charset="utf-8">'
      + '<title>' + esc(o.title) + (o.docNo ? ' ' + esc(o.docNo) : '') + '</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">'
      + '<style>' + baseCss(o) + (o.extraCss || '') + '</style></head><body>'
      + '<div class="phc-p-page">'
      // หัวกระดาษอยู่ใน thead: เบราว์เซอร์พิมพ์ซ้ำทุกหน้า
      + '<table class="phc-p-frame" role="presentation"><thead><tr><td>' + letterhead(o) + '</td></tr></thead><tbody><tr><td>'
      + '<h1 class="phc-p-title">' + esc(o.title) + '</h1>'
      + (o.bodyHtml || '')
      + signatures(o.signatures)
      + '</td></tr></tbody></table>'
      + '</div></body></html>';
  }

  // พิมพ์ผ่าน iframe ซ่อน รอฟอนต์โหลดก่อนสั่งพิมพ์ (ฟอนต์ไม่มาภายใน 2.5 วินาทีก็พิมพ์ต่อ)
  function printHtml(html, opts){
    opts = opts || {};
    var frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('title', 'พิมพ์เอกสาร');
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(frame);
    var doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    var done = false;
    var go = function(){
      if (done) return; done = true;
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
        if (typeof opts.onDone === 'function') opts.onDone(null);
      } catch (err) {
        if (typeof opts.onDone === 'function') opts.onDone(err);
      }
      setTimeout(function(){ try { frame.remove(); } catch (e) {} }, 60000);
    };
    var waitFonts = function(){
      try {
        if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function(){ setTimeout(go, 50); });
        else setTimeout(go, 400);
      } catch (e) { setTimeout(go, 400); }
      setTimeout(go, 2500);
    };
    if (doc.readyState === 'complete') waitFonts();
    else frame.onload = waitFonts;
  }

  window.PHC37Print = {
    VERSION: 'PHC37-PRINT-1.0.3',
    CONFIDENTIAL: CONFIDENTIAL,
    ORG: ORG,
    LOGO: LOGO,
    esc: esc,
    thaiNow: thaiNow,
    document: documentHtml,
    print: printHtml
  };
})();
</script>

/* text helpers without regex literals (Apps Script page transform safety) */
function isDigit(c){ return c>='0'&&c<='9'; }
function digits(t){ t=String(t==null?'':t); let o=''; for(let i=0;i<t.length;i++) if(isDigit(t[i])) o+=t[i]; return o; }
function allDigits(t,n){ t=String(t==null?'':t); if(n!==undefined&&t.length!==n) return false; if(!t.length) return false; for(let i=0;i<t.length;i++) if(!isDigit(t[i])) return false; return true; }

/* ---------- dates ---------- */
function keyOf(v){ if(!v) return ''; if(isKeyStr(v)) return v; const d=new Date(v); if(isNaN(d)) return ''; return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); }

function shortDate(v){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-'); return d+'/'+m+'/'+(Number(y)+543); }
function thDateTime(v){ if(!v) return '-'; const d=new Date(v); if(isNaN(d)) return '-'; const t=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); return shortDate(v)+' '+t+' น.'; }

/* ---------- server ---------- */
function callRaw_(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(r=>{
      if(!r){ reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); return; }
      if(!r.ok){ { const mm=String(r.message||''); if(mm.indexOf('Session')>=0||mm.indexOf('เปิดระบบใหม่')>=0) sessionLost(); } reject(new Error(r.message||'เกิดข้อผิดพลาด')); return; }
      resolve(r.data !== undefined ? r.data : r);
    }).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}
/* PHC37Load (UI Kit 1.2.0): เส้นวิ่งด้านบนระหว่างรอเซิร์ฟเวอร์ (ขึ้นเมื่อรอเกิน 0.3 วินาที) */
function call(fn, ...args){

}

  if(on){ if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.setAttribute('aria-busy','true');
    const plain=btn.classList.contains('phc-btn--secondary')||btn.classList.contains('phc-btn--ghost')||btn.classList.contains('phc-btn--edit')||btn.classList.contains('phc-btn--danger-soft')||!btn.classList.contains('phc-btn');

  min=min||3;

/* ---------- Thai calendar (B.E.) ---------- */
let CAL=null;
function dateField(id, key, opts){ opts=opts||{}; const typed=!!opts.typed;
  return `<div class="date-field"><input class="phc-input ${typed?'typed':''}" id="${id}" data-key="${esc(key||'')}" data-max="${esc(opts.max||'')}" data-min="${esc(opts.min||'')}" value="${key?esc(shortDate(key)):''}" ${typed?`inputmode="numeric" oninput="typedDate('${id}')" onblur="typedDate('${id}',1)"`:`readonly onclick="openCal('${id}')"`} placeholder="วว/ดด/ปปปป (พ.ศ.)">${typed?`<button type="button" class="cal-btn" onclick="openCal('${id}')" aria-label="เลือกจากปฏิทิน">📅</button>`:''}</div>`; }
function parseThai(t){ t=String(t||'').trim(); const parts=[]; let cur=''; for(let i=0;i<t.length;i++){ if(isDigit(t[i])) cur+=t[i]; else { parts.push(cur); cur=''; } } parts.push(cur); if(parts.length!==3||parts[0].length<1||parts[0].length>2||parts[1].length<1||parts[1].length>2||parts[2].length!==4) return ''; const m=[t,parts[0],parts[1],parts[2]]; let y=Number(m[3]); if(y>2400) y-=543; const mo=Number(m[2]), d=Number(m[1]); const dt=new Date(Date.UTC(y,mo-1,d)); if(dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return ''; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function typedDate(id, final){ const el=$(id); const k=parseThai(el.value); el.dataset.key=k; if(final&&k) el.value=shortDate(k); el.style.borderColor=(el.value&&!k)?'#B42318':''; el.dispatchEvent(new Event('change')); }
function dateVal(id){ const el=$(id); return el?(el.dataset.key||''):''; }
function setDate(id,k){ const el=$(id); if(!el) return; el.dataset.key=k||''; el.value=k?shortDate(k):''; el.style.borderColor=''; el.dispatchEvent(new Event('change')); closeCal(); }
function openCal(id){ closeCal(); const el=$(id); const k=el.dataset.key||el.dataset.max&&el.dataset.max<todayKey()&&el.dataset.max||todayKey(); const [y,m]=k.split('-').map(Number); CAL={id,y,m}; renderCal(); }
function closeCal(){ const c=document.getElementById('calPop'); if(c) c.remove(); CAL=null; }
function calMove(n){ let m=CAL.m+n,y=CAL.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;} CAL.y=y; CAL.m=m; renderCal(); }
function calSet(y,m){ if(y) CAL.y=Number(y); if(m) CAL.m=Number(m); renderCal(); }
function renderCal(){
  let c=document.getElementById('calPop'); if(!c){ c=document.createElement('div'); c.id='calPop'; c.className='cal'; document.body.appendChild(c); }
  const el=$(CAL.id), sel=el.dataset.key, t=todayKey(), mx=el.dataset.max||'', mn=el.dataset.min||'', first=new Date(Date.UTC(CAL.y,CAL.m-1,1)).getUTCDay(), days=new Date(Date.UTC(CAL.y,CAL.m,0)).getUTCDate();
  const ty=Number(t.slice(0,4)), y0=mn?Number(mn.slice(0,4)):ty-100, y1=mx?Number(mx.slice(0,4)):ty+1, ys=[]; for(let y=Math.max(y1,CAL.y);y>=Math.min(y0,CAL.y);y--) ys.push(y);
  let h=`<div class="cal-head"><button type="button" onclick="calMove(-1)">‹</button><div class="mid"><select onchange="calSet(0,this.value)" aria-label="เดือน">${TH_MS.map((x,i)=>`<option value="${i+1}" ${i+1===CAL.m?'selected':''}>${x}</option>`).join('')}</select><select onchange="calSet(this.value,0)" aria-label="ปี พ.ศ.">${ys.map(y=>`<option value="${y}" ${y===CAL.y?'selected':''}>${y+543}</option>`).join('')}</select></div><button type="button" onclick="calMove(1)">›</button></div><div class="cal-grid">`+['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<span>${x}</span>`).join('');
  for(let i=0;i<first;i++) h+='<span></span>';
  for(let d=1;d<=days;d++){ const k=`${CAL.y}-${String(CAL.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, w=(first+d-1)%7, dis=(mx&&k>mx)||(mn&&k<mn); h+=`<button type="button" ${dis?'disabled':''} class="${k===sel?'sel':''} ${k===t?'today':''} ${w===0||w===6?'we':''}" onclick="setDate('${CAL.id}','${k}')">${d}</button>`; }

  const vt=sum(v.t), vf=sum(v.f), vPos=vin>0&&vf>0?1:0, units=rows.length+vin, up=hp+vPos, C=ct+vt, CP=cf+vf;

      if(await confirmBox('ตรวจพบข้อมูลที่อาจซ้ำ',h+'<p>ต้องการบันทึกต่อหรือไม่</p>','บันทึกต่อ')) saveSurvey(true); return; }

}

async function reviewSurvey(action){ const s=S.view; let reason='';
  if(action==='REJECT'){ reason=await reasonBox('ไม่รับรองแบบสำรวจ',`<b>${esc(s.SurveyNo)} ${esc(s.PlaceName)}</b> · ไม่นับผล · มือถือที่ส่งจะเห็นเหตุผลนี้ · ถ้าแค่ตัวเลขผิดเล็กน้อย ให้ใช้ "แก้ตัวเลขเองก่อนรับรอง" แทน`,'เหตุผลที่ไม่รับรอง','เช่น ส่งซ้ำกับแผ่น LV2569-0012 / ไม่ใช่พื้นที่ของชุมชนนี้','ไม่รับรอง'); if(!reason) return; }
  else if(!await confirmBox('รับรองแบบสำรวจ',`รับรอง <b>${esc(s.SurveyNo)} ${esc(s.PlaceName)} ครั้งที่ ${esc(s.RoundNo)}</b> · ${esc(s.Houses)} ${s.PlaceType==='COMMUNITY'?'หลัง':'จุด'} · HI ${esc(pct(s.HI))} · CI ${esc(pct(s.CI))}<br>รับรองแล้วนับในภาพรวมและรายงาน และผู้ส่งแก้เองไม่ได้`,'รับรอง')) return;
  const b=$('apBtn'); setBusy(b,true,'กำลังบันทึก…');
  try{ const x=await api('apiReviewSurvey',{SurveyID:s.SurveyID,Version:s.Version,action,reason}); S.dash=null; S.hist=null; S.report=null; setWaiting(x.waiting); toast(action==='APPROVE'?'รับรองแล้ว':'บันทึกไม่รับรองแล้ว'); showSurvey(x.survey,S.back); }catch(e){ setBusy(b,false); toast(e.message,true); } }
function drawSurvey(){ const s=S.view, canc=s.Status==='CANCELLED';
  $('content').innerHTML=`<div class="page-head"><div><a href="#" class="backlink" onclick="go(S.back,true);return false">← กลับ</a><h2>${esc(s.PlaceName)} · ครั้งที่ ${esc(s.RoundNo)} ${canc?chip('ยกเลิกแล้ว','neutral'):(s.Status&&s.Status!=='ACTIVE'?stChip(s.Status):lvPair(s))}</h2><p>${esc(s.SurveyNo)} · ${esc(ptype(s.PlaceType).name)} · สำรวจ ${esc(thDate(s.SurveyDate,true))} (ครั้งที่ ${esc(s.RoundNo)} ของเดือน${esc(monthLabel(s.MonthKey,true))})</p></div>
    <div class="actions"><button class="phc-btn phc-btn--secondary" onclick="printSurvey()">🖨️ พิมพ์แบบสำรวจ</button>${s.canChange?`<button class="phc-btn phc-btn--edit" onclick="editSurvey()">✏️ แก้ไข</button><button class="phc-btn phc-btn--danger-soft" onclick="cancelSurvey()">ยกเลิกแบบสำรวจ</button>`:''}</div></div>
  ${canc?`<div class="card" style="border-color:var(--phc-danger);margin-bottom:12px"><b>ยกเลิกแล้ว</b> — ${esc(s.CancelReason)} <span class="muted small">(${esc(s.UpdatedByName)})</span></div>`:''}${reviewHtml(s)}
  <div class="grid g2"><div class="card"><h3>หัวแบบ</h3><dl class="kv"><dt>${s.PlaceType==='COMMUNITY'?'ชุมชน':'สถานที่'}</dt><dd>${esc(s.PlaceName)}${s.CommunityType?' · ชุมชน'+esc(tx('communityTypeMap',s.CommunityType)):''}</dd><dt>แขวง / เขต</dt><dd>${esc(s.SubDistrict||'-')} / ${esc(s.District||'-')}</dd><dt>ศูนย์บริการฯ</dt><dd>${esc(s.CenterName||'-')}</dd><dt>ผู้สำรวจ</dt><dd>${esc(tx('surveyorMap',s.SurveyorType))}${s.SurveyorName?' · '+esc(s.SurveyorName):''}</dd>${s.FocusID?`<dt>จุดระบาด</dt><dd>📍 ${esc(s.FocusLabel||s.FocusID)}</dd>`:''}${s.Note?`<dt>หมายเหตุ</dt><dd>${esc(s.Note)}</dd>`:''}<dt>บันทึกโดย</dt><dd>${s.Source==='VOL'?'📱 กรอกเองจากมือถือ · ':''}${esc(s.CreatedByName)} · ${esc(thDateTime(s.CreatedAt))}${s.ReviewedByName&&s.Status==='ACTIVE'?`<small class="muted"> · รับรองโดย ${esc(s.ReviewedByName)} ${esc(thDateTime(s.ReviewedAt))}</small>`:''}${s.Version>1?`<small class="muted"> · แก้ล่าสุด ${esc(s.UpdatedByName)} ${esc(thDateTime(s.UpdatedAt))}</small>`:''}</dd></dl></div>
  <div class="card"><h3>ผลการคำนวณ</h3><div class="calc" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><span>หน่วยที่สำรวจ</span><b>${esc(s.Units)}</b></div><div><span>หน่วยที่พบลูกน้ำ</span><b>${esc(s.UnitsPos)}</b></div><div><span>ภาชนะ ทั้งหมด / พบ</span><b>${esc(s.Containers)} / ${esc(s.ContainersPos)}</b></div><div><span>HI</span><b>${esc(pct(s.HI))}</b></div><div><span>CI</span><b>${esc(pct(s.CI))}</b></div><div><span>BI</span><b>${esc(pct(s.BI))}</b></div></div>
    <p class="muted xs" style="margin:8px 0 0">หน่วยที่สำรวจ = ${esc(s.Houses)} ${esc(s.PlaceType==='COMMUNITY'?'หลัง':'จุด')} + ที่รกร้างเข้าได้ ${esc(s.VacantIn)} แห่ง · ตัดสีด้วย ${esc(ptype(s.PlaceType).metric)}</p></div></div>
  <div class="card" style="margin-top:14px"><h3>ผลสำรวจราย${esc(ptype(s.PlaceType).unit)}</h3>${roTable(s)}</div>`;
}
async function editSurvey(){ const s=S.view; await renderEntry(s); }
async function cancelSurvey(){ const s=S.view; const r=await reasonBox('ยกเลิกแบบสำรวจ',`ยกเลิก <b>${esc(s.SurveyNo)} ${esc(s.PlaceName)} ครั้งที่ ${esc(s.RoundNo)}</b> · ข้อมูลยังเก็บไว้ แต่ไม่นับในภาพรวมและรายงาน`,'เหตุผล','เช่น บันทึกซ้ำ / บันทึกผิดชุมชน','ยกเลิกแบบสำรวจ');
  if(!r) return; try{ const x=await api('apiCancelSurvey',{SurveyID:s.SurveyID,Version:s.Version,reason:r}); S.dash=null; S.hist=null; S.report=null; toast('ยกเลิกแล้ว'); showSurvey(x.survey,S.back); }catch(e){ toast(e.message,true); } }

/* ---------- print ---------- */
function printDoc(o){ const P=window.PHC37Print; if(!P){ toast('ไม่พบชุดพิมพ์ PHC37_Print',true); return; }
  const html=P.document(Object.assign({ systemName:'ระบบสำรวจลูกน้ำยุงลาย (LVS)', systemShort:'LVS', docDate:shortDate(todayKey()), printedBy:S.user.fullName }, o)); P.print(html); }
function printSurvey(){ const s=S.view, cs=containers(), show=[]; cs.forEach((c,i)=>{ let used=false; s.rows.forEach(r=>{ if(r.t[i]||r.f[i]) used=true; }); if(s.vacant.t[i]||s.vacant.f[i]) used=true; if(c.active||used) show.push(i); });
  const unit=ptype(s.PlaceType).unit, box=b=>b?'☑':'☐', z=v=>v?String(v):'';
  const head=`<table class="sv-h"><tr><td colspan="2">${s.PlaceType==='COMMUNITY'?'ชื่อชุมชน':'ชื่อสถานที่ ('+esc(ptype(s.PlaceType).name)+')'} <u>${esc(s.PlaceName)}</u></td><td>${s.PlaceType==='COMMUNITY'?`ประเภทชุมชน ${box(s.CommunityType==='FORMAL')} จัดตั้ง ${box(s.CommunityType==='INFORMAL')} ไม่จัดตั้ง`:''}</td></tr>
    <tr><td>แขวง <u>${esc(s.SubDistrict||'-')}</u></td><td>เขต <u>${esc(s.District||'-')}</u></td><td>ศูนย์บริการสาธารณสุข <u>${esc(s.CenterName||'-')}</u></td></tr>
    <tr><td colspan="2">ผู้สำรวจ ${S.text.surveyorTypes.map(x=>box(s.SurveyorType===x[0])+' '+esc(x[1])).join(' ')}${s.SurveyorName?' · <u>'+esc(s.SurveyorName)+'</u>':''}</td><td>วันที่สำรวจ <u>${esc(thDate(s.SurveyDate,true))}</u> (สำรวจครั้งที่ <b>${esc(s.RoundNo)}</b> ของเดือน)</td></tr></table>`;
  const th1=`<tr><th rowspan="2">${esc(unit)}</th>${show.map(i=>`<th colspan="2">${esc(cs[i].label)}</th>`).join('')}<th colspan="2">รวม</th></tr><tr>${show.map(()=>'<th>ทั้งหมด</th><th>พบ</th>').join('')}<th>ทั้งหมด</th><th>พบ</th></tr>`;
  const tot=i=>{ let a=0,b=0; s.rows.forEach(r=>{ a+=r.t[i]; b+=r.f[i]; }); return [a,b]; };
  const rows=s.rows.map(r=>`<tr><td>${esc(r.HouseNo)}</td>${show.map(i=>`<td class="c">${z(r.t[i])}</td><td class="c f">${z(r.f[i])}</td>`).join('')}<td class="c b">${z(sum(r.t))}</td><td class="c b f">${z(sum(r.f))}</td></tr>`).join('');
  const foot=`<tr class="b"><td>รวม ${esc(s.Houses)}</td>${show.map(i=>{ const x=tot(i); return `<td class="c">${z(x[0])}</td><td class="c f">${z(x[1])}</td>`; }).join('')}<td class="c">${z(s.Containers-s.VacantContainers)}</td><td class="c f">${z(s.ContainersPos-sum(s.vacant.f))}</td></tr>`;
  const frm=(lab,a,b,res,unitTxt)=>`<td class="frm"><b>${lab}</b> = <span class="fr"><span>${esc(unitTxt[0])}</span><span>${esc(unitTxt[1])}</span></span> × 100 = <span class="fr"><span>${esc(a)}</span><span>${esc(b)}</span></span> × 100 = <b class="res">${esc(pct(res))} %</b></td>`;
  const formulas=`<table class="sv-fm"><tr>${frm('HI',s.UnitsPos,s.Units,s.HI,['จำนวน'+(s.PlaceType==='COMMUNITY'?'บ้าน':'จุด')+'ที่พบลูกน้ำยุงลาย','จำนวน'+(s.PlaceType==='COMMUNITY'?'บ้าน':'จุด')+'ที่สำรวจทั้งหมด'])}${frm('CI',s.ContainersPos,s.Containers,s.CI,['จำนวนภาชนะที่พบลูกน้ำยุงลาย','จำนวนภาชนะที่สำรวจทั้งหมด'])}</tr></table>
    <p class="phc-p-note">BI = ${esc(pct(s.BI))} · ผลการประเมิน: HI <b>${esc(LV_TH[s.levelHI])}</b> · CI <b>${esc(LV_TH[s.levelCI])}</b> · ${esc(s.PlaceType==='COMMUNITY'?'บ้าน':'จุด')}ที่สำรวจ ${esc(s.Houses)} + ที่รกร้างเข้าได้ ${esc(s.VacantIn)} แห่ง = ${esc(s.Units)} หน่วย</p>`;
  const vac=`<table class="sv-p"><thead><tr><th rowspan="2">สถานที่รกร้าง/<br>ว่างเปล่า</th>${show.map(i=>`<th colspan="2">${esc(cs[i].label)}</th>`).join('')}<th colspan="2">รวม</th></tr><tr>${show.map(()=>'<th>ทั้งหมด</th><th>พบ</th>').join('')}<th>ทั้งหมด</th><th>พบ</th></tr></thead><tbody><tr><td>เข้าได้ <b>${esc(s.VacantIn)}</b> แห่ง</td>${show.map(i=>`<td class="c">${z(s.vacant.t[i])}</td><td class="c f">${z(s.vacant.f[i])}</td>`).join('')}<td class="c b">${z(sum(s.vacant.t))}</td><td class="c b f">${z(sum(s.vacant.f))}</td></tr><tr><td>เข้าไม่ได้ <b>${esc(s.VacantOut)}</b> แห่ง</td><td colspan="${show.length*2+2}"></td></tr></tbody></table>`;
  printDoc({ title:'แบบสำรวจลูกน้ำยุงลาย'+(s.PlaceType==='COMMUNITY'?'ในชุมชน':'ใน'+ptype(s.PlaceType).name), orientation:'landscape', density:'compact', docNo:s.SurveyNo, meta:[['ครั้งที่',String(s.RoundNo)+' · '+monthLabel(s.MonthKey,true)]].concat(s.FocusID?[['จุดระบาด',s.FocusLabel||s.FocusID]]:[]),
    extraCss:'table.sv-h{width:100%;border-collapse:collapse;margin-bottom:6px}table.sv-h td{padding:3px 4px;vertical-align:top}table.sv-h u{text-decoration:none;border-bottom:1px dotted #333;padding:0 4px}table.sv-p{width:100%;border-collapse:collapse;font-size:8.5pt;margin-top:4px}table.sv-p th,table.sv-p td{border:1px solid #444;padding:2px 3px}table.sv-p th{background:#F1F4F2;font-weight:700;text-align:center}table.sv-p td.c{text-align:center}table.sv-p td.f{color:#B42318}table.sv-p .b,table.sv-p td.b{font-weight:700}table.sv-fm{width:100%;margin:8px 0 2px;border-collapse:collapse}table.sv-fm td{padding:4px 6px;vertical-align:middle}.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 2px}.fr span:first-child{border-bottom:1px solid #000;padding:0 4px}.fr span{padding:0 4px;font-size:8.5pt}.res{border-bottom:3px double #000;padding:0 6px}',
    bodyHtml:head+`<table class="sv-p"><thead>${th1}</thead><tbody>${rows}${foot}</tbody></table>`+formulas+vac+(s.Note?`<p class="phc-p-note">หมายเหตุ: ${esc(s.Note)}</p>`:''), signatures:['ผู้สำรวจ','ผู้บันทึกข้อมูล'] }); }

async function renderReports(){
  if(!S.rf.fy) S.rf.fy=(S.refs.fyOptions||[])[0]||fyOf(todayKey());
  loading('กำลังคำนวณรายงาน…');
  try{ S.report=await api('apiReport',{fy:S.rf.fy,scope:S.rf.scope}); S.refs.fyOptions=S.report.fyOptions||S.refs.fyOptions; }catch(e){ errBox(e); return; }
  if(S.page==='reports') drawReport();
}
function metricOf(){ return S.rf.metric||(S.rf.scope==='COMMUNITY'?'HI':'CI'); }
function lvOfCell(c,m){ return m==='BI'?'BI':(c['level'+m]||'NONE'); }
function mtxCell(c){ const m=metricOf(); if(!c.surveys) return `<td class="num c-NONE">-</td>`; return `<td class="num c-${esc(lvOfCell(c,m))}" title="${esc(c.surveys)} ครั้ง · ${esc(c.Units)} หน่วย"><b>${esc(pct(c[m]))}</b></td>`; }

  $('content').innerHTML=`<div class="page-head"><div><h2>รายงานการสำรวจลูกน้ำยุงลาย</h2><p>ปีงบประมาณ ${esc(R.fy)} (ต.ค. ${esc(R.fy-1)} – ก.ย. ${esc(R.fy)}) · นับเฉพาะแบบสำรวจที่รับรองแล้ว</p></div>
    <div class="actions"><select class="phc-select" aria-label="ปีงบประมาณ" onchange="S.rf.fy=Number(this.value);renderReports()">${(S.refs.fyOptions||[]).map(x=>opt(x,'ปีงบประมาณ '+x,x===R.fy)).join('')}</select>${segHtml('rScope',[['COMMUNITY','ชุมชน'],['OTHER','สถานที่อื่น']],rf.scope,"S.rf.scope=segVal('rScope');S.rf.metric='';renderReports()")}<button class="phc-btn phc-btn--secondary" onclick="printReport()">🖨️ พิมพ์</button></div></div>
  <div class="grid g4"><div class="stat"><span>แบบสำรวจทั้งปี</span><b>${esc(y.surveys)}</b><i>แผ่น</i></div><div class="stat"><span>หน่วยที่สำรวจ</span><b>${esc(y.Units)}</b><i>พบลูกน้ำ ${esc(y.UnitsPos)}</i></div><div class="stat"><span>HI · CI · BI ทั้งปี</span><b style="font-size:22px">${esc(pct(y.HI))} · ${esc(pct(y.CI))} · ${esc(pct(y.BI))}</b><i>${lvPair(y)}</i></div><div class="stat"><span>ภาชนะ ทั้งหมด / พบ</span><b style="font-size:22px">${esc(y.Containers)} / ${esc(y.ContainersPos)}</b><i>ที่รกร้างเข้าไม่ได้ ${esc(y.VacantOut)} แห่ง</i></div></div>
  <div class="tabs" style="margin-top:14px">${tabs.map(t=>`<button class="tab ${rf.tab===t[0]?'on':''}" onclick="S.rf.tab='${t[0]}';drawReport()">${esc(t[1])}</button>`).join('')}</div>${body}`;
}
function printReport(){ const R=S.report, rf=S.rf, m=metricOf(), y=R.year, sc=rf.scope==='COMMUNITY'?'ชุมชน':'สถานที่อื่น';

    bodyHtml:`<table class="phc-p-table"><thead><tr><th>${rf.scope==='COMMUNITY'?'ชุมชน':'สถานที่'}</th>${R.months.map(x=>`<th>${esc(x.label)}</th>`).join('')}<th>ทั้งปี</th></tr></thead><tbody>${R.matrix.map(r=>`<tr><td>${esc(r.PlaceName)}</td>${r.cells.map(c=>`<td class="phc-p-num c-${esc(c.surveys?lvOfCell(c,m):'NONE')}">${c.surveys?esc(pct(c[m])):'-'}</td>`).join('')}<td class="phc-p-num c-${esc(r.year.surveys?lvOfCell(r.year,m):'NONE')}"><b>${r.year.surveys?esc(pct(r.year[m])):'-'}</b></td></tr>`).join('')}<tr><td><b>รวม</b></td>${R.totals.map(t=>`<td class="phc-p-num"><b>${t.surveys?esc(pct(t[m])):'-'}</b></td>`).join('')}<td class="phc-p-num"><b>${y.surveys?esc(pct(y[m])):'-'}</b></td></tr></tbody></table><p class="phc-p-note">เกณฑ์: ${legendText()}</p>` }); return; }

    bodyHtml:`<table class="phc-p-table"><thead><tr><th>เดือน</th><th>${rf.scope==='COMMUNITY'?'ชุมชน':'สถานที่'}ที่สำรวจ</th><th>แบบสำรวจ</th><th>หน่วยที่สำรวจ</th><th>หน่วยที่พบ</th><th>ภาชนะ</th><th>ภาชนะที่พบ</th><th>HI</th><th>CI</th><th>BI</th><th>รกร้างเข้าไม่ได้</th></tr></thead><tbody>${R.totals.map(t=>`<tr><td>${esc(monthLabel(t.month,true))}</td><td class="phc-p-num">${esc(t.places)} / ${esc(R.matrix.length)}</td><td class="phc-p-num">${esc(t.surveys)}</td><td class="phc-p-num">${esc(t.Units)}</td><td class="phc-p-num">${esc(t.UnitsPos)}</td><td class="phc-p-num">${esc(t.Containers)}</td><td class="phc-p-num">${esc(t.ContainersPos)}</td><td class="phc-p-num">${esc(pct(t.HI))}</td><td class="phc-p-num">${esc(pct(t.CI))}</td><td class="phc-p-num">${esc(pct(t.BI))}</td><td class="phc-p-num">${esc(t.VacantOut)}</td></tr>`).join('')}<tr><td><b>ทั้งปีงบ</b></td><td></td><td class="phc-p-num"><b>${esc(y.surveys)}</b></td><td class="phc-p-num"><b>${esc(y.Units)}</b></td><td class="phc-p-num"><b>${esc(y.UnitsPos)}</b></td><td class="phc-p-num"><b>${esc(y.Containers)}</b></td><td class="phc-p-num"><b>${esc(y.ContainersPos)}</b></td><td class="phc-p-num"><b>${esc(pct(y.HI))}</b></td><td class="phc-p-num"><b>${esc(pct(y.CI))}</b></td><td class="phc-p-num"><b>${esc(pct(y.BI))}</b></td><td class="phc-p-num"><b>${esc(y.VacantOut)}</b></td></tr></tbody></table>` }); return; }
  if(rf.tab==='containers'){ const tf=R.containers.reduce((a,c)=>a+c.f,0); printDoc({ title:'ภาชนะที่พบลูกน้ำยุงลาย ('+sc+')', meta:meta,
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>ประเภทภาชนะ</th><th>สำรวจ</th><th>พบลูกน้ำ</th><th>CI ของประเภท</th><th>สัดส่วนของที่พบ (%)</th></tr></thead><tbody>${R.containers.map(c=>`<tr><td>${esc(c.label)}</td><td class="phc-p-num">${esc(c.t)}</td><td class="phc-p-num">${esc(c.f)}</td><td class="phc-p-num">${esc(pct(c.ci))}</td><td class="phc-p-num">${esc(pctOf(c.f,tf))}</td></tr>`).join('')}</tbody></table>` }); return; }
  if(rf.tab==='repeat'){ printDoc({ title:'บ้าน/จุดที่พบลูกน้ำซ้ำตั้งแต่ 2 เดือน ('+sc+')', meta:meta,
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>#</th><th>สถานที่</th><th>บ้านเลขที่/จุด</th><th>จำนวนเดือน</th><th>ครั้งที่พบ</th><th>เดือนที่พบ</th></tr></thead><tbody>${R.repeat.map((h,i)=>`<tr><td class="phc-p-num">${i+1}</td><td>${esc(h.PlaceName)}</td><td>${esc(h.HouseNo)}</td><td class="phc-p-num">${esc(h.nMonths)}</td><td class="phc-p-num">${esc(h.times)}</td><td>${esc(h.months.join(', '))}</td></tr>`).join('')}</tbody></table>` }); return; }
  printDoc({ title:'แบบสำรวจลูกน้ำยุงลายรอบจุดระบาด', orientation:'landscape', meta:meta,
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>#</th><th>จุดระบาด</th><th>สถานที่</th><th>วันที่</th><th>ครั้งที่</th><th>บ้าน สำรวจ/พบ</th><th>HI</th><th>CI</th><th>BI</th></tr></thead><tbody>${R.focus.map((s,i)=>`<tr><td class="phc-p-num">${i+1}</td><td>${esc(s.FocusLabel||s.FocusID)}</td><td>${esc(s.PlaceName)}</td><td>${esc(shortDate(s.SurveyDate))}</td><td class="phc-p-num">${esc(s.RoundNo)}</td><td class="phc-p-num">${esc(s.Units)} / ${esc(s.UnitsPos)}</td><td class="phc-p-num">${esc(pct(s.HI))}</td><td class="phc-p-num">${esc(pct(s.CI))}</td><td class="phc-p-num">${esc(pct(s.BI))}</td></tr>`).join('')}</tbody></table>` }); }

/* ---------- settings ---------- */
function renderSettings(){
  if(!canSet()){ go('home',true); return; }
  const tabs=[['places','สถานที่'],['vols','อสส. (หน้ากรอกมือถือ)']]; if(S.user.isAdmin){ tabs.push(['containers','ประเภทภาชนะ']); tabs.push(['rules','เกณฑ์สี / หัวแบบ']); }
  if(!tabs.some(t=>t[0]===S.setTab)) S.setTab='places';
  $('content').innerHTML=`<div class="page-head"><div><h2>ตั้งค่า</h2><p>${S.user.isAdmin?'ผู้ดูแลระบบ':'ผู้มีสิทธิ์แก้ไข (สถานที่)'}</p></div></div>
    <div class="tabs">${tabs.map(t=>`<button class="tab ${S.setTab===t[0]?'on':''}" onclick="S.setTab='${t[0]}';renderSettings()">${esc(t[1])}</button>`).join('')}</div><div id="setBody"></div>`;
  ({places:drawPlaces,vols:drawVols,containers:drawContainers,rules:drawRules}[S.setTab])();
}
function drawPlaces(){ const P=S.refs.places||[];
  $('setBody').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">สถานที่อื่น (โรงเรียน ศูนย์เด็กเล็ก ศาสนสถาน ฯลฯ)</h3><button class="phc-btn phc-btn--sm" onclick="placeForm('')">+ เพิ่มสถานที่</button></div>
    <p class="muted small">ชุมชน ${esc((S.refs.communities||[]).length)} แห่งดึงจากรายชื่อชุมชนของ Gateway อัตโนมัติ ไม่ต้องเพิ่มที่นี่ <a href="#" onclick="reloadComms();return false">โหลดรายชื่อชุมชนใหม่</a></p>
    ${P.length?`<div class="table-wrap"><table class="t"><thead><tr><th>ชื่อสถานที่</th><th>ประเภท</th><th>ชุมชน</th><th>สถานะ</th><th></th></tr></thead><tbody>${P.map(p=>`<tr><td><b>${esc(p.PlaceName)}</b>${p.Note?'<small>'+esc(p.Note)+'</small>':''}</td><td>${esc(ptype(p.PlaceType).name)}</td><td>${esc(p.CommunityName||'-')}</td><td>${p.Active?chip('ใช้งาน','success'):chip('ปิดใช้','neutral')}</td><td><button class="phc-btn phc-btn--edit phc-btn--sm" onclick="placeForm('${esc(p.PlaceID)}')">แก้ไข</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">ยังไม่มีสถานที่</p>'}</div>`; }
async function reloadComms(){ try{ S.refs=await api('apiRefs',true); toast('โหลดรายชื่อชุมชนแล้ว '+S.refs.communities.length+' แห่ง'); drawPlaces(); }catch(e){ toast(e.message,true); } }
function placeForm(id){ const p=(S.refs.places||[]).filter(x=>x.PlaceID===id)[0]||{PlaceType:'SCHOOL',Active:true};
  openModal(id?'แก้ไขสถานที่':'เพิ่มสถานที่',`<div class="form-grid">${field('ประเภท',`<select class="phc-select" id="plType">${S.text.placeTypes.filter(t=>t.key!=='COMMUNITY').map(t=>opt(t.key,t.name,t.key===p.PlaceType)).join('')}</select>`,'',true)}${field('ชื่อสถานที่',`<input class="phc-input" id="plName" maxlength="120" value="${esc(p.PlaceName||'')}">`,'',true)}
    ${field('อยู่ในชุมชน',`<select class="phc-select" id="plComm">${opt('','— ไม่ระบุ —',!p.CommunityName)}${(S.refs.communities||[]).map(c=>opt(c.CommunityName,c.CommunityName,c.CommunityName===p.CommunityName)).join('')}</select>`)}${field('แขวง',`<input class="phc-input" id="plSub" maxlength="60" value="${esc(p.SubDistrict||S.refs.settings.SUB_DISTRICT||'')}">`)}
    ${field('หมายเหตุ',`<input class="phc-input" id="plNote" maxlength="300" value="${esc(p.Note||'')}">`,'full')}${id?field('สถานะ',segHtml('plAct',[['1','ใช้งาน'],['0','ปิดใช้']],p.Active?'1':'0'),'full'):''}</div>`,
    `<button class="phc-btn phc-btn--secondary" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" id="plBtn" onclick="savePlace('${esc(id)}')">บันทึก</button>`); }
async function savePlace(id){ const b=$('plBtn'); setBusy(b,true);
  try{ S.refs.places=await api('apiSavePlace',{PlaceID:id,PlaceType:val('plType'),PlaceName:val('plName'),CommunityName:val('plComm'),SubDistrict:val('plSub'),Note:val('plNote'),Active:id?segVal('plAct')==='1':true}); closeModal(); toast('บันทึกสถานที่แล้ว'); S.dash=null; drawPlaces(); }catch(e){ setBusy(b,false); toast(e.message,true); } }
function drawContainers(){ const cs=containers();
  $('setBody').innerHTML=`<div class="card"><h3>ประเภทภาชนะ (คอลัมน์ในแบบสำรวจ)</h3><p class="muted small">มี 10 ช่อง · ตั้งต้นใช้ 8 ประเภทตามแบบฟอร์ม · ช่องที่ปิดใช้จะไม่แสดงตอนบันทึกใหม่ แต่ข้อมูลเดิมยังอยู่ · <b>ไม่ควรเปลี่ยนความหมายของช่องที่มีข้อมูลแล้ว</b> (เปลี่ยนชื่อได้เมื่อแก้คำ) ถ้าต้องการประเภทใหม่ให้เปิดช่องสำรอง</p>
    ${cs.map((c,i)=>`<div class="slotrow"><b>C${i+1}</b><input class="phc-input" id="cl${i}" maxlength="60" value="${esc(c.label)}"><label class="chk-item" style="border:0"><input type="checkbox" class="chk" id="ca${i}" ${c.active?'checked':''}> ใช้งาน</label></div>`).join('')}
    <div style="margin-top:12px"><button class="phc-btn" id="csBtn" onclick="saveContainers()">บันทึก</button></div></div>`; }
async function saveContainers(){ const b=$('csBtn'); setBusy(b,true); const list=containers().map((c,i)=>({label:val('cl'+i),active:$('ca'+i).checked}));
  try{ S.refs.settings=await api('apiSaveSettings',{containers:list}); toast('บันทึกประเภทภาชนะแล้ว'); drawContainers(); }catch(e){ setBusy(b,false); toast(e.message,true); } }
function drawRules(){ const st=S.refs.settings;
  const c=st.levels||{HI:{},CI:{},names:{}}, opSel=(id,v)=>`<select class="phc-select" id="${id}" style="width:auto">${opt('GE','≥ ตั้งแต่',v==='GE')}${opt('GT','> มากกว่า',v==='GT')}</select>`;
  const mrow=(m,lv,key,id)=>`<div class="rule-row">${lvChip(lv)}<span>เมื่อ ${m}</span>${opSel('ro'+id,c[m][key+'Op'])}<input class="phc-input" id="rv${id}" inputmode="decimal" style="width:90px" value="${esc(c[m][key])}"></div>`;
  $('setBody').innerHTML=`<div class="grid g2"><div class="card"><h3>เกณฑ์สี (4 ระดับ · ใช้ทั้ง HI และ CI ทุกสถานที่)</h3>
      <p class="muted small" style="margin-top:0">${lvChip('SAFE')} = 0 · ${lvChip('LOW')} มากกว่า 0 แต่ยังไม่ถึงเกณฑ์${esc(LV_TH.HIGH)} · สีคงที่ แก้ได้เฉพาะตัวเลขและชื่อระดับ</p>
      <h4 style="margin:10px 0 4px">HI</h4>${mrow('HI','HIGH','high','Hh')}${mrow('HI','VHIGH','vhigh','Hv')}
      <h4 style="margin:12px 0 4px">CI</h4>${mrow('CI','HIGH','high','Ch')}${mrow('CI','VHIGH','vhigh','Cv')}
      <h4 style="margin:12px 0 4px">ชื่อระดับ</h4><div class="form-grid">${['SAFE','LOW','HIGH','VHIGH'].map((k,i)=>field(['สีเขียว (= 0)','สีเหลือง','สีส้ม','สีแดง'][i],`<input class="phc-input" id="rn${k}" maxlength="30" value="${esc(c.names[k]||'')}">`)).join('')}</div>
      <div style="margin-top:12px"><button class="phc-btn" id="rBtn" onclick="saveRules()">บันทึกเกณฑ์</button></div><div style="margin-top:10px">${legendHtml()}</div></div>
    <div class="card"><h3>หัวแบบ / เชื่อมระบบ</h3><div class="form-grid">${field('แขวง (ตั้งต้น)',`<input class="phc-input" id="tSub" value="${esc(st.SUB_DISTRICT)}">`)}${field('เขต',`<input class="phc-input" id="tDis" value="${esc(st.DISTRICT)}">`)}${field('ศูนย์บริการสาธารณสุข',`<input class="phc-input" id="tCen" value="${esc(st.CENTER_NAME)}">`,'full')}
      ${field('รหัสไฟล์ข้อมูลระบบควบคุมโรค (ไม่บังคับ)',`<input class="phc-input" id="tCdc" value="${esc(st.CDC_SPREADSHEET_ID)}" placeholder="เว้นว่าง = ไม่แสดงช่องผูกจุดระบาด">`,'full')}
      ${field('รหัสไฟล์ข้อมูลระบบ อสส. (ใช้ตอนนำเข้ารายชื่อ)',`<input class="phc-input" id="tOss" value="${esc(st.OSS_SPREADSHEET_ID||'')}" placeholder="เว้นว่าง = ไม่ใช้ปุ่มนำเข้า">`,'full')}</div>
      <div style="margin-top:12px"><button class="phc-btn" id="tBtn" onclick="saveTexts()">บันทึก</button></div></div></div>`; }
async function saveRules(){ const b=$('rBtn'); setBusy(b,true);
  try{ S.refs.settings=await api('apiSaveSettings',{numbers:{HI_L_HIGH:val('rvHh'),HI_L_VHIGH:val('rvHv'),CI_L_HIGH:val('rvCh'),CI_L_VHIGH:val('rvCv')},
      levelTexts:{HI_OP_HIGH:val('roHh'),HI_OP_VHIGH:val('roHv'),CI_OP_HIGH:val('roCh'),CI_OP_VHIGH:val('roCv'),LV_NAME_SAFE:val('rnSAFE'),LV_NAME_LOW:val('rnLOW'),LV_NAME_HIGH:val('rnHIGH'),LV_NAME_VHIGH:val('rnVHIGH')}});
    applyLevelNames(); S.dash=null; S.report=null; S.hist=null; toast('บันทึกเกณฑ์แล้ว'); drawRules(); }catch(e){ setBusy(b,false); toast(e.message,true); } }
async function saveTexts(){ const b=$('tBtn'); setBusy(b,true);
  try{ S.refs.settings=await api('apiSaveSettings',{texts:{SUB_DISTRICT:val('tSub'),DISTRICT:val('tDis'),CENTER_NAME:val('tCen'),CDC_SPREADSHEET_ID:val('tCdc'),OSS_SPREADSHEET_ID:val('tOss')}}); S.focus=null; toast('บันทึกแล้ว'); drawRules(); }catch(e){ setBusy(b,false); toast(e.message,true); } }

/* ---------- อสส. (หน้ากรอกมือถือ · 2.1.0 ไม่ใช้ LINE) ---------- */
async function drawVols(){ $('setBody').innerHTML='<div class="card">'+phcSk(5)+'</div>';
  try{ S.vols=await api('apiVolAdmin'); }catch(e){ $('setBody').innerHTML=`<div class="card"><p class="muted">${esc(e.message)}</p></div>`; return; }
  if(S.page==='settings'&&S.setTab==='vols') drawVolsBody(); }
function drawVolsBody(){ const A=S.vols, st=A.status, L=A.list, q=(S.volQ||'').trim().toLowerCase();
  const stBox=st.enabled?`<div class="alert-row s"><b>✅ เปิดให้ อสส. กรอกแล้ว</b><span class="small">ใครมีลิงก์/QR นี้ก็กรอกได้ทันที ไม่ต้องเข้าสู่ระบบ · ทุกแผ่นต้องรับรองก่อนนับผล</span></div>`
    :`<div class="alert-row w"><b>⚠️ ยังไม่เปิดให้ อสส. กรอก</b><span class="small">ผู้ดูแลต้องตั้ง Script Properties: ${esc((st.missing||[]).join(' · '))}</span></div>`;
  const shown=q?L.filter(v=>(v.FullName+' '+v.PlaceNames.join(' ')).toLowerCase().indexOf(q)>=0):L;
  $('setBody').innerHTML=`<div class="card"><h3>หน้าให้ อสส. กรอกเองจากมือถือ</h3>${stBox}
    ${st.volUrl?`<div class="line-grid" style="margin-top:12px"><div><p class="small" style="margin:0 0 6px"><b>ลิงก์สำหรับ อสส.</b> (ลิงก์เดียวใช้ทุกคน · ส่งในกลุ่ม LINE / ปักหมุด / พิมพ์ QR ติดบอร์ด)</p><input class="phc-input" readonly value="${esc(st.volUrl)}" onclick="this.select()"><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="copyText('${esc(st.volUrl)}')">📋 คัดลอกลิงก์</button><button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="printVolQr()">🖨️ พิมพ์ QR</button></div>
      <p class="muted xs" style="margin-top:10px">อสส. เปิดลิงก์ → เลือกชุมชน → แตะชื่อตัวเอง (ไม่มีชื่อพิมพ์เองได้) → กรอกทีละบ้าน → ส่ง · แบบสำรวจที่ส่งมาอยู่ในเมนู "รอรับรอง"${A.guest?` · มีแผ่นที่พิมพ์ชื่อเอง ${esc(A.guest)} แผ่น`:''}</p></div><div class="qr-box" id="qrVol"></div></div>`:''}</div>
  <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">รายชื่อให้เลือกในมือถือ (${esc(L.length)})</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${A.ossLinked?`<button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="ossImport()">⬇️ นำเข้าจาก อสส. (OSS2)</button>`:''}<button class="phc-btn phc-btn--sm" onclick="volForm('')">+ เพิ่มรายชื่อ</button></div></div>
    <p class="muted small">มือถือแสดงรายชื่อตามชุมชน/สถานที่ที่ผูกไว้ · ปิดใช้ = ไม่แสดงในมือถือ (แบบสำรวจเดิมยังอยู่)</p>
    <input class="phc-input" style="max-width:320px;margin-bottom:8px" placeholder="ค้นชื่อ / ชุมชน" value="${esc(S.volQ||'')}" oninput="S.volQ=this.value;clearTimeout(S.volT);S.volT=setTimeout(drawVolsBody,250)">
    ${shown.length?`<div class="table-wrap"><table class="t"><thead><tr><th>ชื่อ</th><th>ชุมชน / สถานที่</th><th class="num">ส่งแล้ว / รอ</th><th>สำรวจล่าสุด</th><th></th></tr></thead><tbody>${shown.map(v=>`<tr><td><b>${esc(v.FullName)}</b><small>${esc(v.VolTypeName)}${v.Active?'':' · ปิดใช้'}${v.OssID?' · จาก OSS2':''}</small></td><td>${esc(v.PlaceNames.join(', '))}</td><td class="num">${esc(v.total)} / ${esc(v.pending)}</td><td>${v.lastAt?esc(shortDate(v.lastAt)):'-'}</td>
      <td class="nowrap"><button class="phc-btn phc-btn--edit phc-btn--sm" onclick="volForm('${esc(v.VolID)}')">แก้ไข</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">'+(q?'ไม่พบ':'ยังไม่มีรายชื่อ · เพิ่มเอง หรือนำเข้าจากระบบ อสส.')+'</p>'}</div>`;
  if(st.volUrl) drawQr('qrVol',st.volUrl); }
function copyText(t){ try{ navigator.clipboard.writeText(t).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่ได้ ให้กดค้างที่ช่องลิงก์แล้วคัดลอกเอง',true)); }catch(e){ toast('คัดลอกไม่ได้',true); } }
function loadQrLib(){ if(window.qrcode) return Promise.resolve(true); return new Promise(res=>{ const s=document.createElement('script'); s.src=['https:','','cdnjs.cloudflare.com','ajax','libs','qrcode-generator','1.4.4','qrcode.min.js'].join(String.fromCharCode(47)); s.onload=()=>res(!!window.qrcode); s.onerror=()=>res(false); document.head.appendChild(s); }); }
async function qrSvg(url, cell){ const ok=await loadQrLib(); if(!ok||!window.qrcode) return ''; const q=window.qrcode(0,'M'); q.addData(url); q.make(); return q.createSvgTag({cellSize:cell||4,margin:2,scalable:true}); }
async function drawQr(id, url){ const el=$(id); if(!el) return; const svg=await qrSvg(url); el.innerHTML=svg||'<span class="small muted">แสดง QR ไม่ได้ ใช้ลิงก์แทน</span>'; }
async function printVolQr(){ const url=S.vols.status.volUrl, svg=await qrSvg(url,8); if(!svg){ toast('สร้าง QR ไม่ได้ (เน็ตไม่ออก) ใช้ลิงก์แทน',true); return; }
  printDoc({ title:'สำรวจลูกน้ำยุงลาย · สำหรับ อสส.', meta:[], bodyHtml:`<div style="text-align:center;padding:10mm 0"><div style="font-size:22pt;font-weight:700;margin-bottom:6mm">สแกนเพื่อส่งผลสำรวจลูกน้ำยุงลาย</div><div style="width:120mm;height:120mm;margin:0 auto">${svg}</div><div style="font-size:16pt;margin-top:8mm;line-height:1.6">1. สแกน QR ด้วยกล้องมือถือ หรือ LINE<br>2. เลือกชุมชน แล้วแตะชื่อตัวเอง<br>3. กรอกทีละบ้าน แล้วกด "ส่งแบบสำรวจ"</div><div style="font-size:11pt;margin-top:8mm;color:#555">ถ้ามีแถบ "แอปพลิเคชันนี้สร้างโดยผู้ใช้ Google Apps Script" ด้านบน กด ✕ ปิดได้</div></div>` }); }
function volForm(id){ const v=(S.vols.list||[]).filter(x=>x.VolID===id)[0]||{VolType:'OSS',PlaceKeys:[],Active:true}, keys=v.PlaceKeys||[];
  const types=S.text.volTypes||[['OSS','อสส.']], places=allPlaces();
  openModal(id?'แก้ไขรายชื่อ':'เพิ่มรายชื่อผู้กรอก',`<div class="form-grid">${field('ชื่อ-สกุล',`<input class="phc-input" id="vfName" maxlength="120" value="${esc(v.FullName||'')}">`,'',true)}${field('ประเภท',`<select class="phc-select" id="vfType">${types.map(t=>opt(t[0],t[1],t[0]===v.VolType)).join('')}</select>`,'',true)}
    ${field('ชุมชน / สถานที่ (ชื่อนี้จะแสดงให้เลือกในที่เหล่านี้)',`<div class="pick-list" id="vfPlaces">${places.map(p=>`<label><input type="checkbox" class="chk" value="${esc(p.key)}" ${keys.indexOf(p.key)>=0?'checked':''}> ${esc(p.name)} <span class="muted xs">${esc(ptype(p.type).name)}</span></label>`).join('')}</div>`,'full',true)}
    ${field('หมายเหตุ',`<input class="phc-input" id="vfNote" maxlength="300" value="${esc(v.Note||'')}">`,'full')}${id?field('สถานะ',segHtml('vfAct',[['1','ใช้งาน'],['0','ปิดใช้']],v.Active?'1':'0'),'full'):''}</div><div id="vfErr"></div>`,
    `<button class="phc-btn phc-btn--secondary" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" id="vfBtn" onclick="volSave('${esc(id)}')">บันทึก</button>`); }
async function volSave(id){ const b=$('vfBtn'); setBusy(b,true); const keys=[...document.querySelectorAll('#vfPlaces input:checked')].map(x=>x.value);
  try{ S.vols=await api('apiVolSave',{VolID:id,FullName:val('vfName'),VolType:val('vfType'),PlaceKeys:keys,Note:val('vfNote'),Active:id?segVal('vfAct')==='1':true}); closeModal(); toast('บันทึกแล้ว'); drawVolsBody(); }catch(e){ setBusy(b,false); toast(e.message,true); } }
async function ossImport(){ openModal('นำเข้ารายชื่อจากระบบ อสส.','<div id="ossBody">'+phcSk(5)+'</div>','<button class="phc-btn phc-btn--secondary" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" id="ossBtn" disabled onclick="ossApply()">นำเข้าที่เลือก</button>','lg');
  try{ const r=await api('apiVolOssList'); S.ossRows=r.rows; const can=r.rows.filter(x=>!x.exists&&x.PlaceKey);
    $('ossBody').innerHTML=`<p class="muted small" style="margin-top:0">อ่านเฉพาะชื่อ + ชุมชนของ อสส. ที่ยังทำงานอยู่ · ผูกชุมชนตามที่บันทึกในระบบ อสส. (แก้ภายหลังได้) · ${esc(can.length)} คนนำเข้าได้</p>
      <label class="chk-item" style="border:0"><input type="checkbox" class="chk" id="ossAll" onchange="document.querySelectorAll('#ossList input').forEach(x=>{ if(!x.disabled) x.checked=this.checked; })"> เลือกทั้งหมด</label>
      <div class="pick-list" id="ossList">${r.rows.map((x,i)=>`<label><input type="checkbox" class="chk" value="${i}" ${x.exists||!x.PlaceKey?'disabled':''}> <b>${esc(x.FullName)}</b> <span class="muted xs">${esc(x.CommunityName||'-')}${x.exists?' · มีแล้ว':(x.PlaceKey?'':' · ไม่พบชุมชนนี้ในรายชื่อ')}</span></label>`).join('')||'<p class="muted">ไม่พบรายชื่อ</p>'}</div>`;
    $('ossBtn').disabled=!can.length; }catch(e){ $('ossBody').innerHTML=`<p class="muted">${esc(e.message)}</p>`; } }
async function ossApply(){ const b=$('ossBtn'); const items=[...document.querySelectorAll('#ossList input:checked')].map(x=>S.ossRows[Number(x.value)]);
  if(!items.length){ toast('กรุณาเลือกรายชื่อ',true); return; } setBusy(b,true,'กำลังนำเข้า…');
  try{ S.vols=await api('apiVolOssImport',items); closeModal(); toast('นำเข้าแล้ว '+S.vols.imported+' คน'); drawVolsBody(); }catch(e){ setBusy(b,false); toast(e.message,true); } }

boot();
</script>
<script>
/* ปุ่ม "กลับหน้าหลัก" → หน้าหลักของแอป PHC37 */
window.goGateway = function () { try { sessionStorage.removeItem('lvs1.session'); } catch (e) {} try { window.parent.PHC37.goHome(); } catch (e) {} };
</script>
