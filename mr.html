/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}
.phc-table .phc-num{text-align:right;font-variant-numeric:tabular-nums}
.phc-empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 20px;border:1px dashed var(--phc-border-input);border-radius:var(--phc-radius);background:var(--phc-surface);color:var(--phc-ink-2)}

/* ---------- หน้ายืนยัน ---------- */

  1.0.3: ท้ายกระดาษบรรทัดเดียว ตัวเล็ก (ชื่อย่อระบบ · ผู้พิมพ์ เวลา · ข้อความข้อมูลส่วนบุคคล | หน้า) ยกห่างขอบล่าง
         หัวกระดาษ (ตรา ชื่อหน่วยงาน ที่อยู่ เลขที่เอกสาร) ซ้ำทุกหน้า · ชื่อเอกสารใหญ่อยู่หน้าแรก
         เพิ่ม systemShort (ชื่อย่อในท้ายกระดาษ) ถ้าไม่ระบุ ใช้ข้อความในวงเล็บท้าย systemName เช่น (NCDs)
  1.0.1: ตัวเลขในตาราง (.phc-p-num) ชิดขวาได้จริง
  1.0.2: ข้อความ "เอกสารนี้มีข้อมูลส่วนบุคคล..." ย้ายไปท้ายกระดาษทุกหน้า (ไม่ตกหน้าเดี่ยวอีก)
         เพิ่ม paper: 'A5' (ค่าเริ่มต้น A4) ย่อหัวกระดาษ/ตัวอักษรให้พอดี A5 เอง
  ไฟล์นี้ต้องเหมือนกันทุกระบบ (ใส่เข้าหน้าเว็บด้วย phc37InjectUiKit_)

  ใช้งานในหน้าเว็บ:
    var html = PHC37Print.document({
      title: 'แบบบันทึก...',              // ชื่อเอกสาร (บังคับ)

      systemShort: 'NCDs',                // ชื่อย่อในท้ายกระดาษ (ถ้าไม่ระบุ ใช้ข้อความในวงเล็บท้าย systemName)

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';
  }

  function documentHtml(o){
    o = o || {};
    if (!o.title) throw new Error('PHC37Print.document: ต้องระบุ title');
    return '<!doctype html><html lang="th"><head><meta charset="utf-8">'
      + '<title>' + esc(o.title) + (o.docNo ? ' ' + esc(o.docNo) : '') + '</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">'
      + '<style>' + baseCss(o) + (o.extraCss || '') + '</style></head><body>'
      + '<div class="phc-p-page">'
      // หัวกระดาษอยู่ใน thead: เบราว์เซอร์พิมพ์ซ้ำทุกหน้า
      + '<table class="phc-p-frame" role="presentation"><thead><tr><td>' + letterhead(o) + '</td></tr></thead><tbody><tr><td>'
      + '<h1 class="phc-p-title">' + esc(o.title) + '</h1>'
      + (o.bodyHtml || '')
      + signatures(o.signatures)
      + '</td></tr></tbody></table>'
      + '</div></body></html>';
  }

  // พิมพ์ผ่าน iframe ซ่อน รอฟอนต์โหลดก่อนสั่งพิมพ์ (ฟอนต์ไม่มาภายใน 2.5 วินาทีก็พิมพ์ต่อ)
  function printHtml(html, opts){
    opts = opts || {};
    var frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('title', 'พิมพ์เอกสาร');
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(frame);
    var doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    var done = false;
    var go = function(){
      if (done) return; done = true;
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
        if (typeof opts.onDone === 'function') opts.onDone(null);
      } catch (err) {
        if (typeof opts.onDone === 'function') opts.onDone(err);
      }
      setTimeout(function(){ try { frame.remove(); } catch (e) {} }, 60000);
    };
    var waitFonts = function(){
      try {
        if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function(){ setTimeout(go, 50); });
        else setTimeout(go, 400);
      } catch (e) { setTimeout(go, 400); }
      setTimeout(go, 2500);
    };
    if (doc.readyState === 'complete') waitFonts();
    else frame.onload = waitFonts;
  }

  window.PHC37Print = {
    VERSION: 'PHC37-PRINT-1.0.3',
    CONFIDENTIAL: CONFIDENTIAL,
    ORG: ORG,
    LOGO: LOGO,
    esc: esc,
    thaiNow: thaiNow,
    document: documentHtml,
    print: printHtml
  };
})();

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--phc-font);font-size:16px;color:var(--phc-ink);background:var(--phc-ground);line-height:1.55}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.muted{color:var(--phc-ink-2)}
.small{font-size:14px}
.nowrap{white-space:nowrap}

/* gate */
.gate{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;background:var(--phc-ground)}
.gate-card{width:min(440px,100%);text-align:center;background:#fff;border:1px solid var(--phc-border);border-radius:16px;padding:32px;box-shadow:var(--phc-shadow)}
.gate-card h2{margin:14px 0 6px;font-size:21px}
.spinner{width:40px;height:40px;margin:auto;border:4px solid var(--phc-primary-tint);border-top-color:var(--phc-primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* shell */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#fff;border-right:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand);padding:16px 12px;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid var(--phc-border);margin-bottom:8px}
.brand .phc-brand-mark{width:40px;height:40px}
.brand b{display:block;font-size:17px;line-height:1.25}
.brand span{font-size:13px;color:var(--phc-ink-2)}
.nav-label{font-size:13px;font-weight:700;color:#6B7A72;padding:10px 12px 4px}
.nav-sep{border-top:1px solid var(--phc-border);margin:6px 0}
.nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--phc-ink);text-align:left;padding:10px 12px;border-radius:8px;font-weight:600;cursor:pointer;min-height:44px}
.nav button:hover{background:var(--phc-surface-2)}
.nav button.active{background:var(--phc-primary-tint);color:var(--phc-primary-hover);box-shadow:inset 3px 0 0 var(--phc-primary)}
.nav .ico{width:24px;text-align:center;font-size:18px}
.nav .count{margin-left:auto;min-width:24px;padding:0 7px;border-radius:999px;background:var(--phc-warning);color:#fff;font-size:13px;text-align:center}
.side-user{margin-top:auto;border-top:1px solid var(--phc-border);padding:12px 6px 0;display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--phc-primary-tint);color:var(--phc-primary);font-weight:700;flex:0 0 auto}
.side-user b{display:block;font-size:15px;line-height:1.3}
.side-user span{font-size:13px;color:var(--phc-ink-2)}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 22px;background:#fff;border-bottom:1px solid var(--phc-border)}
.topbar h1{margin:0;font-size:20px;flex:1}
.backdrop{display:none}
.hamb{display:none;border:1px solid var(--phc-border);background:#fff;border-radius:8px;width:44px;height:44px;font-size:20px;cursor:pointer}
.content{padding:20px 22px 40px;max-width:1280px}
.page-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.page-head h2{margin:0;font-size:23px}
.page-head p{margin:2px 0 0;color:var(--phc-ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:#fff;border:1px solid var(--phc-border);border-radius:12px;padding:18px}
.card h3{margin:0 0 10px;font-size:18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.stack>*{min-width:0}
.round-banner{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px 18px;border-radius:12px;background:var(--phc-primary-tint);border:1px solid #B9DFC2}
.round-banner .big{font-size:20px;font-weight:700;color:var(--phc-primary-hover)}
.round-banner .chip{background:#fff;border:1px solid #B9DFC2;border-radius:999px;padding:3px 12px;font-weight:600}
.round-banner.warn{background:var(--phc-warning-bg);border-color:#E8C48F}
.round-banner.warn .big{color:var(--phc-warning)}
.stat{background:#fff;border:1px solid var(--phc-border);border-radius:12px;padding:14px 16px;cursor:default}
.stat.link{cursor:pointer}
.stat.link:hover{border-color:var(--phc-primary)}
.stat span{display:block;color:var(--phc-ink-2);font-size:14px}
.stat b{display:block;font-size:28px;line-height:1.3}
.stat.warn{border-left:4px solid var(--phc-warning)}
.stat.bad{border-left:4px solid var(--phc-danger)}
.stat.good{border-left:4px solid var(--phc-primary)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar .phc-input,.toolbar .phc-select{width:auto;min-width:180px}
.table-wrap{background:#fff;border:1px solid var(--phc-border);border-radius:12px;overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{background:var(--phc-ground);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #EEF1EF;vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--phc-surface-2)}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t input.q{width:96px;text-align:right}
.empty{padding:26px;text-align:center;color:var(--phc-ink-2)}
.badge-st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.st-OPEN{background:var(--phc-info-bg);color:var(--phc-info)}
.st-PENDING{background:var(--phc-warning-bg);color:var(--phc-warning)}
.st-APPROVED{background:#FFF0D6;color:#8A4B00}
.st-ISSUED{background:var(--phc-success-bg);color:var(--phc-success)}
.st-REJECTED{background:var(--phc-danger-bg);color:var(--phc-danger)}
.st-CANCELLED{background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.stk-OUT{background:var(--phc-danger-bg);color:var(--phc-danger)}
.stk-LOW{background:var(--phc-warning-bg);color:var(--phc-warning)}
.stk-OK{background:var(--phc-success-bg);color:var(--phc-success)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.items-table td{vertical-align:middle}
.mat-name b{display:block}
.mat-name span{font-size:13px;color:var(--phc-ink-2)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.kv div{display:flex;gap:8px;min-width:0}
.kv div span{color:var(--phc-ink-2);white-space:nowrap}
.kv div b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.flow .step{border:1px solid var(--phc-border);border-radius:8px;padding:6px 10px;font-size:14px;background:#fff}
.flow .step.done{border-color:#B9DFC2;background:var(--phc-primary-tint)}
.flow .step.bad{border-color:#F5C2BD;background:var(--phc-danger-bg)}

/* modal */
.modal-wrap{position:fixed;inset:0;z-index:200;background:rgba(23,32,26,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto}
.modal{width:min(980px,100%);background:#fff;border-radius:14px;box-shadow:var(--phc-shadow-lg);display:flex;flex-direction:column;max-height:calc(100vh - 56px)}
.modal.sm{width:min(560px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--phc-border)}
.modal-head h3{margin:0;font-size:20px;flex:1}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--phc-border)}
.modal-foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.xbtn{border:0;background:var(--phc-surface-2);width:40px;height:40px;border-radius:8px;font-size:20px;cursor:pointer}
.toast-box{position:fixed;right:16px;bottom:16px;z-index:400;display:grid;gap:8px}
.toast-box .phc-toast.err{background:var(--phc-danger)}

/* picker */
.pick-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;max-height:52vh;overflow:auto;margin-top:10px}
.pick{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--phc-border);border-radius:10px;padding:10px;background:#fff;cursor:pointer}
.pick:hover{border-color:var(--phc-primary);background:var(--phc-surface-2)}
.pick.added{opacity:.55}
.pick img,.pick .noimg{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--phc-ground);display:grid;place-items:center;font-size:20px}
.pick b{display:block;font-size:15px;line-height:1.3}
.pick span{font-size:13px;color:var(--phc-ink-2)}


/* catalog (หน้าเขียนใบเบิกแบบแคตตาล็อก) */
.shop{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.cat-head{position:sticky;top:61px;z-index:5;background:#fff;padding:6px 0 10px;display:grid;gap:10px}
.shop-card{padding-top:14px}
.cat-search{display:flex;gap:8px}
.cat-search .phc-input{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip-btn{flex:0 0 auto;border:1px solid var(--phc-border);background:#fff;color:var(--phc-ink);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;min-height:38px;white-space:nowrap}
.chip-btn:hover{border-color:var(--phc-primary)}
.chip-btn.on{background:var(--phc-primary);border-color:var(--phc-primary);color:#fff}
.chip-btn .n{opacity:.75;font-weight:400;margin-left:4px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mat-card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--phc-border);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.mat-card:hover{box-shadow:var(--phc-shadow)}
.mat-card.sel{border-color:var(--phc-primary);box-shadow:0 0 0 1px var(--phc-primary)}
.mat-card .ph{aspect-ratio:4/3;background:var(--phc-surface-2);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid #EEF1EF}
.mat-card .ph img{width:100%;height:100%;object-fit:contain;background:#fff;padding:6px}
.mat-card .ph .ico{font-size:46px;opacity:.55}
.mat-card.out .ph img,.mat-card.out .ph .ico{filter:grayscale(1);opacity:.55}

<script>
const BOOT = {"version":"MR2-1.3.6","appName":"ระบบเบิก–จ่ายวัสดุ ศบส.37","launchToken":"","returnUrl":""};
const S = { token:'', user:null, materials:[], categories:[], dash:null, page:'dashboard', draft:null, lists:{}, statusText:{} };
const TH_M = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TITLES = {signature:'ลายเซ็นของฉัน',dashboard:'ภาพรวม',create:'เขียนใบเบิก',mine:'ใบเบิกของฉัน',approval:'อนุมัติใบเบิก',issue:'จ่ายพัสดุ',stock:'คลังวัสดุ',reports:'รายงาน',settings:'ตั้งค่า'};
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const fmtQty = v => (v === '' || v == null) ? '-' : Number(v).toLocaleString('th-TH', {maximumFractionDigits:2});

/* ---------- วันที่ ---------- */
function keyOf(v){ if(!v) return ''; if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v; const d=new Date(v); if(isNaN(d)) return ''; const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); return p; }
function thDate(v,full){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-').map(Number); return d+' '+(full?TH_M:TH_MS)[m-1]+' '+(y+543); }
function thDateTime(v){ if(!v) return '-'; const d=new Date(v); if(isNaN(d)) return '-'; const t=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); return thDate(v)+' '+t+' น.'; }
function shortDate(v){ const k=keyOf(v); if(!k) return ''; const [y,m,d]=k.split('-'); return d+'/'+m+'/'+(Number(y)+543); }
function todayKey(){ return keyOf(new Date()); }

/* ---------- เรียกเซิร์ฟเวอร์ ---------- */
function callRaw_(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(r=>{
      if(!r){ reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); return; }
      if(!r.ok){ if(/Session|Gateway|เปิดระบบใหม่/.test(r.message||'')) sessionLost(r.message); reject(new Error(r.message||'เกิดข้อผิดพลาด')); return; }
      resolve(r.data !== undefined ? r.data : r);
    }).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}
/* PHC37Load (UI Kit 1.2.0): เส้นวิ่งด้านบนระหว่างรอเซิร์ฟเวอร์ (ขึ้นเมื่อรอเกิน 0.3 วินาที) */
function call(fn, ...args){
  const L=window.PHC37Load; if(L) L.line.start();
  return callRaw_(fn, ...args).then(v=>{ if(L) L.line.done(); return v; }, e=>{ if(L) L.line.fail(); throw e; });
}
/* โครงเทาแบบรายการ (UI Kit 1.2.0) */
function phcSk(n){ let h='<div class="phc-sk-lines" aria-busy="true"><span class="sr-only" role="status">กำลังโหลด…</span>'; const W=[92,78,85,70,88,64]; for(let k=0;k<(n||4);k++) h+='<span class="phc-sk" style="height:16px;width:'+W[k%W.length]+'%"></span>'; return h+'</div>'; }

function toast(msg, err){ const el=document.createElement('div'); el.className='phc-toast'+(err?' err':''); el.textContent=msg; $('toasts').appendChild(el); setTimeout(()=>el.remove(), err?6500:3500); }
function setBusy(btn, on, text){ if(!btn) return;
  if(on){ if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.setAttribute('aria-busy','true');
    const plain=btn.classList.contains('phc-btn--secondary')||btn.classList.contains('phc-btn--ghost')||btn.classList.contains('phc-btn--edit')||btn.classList.contains('phc-btn--danger-soft')||!btn.classList.contains('phc-btn');
    const t=text||'กำลังบันทึก…'; btn.innerHTML=String(t).indexOf('spinner')>=0?t:'<span class="phc-spin'+(plain?'':' phc-spin--light')+'" aria-hidden="true"></span> '+t; }
  else { btn.disabled=false; btn.removeAttribute('aria-busy'); delete btn.dataset.busy; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }
function openModal(title, body, foot, size){ $('modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal ${size||''}" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button class="xbtn" type="button" onclick="closeModal()" aria-label="ปิด">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`; }

function confirmBox(title, html, okText, danger, withReason, reasonLabel){
  return new Promise(res=>{
    const root=document.createElement('div');

    document.body.appendChild(root);
    root.addEventListener('click',e=>{ const a=e.target.getAttribute&&e.target.getAttribute('data-a'); if(a===null||a===undefined) return; const reason=root.querySelector('#cfReason')?root.querySelector('#cfReason').value.trim():''; if(a==='1'&&withReason==='required'&&reason.length<3){ toast('กรุณาระบุเหตุผล',true); return; } root.remove(); res(a==='1'?{ok:true,reason}:{ok:false}); });

let CAL=null;
function dateField(id, key, opts){ opts=opts||{}; return `<div class="date-field"><input class="phc-input" id="${id}" data-key="${esc(key||'')}" value="${key?esc(shortDate(key)):''}" readonly placeholder="วว/ดด/ปปปป พ.ศ." onclick="openCal('${id}')"><button type="button" class="phc-btn phc-btn--secondary phc-btn--icon" onclick="openCal('${id}')" aria-label="เลือกวันที่">📅</button>${opts.clear?`<button type="button" class="phc-btn phc-btn--ghost" onclick="setDate('${id}','')">ล้าง</button>`:''}</div>`; }
function dateVal(id){ const el=$(id); return el?(el.dataset.key||''):''; }
function setDate(id,k){ const el=$(id); if(!el) return; el.dataset.key=k||''; el.value=k?shortDate(k):''; el.dispatchEvent(new Event('change')); closeCal(); }
function openCal(id){ closeCal(); const el=$(id); const k=el.dataset.key||todayKey(); const [y,m]=k.split('-').map(Number); CAL={id,y,m}; renderCal(); }
function closeCal(){ const c=document.getElementById('calPop'); if(c) c.remove(); CAL=null; }
function calMove(n){ let m=CAL.m+n,y=CAL.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;} CAL.y=y; CAL.m=m; renderCal(); }
function renderCal(){
  let c=document.getElementById('calPop'); if(!c){ c=document.createElement('div'); c.id='calPop'; c.className='cal'; document.body.appendChild(c); }
  const el=$(CAL.id), sel=el.dataset.key, t=todayKey(), first=new Date(Date.UTC(CAL.y,CAL.m-1,1)).getUTCDay(), days=new Date(Date.UTC(CAL.y,CAL.m,0)).getUTCDate();
  let h=`<div class="cal-head"><button type="button" onclick="calMove(-1)">‹</button><b>${TH_M[CAL.m-1]} ${CAL.y+543}</b><button type="button" onclick="calMove(1)">›</button></div><div class="cal-grid">`+['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<span>${d}</span>`).join('');
  for(let i=0;i<first;i++) h+='<span></span>';
  for(let d=1;d<=days;d++){ const k=`${CAL.y}-${String(CAL.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, w=(first+d-1)%7; h+=`<button type="button" class="${k===sel?'sel':''} ${k===t?'today':''} ${w===0||w===6?'we':''}" onclick="setDate('${CAL.id}','${k}')">${d}</button>`; }
  h+=`</div><div class="cal-foot"><button type="button" class="phc-btn phc-btn--ghost phc-btn--sm" onclick="setDate('${CAL.id}','${t}')">วันนี้</button><button type="button" class="phc-btn phc-btn--secondary phc-btn--sm" onclick="closeCal()">ปิด</button></div>`;
  c.innerHTML=h;
  const r=el.getBoundingClientRect(); let top=r.bottom+4, left=r.left; if(top+340>innerHeight) top=Math.max(8,r.top-344); if(left+300>innerWidth) left=Math.max(8,innerWidth-308); c.style.top=top+'px'; c.style.left=left+'px';
}
document.addEventListener('mousedown',e=>{ const c=document.getElementById('calPop'); if(c&&!c.contains(e.target)&&!(e.target.closest&&e.target.closest('.date-field'))) closeCal(); });

const DRIVE_ID_RE=new RegExp('(?:[?&]id=|/d/)([A-Za-z0-9_-]{20,})');
function driveId(u){ const m=String(u||'').match(DRIVE_ID_RE); return m?m[1]:''; }
function matImg(m,size){ if(!m||!m.ImageURL) return ''; const id=driveId(m.ImageURL); return id?'https:\/\/drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+(size||400):m.ImageURL; }

function catKeyOf(m){ const id=m&&m.CategoryID; return id&&S.categories.some(c=>c.CategoryID===id)?id:''; }
function catNameOf(k){ const c=S.categories.find(x=>x.CategoryID===k); return c?c.Name:'ไม่ระบุหมวด'; }

/** หมวดของใบเบิกนี้ = หมวดของรายการแรก · null = ยังไม่ได้เลือกรายการ */
function draftCat(){ const it=S.draft.items[0]; return it?itemCatKey(it):null; }
function draftCats(){ return [...new Set(S.draft.items.map(itemCatKey))]; }
function drawChips(){
  const all=S.materials, lock=draftCat();
  if(lock!==null){
    const n=all.filter(m=>catKeyOf(m)===lock).length;
    $('chips').innerHTML=`<button type="button" class="chip-btn on" aria-pressed="true">${esc(catNameOf(lock))}<span class="n">${n}</span></button><span class="small muted" style="align-self:center">ใบเบิก 1 ใบ เบิกได้ 1 หมวด · หมวดอื่นให้เขียนใบเบิกใหม่</span>`;
    return;
  }
  const cnt=id=>all.filter(m=>!id||m.CategoryID===id).length;
  $('chips').innerHTML=[{CategoryID:'',Name:'ทั้งหมด'}].concat(S.categories.filter(c=>cnt(c.CategoryID))).map(c=>`<button type="button" class="chip-btn ${S.draft.cat===c.CategoryID?'on':''}" onclick="S.draft.cat='${esc(c.CategoryID)}';drawChips();drawCatalog()">${esc(c.Name)}<span class="n">${cnt(c.CategoryID)}</span></button>`).join('');
}
function draftItem(id){ return S.draft.items.find(i=>i.materialId===id); }
function cardAct(m){
  const it=draftItem(m.MaterialID);
  return it?`<div class="stepper"><button type="button" onclick="stepQty('${esc(m.MaterialID)}',-1)" aria-label="ลด">−</button><input type="number" min="0" step="any" inputmode="decimal" value="${esc(it.qty)}" aria-label="จำนวน ${esc(m.Name)}" onchange="setQty('${esc(m.MaterialID)}',this.value)"><span class="u">${esc(m.Unit)}</span><button type="button" onclick="stepQty('${esc(m.MaterialID)}',1)" aria-label="เพิ่ม">+</button></div>`
    :`<button class="phc-btn phc-btn--secondary" type="button" onclick="addItem('${esc(m.MaterialID)}')" aria-label="เพิ่ม ${esc(m.Name)} ในใบเบิก">+ เพิ่ม<span class="lg">ในใบเบิก</span></button>`;
}
function cardHtml(m){
  const it=draftItem(m.MaterialID);
  return `<article class="mat-card ${it?'sel':''} ${m.StockState==='OUT'?'out':''}" id="mc_${esc(m.MaterialID)}"><div class="ph">${thumbHtml(m,400)}</div>${stockTag(m)}${it?'<span class="tick">✓</span>':''}
    <div class="bd"><div class="nm">${esc(m.Name)}</div><div class="meta">หน่วย ${esc(m.Unit)}${m.Code?' · '+esc(m.Code):''}</div><div class="act">${cardAct(m)}</div></div></article>`;
}
function drawCatalog(){
  const q=(S.draft.q||'').trim().toLowerCase(), c=S.draft.cat, lock=draftCat();
  const rows=S.materials.filter(m=>(lock!==null?catKeyOf(m)===lock:(!c||m.CategoryID===c))&&(!q||(m.Name+' '+m.Code).toLowerCase().includes(q)));
  $('catGrid').innerHTML=rows.length?rows.map(cardHtml).join(''):'<div class="empty" style="grid-column:1/-1">ไม่พบวัสดุ</div>';
}
function refreshCard(id){ const el=$('mc_'+id), m=matById(id); if(el&&m) el.outerHTML=cardHtml(m); }
function addItem(id){ if(draftItem(id)) return; const m=matById(id), lock=draftCat();
  if(lock!==null&&catKeyOf(m)!==lock) return toast('ใบเบิกนี้เป็นหมวด “'+catNameOf(lock)+'” · วัสดุหมวด “'+catNameOf(catKeyOf(m))+'” ให้เขียนใบเบิกใหม่',true);
  const first=lock===null; S.draft.items.push({materialId:id,qty:1,note:'',name:m?m.Name:'',unit:m?m.Unit:'',catKey:catKeyOf(m)});
  if(first){ drawChips(); drawCatalog(); } else refreshCard(id); renderItems(); }
function setQty(id,v){ const it=draftItem(id); if(!it) return; const n=Number(v); if(!(n>0)){ removeItem(id); return; } it.qty=Math.round(n*100)/100; refreshCard(id); renderItems(); }
function stepQty(id,d){ const it=draftItem(id); if(!it) return; setQty(id,Math.max(0,num(it.qty)+d)); }
function removeItem(id){ const before=draftCat(); S.draft.items=S.draft.items.filter(i=>i.materialId!==id);
  if(draftCat()!==before){ drawChips(); drawCatalog(); } else refreshCard(id); renderItems(); }
function renderItems(){

  $('cartBody').innerHTML=mixed+items.map(it=>{ const m=matById(it.materialId)||{Name:it.name||'(วัสดุถูกปิดใช้งาน)',Unit:it.unit||'',StockState:'OUT'};
    return `<div class="ci"><div class="th">${thumbHtml(m,120)}</div><div class="nm">${esc(m.Name)}<small>หน่วย ${esc(m.Unit)}${seesQty()?' · คงเหลือ '+fmtQty(m.Balance):''}</small></div><button class="rm" type="button" onclick="removeItem('${esc(it.materialId)}')" aria-label="เอาออก ${esc(m.Name)}">✕</button>
      <div class="row2"><div class="stepper"><button type="button" onclick="stepQty('${esc(it.materialId)}',-1)" aria-label="ลด">−</button><input type="number" min="0" step="any" inputmode="decimal" value="${esc(it.qty)}" onchange="setQty('${esc(it.materialId)}',this.value)" aria-label="จำนวน"><button type="button" onclick="stepQty('${esc(it.materialId)}',1)" aria-label="เพิ่ม">+</button></div><input class="phc-input" value="${esc(it.note||'')}" oninput="draftItem('${esc(it.materialId)}').note=this.value" placeholder="หมายเหตุ (ถ้ามี)"></div>
      ${m.StockState==='OUT'?'<div class="warn">⚠️ ของหมดในคลังตอนนี้ — อาจไม่ได้รับ ถ้าของไม่เข้าก่อนวันจ่าย</div>':''}</div>`; }).join('');

async function saveReq(){
  const btn=$('saveReqBtn');
  const p={reqId:S.draft.reqId, version:S.draft.version, workGroup:$('fWork').value.trim(), purpose:$('fPurpose').value.trim(), needByDate:dateVal('fNeed'), receiverName:$('fRecv').value.trim(), receiverPosition:$('fRecvPos').value.trim(),
    items:S.draft.items.map(i=>({materialId:i.materialId, qty:Number(i.qty), note:(i.note||'').trim()}))};
  if(!p.workGroup){ toggleCart(false); $('fWork').focus(); return toast('กรุณาระบุงาน (กลุ่มงาน)',true); }
  if(!p.purpose){ toggleCart(false); $('fPurpose').setAttribute('aria-invalid','true'); $('fPurpose').focus(); return toast('กรุณาระบุ “เพื่อใช้ในงาน”',true); }
  if(!p.receiverName){ toggleCart(false); $('fRecv').setAttribute('aria-invalid','true'); $('fRecv').focus(); return toast('กรุณาระบุ “มอบให้ (ผู้รับพัสดุแทน)”',true); }
  if(!p.receiverPosition){ toggleCart(false); $('fRecvPos').setAttribute('aria-invalid','true'); $('fRecvPos').focus(); return toast('กรุณาระบุ “ตำแหน่งผู้รับแทน”',true); }
  if(!p.items.length) return toast('กรุณาเพิ่มรายการวัสดุอย่างน้อย 1 รายการ',true);
  if(draftCats().length>1) return toast('ใบเบิก 1 ใบเบิกได้ 1 หมวด กรุณาเอารายการหมวดอื่นออก',true);
  if(p.items.some(i=>!(i.qty>0))) return toast('จำนวนเบิกต้องมากกว่า 0 ทุกรายการ',true);
  setBusy(btn,true);
  const fm=S.lists.mine||(S.lists.mine={status:'',round:'',q:''}); p.listQuery={mode:'mine',status:fm.status,roundKey:fm.round,q:fm.q};
  try{ const r=await api('apiReqSave',p), d=r.detail; toast('บันทึกใบเบิกเลขที่ '+d.ReqNo+' แล้ว · แก้ไขได้ถึง '+thDate(d.CloseKey,true));
    if(r.dash){ S.dash=r.dash; updateBadges(); } if(r.roundOptions) S.roundOptions=r.roundOptions; S.preList=r.list?{mode:'mine',data:r.list}:null;
    S.page='mine'; go('mine'); setTimeout(()=>showReq(d),30); }
  catch(e){ setBusy(btn,false); toast(e.message,true); }
}

function reqTable(rows, mode){
  if(!rows.length) return '<div class="empty">ไม่มีใบเบิก</div>';
  return `<div class="table-wrap"><table class="t"><thead><tr><th>เลขที่</th><th>รอบ</th>${mode==='mine'?'':'<th>งาน / ผู้เบิก</th>'}<th>เพื่อใช้ในงาน</th><th>เขียนเมื่อ</th><th>สถานะ</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" onclick="openReq('${esc(r.ReqID)}')"><td class="nowrap"><b>${esc(r.ReqNo)}</b></td><td class="nowrap">${esc(r.RoundLabel)}</td>${mode==='mine'?'':`<td>${esc(r.WorkGroup)}<div class="small muted">${esc(r.RequesterName)}</div></td>`}<td>${esc(r.Purpose)}</td><td class="nowrap">${thDate(r.CreatedAt)}</td><td>${statusBadge(r.Status)}${r.IssueOverdue?' <span class="badge-st st-REJECTED">เลยกำหนดจ่าย</span>':''}${r.Status==='OPEN'?`<div class="small muted">แก้ได้ถึง ${thDate(r.CloseKey)}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
/* ---------- ผลหลังบันทึก: ใช้ข้อมูลที่เซิร์ฟเวอร์ส่งกลับมาในคำตอบเดียว ---------- */
function listQuery(){ const mode={mine:'mine',approval:'approval',issue:'issue'}[S.page]; if(!mode) return null; const f=S.lists[mode]||{status:mode==='approval'?'PENDING':(mode==='issue'?'APPROVED':''),round:'',q:''}; return {mode,status:f.status,roundKey:f.round,q:f.q}; }
function setMaterials(list){ if(!list) return; S.allMaterials=list; S.materials=list.filter(m=>m.Active); S.matAt=Date.now(); }
function applyAfter(r){
  if(r.dash){ S.dash=r.dash; updateBadges(); }
  if(r.roundOptions) S.roundOptions=r.roundOptions;
  if(r.materials) setMaterials(r.materials);
  if(r.list&&S.drawList&&S.listMode===r.list.mode) S.drawList(r.list);
  else if(S.page==='dashboard'){ S.dashFresh=true; renderDashboard(); }
}
async function loadRoundOptions(){ if(S.roundOptions) return S.roundOptions; try{ S.roundOptions=await api('apiRoundOptions'); }catch(e){ S.roundOptions=[]; } return S.roundOptions; }
async function renderList(mode, title, desc, statuses, defaultStatus, extra){

  const rounds=await loadRoundOptions();
  $('content').innerHTML=`<div class="page-head"><div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div><div class="actions">${extra||''}</div></div>
   <div class="toolbar"><select class="phc-select" id="lStatus">${statuses.map(s=>`<option value="${s[0]}" ${f.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select><select class="phc-select" id="lRound"><option value="">ทุกรอบ</option>${rounds.map(r=>`<option value="${esc(r.key)}" ${f.round===r.key?'selected':''}>รอบ ${esc(r.label)}</option>`).join('')}</select><input class="phc-input" id="lQ" placeholder="ค้นหาเลขที่ / งาน / ผู้เบิก" value="${esc(f.q)}"></div><div id="listBox">${phcSk(4)}</div>`;
  const pageOf={mine:'mine',approval:'approval',issue:'issue',all:'reports'}[mode]||mode;

  const reload=async()=>{ f.status=$('lStatus').value; f.round=$('lRound').value; f.q=$('lQ').value.trim(); $('listBox').innerHTML=phcSk(4);
    try{ draw(await api('apiReqList',{mode,status:f.status,roundKey:f.round,q:f.q})); }
    catch(e){ $('listBox').innerHTML=`<div class="phc-alert phc-alert--danger">${esc(e.message)}</div>`; } };
  $('lStatus').onchange=reload; $('lRound').onchange=reload; let tm; $('lQ').oninput=()=>{ clearTimeout(tm); tm=setTimeout(reload,350); };
  S.reloadList=reload; S.drawList=draw; S.listMode=mode;

  const thead=mode==='approve'?'<th>#</th><th>รายการ</th><th class="num">ขอเบิก</th><th class="num">คงเหลือคลัง</th><th class="num">อนุมัติ</th><th>หมายเหตุ</th>':(mode==='issue'?'<th>#</th><th>รายการ</th><th class="num">ขอ</th><th class="num">อนุมัติ</th><th class="num">คงเหลือคลัง</th><th class="num">จ่ายจริง</th><th>หมายเหตุ</th>':`<th>#</th><th>รายการ</th><th>หน่วย</th><th class="num">ขอเบิก</th><th class="num">อนุมัติ</th><th class="num">จ่าย</th>${showStock?'<th class="num">คงเหลือคลัง</th>':''}`);

async function doApprove(reject){
  const d=S.cur, note=$('apNote').value.trim();
  const items=d.Items.map((it,i)=>({itemId:it.ItemID, approvedQty:Number($('ap_'+i).value), note:$('apn_'+i).value.trim()}));
  if(!reject){ const bad=items.find((x,i)=>!(x.approvedQty>=0)||x.approvedQty>d.Items[i].RequestedQty); if(bad) return toast('จำนวนอนุมัติต้องอยู่ระหว่าง 0 ถึงจำนวนที่ขอ',true); }
  const allZero=reject||items.every(x=>x.approvedQty===0);
  if(allZero&&note.length<3){ $('apNote').setAttribute('aria-invalid','true'); return toast('กรุณาระบุเหตุผลที่ไม่อนุมัติในช่องหมายเหตุ',true); }
  const c=await confirmBox(allZero?'ไม่อนุมัติใบเบิก':'อนุมัติใบเบิก',`<p>ใบเบิก <b>${esc(d.ReqNo)}</b> · ${esc(d.WorkGroup)}</p>${allZero?'':`<p>อนุมัติ ${items.filter(x=>x.approvedQty>0).length} จาก ${items.length} รายการ</p>`}`,allZero?'ไม่อนุมัติ':'อนุมัติ',allZero);
  if(!c.ok) return;
  const btn=$('apBtn'); setBusy(btn,true);
  try{ const r=await api('apiReqApprove',{reqId:d.ReqID,version:d.Version,reject:!!reject,note,items,listQuery:listQuery()}), x=r.detail; toast((x.Status==='REJECTED'?'ไม่อนุมัติ':'อนุมัติ')+'ใบเบิก '+x.ReqNo+' แล้ว'); closeModal(); applyAfter(r); }
  catch(e){ setBusy(btn,false); toast(e.message,true); }
}
async function doIssue(){
  const d=S.cur;
  const items=d.Items.map((it,i)=>$('is_'+i)?{itemId:it.ItemID,issuedQty:Number($('is_'+i).value),note:$('isn_'+i).value.trim()}:{itemId:it.ItemID,issuedQty:0,note:''});
  const bad=items.find((x,i)=>!(x.issuedQty>=0)||x.issuedQty>num(d.Items[i].ApprovedQty)); if(bad) return toast('จำนวนจ่ายต้องอยู่ระหว่าง 0 ถึงจำนวนที่อนุมัติ',true);
  const over=items.find((x,i)=>x.issuedQty>num(d.Items[i].Balance)); if(over) return toast('มีรายการที่จ่ายเกินยอดคงเหลือในคลัง',true);
  const c=await confirmBox('จ่ายพัสดุ',`<p>ใบเบิก <b>${esc(d.ReqNo)}</b> · ${esc(d.WorkGroup)}</p><p>จ่าย ${items.filter(x=>x.issuedQty>0).length} รายการ · ระบบจะตัดคลังทันทีและปิดใบเบิก</p>`,'ยืนยันจ่ายพัสดุ');
  if(!c.ok) return;
  const btn=$('isBtn'); setBusy(btn,true);
  try{ const r=await api('apiReqIssue',{reqId:d.ReqID,version:d.Version,note:$('isNote').value.trim(),items,listQuery:listQuery()}), x=r.detail; toast('จ่ายพัสดุใบเบิก '+x.ReqNo+' แล้ว'); applyAfter(r); showReq(x); }

/** ย่อรูปในเครื่องก่อนส่ง (ด้านยาวไม่เกิน 800 px, JPEG) */
function shrinkImage(file){
  return new Promise((res,rej)=>{ if(String(file.type||'').indexOf('image')!==0) return rej(new Error('กรุณาเลือกไฟล์รูปภาพ'));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const max=800, k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)), w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.85)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('เปิดไฟล์รูปไม่ได้')); }; img.src=url; });
}

function sigTab(t){ SIG.tab=t; $('tabDraw').classList.toggle('on',t==='draw'); $('tabUp').classList.toggle('on',t==='upload'); $('sigDraw').classList.toggle('hidden',t!=='draw'); $('sigUp').classList.toggle('hidden',t!=='upload'); if(t==='draw') sigInitPad(); }
function sigInitPad(){
  const c=$('sigCanvas'); if(!c) return; const r=c.getBoundingClientRect(), k=window.devicePixelRatio||1;
  c.width=Math.round(r.width*k); c.height=Math.round(r.height*k);
  const g=c.getContext('2d'); g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#14246B'; g.lineWidth=2.6*k;
  SIG.drawn=false; let last=null;
  const pos=e=>{ const b=c.getBoundingClientRect(); return {x:(e.clientX-b.left)*k,y:(e.clientY-b.top)*k}; };
  c.onpointerdown=e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); last=pos(e); g.beginPath(); g.arc(last.x,last.y,g.lineWidth/2,0,Math.PI*2); g.fillStyle='#14246B'; g.fill(); SIG.drawn=true; $('sigHint').classList.add('hidden'); };
  c.onpointermove=e=>{ if(!last) return; e.preventDefault(); const p=pos(e), m={x:(last.x+p.x)/2,y:(last.y+p.y)/2}; g.beginPath(); g.moveTo(last.x,last.y); g.quadraticCurveTo(last.x,last.y,m.x,m.y); g.lineTo(p.x,p.y); g.stroke(); last=p; };
  c.onpointerup=c.onpointercancel=()=>{ last=null; };
}
function sigClear(){ const c=$('sigCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); SIG.drawn=false; $('sigHint').classList.remove('hidden'); }
/** ตัดขอบว่าง แล้วย่อให้สูงไม่เกิน 180 px กว้างไม่เกิน 640 px (PNG พื้นใส) */
function sigTrim(src){
  const g=src.getContext('2d'), w=src.width, h=src.height, data=g.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(data[(y*w+x)*4+3]>20){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<0) return '';
  const pad=8; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
  const cw=x1-x0+1, ch=y1-y0+1, k=Math.min(1,640/cw,180/ch), out=document.createElement('canvas');
  out.width=Math.max(1,Math.round(cw*k)); out.height=Math.max(1,Math.round(ch*k));
  out.getContext('2d').drawImage(src,x0,y0,cw,ch,0,0,out.width,out.height);
  return out.toDataURL('image/png');
}
/** รูปสแกน: ตัดพื้นสว่างออก ให้เหลือเส้นลายเซ็นสีน้ำเงินเข้มบนพื้นใส */
function sigPickFile(inp){
  const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{ const k=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    const g=c.getContext('2d'); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    const im=g.getImageData(0,0,c.width,c.height), d=im.data; let sum=0,n=0;
    for(let i=0;i<d.length;i+=16){ sum+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; n++; }
    const cut=Math.min(200,(sum/n)*0.78);
    for(let i=0;i<d.length;i+=4){ const L=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; const a=L>=cut?0:Math.min(255,Math.round((cut-L)*3)); d[i]=20; d[i+1]=36; d[i+2]=107; d[i+3]=a; }
    g.putImageData(im,0,0); SIG.upload=sigTrim(c);
    $('sigUpPrev').innerHTML=SIG.upload?`<img src="${SIG.upload}" alt="ตัวอย่างลายเซ็น">`:'<span class="muted">ไม่พบเส้นลายเซ็นในรูป ลองถ่ายใหม่ให้ชัดขึ้น</span>'; };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('เปิดไฟล์รูปไม่ได้',true); }; img.src=url;
}
async function sigSave(){
  const dataUrl=SIG.tab==='draw'?(SIG.drawn?sigTrim($('sigCanvas')):''):SIG.upload;
  if(!dataUrl) return toast(SIG.tab==='draw'?'กรุณาเซ็นชื่อในกรอบก่อน':'กรุณาเลือกรูปลายเซ็นก่อน',true);
  const c=await confirmBox('บันทึกลายเซ็น',`<p>ใช้ลายเซ็นนี้ลงนามในใบเบิกในนามของ <b>${esc(S.user.fullName)}</b></p><div class="sig-cur sm"><img src="${dataUrl}" alt=""></div>`,'บันทึกลายเซ็น');
  if(!c.ok) return;
  const btn=$('sigSave'); setBusy(btn,true);
  try{ const d=await api('apiSaveSignature',{dataUrl,method:SIG.tab==='draw'?'DRAW':'UPLOAD'}); S.user.hasSignature=true; updateBadges(); toast('บันทึกลายเซ็นแล้ว'); renderSignature(d); }
  catch(e){ setBusy(btn,false); toast(e.message,true); }
}

/* ---------- ตั้งค่า ---------- */
async function renderSettings(){
  loading(); let d; try{ d=await api('apiAdminData'); }catch(e){ $('content').innerHTML=`<div class="phc-alert phc-alert--danger">${esc(e.message)}</div>`; return; } S.admin=d; drawSettings();
}
function drawSettings(){
  const d=S.admin, sup=S.user.canManage, s=d.settings;
  $('content').innerHTML=`<div class="stack">
  <div class="card"><h3>👥 ผู้สั่งจ่าย และ ผู้จ่ายพัสดุ</h3>${d.staff.length?`<div class="table-wrap"><table class="t"><thead><tr><th>ชื่อ</th><th>ตำแหน่ง</th><th>บทบาท</th>${sup?'<th></th>':''}</tr></thead><tbody>${d.staff.map(x=>`<tr><td>${esc(x.FullName)}<div class="small muted">${esc(x.Username)}</div></td><td>${esc(x.Position)}</td><td>${esc(x.RoleText)}</td>${sup?`<td><button class="phc-btn phc-btn--danger-soft phc-btn--sm" type="button" onclick="removeStaff('${esc(x.Username)}','${esc(x.Role)}')">🗑️ เอาออก</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="phc-alert phc-alert--warning">ยังไม่ได้กำหนดผู้สั่งจ่าย / ผู้จ่ายพัสดุ</div>'}
   ${sup?`<div class="toolbar" style="margin-top:10px"><input class="phc-input" id="psQ" placeholder="ค้นหาบุคลากร (ชื่อ / ตำแหน่ง / username)" style="flex:1"><button class="phc-btn phc-btn--secondary" type="button" onclick="searchPerson()">🔍 ค้นหา</button></div><div id="psBox"></div>`:'<p class="small muted">เพิ่ม/เอาออกได้เฉพาะผู้ดูแลระบบพัสดุ (superadmin หรือ admin กลุ่มงานธุรการ)</p>'}</div>
  <div class="card"><h3>📅 กติกาวันของรอบ</h3>${sup?`<div class="form-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="phc-field"><label class="phc-label">วันปิดรับใบเบิก (วันที่)</label><input class="phc-input" type="number" min="1" max="28" id="stClose" value="${s.closeDay}"></div><div class="phc-field"><label class="phc-label">จ่ายพัสดุภายใน (วันที่)</label><input class="phc-input" type="number" min="1" max="28" id="stIssue" value="${s.issueDay}"></div><div class="phc-field"><label class="phc-label">ตรงวันหยุด เลื่อนเป็น</label><select class="phc-select" id="stShift"><option value="PREV" ${s.shift==='PREV'?'selected':''}>วันทำการก่อนหน้า</option><option value="NEXT" ${s.shift==='NEXT'?'selected':''}>วันทำการถัดไป</option></select></div></div><div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="phc-btn" type="button" onclick="saveRule()">💾 บันทึกกติกา</button></div>`:`<p>ปิดรับวันที่ ${s.closeDay} · จ่ายภายในวันที่ ${s.issueDay} · ตรงวันหยุดเลื่อนเป็น${s.shift==='NEXT'?'วันทำการถัดไป':'วันทำการก่อนหน้า'}</p>`}
   <h3 style="margin-top:16px">วันของแต่ละรอบ</h3><div class="table-wrap"><table class="t"><thead><tr><th>รอบ</th><th>ปิดรับใบเบิก</th><th>จ่ายภายใน</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>${d.rounds.map(r=>`<tr><td><b>${esc(r.label)}</b></td><td>${thDate(r.closeKey,true)}${r.closeShifted&&!r.overridden?' <span class="small muted">(เลื่อนจากวันหยุด)</span>':''}</td><td>${thDate(r.issueDueKey,true)}${r.issueShifted&&!r.overridden?' <span class="small muted">(เลื่อนจากวันหยุด)</span>':''}</td><td>${r.overridden?'<span class="badge-st st-APPROVED">แก้วันแล้ว</span> ':''}${esc(r.note)}</td><td><button class="phc-btn phc-btn--edit phc-btn--sm" type="button" onclick="editRound('${esc(r.roundKey)}')">✏️ แก้วัน</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>🗓️ วันหยุด (นอกจากเสาร์-อาทิตย์)</h3><div class="form-grid" style="grid-template-columns:220px 1fr auto;align-items:end"><div class="phc-field"><label class="phc-label">วันที่</label>${dateField('hdDate','')}</div><div class="phc-field"><label class="phc-label">ชื่อวันหยุด</label><input class="phc-input" id="hdName"></div><button class="phc-btn" type="button" onclick="saveHoliday()">➕ เพิ่ม</button></div>
   ${d.holidays.length?`<div class="table-wrap" style="margin-top:10px"><table class="t"><tbody>${d.holidays.map(h=>`<tr><td class="nowrap">${esc(h.text)}</td><td>${esc(h.Name)}</td><td><button class="phc-btn phc-btn--danger-soft phc-btn--sm" type="button" onclick="removeHoliday('${esc(h.key)}')">🗑️ ลบ</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">ยังไม่มีวันหยุดในตาราง</p>'}</div></div>`;
}
async function searchPerson(){ const q=$('psQ').value.trim(); $('psBox').innerHTML=phcSk(3);
  try{ const rows=await api('apiSearchPersonnel',q); $('psBox').innerHTML=rows.length?`<div class="table-wrap"><table class="t"><tbody>${rows.map(p=>`<tr><td>${esc(p.FullName)}<div class="small muted">${esc(p.Username)}</div></td><td>${esc(p.Position)}</td><td class="nowrap"><button class="phc-btn phc-btn--sm" type="button" onclick='addStaff(${JSON.stringify(p).replace(/'/g,"&#39;")},"APPROVER")'>เป็นผู้สั่งจ่าย</button> <button class="phc-btn phc-btn--secondary phc-btn--sm" type="button" onclick='addStaff(${JSON.stringify(p).replace(/'/g,"&#39;")},"ISSUER")'>เป็นผู้จ่ายพัสดุ</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่พบบุคลากร</div>'; }
  catch(e){ $('psBox').innerHTML=`<div class="phc-alert phc-alert--danger">${esc(e.message)}</div>`; } }
async function addStaff(p,role){ if(!p.Username) return toast('บุคลากรนี้ยังไม่มี Username ใน Gateway',true); try{ S.admin=await api('apiSaveStaff',{username:p.Username,fullName:p.FullName,position:p.Position,role}); toast('เพิ่มแล้ว'); drawSettings(); }catch(e){ toast(e.message,true); } }
async function removeStaff(u,role){ const c=await confirmBox('เอาออกจากรายชื่อ',`<p>${esc(u)} · ${role==='APPROVER'?'ผู้สั่งจ่าย':'ผู้จ่ายพัสดุ'}</p>`,'เอาออก',true); if(!c.ok) return; try{ S.admin=await api('apiRemoveStaff',{username:u,role}); drawSettings(); }catch(e){ toast(e.message,true); } }
async function saveRule(){ try{ S.admin=await api('apiSaveSettings',{closeDay:$('stClose').value,issueDay:$('stIssue').value,shift:$('stShift').value}); toast('บันทึกกติกาแล้ว'); drawSettings(); }catch(e){ toast(e.message,true); } }
async function saveHoliday(){ const k=dateVal('hdDate'), n=$('hdName').value.trim(); if(!k||!n) return toast('กรุณาเลือกวันที่และระบุชื่อวันหยุด',true); try{ S.admin=await api('apiSaveHoliday',{date:k,name:n}); toast('เพิ่มวันหยุดแล้ว'); drawSettings(); }catch(e){ toast(e.message,true); } }
async function removeHoliday(k){ try{ S.admin=await api('apiRemoveHoliday',{date:k}); drawSettings(); }catch(e){ toast(e.message,true); } }
function editRound(rk){ const r=S.admin.rounds.find(x=>x.roundKey===rk); if(!r) return;
  openModal('แก้วันของรอบ '+r.label,`<div class="form-grid"><div class="phc-field"><label class="phc-label">ปิดรับใบเบิก</label>${dateField('rdClose',r.overridden?r.closeKey:'',{clear:true})}<span class="phc-help">ใช้อยู่ตอนนี้: ${thDate(r.closeKey,true)}</span></div><div class="phc-field"><label class="phc-label">จ่ายภายใน</label>${dateField('rdIssue',r.overridden?r.issueDueKey:'',{clear:true})}<span class="phc-help">ใช้อยู่ตอนนี้: ${thDate(r.issueDueKey,true)}</span></div><div class="phc-field full"><label class="phc-label">เหตุผล</label><input class="phc-input" id="rdNote" value="${esc(r.note)}"></div></div><p class="small muted">เว้นว่างทั้งสองช่อง = กลับไปใช้วันตามกติกา</p>`,
  `<button class="phc-btn phc-btn--secondary" type="button" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" type="button" onclick="saveRound('${esc(rk)}')">💾 บันทึก</button>`,'sm'); }
async function saveRound(rk){ try{ S.admin=await api('apiSaveRound',{roundKey:rk,closeDate:dateVal('rdClose'),issueDueDate:dateVal('rdIssue'),note:$('rdNote').value.trim()}); closeModal(); toast('บันทึกวันของรอบแล้ว'); drawSettings(); }catch(e){ toast(e.message,true); } }

boot();
</script>
