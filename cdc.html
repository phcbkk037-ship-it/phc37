/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}
.phc-table .phc-num{text-align:right;font-variant-numeric:tabular-nums}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';

  cases:null, foci:null, mapData:null, focus:null, caseFile:null, report:null, rf:{fy:0,disease:'',tab:'r1'}, setTab:'diseases', add:null, F:null, comms:null, pkLists:null };
const TH_M = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TITLES = {home:'ภาพรวม',map:'แผนที่',cases:'ทะเบียนผู้ป่วย',caseFile:'ผู้ป่วย',foci:'จุดระบาด',focus:'แฟ้มจุดระบาด',reports:'รายงาน',settings:'ตั้งค่า'};

const esc = v => { const t=String(v == null ? '' : v); let o=''; for(let i=0;i<t.length;i++){ const c=t[i]; o+=ESC_MAP[c]||c; } return o; };
/* text helpers without regex literals (Apps Script page transform safety) */
function isDigit(c){ return c>='0'&&c<='9'; }
function digits(t){ t=String(t==null?'':t); let o=''; for(let i=0;i<t.length;i++) if(isDigit(t[i])) o+=t[i]; return o; }
function allDigits(t,n){ t=String(t==null?'':t); if(n!==undefined&&t.length!==n) return false; if(!t.length) return false; for(let i=0;i<t.length;i++) if(!isDigit(t[i])) return false; return true; }
function isKeyStr(v){ return typeof v==='string'&&v.length===10&&v[4]==='-'&&v[7]==='-'&&allDigits(v.slice(0,4))&&allDigits(v.slice(5,7))&&allDigits(v.slice(8,10)); }

/* ---------- dates ---------- */
function keyOf(v){ if(!v) return ''; if(isKeyStr(v)) return v; const d=new Date(v); if(isNaN(d)) return ''; return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); }
function thDate(v,full){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-').map(Number); return d+' '+(full?TH_M:TH_MS)[m-1]+' '+(y+543); }
function shortDate(v){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-'); return d+'/'+m+'/'+(Number(y)+543); }
function thDateTime(v){ if(!v) return '-'; const d=new Date(v); if(isNaN(d)) return '-'; const t=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); return shortDate(v)+' '+t+' น.'; }
function todayKey(){ return keyOf(new Date()); }
function fyOf(k){ const [y,m]=k.split('-').map(Number); return y+543+(m>=10?1:0); }
function ageAt(birth, at){ if(!birth||!at) return ''; const [by,bm,bd]=birth.split('-').map(Number), [ay,am,ad]=at.split('-').map(Number); let a=ay-by; if(am<bm||(am===bm&&ad<bd)) a--; return a; }

/* ---------- server ---------- */
function callRaw_(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(r=>{
      if(!r){ reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); return; }
      if(!r.ok){ { const mm=String(r.message||''); if(mm.indexOf('Session')>=0||mm.indexOf('เปิดระบบใหม่')>=0) sessionLost(); } reject(new Error(r.message||'เกิดข้อผิดพลาด')); return; }
      resolve(r.data !== undefined ? r.data : r);
    }).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}
/* PHC37Load (UI Kit 1.2.0): เส้นวิ่งด้านบนระหว่างรอเซิร์ฟเวอร์ (ขึ้นเมื่อรอเกิน 0.3 วินาที) */
function call(fn, ...args){
  const L=window.PHC37Load; if(L) L.line.start();
  return callRaw_(fn, ...args).then(v=>{ if(L) L.line.done(); return v; }, e=>{ if(L) L.line.fail(); throw e; });
}
/* โครงเทาแบบรายการ (UI Kit 1.2.0) */
function phcSk(n){ let h='<div class="phc-sk-lines" aria-busy="true"><span class="sr-only" role="status">กำลังโหลด…</span>'; const W=[92,78,85,70,88,64]; for(let k=0;k<(n||4);k++) h+='<span class="phc-sk" style="height:16px;width:'+W[k%W.length]+'%"></span>'; return h+'</div>'; }
function api(fn, ...args){ return call(fn, S.token, ...args); }
function sessionLost(){ try{ sessionStorage.removeItem('cdc1.session'); }catch(e){} }

/* ---------- common ---------- */
function toast(msg, err){ const el=document.createElement('div'); el.className='phc-toast'+(err?' err':''); el.textContent=msg; $('toasts').appendChild(el); setTimeout(()=>el.remove(), err?7000:3800); }
function setBusy(btn, on, text){ if(!btn) return;
  if(on){ if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.setAttribute('aria-busy','true');
    const plain=btn.classList.contains('phc-btn--secondary')||btn.classList.contains('phc-btn--ghost')||btn.classList.contains('phc-btn--edit')||btn.classList.contains('phc-btn--danger-soft')||!btn.classList.contains('phc-btn');
    const t=text||'กำลังบันทึก…'; btn.innerHTML=String(t).indexOf('spinner')>=0?t:'<span class="phc-spin'+(plain?'':' phc-spin--light')+'" aria-hidden="true"></span> '+t; }
  else { btn.disabled=false; btn.removeAttribute('aria-busy'); delete btn.dataset.busy; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }
function openModal(title, body, foot, size){ $('modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal ${size||''}" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button class="xbtn" type="button" onclick="closeModal()" aria-label="ปิด">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`; }
function closeModal(){ closeCal(); $('modalRoot').innerHTML=''; }
function confirmBox(title, html, okText, danger){
  return new Promise(res=>{
    const root=document.createElement('div');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body">${html}</div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="0">ยกเลิก</button><button class="phc-btn ${danger?'phc-btn--danger':''}" data-a="1">${esc(okText||'ยืนยัน')}</button></div></div></div>`;
    document.body.appendChild(root);
    root.addEventListener('click',e=>{ const a=e.target.getAttribute&&e.target.getAttribute('data-a'); if(a===null||a===undefined) return; root.remove(); res(a==='1'); });
  });
}
function reasonBox(title, html, label, ph, okText, min){
  min=min||3;
  return new Promise(res=>{
    const root=document.createElement('div');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body"><div style="margin:0 0 10px">${html}</div><label class="phc-label">${esc(label)} <span class="phc-required">*</span></label><textarea class="phc-input" data-r="1" rows="3" placeholder="${esc(ph||'')}"></textarea><div data-err="1" style="color:#B42318;font-size:13px;min-height:18px"></div></div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="0">ยกเลิก</button><button class="phc-btn phc-btn--danger" data-a="1">${esc(okText||'ยืนยัน')}</button></div></div></div>`;
    document.body.appendChild(root);
    const ta=root.querySelector('[data-r]'); setTimeout(()=>ta.focus(),50);
    root.addEventListener('click',e=>{ const a=e.target.getAttribute&&e.target.getAttribute('data-a'); if(a===null||a===undefined) return; if(a==='0'){ root.remove(); res(null); return; } const v=ta.value.trim(); if(v.length<min){ root.querySelector('[data-err]').textContent='กรุณาระบุเหตุผลอย่างน้อย '+min+' ตัวอักษร'; return; } root.remove(); res(v); });
  });
}
function avatarChar(n){ n=String(n||'?').trim(); const pre=['นางสาว','นาย','นาง','ดร.']; for(const p of pre){ if(n.indexOf(p)===0){ n=n.slice(p.length).trim(); break; } } return n.charAt(0)||'?'; }
function chip(text, tone){ return `<span class="chip tone-${esc(tone||'neutral')}">${esc(text)}</span>`; }
function toggleSide(on){ $('sidebar').classList.toggle('open',on); $('backdrop').classList.toggle('show',on); }
function goGateway(){ try{ sessionStorage.removeItem('cdc1.session'); }catch(e){} const url=BOOT.returnUrl; const okUrl=['https:','','script.google.com',''].join(String.fromCharCode(47)); if(String(url||'').indexOf(okUrl)===0) window.open(url,'_top'); }
function can(a){ if(!S.user) return false; if(a==='admin') return !!S.user.isAdmin; return a==='edit'?!!S.user.canEdit:!!S.user.canAdd; }
function field(label, inner, cls, req){ return `<div class="phc-field ${cls||''}"><label class="phc-label">${esc(label)}${req?' <span class="phc-required">*</span>':''}</label>${inner}</div>`; }
function opt(v,t,sel){ return `<option value="${esc(v)}" ${sel?'selected':''}>${esc(t)}</option>`; }
function norm(s){ s=String(s||'').toLowerCase(); let o=''; for(let i=0;i<s.length;i++){ const c=s[i]; if(c!==' '&&c!=='\t'&&c!=='\n'&&c!=='\r'&&c!=='\u00a0') o+=c; } return o; }

/* ---------- Thai calendar (B.E.) ---------- */
let CAL=null;
function dateField(id, key, opts){ opts=opts||{}; const typed=!!opts.typed;
  return `<div class="date-field"><input class="phc-input ${typed?'typed':''}" id="${id}" data-key="${esc(key||'')}" data-max="${esc(opts.max||'')}" data-min="${esc(opts.min||'')}" value="${key?esc(shortDate(key)):''}" ${typed?`inputmode="numeric" oninput="typedDate('${id}')" onblur="typedDate('${id}',1)"`:`readonly onclick="openCal('${id}')"`} placeholder="วว/ดด/ปปปป (พ.ศ.)">${typed?`<button type="button" class="cal-btn" onclick="openCal('${id}')" aria-label="เลือกจากปฏิทิน">📅</button>`:''}</div>`; }
function parseThai(t){ t=String(t||'').trim(); const parts=[]; let cur=''; for(let i=0;i<t.length;i++){ if(isDigit(t[i])) cur+=t[i]; else { parts.push(cur); cur=''; } } parts.push(cur); if(parts.length!==3||parts[0].length<1||parts[0].length>2||parts[1].length<1||parts[1].length>2||parts[2].length!==4) return ''; const m=[t,parts[0],parts[1],parts[2]]; let y=Number(m[3]); if(y>2400) y-=543; const mo=Number(m[2]), d=Number(m[1]); const dt=new Date(Date.UTC(y,mo-1,d)); if(dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return ''; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function typedDate(id, final){ const el=$(id); const k=parseThai(el.value); el.dataset.key=k; if(final&&k) el.value=shortDate(k); el.style.borderColor=(el.value&&!k)?'#B42318':''; el.dispatchEvent(new Event('change')); }
function dateVal(id){ const el=$(id); return el?(el.dataset.key||''):''; }
function setDate(id,k){ const el=$(id); if(!el) return; el.dataset.key=k||''; el.value=k?shortDate(k):''; el.style.borderColor=''; el.dispatchEvent(new Event('change')); closeCal(); }
function openCal(id){ closeCal(); const el=$(id); const k=el.dataset.key||el.dataset.max&&el.dataset.max<todayKey()&&el.dataset.max||todayKey(); const [y,m]=k.split('-').map(Number); CAL={id,y,m}; renderCal(); }
function closeCal(){ const c=document.getElementById('calPop'); if(c) c.remove(); CAL=null; }
function calMove(n){ let m=CAL.m+n,y=CAL.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;} CAL.y=y; CAL.m=m; renderCal(); }
function calSet(y,m){ if(y) CAL.y=Number(y); if(m) CAL.m=Number(m); renderCal(); }
function renderCal(){
  let c=document.getElementById('calPop'); if(!c){ c=document.createElement('div'); c.id='calPop'; c.className='cal'; document.body.appendChild(c); }
  const el=$(CAL.id), sel=el.dataset.key, t=todayKey(), mx=el.dataset.max||'', mn=el.dataset.min||'', first=new Date(Date.UTC(CAL.y,CAL.m-1,1)).getUTCDay(), days=new Date(Date.UTC(CAL.y,CAL.m,0)).getUTCDate();
  const ty=Number(t.slice(0,4)), y0=mn?Number(mn.slice(0,4)):ty-100, y1=mx?Number(mx.slice(0,4)):ty+1, ys=[]; for(let y=Math.max(y1,CAL.y);y>=Math.min(y0,CAL.y);y--) ys.push(y);
  let h=`<div class="cal-head"><button type="button" onclick="calMove(-1)">‹</button><div class="mid"><select onchange="calSet(0,this.value)" aria-label="เดือน">${TH_MS.map((x,i)=>`<option value="${i+1}" ${i+1===CAL.m?'selected':''}>${x}</option>`).join('')}</select><select onchange="calSet(this.value,0)" aria-label="ปี พ.ศ.">${ys.map(y=>`<option value="${y}" ${y===CAL.y?'selected':''}>${y+543}</option>`).join('')}</select></div><button type="button" onclick="calMove(1)">›</button></div><div class="cal-grid">`+['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<span>${x}</span>`).join('');
  for(let i=0;i<first;i++) h+='<span></span>';
  for(let d=1;d<=days;d++){ const k=`${CAL.y}-${String(CAL.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, w=(first+d-1)%7, dis=(mx&&k>mx)||(mn&&k<mn); h+=`<button type="button" ${dis?'disabled':''} class="${k===sel?'sel':''} ${k===t?'today':''} ${w===0||w===6?'we':''}" onclick="setDate('${CAL.id}','${k}')">${d}</button>`; }
  h+=`</div><div class="cal-foot"><button type="button" class="phc-btn phc-btn--ghost phc-btn--sm" ${(mx&&t>mx)||(mn&&t<mn)?'disabled':''} onclick="setDate('${CAL.id}','${t}')">วันนี้</button><button type="button" class="phc-btn phc-btn--secondary phc-btn--sm" onclick="closeCal()">ปิด</button></div>`;
  c.innerHTML=h;
  const r=el.getBoundingClientRect(); let top=r.bottom+4, left=r.left; if(top+350>innerHeight) top=Math.max(8,r.top-354); if(left+300>innerWidth) left=Math.max(8,innerWidth-308); c.style.top=top+'px'; c.style.left=left+'px';
}
document.addEventListener('mousedown',e=>{ const c=document.getElementById('calPop'); if(c&&!c.contains(e.target)&&!(e.target.closest&&e.target.closest('.date-field'))) closeCal(); });


/* ---------- CDC helpers ---------- */
function tx(map,k){ return (S.text[map]&&S.text[map][k])||k||''; }
function dis(code){ return (S.refs.diseases||[]).filter(d=>d.DiseaseCode===code)[0]||{DiseaseCode:code,DiseaseName:code,Color:'#15703A',ActivityTypes:[],FollowDays:0,RadiusM:100,GroupMode:'RADIUS'}; }
function dzChip(code,name,color){ const d=dis(code); return `<span class="dz"><i style="background:${esc(color||d.Color)}"></i>${esc(name||d.DiseaseName)}</span>`; }
function stChip(s){ return `<span class="st st-${esc(s)}">${esc(ST_TH[s]||s)}</span>`; }
function caseStChip(s){ const x=CASE_ST[s]||[s,'neutral']; return s==='NEED_PIN'?`<span class="st st-NEED_PIN">📍 ${esc(x[0])}</span>`:chip(x[0],x[1]); }
function segHtml(id, opts, cur, fn){ return `<div class="seg" id="${id}">${opts.map(o=>`<button type="button" data-v="${esc(o[0])}" class="${String(o[0])===String(cur==null?'':cur)?'on':''}" onclick="segPick(this)${fn?';'+fn:''}">${esc(o[1])}</button>`).join('')}</div>`; }
function segPick(b){ b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }
function segVal(id){ const b=document.querySelector('#'+id+' button.on'); return b?b.dataset.v:''; }
function val(id){ const el=$(id); return el?String(el.value==null?'':el.value).trim():''; }
function canSet(){ return !!(S.user&&(S.user.canEdit||S.user.isAdmin)); }
function addDaysKey(k,n){ const [y,m,d]=k.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d+n)); return dt.toISOString().slice(0,10); }
function daysLeftText(f){ if(f.state==='DUE') return 'เลยกำหนด '+Math.abs(f.daysLeft)+' วัน'; if(f.state!=='ACTIVE') return ''; return f.daysLeft===0?'ครบวันนี้':'เหลือ '+f.daysLeft+' วัน'; }
function pctOf(a,b){ return b>0?Math.round(a*1000/b)/10:'-'; }
function ageSex(o){ return [o.Age!==''&&o.Age!==undefined?o.Age+' ปี':'', SEX_TH[o.Sex]||''].filter(Boolean).join(' · '); }
function legendHtml(){ return `<div class="legend-l">${['ACTIVE','DUE','CLOSED'].map(s=>`<span><i style="display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid ${ST_COLOR[s]};vertical-align:-2px"></i> ${esc(ST_TH[s])}</span>`).join(' ')} · จุดสี = โรค · วง = รัศมีรอบผู้ป่วยแต่ละราย</div>`; }

/* ---------- Leaflet ---------- */
let LEAF_P=null;
function loadLeaflet(){ if(window.L&&window.L.map) return Promise.resolve(true); if(LEAF_P) return LEAF_P;
  LEAF_P=new Promise(res=>{ const l=document.createElement('link'); l.rel='stylesheet'; l.href=LEAF_CSS; document.head.appendChild(l);
    const s=document.createElement('script'); s.src=LEAF_JS; s.onload=()=>res(!!(window.L&&window.L.map)); s.onerror=()=>{ LEAF_P=null; res(false); }; document.head.appendChild(s); setTimeout(()=>res(!!(window.L&&window.L.map)),12000); });
  return LEAF_P; }
function newMap(el, opt){ const st=S.refs.settings; const m=L.map(el,{zoomControl:true,attributionControl:true}).setView([st.MAP_LAT,st.MAP_LNG],st.MAP_ZOOM);
  L.tileLayer(TILE,{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m); return m; }
function noMap(el){ el.innerHTML='<div class="nomap">โหลดแผนที่ไม่ได้ (ไม่มีอินเทอร์เน็ต หรือเครือข่ายบล็อกแผนที่)<br>ข้อมูลอื่นยังใช้ได้ตามปกติ · ปักหมุดด้วย GPS ได้</div>'; }

/* ---------- boot ---------- */
function phcRetryBoot(){ $('errGate').classList.add('hidden'); $('gate').classList.remove('hidden'); boot(); }
async function boot(){
  let stored=''; try{ stored=sessionStorage.getItem('cdc1.session')||''; }catch(e){}
  try{
    const r=await call('apiBootstrap',{launchToken:BOOT.launchToken, sessionToken:stored});
    S.token=r.sessionToken; S.user=r.user; S.refs=r.refs; S.text=r.text; S.dash=r.dashboard; S.comms=r.refs.communities;
    try{ sessionStorage.setItem('cdc1.session',S.token); }catch(e){}
    $('uName').textContent=S.user.fullName;
    $('uMeta').textContent=[S.user.workGroup, S.user.isSuper?'superadmin':(S.user.isAdmin?'admin':''), S.user.canEdit?'แก้ไขได้':(S.user.canAdd?'บันทึกได้':'ดูอย่างเดียว')].filter(Boolean).join(' · ');
    $('avatar').textContent=avatarChar(S.user.fullName);
    document.querySelectorAll('.role-set').forEach(b=>b.classList.toggle('hidden',!canSet()));
    document.querySelectorAll('.role-add').forEach(b=>b.classList.toggle('hidden',!can('add')));
    document.querySelectorAll('#nav button[data-page]').forEach(b=>b.addEventListener('click',()=>{ toggleSide(false); go(b.dataset.page); }));
    window.__cdcBooted=true; $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); updateBadge();
    if(can('add')) setTimeout(()=>{ ensureKit(); },1500);
    let last='home', key=''; try{ last=sessionStorage.getItem('cdc1.page')||'home'; key=sessionStorage.getItem('cdc1.key')||''; }catch(e){}
    if(last==='focus'&&key) openFocus(key,'foci'); else if(last==='caseFile'&&key) openCase(key,'cases'); else go(TITLES[last]&&last!=='focus'&&last!=='caseFile'&&(last!=='settings'||canSet())?last:'home');
  }catch(e){ $('gate').classList.add('hidden'); $('errText').textContent=e.message; $('errGate').classList.remove('hidden'); }
}
function updateBadge(){ const d=S.dash||{}; const n=(d.due||[]).length; const el=$('cntDue'); el.textContent=n||''; el.classList.toggle('hidden',!n); el.style.background='var(--phc-warning)'; }
function setNav(page){ const map={caseFile:S.back,focus:S.back}; document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===(map[page]||page))); $('pageTitle').textContent=TITLES[page]; }
function go(page){

}

async function loadMap(){

function popupHtml(f){ const anon=S.mapData.anon;
  return `<b>${esc(f.FocusCode)}</b> ${stChip(f.state)}<br>${esc(f.DiseaseName)} · ${esc(f.CaseCount)} ราย · รัศมี ${esc(f.RadiusM)} ม.<br>เปิด ${esc(shortDate(f.OpenDate))} · ${f.state==='CLOSED'?'ปิด '+esc(shortDate(f.CloseDate)):'ถึง '+esc(shortDate(f.EndDate))+' ('+esc(daysLeftText(f))+')'}
  ${anon?'':`<br><small>${f.cases.map(c=>esc(c.CaseNo+' '+c.FullName)).join('<br>')}</small><br><button class="phc-btn phc-btn--sm" onclick="openFocus('${esc(f.FocusID)}','map')">เปิดแฟ้มจุด</button>`}`; }
function drawMapLayers(){ if(!MAP) return; MAPL.clearLayers(); const pts=[], fit=L.featureGroup();
  S.mapData.foci.forEach(f=>{ const sc=ST_COLOR[f.state]||'#999';
    f.cases.forEach(c=>{ if(c.Lat===''||c.Lng==='') return; const cc=radiusCircle(c.Lat,c.Lng,f.RadiusM,sc).addTo(MAPL).bindPopup(popupHtml(f)); fit.addLayer(L.circle([c.Lat,c.Lng],{radius:f.RadiusM})); pts.push([c.Lat,c.Lng]); });
    f.cases.forEach(c=>{ if(c.Lat===''||c.Lng==='') return; caseMarker(c.Lat,c.Lng,f.Color,sc).addTo(MAPL).bindPopup(popupHtml(f)); }); });
  S.mapData.loose.forEach(c=>{ caseMarker(c.Lat,c.Lng,dis(c.DiseaseCode).Color,'#555').addTo(MAPL).bindPopup(S.mapData.anon?esc(dis(c.DiseaseCode).DiseaseName):`<b>${esc(c.CaseNo)}</b> ${esc(c.FullName)}<br>ไม่อยู่ในจุดระบาด<br><button class="phc-btn phc-btn--sm" onclick="openCase('${esc(c.CaseID)}','map')">เปิด</button>`); pts.push([c.Lat,c.Lng]); });
  S.mapData.places.forEach(p=>{ L.marker([p.Lat,p.Lng],{icon:L.divIcon({className:'',html:'<div style="font-size:20px;line-height:20px">🏫</div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(MAPL).bindPopup(`<b>${esc(p.PlaceName)}</b><br>${esc(tx('placeTypeMap',p.PlaceType))}`); });
  S.mapData.loose.forEach(c=>fit.addLayer(L.circle([c.Lat,c.Lng],{radius:60})));
  if(pts.length){ fit.addTo(MAP); try{ MAP.fitBounds(fit.getBounds(),{padding:[20,20],maxZoom:17}); }catch(e){ MAP.fitBounds(pts,{padding:[40,40],maxZoom:17}); } MAP.removeLayer(fit); } }
function drawMapList(){ const D=S.mapData;

    <div class="card"><h3>ผู้ป่วยในจุดระบาดรายชุมชน</h3>${D.byCommunity.length?`<table class="t mtable"><tbody>${D.byCommunity.map(x=>`<tr><td>${esc(x.name)}</td><td class="num"><b>${esc(x.n)}</b> ราย</td></tr>`).join('')}</tbody></table>`:'<p class="muted">ไม่มี</p>'}<div style="margin-top:10px"><button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="printAnon()">🖨️ พิมพ์สรุป (ไม่ระบุตัวบุคคล)</button></div></div></div>`; }

function showCase(c, back){ S.caseFile=c; S.back=back||S.back; S.page='caseFile'; try{ sessionStorage.setItem('cdc1.page','caseFile'); sessionStorage.setItem('cdc1.key',c.CaseID); }catch(e){} setNav('caseFile'); window.scrollTo(0,0); drawCase(); }

  $('content').innerHTML=`<div class="page-head"><div><a href="#" class="backlink" onclick="go(S.back);return false">← กลับ</a><h2>${esc(c.FullName)} ${dzChip(c.DiseaseCode,c.DiseaseName,c.Color)} ${caseStChip(c.state)}</h2><p>${esc(c.CaseNo)} · HN ${esc(c.HN||'-')} · ${esc(ageSex(c))}${c.Phone?' · ☎ '+esc(c.Phone):''}</p></div>
    <div class="actions">${c.canChange?`<button class="phc-btn phc-btn--edit" onclick="editCase()">✏️ แก้ไข / ปักหมุด</button>`:''}${S.user.isAdmin&&!canc&&(c.Lat!==''||c.PlaceID)?'<button class="phc-btn phc-btn--secondary" onclick="moveCaseForm()">ย้ายจุด</button>':''}${S.user.isAdmin&&!canc?'<button class="phc-btn phc-btn--danger-soft" onclick="cancelCase()">ยกเลิกผู้ป่วย</button>':''}</div></div>
  ${canc?`<div class="card" style="border-color:var(--phc-danger);margin-bottom:12px"><b>ยกเลิกแล้ว</b> — ${esc(c.CancelReason)}</div>`:''}
  <div class="grid g2"><div class="card"><h3>ข้อมูลการป่วย</h3><dl class="kv"><dt>การวินิจฉัย</dt><dd>${esc(tx('diagMap',c.Diagnosis))}</dd><dt>ที่มา</dt><dd>${esc(tx('sourceMap',c.Source))}${c.Source==='NOTIFIED'?' · '+esc(tx('notifyMap',c.NotifyFrom))+(c.NotifyUnit?' ('+esc(c.NotifyUnit)+')':''):''}</dd>
    <dt>วันเริ่มป่วย</dt><dd>${esc(c.OnsetDate?thDate(c.OnsetDate,true):'ไม่ทราบ')}</dd><dt>${c.Source==='NOTIFIED'?'วันรับแจ้ง':'วันที่พบ'}</dt><dd>${esc(thDate(c.FoundDate,true))}</dd><dt>วันเริ่มนับติดตาม</dt><dd><b>${esc(thDate(c.StartDate,true))}</b></dd>
    <dt>ข้อมูลผู้ป่วย</dt><dd><small>สำเนาในระบบ อัปเดตล่าสุด ${esc(thDateTime(p.UpdatedAt||c.UpdatedAt))}</small>${p.PatientID&&can('add')?' <a href="#" onclick="refreshCasePatient();return false">🔄 อัปเดตจากเวชระเบียนกลาง</a>':''}</dd>
    <dt>ผลการรักษา</dt><dd>${esc(tx('outcomeMap',c.Outcome))}</dd><dt>ที่อยู่ขณะป่วย</dt><dd>${esc(c.AddressText||'-')}<br><small>${esc(c.CommunityName||'')}</small></dd><dt>สถานที่ประจำ</dt><dd>${esc(c.PlaceName?c.PlaceName+(c.ClassRoom?' · '+c.ClassRoom:''):'-')}</dd>
    <dt>พิกัด</dt><dd>${c.Lat!==''?esc(c.Lat+', '+c.Lng)+' <small>'+esc(tx('pinMap',c.PinMethod))+(c.GpsAcc!==''?' ±'+esc(c.GpsAcc)+' ม.':'')+'</small>':'<span class="st st-NEED_PIN">ยังไม่ปักหมุด</span>'}</dd>${c.Note?`<dt>หมายเหตุ</dt><dd>${esc(c.Note)}</dd>`:''}<dt>บันทึกโดย</dt><dd>${esc(c.CreatedByName)} · ${esc(thDateTime(c.CreatedAt))}${c.Version>1?'<small>แก้ล่าสุด '+esc(c.UpdatedByName)+' '+esc(thDateTime(c.UpdatedAt))+'</small>':''}</dd></dl></div>
  <div class="card"><h3>จุดระบาด</h3>${f?`<div class="fcard s-${esc(f.state)}" onclick="openFocus('${esc(f.FocusID)}','cases')"><div><b>${esc(f.FocusCode)}</b><small>${esc(f.CommunityName||f.PlaceName||'-')} · ${esc(f.CaseCount)} ราย · เปิด ${esc(shortDate(f.OpenDate))} · ถึง ${esc(shortDate(f.EndDate))}</small></div><div class="days">${stChip(f.state)}<small>${esc(daysLeftText(f))}</small></div></div>`:`<p class="muted">${c.state==='NEED_PIN'?'ยังไม่เข้าจุดระบาด เพราะยังไม่มีพิกัดหรือสถานที่ — กด "แก้ไข / ปักหมุด"':'ไม่อยู่ในจุดระบาด'}</p>`}
    <div class="mapbox sm" id="caseMap" style="margin-top:10px"></div>
    ${c.otherCases.length?`<div class="sub">การป่วยครั้งอื่นของผู้ป่วยรายนี้</div>${c.otherCases.map(o=>`<div class="arow" onclick="openCase('${esc(o.CaseID)}','cases')"><div>${esc(o.CaseNo)} ${dzChip(o.DiseaseCode,o.DiseaseName,o.Color)}<small>เริ่มนับ ${esc(shortDate(o.StartDate))}</small></div><div>${caseStChip(o.state)}</div></div>`).join('')}`:''}</div></div>`;
  drawCaseMap(); }
async function drawCaseMap(){ const c=S.caseFile, el=$('caseMap'); if(!el) return; if(c.Lat===''){ el.innerHTML='<div class="nomap">ยังไม่มีพิกัด</div>'; return; }
  const ok=await loadLeaflet(); if(!ok||!$('caseMap')){ if($('caseMap')) noMap($('caseMap')); return; }
  const m=newMap(el); const d=dis(c.DiseaseCode); radiusCircle(c.Lat,c.Lng,d.RadiusM,d.Color).addTo(m); caseMarker(c.Lat,c.Lng,d.Color).addTo(m); m.setView([c.Lat,c.Lng],17); }
async function refreshCasePatient(){ const c=S.caseFile; try{ await api('apiPatientRefresh',c.PatientKey); toast('อัปเดตจากเวชระเบียนกลางแล้ว'); const x=await api('apiCase',c.CaseID); showCase(x,S.back); }catch(e){ toast(e.message,true); } }
async function cancelCase(){ const c=S.caseFile; const r=await reasonBox('ยกเลิกผู้ป่วย',`ยกเลิก <b>${esc(c.CaseNo)} ${esc(c.FullName)}</b> · ข้อมูลยังเก็บไว้ ไม่นับในรายงาน · ถ้าอยู่ในจุดระบาด ระบบคำนวณวันสิ้นสุดของจุดใหม่`,'เหตุผล','เช่น บันทึกซ้ำ / ผลตรวจไม่ใช่โรคนี้','ยกเลิกผู้ป่วย');
  if(!r) return; try{ const x=await api('apiCancelCase',{CaseID:c.CaseID,Version:c.Version,reason:r}); refreshAfterWrite(); toast('ยกเลิกแล้ว'); showCase(x.file,S.back); }catch(e){ toast(e.message,true); } }
async function moveCaseForm(){ const c=S.caseFile; let others=[]; try{ const fl=await api('apiFoci',{status:'open',disease:c.DiseaseCode}); others=fl.rows.filter(f=>f.FocusID!==c.FocusID); }catch(e){}
  openModal('ย้ายผู้ป่วยไปจุดอื่น (admin)',`<p class="muted small">ใช้เมื่อระบบจัดเข้าจุดไม่ถูก เช่น บ้านอยู่ใกล้แต่คนละฝั่งคลอง · จุดเดิมและจุดใหม่คำนวณวันสิ้นสุดใหม่ และเก็บประวัติไว้</p>
    ${field('ย้ายไป',`<select class="phc-select" id="mvT">${opt('NEW','เปิดจุดระบาดใหม่ (แยกจุด)',true)}${others.map(f=>opt(f.FocusID,f.FocusCode+' · '+(f.CommunityName||f.PlaceName||'')+' · '+f.CaseCount+' ราย',false)).join('')}</select>`,'',true)}${field('เหตุผล',`<textarea class="phc-input" id="mvR" rows="2"></textarea>`,'',true)}`,
    `<button class="phc-btn phc-btn--secondary" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" id="mvBtn" onclick="moveCase()">ย้าย</button>`); }
async function moveCase(){ const b=$('mvBtn'); setBusy(b,true); try{ const x=await api('apiMoveCase',{CaseID:S.caseFile.CaseID,target:val('mvT'),reason:val('mvR')}); refreshAfterWrite(); closeModal(); toast('ย้ายแล้ว'); showFocus(x.focus,'cases'); }catch(e){ setBusy(b,false); toast(e.message,true); } }

/* ---------- add / edit case ---------- */
function kitComm(v){ return { list:(S.comms||[]).map(c=>({CommunityName:c.CommunityName, SubDistrict:c.SubDistrict})), value:v }; }
async function ensureKit(){ if(!S.pkLists){ try{ S.pkLists=await api('apiPatientKitLists'); }catch(e){ S.pkLists=null; } } PK.setLists(S.pkLists); }
function addCase(){
  if(!can('add')) return;
  S.add={ pick:null, isNew:false, rows:[], patientKey:'', patient:null };
  openModal('บันทึกผู้ป่วยโรคติดต่อ', `<p class="muted small" style="margin:0 0 8px">ขั้นที่ 1 ค้นหาผู้ป่วยในเวชระเบียนกลาง (HN / เลขบัตรประชาชน / ชื่อ)</p>
    <div class="toolbar"><input class="phc-input grow" id="psKey" placeholder="พิมพ์ HN / เลขบัตร / ชื่อ แล้วกด Enter" onkeydown="if(event.key==='Enter')searchPatients()"><button class="phc-btn" id="psBtn" onclick="searchPatients()">🔍 ค้นหา</button></div>
    <div id="psRes"></div>`, '', 'lg');
  setTimeout(()=>{ const k=$('psKey'); if(k) k.focus(); },50);
}
/* 1.1.1: ค้นในระบบนี้ + เวชระเบียนกลาง พร้อมกัน (ไม่รอกัน) · แสดงผลส่วนที่มาถึงก่อน */
async function searchPatients(){
  const k=val('psKey'), b=$('psBtn'); if(k.length<2){ toast('กรุณาพิมพ์อย่างน้อย 2 ตัวอักษร',true); return; }
  setBusy(b,true,'กำลังค้น…'); S.add.rows=[]; S.add.local=null; S.add.central=null; S.add.kw=k;
  $('psRes').innerHTML=`<div class="sub">ในระบบควบคุมโรค <span class="muted small">(สำเนาในระบบนี้ · เปิดได้ทันที)</span></div><div id="psLocal">${phcSk(1)}</div>
    <div class="sub">เวชระเบียนกลาง</div><div id="psCentral">${phcSk(2)}<p class="muted xs">กำลังค้นเวชระเบียนกลาง… (ถ้าพบในระบบนี้ เลือกได้เลยไม่ต้องรอ)</p></div>`;
  const done=()=>{ if(S.add.kw===k&&(S.add.local||S.add.central)) setBusy(b,false); };
  const pl=api('apiSearchLocal',k).then(r=>r,()=>[]).then(local=>{ if(S.add.kw!==k) return; S.add.local=local; renderLocal(); if(S.add.central) renderCentral(); done(); });
  const pc=api('apiSearchPatients',k).then(r=>({ok:true,rows:r}),e=>({ok:false,msg:e.message})).then(c=>{ if(S.add.kw!==k) return; S.add.central=c; renderCentral(); done(); });
  await Promise.all([pl,pc]); if(S.add.kw===k) setBusy(b,false);
}
function renderLocal(){ const el=$('psLocal'); if(!el) return; const local=S.add.local||[];
  el.innerHTML=local.length?`<div class="stack" style="gap:6px">${local.map((p,i)=>`<div class="pick" onclick="pickLocal(${i})"><div><b>${esc(p.FullName)}</b><span>HN ${esc(p.HN||'-')} · ${esc(p.CIDMasked||'ไม่มีเลขบัตร')} · ${esc(ageSex(p))} · ${esc(p.CommunityName||'')}</span></div>${p.cases.length?chip('เคยป่วย '+p.cases.map(x=>x.DiseaseCode+' '+shortDate(x.StartDate)).join(', '),'warning'):''}</div>`).join('')}</div>`:'<p class="muted small">ไม่พบในระบบนี้</p>'; }
function renderCentral(){ const el=$('psCentral'); if(!el) return; const c=S.add.central; if(!c) return;
  const addBtn=`<div style="margin-top:10px"><button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="addPerson(null,true)">➕ ไม่พบ — เพิ่มผู้ป่วยใหม่ (เพิ่มเข้าเวชระเบียนกลางด้วย)</button></div>`;
  if(!c.ok){ el.innerHTML=`<p style="color:var(--phc-danger)">${esc(c.msg)}</p><button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="searchPatients()">ค้นอีกครั้ง</button>${addBtn}`; return; }
  const rows=c.rows||[], have={}; (S.add.local||[]).forEach(p=>{ if(p.PatientID) have[p.PatientID]=1; });
  S.add.rows=rows; const show=rows.map((r,i)=>[r,i]).filter(x=>!have[x[0].patient.PatientID]);
  el.innerHTML=`${show.length?`<div class="stack" style="gap:6px">${show.map(([r,i])=>{ const p=r.patient;
    return `<div class="pick" onclick="pickPatient(${i})"><div><b>${esc(p.FullName)}</b><span>HN ${esc(p.HN||'-')} · ${esc(p.CIDMasked||'ไม่มีเลขบัตร')} · ${esc([r.age!==''?r.age+' ปี':'',SEX_TH[p.Sex]||''].filter(Boolean).join(' '))} · ${esc(p.CommunityName||'')}</span></div></div>`; }).join('')}</div>`:`<p class="muted small">${rows.length?'ไม่มีรายเพิ่มจากที่พบในระบบนี้':'ไม่พบในเวชระเบียนกลาง'}</p>`}${addBtn}`; }
function pickPatient(i){ const r=S.add.rows[i]; S.add.pick=r.patient; addPerson(r.patient,false); }
function localTop(p){ return `<div class="sub">ผู้ป่วย <span class="chip tone-success">ในระบบนี้แล้ว</span></div><div id="locPt">${localPtHtml(p)}</div>`; }
function localPtHtml(p){ return `<p style="margin:0 0 4px"><b>${esc(p.FullName)}</b> <span class="muted small">HN ${esc(p.HN||'-')} · ${esc(ageSex(p))}${p.Phone?' · ☎ '+esc(p.Phone):''}</span></p><p class="muted xs" style="margin:0 0 8px">${esc(p.AddressText||'')} ${esc(p.CommunityName||'')} · ข้อมูลจากสำเนาในระบบ อัปเดตล่าสุด ${esc(thDateTime(p.UpdatedAt))}${p.PatientID?` · <a href="#" onclick="refreshLocal();return false">🔄 อัปเดตจากเวชระเบียนกลาง</a>`:''}</p>`; }
function pickLocal(i){ const p=S.add.local[i]; S.add.patientKey=p.PatientKey; S.add.patient=p; S.add.isNew=false; S.add.pick=null; openCaseForm(null, localTop(p), p); }
async function refreshLocal(){ const p=S.add.patient; if(!p) return; const el=$('locPt'); if(el) el.innerHTML=phcSk(1);
  try{ const x=await api('apiPatientRefresh',p.PatientKey); S.add.patient=x; if($('locPt')) $('locPt').innerHTML=localPtHtml(x); toast('อัปเดตจากเวชระเบียนกลางแล้ว'); }catch(e){ if($('locPt')) $('locPt').innerHTML=localPtHtml(p); toast(e.message,true); } }
function addPersonHtml(x,isNew){ return `<div class="sub">ข้อมูลผู้ป่วย ${isNew?'<span class="chip tone-warning">ผู้ป่วยใหม่ — เพิ่มเข้าเวชระเบียนกลาง</span>':'<span class="chip tone-info">จากเวชระเบียนกลาง HN '+esc(x.HN||'-')+' · แก้แล้วส่งกลับเวชระเบียนกลาง</span>'}</div>${PK.formHtml('pk',x,{mode:isNew?'new':'edit',community:kitComm(x.CommunityName||'')})}`; }
async function addPerson(pt,isNew){
  S.add.isNew=!!isNew; if(isNew) S.add.pick=null;
  const getP=(!isNew&&pt&&pt.PatientID)?api('apiCentralPerson',pt.PatientID).catch(()=>Object.assign({},pt)):Promise.resolve({});
  const [x]=await Promise.all([getP, ensureKit()]);
  S.add.person=x;
  openCaseForm(null, `<div id="pkDup"></div><div id="addPerson">${addPersonHtml(x,isNew)}</div>`, x);
  PK.mount('pk',x);
}
function editCase(){ const c=S.caseFile; S.add={ pick:null, isNew:false, patientKey:c.PatientKey, patient:c.patient }; openCaseForm(c, `<div class="sub">ผู้ป่วย</div><p style="margin:0 0 6px"><b>${esc(c.FullName)}</b> <span class="muted small">HN ${esc(c.HN||'-')} · ${esc(ageSex(c))}</span></p>`, c.patient||{}); }
function caseFormHtml(c, person){ const T=S.text, ds=S.refs.diseases.filter(d=>d.Active||(c&&d.DiseaseCode===c.DiseaseCode)), today=todayKey(), F=S.F;

    <div class="full">${field('วันเริ่มนับติดตาม',dateField('cStart',F.StartDate,{typed:true,max:today}),'',true)}<div class="pin-info" id="startHint"></div></div>
    ${field('ชุมชน',`<select class="phc-select" id="cComm">${opt('','— ไม่ระบุ —',!F.CommunityName)}${(S.comms||[]).map(x=>opt(x.CommunityName,x.CommunityName,x.CommunityName===F.CommunityName)).join('')}</select>`)}
    ${field('ที่อยู่ขณะป่วย',`<input class="phc-input" id="cAddr" maxlength="400" value="${esc(F.AddressText)}" placeholder="ถ้าต่างจากทะเบียนบ้าน">`)}
    ${field('สถานที่ประจำ (โรงเรียน/ศูนย์เด็กเล็ก/ที่ทำงาน)',`<select class="phc-select" id="cPlace" onchange="checkNear()">${opt('','— ไม่มี —',!F.PlaceID)}${S.refs.places.filter(p=>p.Active||p.PlaceID===F.PlaceID).map(p=>opt(p.PlaceID,p.PlaceName,p.PlaceID===F.PlaceID)).join('')}</select>`)}
    ${field('ห้องเรียน / แผนก',`<input class="phc-input" id="cRoom" maxlength="60" value="${esc(F.ClassRoom)}">`)}

      <div class="maptools"><button type="button" class="phc-btn phc-btn--secondary phc-btn--sm" id="gpsBtn" onclick="pinGps()">📍 ใช้ GPS ตอนนี้</button><input class="phc-input" id="geoQ" placeholder="ค้นจากที่อยู่ เช่น 12 ซ.อ่อนนุช 17" onkeydown="if(event.key==='Enter'){event.preventDefault();pinGeocode();}"><button type="button" class="phc-btn phc-btn--ghost phc-btn--sm" id="geoBtn" onclick="pinGeocode()">ค้น</button><button type="button" class="phc-btn phc-btn--ghost phc-btn--sm" onclick="pinClear()">ล้างหมุด</button></div>

    ${field('หมายเหตุ',`<input class="phc-input" id="cNote" maxlength="500" value="${esc(F.Note)}">`)}

function openCaseForm(c, topHtml, person){
  const p=person||{};
  S.F=c?{ CaseID:c.CaseID, Version:c.Version, DiseaseCode:c.DiseaseCode, Diagnosis:c.Diagnosis, Source:c.Source, NotifyFrom:c.NotifyFrom, NotifyUnit:c.NotifyUnit, OnsetDate:c.OnsetDate, FoundDate:c.FoundDate, StartDate:c.StartDate, startTouched:true,
      CommunityName:c.CommunityName, AddressText:c.AddressText, PlaceID:c.PlaceID, ClassRoom:c.ClassRoom, Outcome:c.Outcome, Note:c.Note, Lat:c.Lat, Lng:c.Lng, PinMethod:c.PinMethod, GpsAcc:c.GpsAcc }
    :{ CaseID:'', Version:'', DiseaseCode:(S.refs.diseases.filter(d=>d.Active)[0]||{}).DiseaseCode||'', Diagnosis:'SUSPECT', Source:'NOTIFIED', NotifyFrom:'', NotifyUnit:'', OnsetDate:'', FoundDate:todayKey(), StartDate:todayKey(), startTouched:false,
      CommunityName:p.CommunityName||'', AddressText:'', PlaceID:'', ClassRoom:'', Outcome:'TREATING', Note:'', Lat:'', Lng:'', PinMethod:'', GpsAcc:'' };
  openModal(c?'แก้ไขผู้ป่วย '+c.CaseNo:'บันทึกผู้ป่วยโรคติดต่อ', topHtml+caseFormHtml(c,p)+'<div id="addErr"></div>',

async function drawFocusMap(){ const f=S.focus, el=$('focusMap'); if(!el) return; const pts=f.cases.filter(c=>c.Lat!==''); if(!pts.length){ el.innerHTML='<div class="nomap">ผู้ป่วยในจุดยังไม่มีพิกัด (จัดกลุ่มด้วยสถานที่)</div>'; return; }
  const ok=await loadLeaflet(); if(!ok||!$('focusMap')){ if($('focusMap')) noMap($('focusMap')); return; }
  const m=newMap(el), sc=ST_COLOR[f.state]||'#999'; pts.forEach(c=>radiusCircle(c.Lat,c.Lng,f.RadiusM,sc).addTo(m)); pts.forEach((c,i)=>caseMarker(c.Lat,c.Lng,f.Color,sc).addTo(m).bindTooltip(String(f.cases.indexOf(c)+1),{permanent:true,direction:'top',offset:[0,-6]}));
  const g=L.featureGroup(pts.map(c=>L.circle([c.Lat,c.Lng],{radius:f.RadiusM}))).addTo(m); m.fitBounds(g.getBounds(),{padding:[10,10],maxZoom:17}); m.removeLayer(g); }

function printDoc(o){ const P=window.PHC37Print; if(!P){ toast('ไม่พบชุดพิมพ์ PHC37_Print',true); return; }
  P.print(P.document(Object.assign({ systemName:'ระบบควบคุมโรคติดต่อ (CDC)', systemShort:'CDC', docDate:shortDate(todayKey()), printedBy:S.user.fullName }, o))); }
function csvDownload(name, rows){ const q=String.fromCharCode(34), cell=v=>{ const t=String(v==null?'':v); return q+t.split(q).join(q+q)+q; };
  const text=String.fromCharCode(65279)+rows.map(r=>r.map(cell).join(',')).join(String.fromCharCode(13,10)); try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),500); }catch(e){ toast('ดาวน์โหลดไม่ได้: '+e.message,true); } }

  if(rf.tab==='r3') body=`<div class="grid g4"><div class="stat"><span>จุดระบาดที่เปิดในปีงบ</span><b>${esc(fs.total)}</b><i>ยังไม่ปิด ${esc(fs.open)}</i></div><div class="stat ${fs.withNext?'warn':''}"><span>จุดที่มีผู้ป่วยรายถัดไป</span><b>${esc(fs.withNext)}</b><i>${esc(fs.pctNext===''?'-':fs.pctNext+'%')}</i></div><div class="stat good"><span>ปิดโดยไม่มีรายใหม่</span><b>${esc(fs.closedClean)}</b><i>${esc(fs.pctClean===''?'-':fs.pctClean+'%')} ของจุดที่ปิด ${esc(fs.closed)}</i></div><div class="stat"><span>นับวันใหม่รวม</span><b>${esc(R.foci.reduce((a,f)=>a+f.Restarts,0))}</b><i>ครั้ง</i></div></div>
    <div class="card" style="margin-top:14px"><div class="actions" style="justify-content:flex-end;margin-bottom:8px"><button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="csvR3()">⬇️ CSV</button></div><div class="table-wrap"><table class="t"><thead><tr><th>จุด</th><th>โรค</th><th>ชุมชน</th><th>เปิด</th><th class="num">ผู้ป่วย</th><th class="num">นับใหม่</th><th>สิ้นสุด</th><th>ปิด</th><th class="num">เฝ้าระวังจริง (วัน)</th><th class="num">กิจกรรม</th><th>สถานะ</th></tr></thead><tbody>${R.foci.map(f=>`<tr class="click" onclick="openFocus('${esc(f.FocusID)}','reports')"><td><b>${esc(f.FocusCode)}</b></td><td>${esc(f.DiseaseName)}</td><td>${esc(f.CommunityName||f.PlaceName||'-')}</td><td>${esc(shortDate(f.OpenDate))}</td><td class="num">${esc(f.CaseCount)}</td><td class="num">${esc(f.Restarts)}</td><td>${esc(shortDate(f.EndDate))}</td><td>${esc(f.CloseDate?shortDate(f.CloseDate):'-')}</td><td class="num">${esc(f.realDays===''?'-':f.realDays)}</td><td class="num">${esc(f.activities)}</td><td>${stChip(f.state)}</td></tr>`).join('')||'<tr><td colspan="11" class="muted">ไม่มี</td></tr>'}</tbody></table></div></div>`;
  if(rf.tab==='r4'){ const tot=Math.max(1,R.foci.length); body=`<div class="card"><h3>วันพบ/รับแจ้งผู้ป่วยรายแรก → กิจกรรมแรกของจุด</h3><div class="dist">${R.timeliness.map(t=>`<div class="dist-row"><span>${esc(t.label)}</span><div class="dist-track"><div class="${t.key==='D4'||t.key==='NONE'?'d':(t.key==='D23'?'w':'')}" style="width:${Math.round(t.n*100/tot)}%"></div></div><span class="num">${esc(t.n)} จุด</span></div>`).join('')}</div>
    <div class="sub">จุดที่เริ่มกิจกรรมช้ากว่า 3 วัน / ยังไม่มีกิจกรรม</div>${R.foci.filter(f=>f.lagBin==='D4'||f.lagBin==='NONE').map(f=>`<div class="arow" onclick="openFocus('${esc(f.FocusID)}','reports')"><div><b>${esc(f.FocusCode)}</b> ${esc(f.CommunityName||'')}<small>พบรายแรก ${esc(shortDate(f.firstFound))} · กิจกรรมแรก ${esc(f.firstAct?shortDate(f.firstAct):'ยังไม่มี')}</small></div><div>${f.lagDays===''?chip('ยังไม่มี','danger'):chip(f.lagDays+' วัน','warning')}</div></div>`).join('')||'<p class="muted">ไม่มี</p>'}</div>`; }
  if(rf.tab==='r6') body=`<div class="card"><p>แผนที่และสรุปสำหรับนำเสนอในที่ประชุม ไม่แสดงชื่อ/HN</p><button class="phc-btn" onclick="S.mf.anon=true;S.mf.scope='recent';go('map')">🗺️ เปิดแผนที่โหมดนำเสนอ</button></div><div class="card" style="margin-top:14px"><h3>ผู้ป่วยรายชุมชน (ปีงบ ${esc(R.fy)})</h3><div class="table-wrap">${byTable(R.byCommunity,R)}</div></div>`;
  $('content').innerHTML=`<div class="page-head"><div><h2>รายงานโรคติดต่อ</h2><p>ปีงบประมาณ ${esc(R.fy)} (${esc(shortDate(R.range.from))} – ${esc(shortDate(R.range.to))}) · ผู้ป่วย ${esc(R.cases.length)} ราย · นับตามวันพบ/รับแจ้ง · ไม่นับที่ยกเลิก</p></div>
    <div class="actions"><select class="phc-select" aria-label="ปีงบ" onchange="S.rf.fy=Number(this.value);renderReports()">${(S.refs.fyOptions||[]).map(y=>opt(y,'ปีงบประมาณ '+y,y===R.fy)).join('')}</select><select class="phc-select" aria-label="โรค" onchange="S.rf.disease=this.value;renderReports()">${opt('','ทุกโรค',!rf.disease)}${S.refs.diseases.map(d=>opt(d.DiseaseCode,d.DiseaseName,d.DiseaseCode===rf.disease)).join('')}</select><button class="phc-btn phc-btn--secondary" onclick="printReport()">🖨️ พิมพ์</button></div></div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${rf.tab===t[0]?'on':''}" onclick="S.rf.tab='${t[0]}';drawReport()">${esc(t[1])}</button>`).join('')}</div>${body}`; }
function printReport(){ const R=S.report, rf=S.rf, meta=[['ปีงบประมาณ',String(R.fy)],['โรค',rf.disease?dis(rf.disease).DiseaseName:'ทุกโรค']];
  if(rf.tab==='r1'){ printDoc({ title:'ทะเบียนผู้ป่วยโรคติดต่อ', orientation:'landscape', density:'compact', meta:meta.concat([['จำนวน',R.cases.length+' ราย']]),
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>#</th><th>เลขที่</th><th>โรค</th><th>ชื่อ-สกุล</th><th>HN</th><th>อายุ</th><th>เพศ</th><th>วันเริ่มป่วย</th><th>พบ/รับแจ้ง</th><th>ที่มา</th><th>ชุมชน</th><th>สถานที่</th><th>การวินิจฉัย</th><th>ผล</th><th>จุด</th></tr></thead><tbody>${R.cases.slice().sort((a,b)=>a.FoundDate.localeCompare(b.FoundDate)).map((c,i)=>`<tr><td class="phc-p-num">${i+1}</td><td>${esc(c.CaseNo)}</td><td>${esc(c.DiseaseName)}</td><td>${esc(c.FullName)}</td><td>${esc(c.HN||'-')}</td><td class="phc-p-num">${esc(c.Age)}</td><td>${esc(SEX_TH[c.Sex]||'-')}</td><td>${esc(c.OnsetDate?shortDate(c.OnsetDate):'-')}</td><td>${esc(shortDate(c.FoundDate))}</td><td>${esc(tx('sourceMap',c.Source))}${c.NotifyUnit?' · '+esc(c.NotifyUnit):''}</td><td>${esc(c.CommunityName||'-')}</td><td>${esc(c.PlaceName||'-')}</td><td>${esc(tx('diagMap',c.Diagnosis))}</td><td>${esc(tx('outcomeMap',c.Outcome))}</td><td>${esc(c.FocusCode||'-')}</td></tr>`).join('')}</tbody></table>` }); return; }
  if(rf.tab==='r2'){ printDoc({ title:'สรุปผู้ป่วยโรคติดต่อรายเดือน', orientation:'landscape', meta:meta,
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>โรค</th>${R.months.map(m=>`<th>${esc(m.label)}</th>`).join('')}<th>รวม</th></tr></thead><tbody>${R.byMonth.map(r=>`<tr><td>${esc(r.DiseaseName)}</td>${r.cells.map(n=>`<td class="phc-p-num">${n}</td>`).join('')}<td class="phc-p-num"><b>${r.total}</b></td></tr>`).join('')}</tbody></table>`+byPrint('รายชุมชน',R.byCommunity,R)+byPrint('กลุ่มอายุ (ปี)',R.byAge,R)+byPrint('เพศ',R.bySex,R)+byPrint('ที่มา',R.bySource,R)+byPrint('การวินิจฉัย',R.byDiagnosis,R) }); return; }
  if(rf.tab==='r3'){ const fs=R.fociSummary; printDoc({ title:'สรุปจุดระบาดโรคติดต่อ', orientation:'landscape', meta:meta,
    bodyHtml:`<p>จุดที่เปิดในปีงบ <b>${esc(fs.total)}</b> จุด · มีผู้ป่วยรายถัดไป <b>${esc(fs.withNext)}</b> จุด (${esc(fs.pctNext===''?'-':fs.pctNext+'%')}) · ปิดแล้ว ${esc(fs.closed)} จุด ปิดโดยไม่มีรายใหม่ <b>${esc(fs.closedClean)}</b> จุด (${esc(fs.pctClean===''?'-':fs.pctClean+'%')}) · ยังไม่ปิด ${esc(fs.open)} จุด</p>
    <table class="phc-p-table"><thead><tr><th>#</th><th>จุด</th><th>โรค</th><th>ชุมชน/สถานที่</th><th>เปิด</th><th>ผู้ป่วย</th><th>นับใหม่</th><th>สิ้นสุด</th><th>ปิด</th><th>เฝ้าระวังจริง (วัน)</th><th>กิจกรรม</th><th>สถานะ</th></tr></thead><tbody>${R.foci.map((f,i)=>`<tr><td class="phc-p-num">${i+1}</td><td>${esc(f.FocusCode)}</td><td>${esc(f.DiseaseName)}</td><td>${esc(f.CommunityName||f.PlaceName||'-')}</td><td>${esc(shortDate(f.OpenDate))}</td><td class="phc-p-num">${esc(f.CaseCount)}</td><td class="phc-p-num">${esc(f.Restarts)}</td><td>${esc(shortDate(f.EndDate))}</td><td>${esc(f.CloseDate?shortDate(f.CloseDate):'-')}</td><td class="phc-p-num">${esc(f.realDays===''?'-':f.realDays)}</td><td class="phc-p-num">${esc(f.activities)}</td><td>${esc(ST_TH[f.state])}</td></tr>`).join('')}</tbody></table>` }); return; }
  if(rf.tab==='r4'){ printDoc({ title:'ความทันเวลาในการเข้าควบคุมโรค', meta:meta,
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>ระยะเวลา (พบรายแรก → กิจกรรมแรก)</th><th>จำนวนจุด</th><th>ร้อยละ</th></tr></thead><tbody>${R.timeliness.map(t=>`<tr><td>${esc(t.label)}</td><td class="phc-p-num">${esc(t.n)}</td><td class="phc-p-num">${esc(pctOf(t.n,R.foci.length))}</td></tr>`).join('')}</tbody></table>
    <h3>รายจุด</h3><table class="phc-p-table"><thead><tr><th>จุด</th><th>ชุมชน</th><th>พบรายแรก</th><th>กิจกรรมแรก</th><th>ห่าง (วัน)</th></tr></thead><tbody>${R.foci.map(f=>`<tr><td>${esc(f.FocusCode)}</td><td>${esc(f.CommunityName||'-')}</td><td>${esc(shortDate(f.firstFound))}</td><td>${esc(f.firstAct?shortDate(f.firstAct):'ยังไม่มี')}</td><td class="phc-p-num">${esc(f.lagDays===''?'-':f.lagDays)}</td></tr>`).join('')}</tbody></table>` }); return; }
  printDoc({ title:'สรุปผู้ป่วยโรคติดต่อรายชุมชน (ไม่ระบุตัวบุคคล)', meta:meta, bodyHtml:byPrint('รายชุมชน',R.byCommunity,R)+byPrint('กลุ่มอายุ (ปี)',R.byAge,R) }); }
function csvR1(){ const R=S.report; csvDownload('CDC_R1_ทะเบียนผู้ป่วย_'+R.fy+'.csv',[['เลขที่','โรค','ชื่อ-สกุล','HN','อายุ','เพศ','วันเริ่มป่วย','วันพบ/รับแจ้ง','วันเริ่มนับ','ที่มา','หน่วยที่แจ้ง','ชุมชน','สถานที่','การวินิจฉัย','ผล','จุดระบาด','สถานะ']].concat(R.cases.map(c=>[c.CaseNo,c.DiseaseName,c.FullName,c.HN,c.Age,SEX_TH[c.Sex]||'',c.OnsetDate,c.FoundDate,c.StartDate,tx('sourceMap',c.Source),c.NotifyUnit,c.CommunityName,c.PlaceName,tx('diagMap',c.Diagnosis),tx('outcomeMap',c.Outcome),c.FocusCode,(CASE_ST[c.state]||[c.state])[0]]))); }
function csvR2(){ const R=S.report; csvDownload('CDC_R2_รายเดือน_'+R.fy+'.csv',[['โรค'].concat(R.months.map(m=>m.label)).concat(['รวม'])].concat(R.byMonth.map(r=>[r.DiseaseName].concat(r.cells).concat([r.total])))); }
function csvR3(){ const R=S.report; csvDownload('CDC_R3_จุดระบาด_'+R.fy+'.csv',[['จุด','โรค','ชุมชน','เปิด','ผู้ป่วย','นับใหม่','สิ้นสุด','ปิด','เฝ้าระวังจริง (วัน)','กิจกรรม','สถานะ']].concat(R.foci.map(f=>[f.FocusCode,f.DiseaseName,f.CommunityName,f.OpenDate,f.CaseCount,f.Restarts,f.EndDate,f.CloseDate,f.realDays,f.activities,ST_TH[f.state]]))); }

/* ---------- settings ---------- */
function renderSettings(){ if(!canSet()){ go('home'); return; }
  const tabs=[['places','สถานที่']]; if(S.user.isAdmin){ tabs.unshift(['diseases','โรค']); tabs.push(['general','แผนที่ / ทั่วไป']); }
  if(!tabs.some(t=>t[0]===S.setTab)) S.setTab=tabs[0][0];
  $('content').innerHTML=`<div class="page-head"><div><h2>ตั้งค่า</h2><p>${S.user.isAdmin?'ผู้ดูแลระบบ':'ผู้มีสิทธิ์แก้ไข (สถานที่)'}</p></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${S.setTab===t[0]?'on':''}" onclick="S.setTab='${t[0]}';renderSettings()">${esc(t[1])}</button>`).join('')}</div><div id="setBody"></div>`;
  ({diseases:drawDiseases,places:drawPlaces,general:drawGeneral}[S.setTab])(); }
function drawDiseases(){ const D=S.refs.diseases;
  $('setBody').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">โรคที่ติดตาม</h3><button class="phc-btn phc-btn--sm" onclick="diseaseForm('')">+ เพิ่มโรค</button></div>
    <p class="muted small">เปลี่ยนวันติดตาม → จุดที่ยังไม่ปิดของโรคนั้นคำนวณวันสิ้นสุดใหม่ทันที (เก็บประวัติ) · โรคที่มีผู้ป่วยแล้วลบไม่ได้ ให้ปิดใช้แทน</p>
    <div class="table-wrap"><table class="t"><thead><tr><th>โรค</th><th class="num">วันติดตาม</th><th>วิธีจัดกลุ่ม</th><th class="num">รัศมี</th><th class="num">เตือนซ้ำ</th><th>กิจกรรม</th><th>สถานะ</th><th></th></tr></thead><tbody>${D.map(d=>`<tr><td>${dzChip(d.DiseaseCode,d.DiseaseName,d.Color)}<small>${esc(d.DiseaseCode)}</small></td><td class="num"><b>${esc(d.FollowDays)}</b> วัน</td><td>${esc(tx('groupMap',d.GroupMode))}</td><td class="num">${esc(d.RadiusM)} ม.</td><td class="num">${esc(d.DupDays)} วัน</td><td><small>${esc(d.ActivityTypes.join(', '))}</small></td><td>${d.Active?chip('ใช้งาน','success'):chip('ปิดใช้','neutral')}</td><td><button class="phc-btn phc-btn--edit phc-btn--sm" onclick="diseaseForm('${esc(d.DiseaseCode)}')">แก้ไข</button></td></tr>`).join('')}</tbody></table></div></div>`; }
function diseaseForm(code){ const d=S.refs.diseases.filter(x=>x.DiseaseCode===code)[0]||{DiseaseCode:'',DiseaseName:'',Color:'#1D4ED8',FollowDays:14,GroupMode:'RADIUS',RadiusM:100,DupDays:30,ActivityTypes:['สอบสวนโรค','ให้สุขศึกษา','เยี่ยมผู้ป่วย'],Active:true};
  openModal(code?'แก้ไขโรค '+d.DiseaseName:'เพิ่มโรค',`<div class="form-grid">${field('รหัส (อังกฤษ)',`<input class="phc-input" id="dCode" maxlength="12" value="${esc(d.DiseaseCode)}" ${code?'disabled':''} placeholder="เช่น CHIK">`,'',true)}${field('ชื่อโรค',`<input class="phc-input" id="dName" maxlength="80" value="${esc(d.DiseaseName)}">`,'',true)}
    ${field('วันติดตาม (วัน)',`<input class="phc-input" id="dDays" inputmode="numeric" value="${esc(d.FollowDays)}">`,'',true)}${field('สี',`<input class="phc-input" id="dColor" type="color" value="${esc(d.Color)}" style="height:44px">`)}
    <div class="full">${field('วิธีจัดกลุ่มเป็นจุดระบาด',segHtml('dMode',S.text.groupModes,d.GroupMode),'',true)}</div>
    ${field('รัศมี (เมตร)',`<input class="phc-input" id="dRad" inputmode="numeric" value="${esc(d.RadiusM)}">`,'',true)}${field('เตือนบันทึกซ้ำภายใน (วัน)',`<input class="phc-input" id="dDup" inputmode="numeric" value="${esc(d.DupDays)}">`)}
    ${field('ประเภทกิจกรรม (คั่นด้วยเครื่องหมายจุลภาค ,)',`<textarea class="phc-input" id="dActs" rows="3">${esc(d.ActivityTypes.join(', '))}</textarea>`,'full')}${code?field('สถานะ',segHtml('dAct',[['1','ใช้งาน'],['0','ปิดใช้']],d.Active?'1':'0'),'full'):''}</div>`,
  `<button class="phc-btn phc-btn--secondary" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" id="dBtn" onclick="saveDisease('${esc(code)}')">บันทึก</button>`); }
async function saveDisease(code){ const b=$('dBtn'); setBusy(b,true);
  try{ const r=await api('apiSaveDisease',{isNew:!code,DiseaseCode:code||val('dCode'),DiseaseName:val('dName'),Color:val('dColor'),FollowDays:val('dDays'),GroupMode:segVal('dMode'),RadiusM:val('dRad'),DupDays:val('dDup'),ActivityTypes:val('dActs').split(',').map(x=>x.trim()),Active:code?segVal('dAct')==='1':true});
    S.refs.diseases=r.diseases; closeModal(); refreshAfterWrite(); toast('บันทึกโรคแล้ว'+(r.recalc?' · คำนวณจุดใหม่ '+r.recalc+' จุด':'')); drawDiseases(); }catch(e){ setBusy(b,false); toast(e.message,true); } }
function drawPlaces(){ const P=S.refs.places;
  $('setBody').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">สถานที่ (ใช้จัดกลุ่มมือ เท้า ปาก)</h3><button class="phc-btn phc-btn--sm" onclick="placeForm('')">+ เพิ่มสถานที่</button></div>
    ${P.length?`<div class="table-wrap" style="margin-top:10px"><table class="t"><thead><tr><th>สถานที่</th><th>ประเภท</th><th>ชุมชน</th><th>พิกัด</th><th>สถานะ</th><th></th></tr></thead><tbody>${P.map(p=>`<tr><td><b>${esc(p.PlaceName)}</b>${p.Note?'<small>'+esc(p.Note)+'</small>':''}</td><td>${esc(tx('placeTypeMap',p.PlaceType))}</td><td>${esc(p.CommunityName||'-')}</td><td>${p.Lat!==''?'✔':'-'}</td><td>${p.Active?chip('ใช้งาน','success'):chip('ปิดใช้','neutral')}</td><td><button class="phc-btn phc-btn--edit phc-btn--sm" onclick="placeForm('${esc(p.PlaceID)}')">แก้ไข</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">ยังไม่มีสถานที่</p>'}</div>`; }
function placeForm(id){ const p=S.refs.places.filter(x=>x.PlaceID===id)[0]||{PlaceType:'SCHOOL',Active:true,Lat:'',Lng:''};
  openModal(id?'แก้ไขสถานที่':'เพิ่มสถานที่',`<div class="form-grid">${field('ประเภท',`<select class="phc-select" id="plType">${S.text.placeTypes.map(t=>opt(t[0],t[1],t[0]===p.PlaceType)).join('')}</select>`,'',true)}${field('ชื่อสถานที่',`<input class="phc-input" id="plName" maxlength="120" value="${esc(p.PlaceName||'')}">`,'',true)}
    ${field('อยู่ในชุมชน',`<select class="phc-select" id="plComm">${opt('','— ไม่ระบุ —',!p.CommunityName)}${(S.comms||[]).map(c=>opt(c.CommunityName,c.CommunityName,c.CommunityName===p.CommunityName)).join('')}</select>`)}${field('พิกัด (ละติจูด, ลองจิจูด)',`<input class="phc-input" id="plLL" value="${p.Lat!==''?esc(p.Lat+', '+p.Lng):''}" placeholder="เช่น 13.7231, 100.6254 (ไม่บังคับ)">`)}
    ${field('หมายเหตุ',`<input class="phc-input" id="plNote" maxlength="300" value="${esc(p.Note||'')}">`,'full')}${id?field('สถานะ',segHtml('plAct',[['1','ใช้งาน'],['0','ปิดใช้']],p.Active?'1':'0'),'full'):''}</div>`,
  `<button class="phc-btn phc-btn--secondary" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" id="plBtn" onclick="savePlace('${esc(id)}')">บันทึก</button>`); }
async function savePlace(id){ const b=$('plBtn'), ll=val('plLL').split(','); setBusy(b,true);
  try{ S.refs.places=await api('apiSavePlace',{PlaceID:id,PlaceType:val('plType'),PlaceName:val('plName'),CommunityName:val('plComm'),Lat:ll.length===2?ll[0].trim():'',Lng:ll.length===2?ll[1].trim():'',Note:val('plNote'),Active:id?segVal('plAct')==='1':true}); closeModal(); toast('บันทึกสถานที่แล้ว'); drawPlaces(); }catch(e){ setBusy(b,false); toast(e.message,true); } }
function drawGeneral(){ const st=S.refs.settings, F=(k,l)=>field(l,`<input class="phc-input" id="g_${k}" inputmode="decimal" value="${esc(st[k])}">`);
  $('setBody').innerHTML=`<div class="grid g2"><div class="card"><h3>แผนที่</h3><div class="form-grid">${F('MAP_LAT','กึ่งกลาง ละติจูด')}${F('MAP_LNG','กึ่งกลาง ลองจิจูด')}${F('MAP_ZOOM','ระดับซูม (10–19)')}${F('MAP_DAYS','แสดงจุดที่ปิดแล้วย้อนหลัง (วัน)')}${F('GPS_WARN_M','เตือน GPS คลาดเคลื่อนเกิน (ม.)')}${F('NEAR_EDGE_M','เตือนใกล้ขอบรัศมี (ม.)')}</div></div>
    <div class="card"><h3>ทั่วไป</h3><div class="form-grid">${F('DUE_SOON_DAYS','ใกล้ครบกำหนดภายใน (วัน)')}${F('NEAR_CLOSED_DAYS','แจ้งเคยเป็นจุดระบาด ภายใน (วัน)')}${field('รหัสไฟล์ข้อมูลระบบสำรวจลูกน้ำ (ไม่บังคับ)',`<input class="phc-input" id="g_LVS" value="${esc(st.LVS_SPREADSHEET_ID)}" placeholder="เว้นว่าง = ไม่แสดงผลสำรวจลูกน้ำ">`,'full')}</div></div></div>
    <div style="margin-top:12px"><button class="phc-btn" id="gBtn" onclick="saveGeneral()">บันทึก</button></div>
    <div class="card" style="margin-top:14px"><h3>⏱️ วัดความเร็วเวชระเบียนกลาง</h3><p class="muted small">เรียก Gateway จริงอย่างละ 2–3 ครั้ง (ping · รายการ · ค้นหา · เปิดแฟ้ม) แล้วสรุปเวลา · ไม่แก้ข้อมูล · ใช้เวลาประมาณ 20–60 วินาที · ผลบันทึกใน Execution log ด้วย</p>
      <div class="toolbar"><input class="phc-input" id="prKw" placeholder="HN ที่มีอยู่ในเวชระเบียนกลาง เช่น 123/70-37"><button class="phc-btn phc-btn--secondary" id="prBtn" onclick="runProbe()">เริ่มวัด</button></div><div id="prOut"></div></div>`; }
async function runProbe(){ const b=$('prBtn'), kw=val('prKw'); if(kw.length<2){ toast('กรุณาพิมพ์ HN สำหรับทดสอบ',true); return; } setBusy(b,true,'กำลังวัด…'); $('prOut').innerHTML=phcSk(4); const t0=Date.now();
  try{ const r=await api('apiSpeedProbe',{keyword:kw}), all=Date.now()-t0, s=r.summary, f=v=>v===''||v===undefined?'-':(v/1000).toFixed(2)+' วิ';
    $('prOut').innerHTML=`<div class="grid g4" style="margin-top:8px"><div class="stat"><span>ค่าคงที่ต่อการเรียก Gateway 1 ครั้ง</span><b style="font-size:22px">${f(s.pingMs)}</b><i>ping เฉลี่ย</i></div><div class="stat"><span>งานค้นหาใน Gateway</span><b style="font-size:22px">${f(s.searchWorkMs)}</b><i>ค้นหา − ping</i></div><div class="stat"><span>อ่านเบอร์/ผู้ติดต่อ</span><b style="font-size:22px">${f(s.contactsMs)}</b><i>เปิดแฟ้ม+เบอร์ − เปิดแฟ้ม</i></div><div class="stat"><span>ค้นในระบบนี้</span><b style="font-size:22px">${f(s.localSearchMs)}</b><i>ไม่เรียก Gateway</i></div></div>
      <div class="table-wrap" style="margin-top:10px"><table class="t"><thead><tr><th>ขั้น</th><th class="num">ครั้งแรก</th><th class="num">ต่ำสุด</th><th class="num">เฉลี่ย</th><th class="num">สูงสุด</th><th>หมายเหตุ</th></tr></thead><tbody>${r.steps.map(x=>`<tr><td>${esc(x.label)}</td><td class="num">${f(x.first)}</td><td class="num">${f(x.min)}</td><td class="num"><b>${f(x.avg)}</b></td><td class="num">${f(x.max)}</td><td><small>${esc((x.errors||[]).join(' · '))}</small></td></tr>`).join('')}</tbody></table></div>
      <p class="muted xs">วัดที่เซิร์ฟเวอร์เว็บลูก ${esc(r.at)} · รวม ${f(r.totalMs)} · ทั้งรอบจากหน้าเว็บ ${f(all)} · ${s.foundPatient?'':'ไม่พบ HN นี้ในเวชระเบียนกลาง จึงไม่ได้วัดการเปิดแฟ้ม · '}คัดลอกตารางนี้ส่งให้ผู้พัฒนาได้</p>`;
  }catch(e){ $('prOut').innerHTML=`<p style="color:var(--phc-danger)">${esc(e.message)}</p>`; } finally{ setBusy(b,false); } }
async function saveGeneral(){ const b=$('gBtn'), nums={}; ['MAP_LAT','MAP_LNG','MAP_ZOOM','MAP_DAYS','GPS_WARN_M','NEAR_EDGE_M','DUE_SOON_DAYS','NEAR_CLOSED_DAYS'].forEach(k=>nums[k]=val('g_'+k)); setBusy(b,true);
  try{ S.refs.settings=await api('apiSaveSettings',{numbers:nums,texts:{LVS_SPREADSHEET_ID:val('g_LVS')}}); toast('บันทึกแล้ว'); drawGeneral(); }catch(e){ setBusy(b,false); toast(e.message,true); } }

boot();
</script>
<script>
/* ปุ่ม "กลับหน้าหลัก" → หน้าหลักของแอป PHC37 */
window.goGateway = function () { try { sessionStorage.removeItem('cdc1.session'); } catch (e) {} try { window.parent.PHC37.goHome(); } catch (e) {} };
</script>
