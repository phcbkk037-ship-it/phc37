/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}
.phc-table .phc-num{text-align:right;font-variant-numeric:tabular-nums}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

function cvdCalc(o){ /* Thai CV risk (NCD formula NO_LAB / WITH_TC) */

async function loadList(force){
  if(!S.list||force||Date.now()-S.listAt>60000){ try{ S.list=await api('apiPersons'); S.listAt=Date.now(); }catch(e){ if(!S.list){ errBox(e); return false; } toast(e.message,true); } }
  return true;
}
async function renderRegistry(){
  if(!S.list) loading();

  const lvOpts=[['NORMAL','ปกติ'],['RISK','เสี่ยง'],['HIGH','เสี่ยงสูง (CVA)'],['SUSPECT','สงสัยป่วย'],['RECHECK','ต้องตรวจซ้ำ (DM)'],['DX','ป่วยแล้ว'],['NONE','ยังไม่มีผล']];
  $('content').innerHTML=`<div class="page-head"><div><h2>ทะเบียน</h2><p>ลงทะเบียนจากเวชระเบียนกลาง · อายุ ${esc(S.crit.criteria.minAge)} ปีขึ้นไป · คลิกรายชื่อเพื่อเปิดแฟ้ม</p></div>

      <select class="phc-select" aria-label="แขวง" onchange="S.filters.sd=this.value;drawRegistry()">${opt('','ทุกแขวง')}${subs.map(c=>opt(c,c,f.sd===c)).join('')}</select>
      <select class="phc-select" onchange="S.filters.c=this.value;drawRegistry()">${opt('','ทุกชุมชน')}${comms.map(c=>opt(c,c,f.c===c)).join('')}</select>

      <select class="phc-select" onchange="S.filters.b=this.value;drawRegistry()">${opt('','ทุกช่วงวัย')}${BANDS.map(b=>opt(b,bandName(b),f.b===b)).join('')}</select>
      <select class="phc-select" onchange="S.filters.d=this.value;drawRegistry()">${opt('','ระดับ: ทุกโรค',!f.d)}${DIS.map(x=>opt(x,DIS_SHORT[x],f.d===x)).join('')}</select>
      <select class="phc-select" onchange="S.filters.l=this.value;drawRegistry()">${opt('','ทุกระดับ',!f.l)}${lvOpts.map(x=>opt(x[0],x[1],f.l===x[0])).join('')}</select>

function lvMatch(r,d,l){ const ds=d?[d]:DIS; return ds.some(x=>{ const v=r.latest[x]?r.latest[x].level:'NONE'; return v===l; }); }
function regRows(){ const f=S.filters, q=norm(f.q); return S.list.filter(r=>(!f.c||(r.CommunityName||'ไม่ระบุชุมชน')===f.c)&&(!f.sd||(r.SubDistrict||'ไม่ระบุแขวง')===f.sd)&&comboMatch(r,f.k)&&(!f.s||r.Status===f.s)&&(!f.b||r.AgeBand===f.b)&&(!f.l||lvMatch(r,f.d,f.l))
  &&(!f.f||(f.f==='FY'?r.screenedFy:f.f==='NOFY'?!r.screenedFy:f.f==='OPEN'?r.open.length>0:r.program))&&(!q||norm([r.FullName,r.RegNo,r.HN,r.Phone].join(' ')).includes(q))); }
function latestCells(r){ return DIS.map(x=>`<td>${r.latest[x]?lvChip(r.latest[x].level):'<span class="muted">-</span>'}</td>`).join(''); }
function drawRegistry(){
  const rows=regRows(), el=$('regList'); if(!el) return;
  el.innerHTML=`<div class="table-wrap"><table class="t rt"><thead><tr><th>ชื่อ-สกุล</th><th>เพศ / อายุ</th><th>DM</th><th>HT</th><th>CVA</th><th>ชุมชน</th><th>คัดกรองล่าสุด</th><th>ติดตาม</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" onclick="openFile('${r.PersonID}','registry')"><td><b>${esc(r.FullName)}</b><small>${esc(r.RegNo)}${r.HN?' · HN '+esc(r.HN):''}${r.Status==='INACTIVE'?' · จำหน่ายแล้ว':''}</small></td><td>${esc(SEX_TH[r.Sex]||'-')} · ${esc(r.Age)} ปี<small>${esc(bandName(r.AgeBand))}</small></td>${latestCells(r)}<td>${esc(r.CommunityName||'-')}${r.SubDistrict?`<small>แขวง${esc(r.SubDistrict)}</small>`:''}${r.Phone?`<small>โทร ${esc(r.Phone)}</small>`:''}</td><td class="nowrap">${r.lastScreen?esc(shortDate(r.lastScreen)):'<span class="muted">ยังไม่คัดกรอง</span>'}</td><td>${r.combo&&r.combo.indexOf('+')>0?chip(comboName(r.combo),'warning')+' ':''}${r.urgent?chip('BE FAST','danger')+' ':''}${r.open.length?`<b>${r.open.length}</b> เรื่อง`:'<span class="muted">-</span>'}${r.program?'<small>อยู่ในโปรแกรม</small>':''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">ไม่พบรายชื่อ</td></tr>'}</tbody></table></div><p class="muted small">แสดง ${rows.length} จาก ${S.list.length} คน · ระดับ = ผลล่าสุดของแต่ละโรค</p>`;
}
async function ensureComms(){ if(S.comms) return; try{ S.comms=await api('apiCommunities',false); }catch(e){ S.comms=[]; } }
function commSelect(id, cur){ const list=S.comms||[]; const has=!cur||list.some(c=>c.CommunityName===cur); return `<select class="phc-select" id="${id}">${opt('','ไม่ระบุชุมชน')}${list.map(c=>opt(c.CommunityName,c.CommunityName+(c.SubDistrict?' ('+c.SubDistrict+')':''),c.CommunityName===cur)).join('')}${!has?opt(cur,cur,true):''}</select>`; }
function cidOk(c){ if(!allDigits(c,13)) return false; let s=0; for(let i=0;i<12;i++) s+=Number(c[i])*(13-i); return (11-(s%11))%10===Number(c[12]); }
function cidCheck(){ const el=$('vCid'), v=digits(el.value), m=$('vCidMsg'); if(!m) return; m.textContent=!v?'':(v.length<13?'กรอกแล้ว '+v.length+'/13 หลัก':(cidOk(v)?'✓ เลขถูกต้อง':'เลขบัตรไม่ถูกต้อง (หลักสุดท้ายไม่ตรง)')); m.style.color=v.length===13&&!cidOk(v)?'#B42318':''; }
function birthInfo(){ const k=dateVal('vBirth'), m=$('vAgeMsg'); if(!m) return; const a=k?ageAt(k,todayKey()):'', min=S.crit.criteria.minAge, low=k&&a<min; m.textContent=k?('อายุ '+a+' ปี'+(low?' · ยังไม่ถึงเกณฑ์ '+min+' ปี':' · '+bandName(a<35?'LT35':a<65?'A35_64':'GE65'))):''; m.style.color=low?'#B42318':''; }

/* แขวงเป็นตัวเลือก (CNR1-1.2.0) — เฉพาะระบบนี้ ไม่แก้ไฟล์ Patient Kit กลาง: ซ่อนช่องพิมพ์แขวงของ kit แล้ววางตัวเลือกแทน · เลือก "อื่น ๆ" = พิมพ์เอง */
function sdList(){ const out=[]; (S.subDistricts||[]).concat((S.comms||[]).map(c=>c.SubDistrict||'')).forEach(x=>{ x=String(x||'').trim(); if(x.indexOf('แขวง')===0) x=x.slice(4).trim(); if(x&&out.indexOf(x)<0) out.push(x); }); return out; }
function sdEnhance(px){ const inp=$(px+'Sd'); if(!inp||$(px+'SdSel')) return; let cur=String(inp.value||'').trim(); if(cur.indexOf('แขวง')===0){ cur=cur.slice(4).trim(); inp.value=cur; }
  const L=sdList(), other=!!cur&&L.indexOf(cur)<0, sel=document.createElement('select'); sel.className='phc-select'; sel.id=px+'SdSel'; sel.setAttribute('aria-label','แขวง');
  sel.innerHTML=opt('','- เลือกแขวง -',!cur)+L.map(x=>opt(x,x,x===cur)).join('')+opt('__OTHER__','อื่น ๆ (พิมพ์เอง)',other);
  inp.parentNode.insertBefore(sel,inp); inp.style.display=other?'':'none'; inp.placeholder='พิมพ์ชื่อแขวง / ตำบล'; if(other) inp.style.marginTop='6px';
  sel.addEventListener('change',()=>{ if(sel.value==='__OTHER__'){ inp.value=''; inp.style.display=''; inp.style.marginTop='6px'; inp.focus(); } else { inp.value=sel.value; inp.style.display='none'; } }); }
/* ===== CNR1-1.4.0 (10/11/2569): ใช้คีย์บอร์ดได้ครบ · วันที่ใส่ / ให้เอง · ค้นหาชุมชน · ค่าตั้งต้นที่อยู่ · อาชีพเพิ่ม ===== */
const CNR_DEFAULT_ADDR = { District:'สวนหลวง', ZipCode:'10250', Province:'กรุงเทพมหานคร' };
const CNR_EXTRA_OCC = ['ธุรกิจส่วนตัว','พนักงานบริษัท'];
function cnrAddOccupations(L){ if(!L||!Array.isArray(L.occupations)) return L; const arr=L.occupations.slice(); let at=arr.indexOf('รับจ้าง'); at=at<0?arr.length:at+1; CNR_EXTRA_OCC.forEach(o=>{ if(arr.indexOf(o)<0){ arr.splice(at,0,o); at++; } }); L.occupations=arr; return L; }
/* พิมพ์ตัวเลขวันที่แล้วใส่ / ให้เอง (แป้นตัวเลขบน iPad / มือถือไม่มี /) */
function cnrSlashDate(el, ev){
  if(!el) return; if(ev&&ev.inputType&&ev.inputType.indexOf('delete')===0) return;
  const raw=String(el.value||''); let d=''; for(let i=0;i<raw.length;i++){ const c=raw[i]; if(c>='0'&&c<='9') d+=c; }
  const parts=raw.split('/');
  if(parts.length>1){ /* พิมพ์ / เอง: เก็บตามที่พิมพ์ · ครบ 2 หลักเติม / ให้ */
    const out=parts.map(p=>{ let q=''; for(let j=0;j<p.length;j++){ const c=p[j]; if(c>='0'&&c<='9') q+=c; } return q; });
    let v=out[0].slice(0,2)+'/'+out[1].slice(0,2); if(out.length>2) v+='/'+out[2].slice(0,4); else if(out[1].length===2) v+='/';
    if(v!==raw) el.value=v; return;
  }
  d=d.slice(0,8); let v=d;
  if(d.length>=2) v=d.slice(0,2)+'/'+d.slice(2);
  if(d.length>=4) v=d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);
  if(v!==raw) el.value=v;
}
function cnrBindSlash(el, after){ if(!el||el.dataset.slash) return; el.dataset.slash='1'; el.setAttribute('maxlength','10'); el.addEventListener('input',function(ev){ cnrSlashDate(el,ev); if(after) after(); }); }
/* ช่องชุมชน: พิมพ์ค้นหาแล้วเลือก */
function cnrCommSearch(selId){
  const sel=$(selId); if(!sel||$(selId+'Q')) return;
  const all=Array.from(sel.options).map(o=>({v:o.value,t:o.textContent}));
  const q=document.createElement('input'); q.type='search'; q.className='phc-input'; q.id=selId+'Q'; q.placeholder='🔍 พิมพ์ชื่อชุมชนเพื่อค้นหา'; q.setAttribute('aria-label','ค้นหาชุมชน'); q.autocomplete='off'; q.style.marginBottom='6px';
  const hint=document.createElement('div'); hint.className='muted small'; hint.id=selId+'QMsg'; hint.style.marginTop='4px';
  sel.parentNode.insertBefore(q,sel); sel.parentNode.insertBefore(hint,sel.nextSibling);
  const draw=function(){ const k=norm(q.value), cur=sel.value; const L=k?all.filter(o=>o.v===''||norm(o.t).indexOf(k)>=0):all;
    sel.innerHTML=L.map(o=>opt(o.v,o.t,o.v===cur)).join('');
    const hits=L.filter(o=>o.v!=='');
    if(k&&hits.length&&!hits.some(o=>o.v===cur)) sel.value=hits[0].v;
    hint.textContent=k?(hits.length?('พบ '+hits.length+' ชุมชน'+(hits.length>1?' · เลือกจากรายการด้านล่าง':' · เลือกให้แล้ว')):'ไม่พบชุมชนที่พิมพ์'):'';
    sel.dispatchEvent(new Event('change')); };
  q.addEventListener('input',draw);
  q.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); cnrFocusNext(sel,1); } });
}
/* ค่าตั้งต้นที่อยู่: เขตสวนหลวง 10250 (เหมือนกรุงเทพมหานคร) — เติมเฉพาะช่องที่ว่าง */
function cnrAddrDefaults(px){
  const dist=$(px+'Dist'), zip=$(px+'Zip'), prov=$(px+'Prov'); if(!dist||!zip) return;
  const pv=prov?String(prov.value||'').trim():'';
  if(pv&&pv!=='กรุงเทพมหานคร'&&pv!=='กรุงเทพฯ'&&pv!=='กทม.') return;
  if(!String(dist.value||'').trim()&&!String(zip.value||'').trim()){ dist.value=CNR_DEFAULT_ADDR.District; zip.value=CNR_DEFAULT_ADDR.ZipCode; if(prov&&!pv) prov.value=CNR_DEFAULT_ADDR.Province; }
}

/* Enter = ไปช่องถัดไป · ปุ่มปฏิทินไม่ขวางการกด Tab */
function cnrFocusables(root){ return Array.from(root.querySelectorAll('input,select,textarea,.seg button,.pk-seg button')).filter(el=>!el.disabled&&el.type!=='hidden'&&el.tabIndex!==-1&&!el.readOnly&&el.offsetParent!==null); }
function cnrFocusNext(el, dir){
  const root=el.closest('.modal')||document; const L=cnrFocusables(root); const i=L.indexOf(el); if(i<0) return false;
  const n=L[i+(dir||1)]; if(!n){ const save=root.querySelector('.modal-foot .phc-btn:not(.phc-btn--secondary)'); if(save){ save.focus(); return true; } return false; }
  n.focus(); if(n.select&&n.tagName==='INPUT'&&n.type!=='checkbox'&&n.type!=='radio') try{ n.select(); }catch(e){}
  return true;
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.isComposing||e.shiftKey||e.ctrlKey||e.altKey||e.metaKey) return;
  const el=e.target; if(!el||!el.closest||!el.closest('.modal')) return;
  if(el.tagName==='TEXTAREA'||el.tagName==='BUTTON') return;
  if(el.tagName!=='INPUT'&&el.tagName!=='SELECT') return;
  if(el.getAttribute('onkeydown')) return; /* ช่องค้นหาที่กด Enter เพื่อค้นหา */
  if(el.type==='checkbox'||el.type==='radio'){ e.preventDefault(); el.checked=!el.checked; el.dispatchEvent(new Event('change',{bubbles:true})); return; }
  if(el.classList.contains('typed')) typedDate(el.id,1);
  if(cnrFocusNext(el,1)) e.preventDefault();
},true);
/* ปุ่มปฏิทินข้างช่องวันที่ไม่ต้องหยุดตอนกด Tab (กดเปิดได้ด้วยเมาส์/นิ้ว) · ช่องวันที่พิมพ์ได้ใส่ / ให้เอง */

  if(S.mf.kind==='SCREEN'){ if(age<35) out.push('<b>CVA</b> อายุ '+age+' ปี ไม่คิด CVD Risk'); else { const p=cvdCalc({age,sbp:bs,sex:v.Sex,dm:dxAtClient('DM',key),smoking:segVal('mSmoke'),tc:nval('mTc'),waist:wi,height:h}); out.push('<b>CVD Risk</b> '+(p===null?'<span class="muted">ต้องมี BP + รอบเอว/ส่วนสูง (หรือ Cholesterol)</span>':p+'% '+(dxAtClient('CVA',key)?lvChip('DX'):lvChip(lvCVA(p,c))))); } }

}

async function renderFollow(){
  if(!S.follow) loading();

  if(S.page==='follow') drawFollowShell();

const FTABS=[['all','ทั้งหมด'],['DUE','ถึง/เลยรอบที่แนะนำ'],['URGENT','BE FAST'],['SUSPECT','สงสัยป่วย'],['RISK','กลุ่มเสี่ยง'],['RECHECK','รอตรวจซ้ำ'],['closed','ปิดแล้ว 90 วัน']];
function cMatch(c,t){ if(t==='all') return true; if(t==='DUE') return c.overdue||c.pastDeadline||c.kind==='URGENT'; return c.kind===t; }
function drawFollowShell(){
  const L=S.follow.rows, f=S.ff, comms=commNames(L.concat(S.follow.closed));
  const cnt=t=>{ if(t==='closed') return S.follow.closed.length+' เรื่อง'; const x=L.map(p=>p.cases.filter(c=>cMatch(c,t)&&(!f.d||c.disease===f.d)).length); return x.filter(Boolean).length+' คน'; };
  $('content').innerHTML=`<div class="page-head"><div><h2>ต้องติดตาม</h2><p>คำนวณจากผลคัดกรองล่าสุด · รอบติดตามเป็นคำแนะนำ (ไม่บังคับ) · 1 คน 1 แถว กดเพื่อดูแต่ละเรื่อง</p></div><div class="actions"><button class="phc-btn phc-btn--secondary" onclick="printFollow()">🖨️ พิมพ์รายการ</button></div></div>
    <div class="tabs">${FTABS.map(t=>`<button class="tab ${S.followTab===t[0]?'on':''}" onclick="S.followTab='${t[0]}';drawFollowShell()">${t[1]} <span class="n">(${cnt(t[0])})</span></button>`).join('')}</div>
    <div class="toolbar"><input class="phc-input grow" placeholder="🔍 ค้นหา ชื่อ / HN" value="${esc(f.q)}" oninput="S.ff.q=this.value;drawFollow()"><select class="phc-select" onchange="S.ff.d=this.value;drawFollowShell()">${opt('','ทุกโรค',!f.d)}${DIS.map(x=>opt(x,DIS_SHORT[x],f.d===x)).join('')}</select><select class="phc-select" onchange="S.ff.c=this.value;drawFollow()">${opt('','ทุกชุมชน')}${comms.map(c=>opt(c,c,f.c===c)).join('')}</select></div><div id="fList"></div>`;
  drawFollow();
}
function followPersons(){
  const f=S.ff, q=norm(f.q), t=S.followTab, pri={URGENT:0,SUSPECT:1,RECHECK:2,RISK:3};
  return S.follow.rows.map(p=>Object.assign({},p,{items:p.cases.filter(c=>cMatch(c,t)&&(!f.d||c.disease===f.d)).sort((a,b)=>(pri[a.kind]-pri[b.kind])||String(a.next||'9').localeCompare(String(b.next||'9')))}))
    .filter(p=>p.items.length&&(!f.c||(p.CommunityName||'ไม่ระบุชุมชน')===f.c)&&(!q||norm(p.FullName+' '+(p.HN||'')).includes(q)))
    .sort((a,b)=>(pri[a.items[0].kind]-pri[b.items[0].kind])||((b.items.some(x=>x.overdue||x.pastDeadline)?1:0)-(a.items.some(x=>x.overdue||x.pastDeadline)?1:0))||String(a.items[0].next||'9').localeCompare(String(b.items[0].next||'9'))||String(a.FullName).localeCompare(String(b.FullName),'th'));
}
function toggleFP(id){ S.fOpen=S.fOpen||{}; S.fOpen[id]=!S.fOpen[id]; drawFollow(); }
function dueText(c){ if(c.kind==='URGENT') return '<b style="color:var(--phc-danger)">ทันที</b>'; const t=[]; if(c.next) t.push(esc(shortDate(c.next))+(c.overdue?' '+chip('เลยกำหนด','warning'):'')); if(c.kind==='SUSPECT'&&c.deadline) t.push('<small>ยืนยันภายใน '+esc(shortDate(c.deadline))+(c.pastDeadline?' '+chip('เกิน','danger'):'')+'</small>'); return t.join('')||'<span class="muted">ครบรอบแล้ว</span>'; }
function drawFollow(){
  const el=$('fList'); if(!el) return;
  if(S.followTab==='closed'){ const f=S.ff, q=norm(f.q); const R=S.follow.closed.filter(c=>(!f.d||c.disease===f.d)&&(!f.c||(c.CommunityName||'ไม่ระบุชุมชน')===f.c)&&(!q||norm(c.FullName+' '+(c.HN||'')).includes(q)));
    el.innerHTML=`<div class="table-wrap"><table class="t rt"><thead><tr><th>ชื่อ-สกุล</th><th>เรื่อง</th><th>เริ่ม</th><th>ปิด</th><th>ผล</th></tr></thead><tbody>${R.map(c=>`<tr class="click" onclick="openFile('${c.PersonID}','follow')"><td><b>${esc(c.FullName)}</b><small>${esc(c.CommunityName||'-')}</small></td><td>${esc(DIS_SHORT[c.disease])} ${kindChip(c.kind)}</td><td>${esc(shortDate(c.openDate))}</td><td>${esc(shortDate(c.closeDate))}</td><td><b>${esc(closeName(c.closeReason))}</b>${c.decision&&c.decision.Note?'<small>'+esc(c.decision.Note)+'</small>':''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">ไม่มีรายการ</td></tr>'}</tbody></table></div>`; return; }
  const P=followPersons(), O=S.fOpen||{};
  el.innerHTML=`<div class="table-wrap"><table class="t rt fp"><thead><tr><th>ชื่อ-สกุล</th><th>เรื่องที่ต้องติดตาม</th><th>ระดับล่าสุด</th><th>ครั้งถัดไป (แนะนำ)</th><th></th></tr></thead><tbody>${P.map(p=>{ const open=!!O[p.PersonID], first=p.items[0];
    return `<tr class="click fp-head ${open?'on':''}" onclick="toggleFP('${p.PersonID}')"><td><b style="color:var(--phc-primary)">${esc(p.FullName)}</b><small>${p.HN?'HN '+esc(p.HN)+' · ':''}${esc(p.CommunityName||'-')}${p.Phone?' · โทร '+esc(p.Phone):''}</small><small>อายุ ${esc(p.Age)} ปี${p.program?' · อยู่ในโปรแกรมลดเสี่ยง':''}</small></td><td><b>${p.items.length} เรื่อง</b><small style="white-space:normal">${p.items.map(c=>esc(c.disease)+' '+esc(S.text.caseKind[c.kind])).join(' · ')}</small></td><td>${DIS.map(d=>p.latest[d]?'<small>'+d+' '+lvChip(p.latest[d].level)+'</small>':'').join('')}</td><td class="nowrap">${dueText(first)}</td><td class="nowrap"><button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="event.stopPropagation();toggleFP('${p.PersonID}')">${open?'▴ ซ่อน':'▾ ดูเรื่อง'}</button> <button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="event.stopPropagation();openFile('${p.PersonID}','follow')">แฟ้ม</button></td></tr>${open?p.items.map(c=>`<tr class="fp-item"><td></td><td><b>${esc(DIS_SHORT[c.disease])}</b> ${kindChip(c.kind)}<small>เริ่ม ${esc(shortDate(c.openDate))} · ติดตามแล้ว ${c.visits.length} ครั้ง${c.nextLabel?' · '+esc(c.nextLabel):''}</small></td><td>${c.kind==='URGENT'?'':lvChip(c.curLevel)}</td><td class="nowrap">${dueText(c)}</td><td><button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="openFile('${p.PersonID}','follow')">บันทึกในแฟ้ม</button></td></tr>`).join(''):''}`; }).join('')||'<tr><td colspan="5" class="empty">ไม่มีรายการ</td></tr>'}</tbody></table></div><p class="muted small">${P.length} คน · ${P.reduce((s,p)=>s+p.items.length,0)} เรื่อง · บันทึกติดตาม/ผลยืนยันในแฟ้มของแต่ละคน</p>`;
}
function printFollow(){
  if(S.followTab==='closed'){ toast('เลือกแท็บอื่นก่อนพิมพ์',true); return; }
  const P=followPersons(), rows=[]; P.forEach((p,pi)=>p.items.forEach((c,k)=>rows.push({p,c,no:k?'':pi+1,first:!k})));

function moveStats(pairs, d){ const out={n:0,better:0,same:0,worse:0,list:[]}; pairs.forEach(x=>{ const a=LV_RANK[x.a], b=LV_RANK[x.b]; if(a===undefined||b===undefined) return; out.n++; if(b<a) out.better++; else if(b>a){ out.worse++; out.list.push(x); } else out.same++; }); return out; }

function printPeople(){ const R=pplRows(), f=pplFilters(), extra=[f.dm?'DM '+lvRowName('DM',f.dm):'',f.ht?'HT '+lvRowName('HT',f.ht):'',f.cva?'CVA '+lvRowName('CVA',f.cva):'',f.combo?(f.combo==='MULTI'?'เสี่ยงตั้งแต่ 2 โรค':'เสี่ยง '+f.combo):'',f.fol?{OPEN:'มีเรื่องติดตามอยู่',OVERDUE:'เลยกำหนดนัด',NONE:'ไม่มีเรื่องติดตาม',PROG:'อยู่ในโปรแกรม'}[f.fol]:''].filter(Boolean);
  kitPrint({ title:'รายชื่อผู้รับการคัดกรองรายบุคคล ปีงบประมาณ '+S.report.fy, docDate:shortDate(todayKey()), orientation:'landscape', meta:[['ตัวกรอง',[pplFilterText()].concat(extra).filter(Boolean).join(' · ')||'ทั้งหมด'],['จำนวน',R.length+' คน']],
    bodyHtml:`<table class="phc-p-table" style="font-size:10.5px"><thead><tr><th>ที่</th><th>ชื่อ-สกุล / HN</th><th>เพศ/อายุ</th><th>ชุมชน / โทร</th><th>วันคัดกรอง</th><th>นน./สส./BMI</th><th>รอบเอว</th><th>BP</th><th>DTX</th><th>CVD%</th><th>ระดับ DM / HT / CVA</th><th>ปัจจัยเสี่ยง</th><th>ติดตาม / ผลยืนยัน / โปรแกรม</th></tr></thead><tbody>${R.map((r,i)=>{ const m=r.m||{}; return `<tr class="phc-p-avoid"><td class="phc-p-num">${i+1}</td><td>${esc(r.FullName)}${r.HN?'<br>HN '+esc(r.HN):''}</td><td>${esc(SEX_TH[r.Sex]||'')} ${esc(r.age)}</td><td>${esc(r.CommunityName)}${r.Phone?'<br>'+esc(r.Phone):''}</td><td>${esc(shortDate(r.date))}</td><td>${esc(fmtN(m.w))}/${esc(fmtN(m.h))}<br>${esc(fmtN(r.first.bmi))}</td><td>${m.waist===''||m.waist===undefined?'-':esc(m.waist)+'"'}${r.first.waistOver===true?' เกิน':''}</td><td>${m.bpS===''||m.bpS===undefined?'-':esc(m.bpS)+'/'+esc(m.bpD)}</td><td>${m.dtx===''||m.dtx===undefined?'-':esc(m.dtx)+(m.dtxType?'<br>'+esc(((S.text.dtxType||{})[m.dtxType])||m.dtxType):'')}</td><td>${r.first.cvdPct===''?'-':esc(r.first.cvdPct)}</td><td>${esc(lvPlain(r))}</td><td>${esc(rfNames(r).join(', ')||'-')}</td><td>${esc(followText(r).concat(confText(r)).concat(progText(r)?[progText(r)]:[]).join(' · ')||'-')}</td></tr>`; }).join('')}</tbody></table><p class="phc-p-note">ค่าที่วัด = ผลคัดกรองครั้งแรกของปีงบ · ระดับ ครั้งแรก→ล่าสุดในปีงบ · ไม่แสดงเลขบัตรประชาชน</p>` }); }
function printReport(){
  const R=S.report, ft=[S.rf.c,S.rf.b?bandName(S.rf.b):''].filter(Boolean).join(' · ');
  const strip=h=>h.split('class="card"').join('class="phc-p-section"').split('<h3').join('<h2').split('</h3>').join('</h2>').split('class="t').join('class="phc-p-table');
  if(S.reportTab==='people'){ printPeople(); return; }
  S.printing=true; let body; try{ body=reportBody(S.reportTab); } finally { S.printing=false; }
  kitPrint({ title:'รายงานคัดกรองและติดตามกลุ่มเสี่ยงโรคเรื้อรังในชุมชน ปีงบประมาณ '+R.fy, docDate:shortDate(todayKey()), orientation:'landscape', density:'compact',
    meta:[['ช่วงเวลา',shortDate(R.range.from)+' – '+shortDate(R.range.to)],['ตัวกรอง',ft||'ทั้งหมด'],['หัวข้อ',RTABS.find(t=>t[0]===S.reportTab)[1]]], bodyHtml:strip(body) });
}

/* =====================================================================
 * criteria & settings
 * ===================================================================== */
function critRows(c){ return [
  ['อายุขั้นต่ำที่ลงทะเบียน', c.minAge+' ปี'],
  ['HT เสี่ยง', '≥ '+c.bp.riskSys+' / '+c.bp.riskDia+' mmHg'], ['HT สงสัยป่วย', '≥ '+c.bp.suspectSys+' / '+c.bp.suspectDia+' mmHg'],
  ['DM อดอาหาร / FBS', 'เสี่ยง '+c.dtxFasting.risk+'–'+(c.dtxFasting.suspect-1)+' · สงสัยป่วย ≥ '+c.dtxFasting.suspect+' mg/dL'],
  ['DM ไม่อดอาหาร', 'ต้องตรวจซ้ำ '+c.dtxRandom.recheck+'–'+(c.dtxRandom.suspect-1)+' · สงสัยป่วย ≥ '+c.dtxRandom.suspect+' mg/dL'],
  ['CVA (CVD Risk อายุ ≥ 35)', 'เสี่ยง ≥ '+c.cvd.risk+'% · เสี่ยงสูง ≥ '+c.cvd.high+'%'],
  ['รอบติดตาม กลุ่มเสี่ยง', c.plans.RISK], ['รอบติดตาม สงสัยป่วย', c.plans.SUSPECT+' · ยืนยันภายใน '+c.suspectConfirmMonths+' เดือน'], ['รอบตรวจซ้ำแบบอดอาหาร', c.plans.RECHECK], ['โปรแกรมลดเสี่ยงเบาหวาน', c.plans.PROGRAM] ]; }
function renderSettings(){
  const C=S.crit, c=C.criteria, adm=can('admin');
  const ni=(id,v,lab)=>field(lab,`<input class="phc-input" id="${id}" inputmode="decimal" value="${esc(v)}" ${adm?'':'disabled'}>`);
  $('content').innerHTML=`<div class="page-head"><div><h2>เกณฑ์และตั้งค่า</h2><p>ชุดเกณฑ์ปัจจุบัน: ชุดที่ ${C.current} · แก้เกณฑ์ = สร้างชุดใหม่ ใช้กับผลที่บันทึกหลังจากนี้ (ผลเดิมคงระดับตามชุดเดิม)</p></div></div>
    <div class="grid g2" style="align-items:start"><div class="card"><h3>เกณฑ์คัดกรอง ${adm?'':'<small class="muted">(แก้ได้เฉพาะผู้ดูแลระบบ)</small>'}</h3><div class="form-grid">
      ${ni('cMin',c.minAge,'อายุขั้นต่ำที่ลงทะเบียน (ปี)')}<div></div>
      <h4 class="full sub">ความดันโลหิต (mmHg) · ตัวบน หรือ ตัวล่าง ถึงเกณฑ์ข้อใดข้อหนึ่ง</h4>
      ${ni('cRs',c.bp.riskSys,'เสี่ยง ตัวบน ≥')}${ni('cRd',c.bp.riskDia,'เสี่ยง ตัวล่าง ≥')}${ni('cSs',c.bp.suspectSys,'สงสัยป่วย ตัวบน ≥')}${ni('cSd',c.bp.suspectDia,'สงสัยป่วย ตัวล่าง ≥')}
      <h4 class="full sub">น้ำตาล (mg/dL)</h4>
      ${ni('cFr',c.dtxFasting.risk,'อดอาหาร/FBS เสี่ยง ≥')}${ni('cFs',c.dtxFasting.suspect,'อดอาหาร/FBS สงสัยป่วย ≥')}${ni('cRr',c.dtxRandom.recheck,'ไม่อดอาหาร ต้องตรวจซ้ำ ≥')}${ni('cRs2',c.dtxRandom.suspect,'ไม่อดอาหาร สงสัยป่วย ≥')}
      <h4 class="full sub">CVA จาก CVD Risk (%) · อายุ ≥ 35 ปี</h4>
      ${ni('cCr',c.cvd.risk,'เสี่ยง ≥')}${ni('cCh',c.cvd.high,'เสี่ยงสูง ≥')}
      <h4 class="full sub">รอบติดตามที่แนะนำ (d = วัน · m = เดือน คั่นด้วย ,)</h4>
      ${field('กลุ่มเสี่ยง',`<input class="phc-input" id="pRisk" value="${esc(c.plans.RISK)}" ${adm?'':'disabled'}>`)}${field('สงสัยป่วย',`<input class="phc-input" id="pSus" value="${esc(c.plans.SUSPECT)}" ${adm?'':'disabled'}>`)}
      ${field('ตรวจซ้ำแบบอดอาหาร',`<input class="phc-input" id="pRe" value="${esc(c.plans.RECHECK)}" ${adm?'':'disabled'}>`)}${field('โปรแกรมลดเสี่ยง (4 ครั้ง)',`<input class="phc-input" id="pPg" value="${esc(c.plans.PROGRAM)}" ${adm?'':'disabled'}>`)}
      ${ni('cCm',c.suspectConfirmMonths,'ยืนยันผลสงสัยป่วยภายใน (เดือน)')}
      ${adm?field('เหตุผลที่เปลี่ยนเกณฑ์',`<input class="phc-input" id="cWhy" placeholder="เช่น ปรับตามแนวทางใหม่ของสำนักอนามัย">`,'full',1):''}</div>
      ${adm?`<div class="actions" style="margin-top:12px"><button class="phc-btn phc-btn--secondary" onclick="fillDefaults()">คืนค่าตามแนวทาง</button><button class="phc-btn" id="cSave" onclick="saveCriteria()">บันทึกเป็นชุดเกณฑ์ใหม่</button></div>`:''}</div>
    <div><div class="card"><h3>ชุดเกณฑ์ที่เคยใช้</h3>${C.history.map(h=>`<details class="crit-h" ${h.version===C.current?'open':''}><summary><b>ชุดที่ ${h.version}</b>${h.version===C.current?' '+chip('ใช้อยู่','success'):''} <span class="muted small">${esc(h.reason||'')}${h.byName?' · '+esc(h.byName):''}${h.at?' · '+esc(thDateTime(h.at)):''}</span></summary><dl class="kv">${critRows(h.criteria).map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></details>`).join('')}</div>
      <div class="card" style="margin-top:14px"><h3>หลักการ</h3><ul class="crit"><li>ช่วงวัย: &lt; 35 · 35–64 · ≥ 65 ปี (อายุ ณ วันคัดกรอง) · เจาะ DTX ทุกคน</li><li>ความดันใช้ค่าเฉลี่ย 2 ครั้ง (ครั้งที่ 2 ไม่บังคับ)</li><li>DTX ไม่อดอาหารค่ากลาง = ยังไม่จัดระดับ นัดตรวจซ้ำแบบอดอาหาร</li><li>CVD Risk: Thai CV risk สูตรเดียวกับระบบ NCD (ไม่ใช้ผลเลือด: รอบเอว/ส่วนสูง · มีผล Cholesterol ใช้แบบมีผลเลือด) · อายุ &gt; 70 คิดที่ 70 · อายุ &lt; 35 ไม่คิด</li><li>อาการเตือน BE FAST = ป้ายแดง ส่งด่วน 1669 (ไม่ใช่ระดับเสี่ยง)</li><li>รอบเอวเกิน = มากกว่าส่วนสูง/2</li><li>ระยะแรกยังไม่เชื่อมระบบ NCD / ระบบส่งต่อ</li></ul></div>
      ${can('edit')?`<div class="card" style="margin-top:14px"><h3>ทั่วไป</h3>${field('สถานที่ให้บริการตั้งต้น',`<input class="phc-input" id="setLoc" value="${esc(S.settings.SERVICE_LOCATION||'')}">`)}<div class="actions" style="margin-top:10px"><button class="phc-btn phc-btn--secondary" id="setSave" onclick="saveSettings()">บันทึก</button></div></div>`:''}</div></div>`;
}
function fillDefaults(){ const d=S.crit.defaults, set=(id,v)=>{ $(id).value=v; };
  set('cMin',d.minAge); set('cRs',d.bp.riskSys); set('cRd',d.bp.riskDia); set('cSs',d.bp.suspectSys); set('cSd',d.bp.suspectDia); set('cFr',d.dtxFasting.risk); set('cFs',d.dtxFasting.suspect); set('cRr',d.dtxRandom.recheck); set('cRs2',d.dtxRandom.suspect);
  set('cCr',d.cvd.risk); set('cCh',d.cvd.high); set('pRisk',d.plans.RISK); set('pSus',d.plans.SUSPECT); set('pRe',d.plans.RECHECK); set('pPg',d.plans.PROGRAM); set('cCm',d.suspectConfirmMonths); toast('ใส่ค่าตามแนวทางในฟอร์มแล้ว ระบุเหตุผลแล้วกดบันทึก'); }
async function saveCriteria(){
  const g=id=>$(id).value.trim();
  const c={ minAge:g('cMin'), bp:{riskSys:g('cRs'),riskDia:g('cRd'),suspectSys:g('cSs'),suspectDia:g('cSd')}, dtxFasting:{risk:g('cFr'),suspect:g('cFs')}, dtxRandom:{recheck:g('cRr'),suspect:g('cRs2')},
    cvd:{risk:g('cCr'),high:g('cCh')}, plans:{RISK:g('pRisk'),SUSPECT:g('pSus'),RECHECK:g('pRe'),PROGRAM:g('pPg')}, suspectConfirmMonths:g('cCm') };
  if(!(await confirmBox('บันทึกชุดเกณฑ์ใหม่','เกณฑ์ใหม่ใช้กับผลที่บันทึกหลังจากนี้ · ผลที่บันทึกแล้วคงระดับตามชุดเดิม','บันทึก'))) return;
  const b=$('cSave'); setBusy(b,true);
  try{ const d=await api('apiSaveCriteria',{criteria:c, reason:g('cWhy')}); setCriteria(d.criteria); afterDash(d.dashboard); S.list=null; S.follow=null; S.report=null; toast('บันทึกชุดเกณฑ์ที่ '+d.criteria.current+' แล้ว'); renderSettings(); }
  catch(e){ toast(e.message,true); setBusy(b,false); }
}
async function saveSettings(){ const b=$('setSave'); setBusy(b,true);
  try{ const d=await api('apiSaveSettings',{SERVICE_LOCATION:$('setLoc').value.trim()}); S.settings=d.settings; toast('บันทึกแล้ว'); setBusy(b,false); }
  catch(e){ toast(e.message,true); setBusy(b,false); } }

/* =====================================================================
 * print (PHC37Print)
 * ===================================================================== */
function kitPrint(o){ if(!window.PHC37Print){ toast('ไม่พบชุดพิมพ์มาตรฐาน',true); return; } PHC37Print.print(PHC37Print.document(Object.assign({systemName:'ระบบคัดกรองและติดตามกลุ่มเสี่ยงโรคเรื้อรังในชุมชน',systemShort:'กลุ่มเสี่ยง NCDs ชุมชน',printedBy:S.user.fullName},o)),{onDone:e=>{ if(e) toast('เปิดหน้าพิมพ์ไม่สำเร็จ: '+e.message,true); }}); }

boot();
</script>
<script>
/* ปุ่ม "กลับหน้าหลัก" → หน้าหลักของแอป PHC37 */
window.goGateway = function () { try { sessionStorage.removeItem('cnr1.session'); } catch (e) {} try { window.parent.PHC37.goHome(); } catch (e) {} };
</script>
