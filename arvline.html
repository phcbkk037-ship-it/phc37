<script>
/* PHC37 PWA 2.12.0 — หน้า LINE ของ ARV (ARV2-1.0.1) บนระบบใหม่ · ไม่ต้องเข้าสู่ระบบ
 * ข้อมูลหน้า: Edge arv.pub linePage(mode, พารามิเตอร์ใน URL) · google.script.run.<ฟังก์ชันเดิม> → Edge arv.pub (ตรวจลายเซ็นโทเคนเดิมทุกบรรทัด) */
(function () {
  var CFG = window.PHC37_CONFIG || {};
  function send(fn, args) {
    if (!CFG.API_URL) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ config.js'));
    var ctrl = ('AbortController' in window) ? new AbortController() : null, timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);
    return fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'arv.pub', data: { fn: fn, args: args } }),
      signal: ctrl ? ctrl.signal : undefined }).then(function (r) { clearTimeout(timer); return r.json(); }, function (e) { clearTimeout(timer); throw new Error('เชื่อมต่อไม่ได้ กรุณาลองใหม่'); });
  }
  window.arvSend_ = send;
  function runner(ok, fail) {
    return new Proxy({}, { get: function (t, k) {
      if (k === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (k === 'withFailureHandler') return function (f) { return runner(ok, f); };
      if (k === 'withUserObject') return function () { return runner(ok, fail); };
      return function () {
        var args = [].slice.call(arguments);
        send(String(k), args).then(function (r) {
          if (r && r.ok === false && r.code === 'not_live') r = { ok: false, message: 'ระบบยังไม่เปิดใช้ กรุณาติดต่อคลินิก' };
          if (ok) ok(r);
        }, function (e) { if (fail) fail(e); });
      };
    } });
  }
  window.google = { script: { run: runner(null, null), host: { close: function () {} } } };
})();
/* โหลดข้อมูลหน้าจาก Edge แทน doGet เดิม · ลบ code/state ออกจากแถบที่อยู่หลังใช้แล้ว (รีเฟรชไม่ใช้รหัสซ้ำ) */
function arvLoad_() {
  var box = document.getElementById('box');
  box.innerHTML = '<div class="st info">กำลังโหลด…</div>';
  var q = {}, sp = new URLSearchParams(location.search);
  sp.forEach(function (v, k) { q[k] = v; });
  var mode = String(q.mode || '').toLowerCase();
  if (mode === 'liff') { MODE = 'ERROR'; D = { message: 'ลิงก์รุ่นเก่า — กรุณาใช้ลิงก์ หรือ QR ใหม่จากเจ้าหน้าที่' }; render(); return; }
  if (mode === 'linecallback') { try { history.replaceState(null, '', location.pathname + '?mode=done'); } catch (e) {} }
  if (mode === 'done') { MODE = 'ERROR'; D = { message: 'ทำรายการนี้ไปแล้ว — ปิดหน้านี้ได้' }; render(); return; }
  window.arvSend_('linePage', [mode, q]).then(function (r) {
    if (r && r.page) { MODE = r.page.mode; D = r.page.data || {}; }
    else { MODE = 'ERROR'; D = { message: (r && r.code === 'not_live') ? 'ระบบยังไม่เปิดใช้ กรุณาติดต่อคลินิก' : ((r && r.message) || 'ไม่สามารถเปิดหน้านี้ได้') }; }
    render();
  }, function (e) { MODE = 'ERROR'; D = { message: e && e.message ? e.message : 'เชื่อมต่อไม่ได้' }; render(); });
}
</script>

/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}
.phc-table .phc-num{text-align:right;font-variant-numeric:tabular-nums}
.phc-empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 20px;border:1px dashed var(--phc-border-input);border-radius:var(--phc-radius);background:var(--phc-surface);color:var(--phc-ink-2)}

/* ---------- หน้ายืนยัน ---------- */
.phc-dialog{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:20px;box-shadow:var(--phc-shadow-lg);display:flex;flex-direction:column;gap:12px}
.phc-dialog-title{margin:0;font-size:var(--phc-text-lg);font-weight:700}
.phc-dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

  function steps(labels, title) {
    var o = mk('div', 'phc-ld-over');
    o.innerHTML = '<div class="phc-ld-card" role="status"><div class="phc-ld-mark" style="width:48px;height:48px;border-radius:12px">' + MARK + '</div><span style="font-size:12px;letter-spacing:.14em;color:#4A5550;font-weight:600">' + esc(title || 'PHC37') + '</span><ol class="phc-ld-steps">'
      + labels.map(function(l) { return '<li><span class="phc-ld-ic" aria-hidden="true"></span><span>' + esc(l) + '</span></li>'; }).join('') + '</ol></div>';
    body(function() { document.body.appendChild(o); });
    var lis = o.querySelectorAll('li');
    return {
      set: function(i, st) { var li = lis[i]; if (!li) return; li.className = 'is-' + st; li.querySelector('.phc-ld-ic').textContent = st === 'done' ? '✓' : (st === 'err' ? '!' : ''); },
      close: function(delay) { setTimeout(function() { o.classList.add('is-hide'); setTimeout(function() { if (o.parentNode) o.parentNode.removeChild(o); }, 450); }, delay == null ? 350 : delay); }
    };
  }

  /* เรียกเซิร์ฟเวอร์พร้อมสถานะครบชุด */
  function call(fn, args, o) {
    o = o || {};
    return new Promise(function(resolve, reject) {
      var restore = o.btn ? busy(o.btn, o.busyText, { group: o.group }) : function() {};
      var useLine = o.line !== false; if (useLine) lineStart();
      if (o.skeleton) skeleton(o.skeleton.target, o.skeleton);
      var fail = function(err) {
        restore(); if (useLine) lineEnd(false);
        var m = (err && err.message) ? err.message : String(err || 'ไม่สำเร็จ');
        if (o.toast !== false) toast((o.errText ? o.errText + ': ' : '') + m, { type: 'error', retry: o.retry === true ? function() { call(fn, args, o).then(resolve, reject); } : o.retry });
        reject(err instanceof Error ? err : new Error(m));
      };
      try {
        google.script.run.withSuccessHandler(function(res) {
          if (typeof o.isError === 'function' && o.isError(res)) { fail(new Error((res && res.message) || 'ไม่สำเร็จ')); return; }
          restore(); if (useLine) lineEnd(true); if (o.skeleton) ready(o.skeleton.target); resolve(res);
        }).withFailureHandler(fail)[fn].apply(null, args || []);
      } catch (e) { fail(e); }
    });
  }

  return { VERSION: VERSION, busy: busy, clicked: clicked, line: { start: lineStart, done: function() { lineEnd(true); }, fail: function() { lineEnd(false); } },
    skeleton: skeleton, ready: ready, toast: toast, boot: boot, steps: steps, call: call };
})();
</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:16px;line-height:1.55}
.hero{display:flex;align-items:center;gap:14px;padding:18px 20px;background:#fff;border-top:4px solid var(--phc-brand);border-bottom:1px solid var(--phc-border)}
.hero .phc-brand-mark{flex:0 0 52px;width:52px;height:52px}
.hero h1{margin:0;font-size:21px;line-height:1.3}
.hero p{margin:2px 0 0;color:var(--phc-ink-2);font-size:14px}
main{width:min(620px,calc(100% - 24px));margin:20px auto 40px}
.card{background:#fff;border:1px solid var(--phc-border);border-radius:16px;padding:20px;box-shadow:var(--phc-shadow)}
.st{padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:15px}
.st.info{background:var(--phc-info-bg);color:var(--phc-info)}.st.ok{background:var(--phc-success-bg);color:var(--phc-success)}.st.err{background:var(--phc-danger-bg);color:var(--phc-danger)}.st.warn{background:var(--phc-warning-bg);color:var(--phc-warning)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;margin:0 0 14px;font-size:15px}.kv dt{color:var(--phc-ink-2)}.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.profile{display:flex;align-items:center;gap:12px;margin-bottom:14px}.profile img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--phc-surface-2)}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.acts .phc-btn{width:100%;min-height:50px;font-size:17px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:15px}.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--phc-primary)}
.small{font-size:13px;color:var(--phc-ink-2)}
.hide{display:none!important}
@media(max-width:560px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:6px}}
textarea.phc-input{width:100%;min-height:80px}
.appt{border:1px solid var(--phc-border);border-radius:14px;padding:14px;margin:0 0 14px;background:var(--phc-surface-2)}
.appt b.big{display:block;font-size:20px;margin-bottom:4px}
</style>
</head>
<body>
<header class="hero"><div class="phc-brand-mark" role="img" aria-label="ตรา ศบส.37"></div><div><h1>คลินิก ศบส.37 · LINE</h1><p>แจ้งเตือนนัดหมาย FollowUp037</p></div></header>
<main><div class="card" id="box"></div></main>
<script>
var MODE = 'LOADING';
var D = {};
function esc(v){ var t=String(v==null?'':v), o='', m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}; for(var i=0;i<t.length;i++){ o+=m[t[i]]||t[i]; } return o; }
function $(id){ return document.getElementById(id); }
function autoGo(url){ var k='arvgo:'+String(url).slice(-48); try{ if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); }catch(e){} setTimeout(function(){ try{ window.top.location.href=url; }catch(e){} },400); }
function apptBox(a){ return '<div class="appt"><b class="big">📅 '+esc(a.date)+'</b>เวลา <b>'+esc(a.time)+' น.</b> · '+esc(a.type)+(a.prep?'<div class="small" style="margin-top:6px">📝 '+esc(a.prep)+'</div>':'')+'<div class="small" style="margin-top:6px">สถานะ: '+esc(a.status)+(a.confirmed?' · ยืนยันแล้ว':'')+(a.requested?' · ส่งคำขอแล้ว':'')+'</div></div>'; }
function render(){
  var b=$('box');
  if(MODE==='LOADING'){ b.innerHTML='<div class="st info">กำลังโหลด…</div>'; return; }
  if(MODE==='LANDING'){
    var pt=D.subjectType==='PATIENT';
    b.innerHTML='<div class="st info">'+(pt?'เชื่อม LINE เพื่อรับแจ้งนัดหมายจากคลินิก':'เชื่อม LINE เพื่อรับแจ้งเตือนนัดหมายผู้ป่วยที่คุณรับผิดชอบ')+'</div>'
      +'<dl class="kv"><dt>'+(pt?'สำหรับ':'เจ้าหน้าที่')+'</dt><dd>'+esc(D.name)+'</dd><dt>LINE OA</dt><dd>'+esc(D.oaName)+' ('+esc(D.oaBasicId)+')</dd></dl>'
      +'<div class="acts"><a class="phc-btn" target="_top" rel="noopener" href="'+esc(D.authorizeUrl)+'">เข้าสู่ระบบด้วยแอป LINE</a><a class="phc-btn phc-btn--secondary" target="_top" rel="noopener" href="'+esc(D.authorizeUrlWeb)+'">เข้าสู่ระบบ LINE แบบเว็บ (อีเมล / QR)</a></div>'
      +'<p class="small" style="margin-top:14px">ระบบจะชวนเพิ่มเพื่อน '+esc(D.oaName)+' ด้วย (จำเป็นสำหรับรับข้อความ) · ถ้ากดแอป LINE แล้ววนกลับมาหน้านี้ ให้ใช้ "แบบเว็บ"</p>';
  } else if(MODE==='CONFIRM'){
    var pt2=D.subjectType==='PATIENT';
    b.innerHTML='<div class="st info">ตรวจสอบก่อนยืนยันการเชื่อม</div>'
      +'<div class="profile">'+(D.picture?'<img alt="" src="'+esc(D.picture)+'">':'')+'<div><b>'+esc(D.lineName)+'</b><div class="small">บัญชี LINE ที่เข้าสู่ระบบ</div></div></div>'
      +'<dl class="kv"><dt>เชื่อมกับ</dt><dd>'+esc(D.name)+'</dd></dl>'
      +(D.replaces?'<div class="st warn">เคยเชื่อมกับ LINE "'+esc(D.replaces)+'" — ยืนยันแล้วจะใช้ LINE นี้แทน</div>':'')
      +'<label class="chk"><input type="checkbox" id="cs" onchange="$(\'ok\').disabled=!this.checked"><span>'+(pt2?'ยินยอมให้คลินิก ศบส.37 ส่งข้อความแจ้งนัดหมาย เตือนก่อนถึงวันนัด และติดตามเมื่อไม่ได้มาตามนัด ไปที่ LINE นี้ และให้ใช้ LINE นี้ยืนยัน/ขอเลื่อนนัดได้':'ยินยอมให้ระบบส่งแจ้งเตือนนัดหมายผู้ป่วย (HN · วันนัด) ไปที่ LINE นี้ เพื่อใช้ในงานติดตามผู้ป่วยเท่านั้น')+'</span></label>'
      +'<div class="acts"><button class="phc-btn" id="ok" disabled onclick="done()">ยืนยันการเชื่อม LINE</button></div><div id="msg"></div>';
  } else if(MODE==='ACT_LOGIN'){
    b.innerHTML='<div class="st info">ยืนยันตัวตนด้วย LINE ก่อนจัดการนัด</div><p>ใช้ LINE ที่ได้รับข้อความจากคลินิก · ในแอป LINE ระบบจะเข้าให้อัตโนมัติ</p>'
      +'<div class="acts"><a class="phc-btn" target="_top" rel="noopener" href="'+esc(D.authorizeUrl)+'">ยืนยันด้วย LINE</a><a class="phc-btn phc-btn--secondary" target="_top" rel="noopener" href="'+esc(D.authorizeUrlWeb)+'">เข้าสู่ระบบ LINE แบบเว็บ</a></div>';
    autoGo(D.authorizeUrl);
  } else if(MODE==='ACT'){
    var a=D.appt||{}, want=D.action||'';
    if(!D.open){ b.innerHTML='<div class="st warn">นัดหมายนี้เปลี่ยนแปลงไปแล้ว</div>'+apptBox(a)+'<p class="small">กรุณาติดต่อคลินิก</p>'; return; }
    b.innerHTML=apptBox(a)
      +(a.confirmed?'':'<div class="acts"><button class="phc-btn" id="bC" onclick="act(\'CONFIRM\')">✅ ยืนยันว่าจะมาตามนัด</button></div>')
      +'<div style="margin-top:18px"><label class="small" for="why">ขอเลื่อน หรือยกเลิกนัด — บอกเหตุผล / วันที่สะดวก</label><textarea class="phc-input" id="why" maxlength="300" placeholder="เช่น ติดงานวันนั้น สะดวกวันพุธหน้า"></textarea></div>'
      +'<div class="acts"><button class="phc-btn phc-btn--secondary" id="bR" onclick="act(\'RESCHEDULE\')">📅 ขอเลื่อนนัด</button><button class="phc-btn phc-btn--secondary" id="bX" onclick="act(\'CANCEL\')">✖ ขอยกเลิกนัด</button></div><div id="msg"></div>'
      +'<p class="small" style="margin-top:14px">คำขอเลื่อน/ยกเลิก เจ้าหน้าที่จะติดต่อกลับเพื่อยืนยันวันนัดใหม่</p>';
    if(want==='RESCHEDULE'||want==='CANCEL'){ setTimeout(function(){ var w=$('why'); if(w) w.focus(); },100); }
  } else if(MODE==='DONE'){
    b.innerHTML='<div class="st ok">✅ '+esc(D.message)+'</div>'+(D.appt?apptBox(D.appt):'')+'<p class="small">ปิดหน้านี้ได้</p>';
  } else {
    b.innerHTML='<div class="st err">'+esc(D.message||'ไม่สามารถดำเนินการได้')+'</div><p class="small">ถ้าเป็นใบเชิญเชื่อม LINE: ขอใบเชิญใหม่จากเจ้าหน้าที่ (ใช้ได้ครั้งเดียว) · ถ้าเป็นปุ่มนัดหมาย: กดจากข้อความล่าสุด หรือติดต่อคลินิก</p>'
      +(D.addFriendUrl?'<div class="acts"><a class="phc-btn phc-btn--secondary" target="_top" rel="noopener" href="'+esc(D.addFriendUrl)+'">เพิ่มเพื่อน '+esc(D.oaName||'LINE OA')+'</a></div>':'');
  }
}
function done(){
  var b=$('ok'); b.disabled=true; b.textContent='กำลังบันทึก…';
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ $('msg').innerHTML='<div class="st err" style="margin-top:14px">'+esc((r&&r.message)||'บันทึกไม่สำเร็จ')+'</div>'; b.disabled=false; b.textContent='ยืนยันการเชื่อม LINE'; return; }
    $('box').innerHTML='<div class="st ok">✅ '+esc(r.message)+'</div><dl class="kv"><dt>เชื่อมกับ</dt><dd>'+esc(r.name)+'</dd><dt>LINE</dt><dd>'+esc(r.lineName)+'</dd></dl>'
      +'<div class="acts">'+(r.pushed?'':'<a class="phc-btn" target="_top" rel="noopener" href="'+esc(r.addFriendUrl)+'">เพิ่มเพื่อน '+esc(D.oaName||'LINE OA')+'</a>')+'</div><p class="small">ปิดหน้านี้ได้</p>';
  }).withFailureHandler(function(e){ $('msg').innerHTML='<div class="st err" style="margin-top:14px">'+esc(e&&e.message?e.message:e)+'</div>'; b.disabled=false; b.textContent='ยืนยันการเชื่อม LINE'; }).arvLineCompleteLink(D.confirmToken);
}
function act(kind){
  var why=$('why')?$('why').value.trim():'';
  if(kind!=='CONFIRM'&&why.length<2){ $('msg').innerHTML='<div class="st warn" style="margin-top:14px">กรุณาบอกเหตุผล หรือวันที่สะดวก</div>'; if($('why')) $('why').focus(); return; }
  ['bC','bR','bX'].forEach(function(id){ var x=$(id); if(x) x.disabled=true; });
  $('msg').innerHTML='<div class="st info" style="margin-top:14px">กำลังบันทึก…</div>';
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ $('msg').innerHTML='<div class="st err" style="margin-top:14px">'+esc((r&&r.message)||'บันทึกไม่สำเร็จ')+'</div>'; ['bC','bR','bX'].forEach(function(id){ var x=$(id); if(x) x.disabled=false; }); return; }
    MODE='DONE'; D={ message:r.message, appt:r.appt }; render();
  }).withFailureHandler(function(e){ $('msg').innerHTML='<div class="st err" style="margin-top:14px">'+esc(e&&e.message?e.message:e)+'</div>'; ['bC','bR','bX'].forEach(function(id){ var x=$(id); if(x) x.disabled=false; }); }).arvLineAct(D.confirmToken, kind, why);
}
arvLoad_();
</script>
