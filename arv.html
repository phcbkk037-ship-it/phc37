  /* สีพื้นและตัวอักษร */

/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';

<script>
const BOOT = {"version":"ARV2-1.0.1","appName":"ระบบติดตามการรักษาและรับยากลุ่มผู้ป่วย ARV","launchToken":"","returnUrl":""};
/* ===== ARV2 หน้าเว็บ (เมนูเดิม 7 หน้า + ตั้งค่า) · ARV2-1.0.0 ===== */
const S = { token:'pwa', user:null, lookups:{}, regimens:[], tests:[], text:{}, line:{}, dash:null, page:'dashboard', back:'patients', file:null, fileTab:'overview',
  plist:null, pf:{q:'',status:'',mine:false}, af:{from:'',to:'',status:'OPEN',type:'',q:''}, lf:{status:''}, mf:{q:''}, setTab:'lookups', settings:null, comms:null, pkLists:null, add:null };
const TH_M = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TITLES = {dashboard:'ภาพรวม',patients:'ทะเบียนผู้ป่วย',labs:'ผลตรวจเลือด',meds:'การรักษาและรับยา',appts:'นัดหมายและติดตาม',referrals:'ส่งต่อ',reports:'รายงาน',settings:'ตั้งค่า',file:'แฟ้มผู้ป่วย'};
const SEX_TH = {MALE:'ชาย',FEMALE:'หญิง'};
const AP_TONE = {SCHEDULED:'info',CONFIRMED:'success',RESCHEDULED:'neutral',COMPLETED:'success',MISSED:'danger',FOLLOW_UP:'warning',CANCELLED:'neutral',CLOSED:'neutral'};

const NL = String.fromCharCode(10);
const $ = id => document.getElementById(id);
const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = v => { const t=String(v == null ? '' : v); let o=''; for(let i=0;i<t.length;i++){ const c=t[i]; o+=ESC_MAP[c]||c; } return o; };
/* text helpers without regex literals (Apps Script page transform safety) */
function isDigit(c){ return c>='0'&&c<='9'; }
function digits(t){ t=String(t==null?'':t); let o=''; for(let i=0;i<t.length;i++) if(isDigit(t[i])) o+=t[i]; return o; }
function allDigits(t,n){ t=String(t==null?'':t); if(n!==undefined&&t.length!==n) return false; if(!t.length) return false; for(let i=0;i<t.length;i++) if(!isDigit(t[i])) return false; return true; }
function isKeyStr(v){ return typeof v==='string'&&v.length===10&&v[4]==='-'&&v[7]==='-'&&allDigits(v.slice(0,4))&&allDigits(v.slice(5,7))&&allDigits(v.slice(8,10)); }

/* ---------- dates ---------- */
function keyOf(v){ if(!v) return ''; if(isKeyStr(v)) return v; const d=new Date(v); if(isNaN(d)) return ''; return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); }
function thDate(v,full){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-').map(Number); return d+' '+(full?TH_M:TH_MS)[m-1]+' '+(y+543); }
function shortDate(v){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-'); return d+'/'+m+'/'+(Number(y)+543); }
function thDateTime(v){ if(!v) return '-'; const d=new Date(v); if(isNaN(d)) return '-'; const t=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); return shortDate(v)+' '+t+' น.'; }
function todayKey(){ return keyOf(new Date()); }
function fyOf(k){ const [y,m]=k.split('-').map(Number); return y+543+(m>=10?1:0); }
function ageAt(birth, at){ if(!birth||!at) return ''; const [by,bm,bd]=birth.split('-').map(Number), [ay,am,ad]=at.split('-').map(Number); let a=ay-by; if(am<bm||(am===bm&&ad<bd)) a--; return a; }

/* ---------- server ---------- */
function callRaw_(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(r=>{
      if(!r){ reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); return; }
      if(!r.ok){ { const mm=String(r.message||''); if(mm.indexOf('Session')>=0||mm.indexOf('เปิดระบบใหม่')>=0) sessionLost(); } reject(new Error(r.message||'เกิดข้อผิดพลาด')); return; }
      resolve(r.data !== undefined ? r.data : r);
    }).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}
/* PHC37Load (UI Kit 1.2.0): เส้นวิ่งด้านบนระหว่างรอเซิร์ฟเวอร์ (ขึ้นเมื่อรอเกิน 0.3 วินาที) */
function call(fn, ...args){
  const L=window.PHC37Load; if(L) L.line.start();
  return callRaw_(fn, ...args).then(v=>{ if(L) L.line.done(); return v; }, e=>{ if(L) L.line.fail(); throw e; });
}
/* โครงเทาแบบรายการ (UI Kit 1.2.0) */
function phcSk(n){ let h='<div class="phc-sk-lines" aria-busy="true"><span class="sr-only" role="status">กำลังโหลด…</span>'; const W=[92,78,85,70,88,64]; for(let k=0;k<(n||4);k++) h+='<span class="phc-sk" style="height:16px;width:'+W[k%W.length]+'%"></span>'; return h+'</div>'; }
function api(fn, ...args){ return call(fn, S.token, ...args); }
function sessionLost(){ try{ sessionStorage.removeItem('arv2.session'); }catch(e){} }

/* ---------- common ---------- */
function toast(msg, err){ const el=document.createElement('div'); el.className='phc-toast'+(err?' err':''); el.textContent=msg; $('toasts').appendChild(el); setTimeout(()=>el.remove(), err?7000:3800); }
function setBusy(btn, on, text){ if(!btn) return;
  if(on){ if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.setAttribute('aria-busy','true');
    const plain=btn.classList.contains('phc-btn--secondary')||btn.classList.contains('phc-btn--ghost')||btn.classList.contains('phc-btn--edit')||btn.classList.contains('phc-btn--danger-soft')||!btn.classList.contains('phc-btn');
    const t=text||'กำลังบันทึก…'; btn.innerHTML=String(t).indexOf('spinner')>=0?t:'<span class="phc-spin'+(plain?'':' phc-spin--light')+'" aria-hidden="true"></span> '+t; }
  else { btn.disabled=false; btn.removeAttribute('aria-busy'); delete btn.dataset.busy; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }
function openModal(title, body, foot, size){ $('modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal ${size||''}" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button class="xbtn" type="button" onclick="closeModal()" aria-label="ปิด">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`; }
function closeModal(){ closeCal(); $('modalRoot').innerHTML=''; }
function confirmBox(title, html, okText, danger){
  return new Promise(res=>{
    const root=document.createElement('div');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body">${html}</div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="0">ยกเลิก</button><button class="phc-btn ${danger?'phc-btn--danger':''}" data-a="1">${esc(okText||'ยืนยัน')}</button></div></div></div>`;
    document.body.appendChild(root);
    root.addEventListener('click',e=>{ const a=e.target.getAttribute&&e.target.getAttribute('data-a'); if(a===null||a===undefined) return; root.remove(); res(a==='1'); });
  });
}
function reasonBox(title, html, label, ph, okText, min){
  min=min||3;
  return new Promise(res=>{
    const root=document.createElement('div');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body"><div style="margin:0 0 10px">${html}</div><label class="phc-label">${esc(label)} <span class="phc-required">*</span></label><textarea class="phc-input" data-r="1" rows="3" placeholder="${esc(ph||'')}"></textarea><div data-err="1" style="color:#B42318;font-size:13px;min-height:18px"></div></div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="0">ยกเลิก</button><button class="phc-btn phc-btn--danger" data-a="1">${esc(okText||'ยืนยัน')}</button></div></div></div>`;
    document.body.appendChild(root);
    const ta=root.querySelector('[data-r]'); setTimeout(()=>ta.focus(),50);
    root.addEventListener('click',e=>{ const a=e.target.getAttribute&&e.target.getAttribute('data-a'); if(a===null||a===undefined) return; if(a==='0'){ root.remove(); res(null); return; } const v=ta.value.trim(); if(v.length<min){ root.querySelector('[data-err]').textContent='กรุณาระบุเหตุผลอย่างน้อย '+min+' ตัวอักษร'; return; } root.remove(); res(v); });
  });
}
function avatarChar(n){ n=String(n||'?').trim(); const pre=['นางสาว','นาย','นาง','ดร.']; for(const p of pre){ if(n.indexOf(p)===0){ n=n.slice(p.length).trim(); break; } } return n.charAt(0)||'?'; }
function chip(text, tone){ return `<span class="chip tone-${esc(tone||'neutral')}">${esc(text)}</span>`; }
function toggleSide(on){ $('sidebar').classList.toggle('open',on); $('backdrop').classList.toggle('show',on); }
function goGateway(){ try{ sessionStorage.removeItem('arv2.session'); }catch(e){} const url=BOOT.returnUrl; const okUrl=['https:','','script.google.com',''].join(String.fromCharCode(47)); if(String(url||'').indexOf(okUrl)===0) window.open(url,'_top'); }
function can(a){ if(!S.user) return false; if(a==='admin') return !!S.user.isAdmin; return a==='edit'?!!S.user.canEdit:!!S.user.canAdd; }
function field(label, inner, cls, req){ return `<div class="phc-field ${cls||''}"><label class="phc-label">${esc(label)}${req?' <span class="phc-required">*</span>':''}</label>${inner}</div>`; }
function opt(v,t,sel){ return `<option value="${esc(v)}" ${sel?'selected':''}>${esc(t)}</option>`; }
function norm(s){ s=String(s||'').toLowerCase(); let o=''; for(let i=0;i<s.length;i++){ const c=s[i]; if(c!==' '&&c!=='\t'&&c!=='\n'&&c!=='\r'&&c!=='\u00a0') o+=c; } return o; }

/* ---------- Thai calendar (B.E.) ---------- */
let CAL=null;
function dateField(id, key, opts){ opts=opts||{}; const typed=!!opts.typed;
  return `<div class="date-field"><input class="phc-input ${typed?'typed':''}" id="${id}" data-key="${esc(key||'')}" data-max="${esc(opts.max||'')}" data-min="${esc(opts.min||'')}" value="${key?esc(shortDate(key)):''}" ${typed?`inputmode="numeric" oninput="typedDate('${id}')" onblur="typedDate('${id}',1)"`:`readonly onclick="openCal('${id}')"`} placeholder="วว/ดด/ปปปป (พ.ศ.)">${typed?`<button type="button" class="cal-btn" onclick="openCal('${id}')" aria-label="เลือกจากปฏิทิน">📅</button>`:''}</div>`; }
function parseThai(t){ t=String(t||'').trim(); const parts=[]; let cur=''; for(let i=0;i<t.length;i++){ if(isDigit(t[i])) cur+=t[i]; else { parts.push(cur); cur=''; } } parts.push(cur); if(parts.length!==3||parts[0].length<1||parts[0].length>2||parts[1].length<1||parts[1].length>2||parts[2].length!==4) return ''; const m=[t,parts[0],parts[1],parts[2]]; let y=Number(m[3]); if(y>2400) y-=543; const mo=Number(m[2]), d=Number(m[1]); const dt=new Date(Date.UTC(y,mo-1,d)); if(dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return ''; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function typedDate(id, final){ const el=$(id); const k=parseThai(el.value); el.dataset.key=k; if(final&&k) el.value=shortDate(k); el.style.borderColor=(el.value&&!k)?'#B42318':''; el.dispatchEvent(new Event('change')); }
function dateVal(id){ const el=$(id); return el?(el.dataset.key||''):''; }
function setDate(id,k){ const el=$(id); if(!el) return; el.dataset.key=k||''; el.value=k?shortDate(k):''; el.style.borderColor=''; el.dispatchEvent(new Event('change')); closeCal(); }
function openCal(id){ closeCal(); const el=$(id); const k=el.dataset.key||el.dataset.max&&el.dataset.max<todayKey()&&el.dataset.max||todayKey(); const [y,m]=k.split('-').map(Number); CAL={id,y,m}; renderCal(); }
function closeCal(){ const c=document.getElementById('calPop'); if(c) c.remove(); CAL=null; }
function calMove(n){ let m=CAL.m+n,y=CAL.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;} CAL.y=y; CAL.m=m; renderCal(); }
function calSet(y,m){ if(y) CAL.y=Number(y); if(m) CAL.m=Number(m); renderCal(); }
function renderCal(){
  let c=document.getElementById('calPop'); if(!c){ c=document.createElement('div'); c.id='calPop'; c.className='cal'; document.body.appendChild(c); }
  const el=$(CAL.id), sel=el.dataset.key, t=todayKey(), mx=el.dataset.max||'', mn=el.dataset.min||'', first=new Date(Date.UTC(CAL.y,CAL.m-1,1)).getUTCDay(), days=new Date(Date.UTC(CAL.y,CAL.m,0)).getUTCDate();
  const ty=Number(t.slice(0,4)), y0=mn?Number(mn.slice(0,4)):ty-100, y1=mx?Number(mx.slice(0,4)):ty+1, ys=[]; for(let y=Math.max(y1,CAL.y);y>=Math.min(y0,CAL.y);y--) ys.push(y);
  let h=`<div class="cal-head"><button type="button" onclick="calMove(-1)">‹</button><div class="mid"><select onchange="calSet(0,this.value)" aria-label="เดือน">${TH_MS.map((x,i)=>`<option value="${i+1}" ${i+1===CAL.m?'selected':''}>${x}</option>`).join('')}</select><select onchange="calSet(this.value,0)" aria-label="ปี พ.ศ.">${ys.map(y=>`<option value="${y}" ${y===CAL.y?'selected':''}>${y+543}</option>`).join('')}</select></div><button type="button" onclick="calMove(1)">›</button></div><div class="cal-grid">`+['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<span>${x}</span>`).join('');
  for(let i=0;i<first;i++) h+='<span></span>';
  for(let d=1;d<=days;d++){ const k=`${CAL.y}-${String(CAL.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, w=(first+d-1)%7, dis=(mx&&k>mx)||(mn&&k<mn); h+=`<button type="button" ${dis?'disabled':''} class="${k===sel?'sel':''} ${k===t?'today':''} ${w===0||w===6?'we':''}" onclick="setDate('${CAL.id}','${k}')">${d}</button>`; }
  h+=`</div><div class="cal-foot"><button type="button" class="phc-btn phc-btn--ghost phc-btn--sm" ${(mx&&t>mx)||(mn&&t<mn)?'disabled':''} onclick="setDate('${CAL.id}','${t}')">วันนี้</button><button type="button" class="phc-btn phc-btn--secondary phc-btn--sm" onclick="closeCal()">ปิด</button></div>`;
  c.innerHTML=h;
  const r=el.getBoundingClientRect(); let top=r.bottom+4, left=r.left; if(top+350>innerHeight) top=Math.max(8,r.top-354); if(left+300>innerWidth) left=Math.max(8,innerWidth-308); c.style.top=top+'px'; c.style.left=left+'px';
}

/* ---------- ARV helpers ---------- */
function segHtml(id, opts, cur, cls, fn){ return `<div class="seg ${cls||''}" id="${id}">${opts.map(o=>`<button type="button" data-v="${esc(o[0])}" class="${String(o[0])===String(cur==null?'':cur)?'on':''}" onclick="segPick(this)${fn?';'+fn:''}">${esc(o[1])}</button>`).join('')}</div>`; }

function checks(name){ return Array.from(document.querySelectorAll('input[data-chk="'+name+'"]:checked')).map(x=>x.value); }

function pairOpts(pairs, cur, blank){ return (blank?opt('',blank,!cur):'')+pairs.map(p=>opt(p[0],p[1],String(cur||'')===p[0])).join(''); }
function pairLabel(pairs, k){ const p=(pairs||[]).filter(x=>x[0]===k)[0]; return p?p[1]:(k||''); }
function lookupOpts(type, cur, blank){ const L=S.lookups[type]||[]; const has=!cur||L.some(x=>x.code===cur); return opt('',blank||'เลือก',!cur)+L.map(x=>opt(x.code,x.label,x.code===cur)).join('')+(has?'':opt(cur,cur+' (ค่าเดิม)',true)); }
function regimenOpts(cur, blank){ const L=S.regimens||[]; const has=!cur||L.some(x=>x.code===cur); return opt('',blank||'เลือกสูตรยา',!cur)+L.map(x=>opt(x.code,x.label,x.code===cur)).join('')+(has?'':opt(cur,cur+' (ค่าเดิม)',true)); }
function hm(v){ if(!v) return ''; const d=new Date(v); if(isNaN(d)) return ''; return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); }
function dtTh(v){ if(!v) return '-'; return shortDate(v)+' '+hm(v)+' น.'; }

function apChip(a){ return chip(a.StatusLabel, AP_TONE[a.AppointmentStatus]||'neutral'); }
function confChip(a){ if(['SCHEDULED','CONFIRMED'].indexOf(a.AppointmentStatus)<0) return ''; const t=a.ConfirmationStatus; return chip(a.ConfirmationLabel, t==='CONFIRMED'?'success':(t==='DECLINED'?'danger':(t==='NOT_REQUIRED'?'neutral':'warning'))); }
function reqChip(a){ return a.RescheduleRequested?chip('ผู้ป่วยขอเลื่อน/ยกเลิก','warning'):''; }
function labChip(v){ return chip(v.LabStatusLabel||v.LabStatus, LAB_TONE[v.LabStatus]||'neutral'); }
function lineChip(l){ return l&&l.linked?chip('LINE ✓','success'):(l&&l.pending?chip('รอเชื่อม LINE','warning'):chip('ยังไม่เชื่อม LINE','neutral')); }
function canAdd(){ return !!(S.user&&S.user.canAdd); }
function canEdit(){ return !!(S.user&&S.user.canEdit); }
function isAdmin(){ return !!(S.user&&S.user.isAdmin); }
function addDaysKey(k,n){ const [y,m,d]=k.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d+n)); return dt.toISOString().slice(0,10); }
function errHtml(m){ return `<div class="sec-err">${esc(m)}</div>`; }
async function ensurePatients(force){ if(!S.plist||force){ S.plist=await api('apiPatients',{}); } return S.plist; }
function patientOpts(cur){ return opt('','เลือกผู้ป่วย',!cur)+(S.plist||[]).map(p=>opt(p.ARVPatientID,p.FullName+' · HN '+(p.HN||'-'),p.ARVPatientID===cur)).join(''); }
function emptyRow(n, t){ return `<tr><td colspan="${n}" class="empty">${esc(t||'ไม่มีรายการ')}</td></tr>`; }

/* ---------- boot ---------- */
function phcRetryBoot(){ $('errGate').classList.add('hidden'); $('gate').classList.remove('hidden'); boot(); }
async function boot(){
  try{
    const r=await call('apiBootstrap',S.token);
    S.user=r.user; S.lookups=r.lookups; S.regimens=r.regimens; S.tests=r.tests; S.text=r.text; S.line=r.line||{}; S.dash=r.dashboard;
    $('uName').textContent=S.user.fullName;
    $('uMeta').textContent=[S.user.roleName, S.user.canEdit?'แก้ไขได้':(S.user.canAdd?'บันทึกได้':'ดูอย่างเดียว'), S.user.isAdmin?'เห็นผู้ป่วยทุกราย':'เห็นผู้ป่วยที่รับผิดชอบ'].filter(Boolean).join(' · ');
    $('avatar').textContent=avatarChar(S.user.fullName);
    document.querySelectorAll('.role-set').forEach(b=>b.classList.toggle('hidden',!isAdmin()));
    document.querySelectorAll('#nav button[data-page]').forEach(b=>b.addEventListener('click',()=>{ toggleSide(false); go(b.dataset.page); }));
    drawLineSide(); updateBadge();
    window.__icBooted=true; $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
    let last='dashboard', fid=''; try{ last=sessionStorage.getItem('arv2.page')||'dashboard'; fid=sessionStorage.getItem('arv2.file')||''; }catch(e){}
    if(last==='file'&&fid) openFile(fid,'patients'); else go(TITLES[last]&&last!=='file'&&(last!=='settings'||isAdmin())?last:'dashboard');
    if(canAdd()) setTimeout(()=>{ ensureKit().catch(()=>{}); },2000);
  }catch(e){ $('gate').classList.add('hidden'); $('errText').textContent=e.message; $('errGate').classList.remove('hidden'); }
}
function updateBadge(){ const d=S.dash||{}; const n=(d.requests||[]).length+(d.missed||[]).length; const el=$('cntDash'); el.textContent=n||''; el.classList.toggle('hidden',!n); }
function setNav(page){ document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===(page==='file'?S.back:page))); $('pageTitle').textContent=TITLES[page]; }
function go(page){
  S.page=page; try{ sessionStorage.setItem('arv2.page',page); }catch(e){}
  setNav(page); closeModal(); window.scrollTo(0,0);
  ({dashboard:renderDash,patients:renderPatients,labs:renderLabs,meds:renderMeds,appts:renderAppts,referrals:renderSoon,reports:renderSoon,settings:renderSettings}[page])();
}
function loading(){ let rows=''; for(let k=0;k<6;k++) rows+='<span class="phc-sk" style="height:16px;width:'+[92,78,85,70,88,64][k]+'%"></span>';
  $('content').innerHTML='<div aria-busy="true" style="display:flex;flex-direction:column;gap:16px"><span class="sr-only" role="status">กำลังโหลด…</span><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">'+[1,2,3,4].map(()=>'<div class="phc-sk-card" style="min-height:92px"><span class="phc-sk" style="width:60%"></span><span class="phc-sk" style="height:26px;width:35%"></span></div>').join('')+'</div><div class="card" style="display:flex;flex-direction:column;gap:14px">'+rows+'</div></div>'; }
function errBox(e){ $('content').innerHTML=`<div class="card empty"><p>${esc(e.message||e)}</p><button class="phc-btn phc-btn--secondary" onclick="go(S.page==='file'?S.back:S.page)">ลองใหม่</button></div>`; }
function refreshAfterSave(){ S.plist=null; S.dash=null; if(S.page==='file'&&S.file) openFile(S.file.patient.ARVPatientID,S.back,true); else go(S.page); }
function renderSoon(){ $('content').innerHTML=`<div class="card empty"><div style="font-size:40px">🕒</div><h3>${esc(TITLES[S.page])}</h3><p class="muted">ยังไม่เปิดใช้งาน — ระบบเดิมยังไม่ได้ใช้หน้านี้ จะเพิ่มภายหลังตามที่ตกลง</p><button class="phc-btn phc-btn--secondary" onclick="go('dashboard')">กลับหน้าภาพรวม</button></div>`; }

/* ---------- ภาพรวม ---------- */
async function renderDash(){
  if(S.dash) drawDash(); else loading();
  try{ S.dash=await api('apiDashboard'); updateBadge(); if(S.page==='dashboard') drawDash(); }catch(e){ if(!S.dash){ errBox(e); return; } toast(e.message,true); }
}
function apRow(a){ return `<tr class="click" onclick="openFile('${esc(a.ARVPatientID)}','dashboard')"><td><b>${apDT(a)}</b><small>${esc(a.AppointmentTypeLabel)}</small></td><td><b>${esc(a.FullName)}</b><small>HN ${esc(a.HN||'-')}</small></td><td>${apChip(a)} ${confChip(a)} ${reqChip(a)}${a.missedDays?'<small>ขาดนัด '+esc(a.missedDays)+' วัน</small>':''}</td></tr>`; }
function apTable(list, empty){ return `<div class="table-wrap"><table class="t"><thead><tr><th>วันนัด</th><th>ผู้ป่วย</th><th>สถานะ</th></tr></thead><tbody>${list.length?list.map(apRow).join(''):emptyRow(3,empty)}</tbody></table></div>`; }
function drawDash(){
  const d=S.dash;
  const st=(t,n,i,link,tone)=>`<div class="stat ${link?'link':''} ${tone||''}" ${link?`onclick="${link}"`:''}><span>${esc(t)}</span><b>${esc(n)}</b><i>${esc(i||'')}</i></div>`;
  $('content').innerHTML=`<div class="page-head"><div><h2>ภาพรวมผู้ป่วย</h2><p>${esc(S.user.isAdmin?'ผู้ป่วยทุกราย':'ผู้ป่วยที่คุณรับผิดชอบ')} · ${esc(thDate(todayKey(),true))}</p></div><div class="actions">${canEdit()?'<button class="phc-btn phc-btn--secondary" id="detBtn" onclick="detectMissed()">🔎 ตรวจขาดนัด</button>':''}${canAdd()?'<button class="phc-btn" onclick="apptForm()">➕ สร้างนัด</button>':''}</div></div>
  ${lineBanner()}
  <div class="grid g4">${st('ผู้ป่วยในทะเบียน',d.patients,'เชื่อม LINE '+d.linked+' ราย',"go('patients')")}${st('นัดวันนี้',d.today.length,'ยังไม่ปิดรายการ',"S.af={from:todayKey(),to:todayKey(),status:'OPEN',type:'',q:''};go('appts')")}${st('นัด 7 วันข้างหน้า',d.week.length,'รอยืนยัน '+d.pending.length+' นัด',"S.af={from:todayKey(),to:addDaysKey(todayKey(),7),status:'OPEN',type:'',q:''};go('appts')")}${st('ขาดนัด / ต้องติดตาม',d.missed.length+d.overdue.length,d.overdue.length?'เลยวันยังไม่ตรวจ '+d.overdue.length:'',"S.af={from:'',to:'',status:'MISSED',type:'',q:''};go('appts')",(d.missed.length+d.overdue.length)?'bad':'good')}
  ${st('ผู้ป่วยขอเลื่อน/ยกเลิก',d.requests.length,'ผ่าน LINE',"S.af={from:'',to:'',status:'REQUEST',type:'',q:''};go('appts')",d.requests.length?'bad':'')}${st('Lab ต้องติดตาม',d.labsFollow.length,'ค่าผิดปกติ',"S.lf={status:'FOLLOW_UP'};go('labs')",d.labsFollow.length?'bad':'good')}${st('Lab รอผล',d.labsWaiting.length,'รอผล / ได้ผลบางส่วน',"S.lf={status:''};go('labs')")}${st('LINE ของฉัน',S.line.linked?'เชื่อมแล้ว':'ยังไม่เชื่อม',S.line.lineName||'',"lineModal()",S.line.linked?'good':'')}</div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>📅 นัดวันนี้</h3>${apTable(d.today,'ไม่มีนัดวันนี้')}</div>
    <div class="card"><h3>📨 คำขอจากผู้ป่วย (LINE)</h3>${apTable(d.requests,'ไม่มีคำขอ')}</div>
    <div class="card"><h3>⚠️ ขาดนัด / เลยวันยังไม่ปิด</h3>${apTable(d.missed.concat(d.overdue),'ไม่มีรายการ')}</div>
    <div class="card"><h3>🧪 Lab ต้องติดตาม</h3><div class="table-wrap"><table class="t"><thead><tr><th>วันที่เจาะ</th><th>ผู้ป่วย</th><th>สถานะ</th></tr></thead><tbody>${d.labsFollow.length?d.labsFollow.map(v=>`<tr class="click" onclick="labDetail('${esc(v.LabVisitID)}')"><td>${esc(shortDate(v.CollectionDate))}</td><td><b>${esc(v.FullName)}</b><small>HN ${esc(v.HN||'-')}</small></td><td>${labChip(v)}<small>ผิดปกติ ${esc(v.flaggedCount)} รายการ</small></td></tr>`).join(''):emptyRow(3,'ไม่มีรายการ')}</tbody></table></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>🕒 เหตุการณ์ล่าสุด (14 วัน)</h3>${d.recent.length?`<ul class="tl">${d.recent.map(x=>`<li><span class="d">${esc(dtTh(x.at))}</span><b>${esc(x.label)}</b> · <a href="#" onclick="openFile('${esc(x.ARVPatientID)}','dashboard');return false">${esc(x.FullName)}</a> <span class="by">${esc(x.by)}</span></li>`).join('')}</ul>`:'<p class="muted">ยังไม่มี</p>'}</div>`;
}
async function detectMissed(){ const b=$('detBtn'); setBusy(b,true,'กำลังตรวจ…'); try{ const r=await api('apiDetectMissed'); toast(r.updated?'เปลี่ยนเป็นขาดนัด '+r.updated+' นัด':'ไม่พบนัดที่ต้องเปลี่ยนเป็นขาดนัด'); S.dash=null; renderDash(); }catch(e){ toast(e.message,true); setBusy(b,false); } }

/* ---------- ทะเบียนผู้ป่วย ---------- */
async function renderPatients(){
  if(S.plist) drawPatients(); else loading();
  try{ S.plist=await api('apiPatients',{}); if(S.page==='patients') drawPatients(); }catch(e){ if(!S.plist){ errBox(e); return; } toast(e.message,true); }
}
function drawPatients(){
  const f=S.pf, q=norm(f.q);
  const rows=(S.plist||[]).filter(p=>(!f.status||p.PatientStatus===f.status)&&(!f.mine||String(p.AssignedToUserID).toLowerCase()===S.user.username.toLowerCase())&&(!q||norm(p.FullName+' '+p.HN+' '+p.NAPNo).indexOf(q)>=0));
  $('content').innerHTML=`<div class="page-head"><div><h2>ทะเบียนผู้ป่วย</h2><p>${esc(rows.length)} ราย${S.user.isAdmin?'':' (เฉพาะผู้ป่วยที่คุณรับผิดชอบ)'}</p></div><div class="actions">${canAdd()?'<button class="phc-btn" onclick="regSearch()">➕ เปิดทะเบียนผู้ป่วย</button>':''}</div></div>
  <div class="toolbar"><input class="phc-input grow" id="pfq" placeholder="ค้นหา ชื่อ / HN / NAP No." value="${esc(f.q)}" oninput="S.pf.q=this.value;drawPatientsTable()"><select class="phc-select" onchange="S.pf.status=this.value;drawPatients()">${lookupOpts('PATIENT_STATUS',f.status,'ทุกสถานะ')}</select>${S.user.isAdmin?`<label class="chk-item"><input type="checkbox" class="chk" ${f.mine?'checked':''} onchange="S.pf.mine=this.checked;drawPatients()"> เฉพาะที่ฉันรับผิดชอบ</label>`:''}</div>
  <div class="card" id="ptTable"></div>`;
  drawPatientsTable(rows);
}
function drawPatientsTable(rows){
  if(!rows){ const f=S.pf, q=norm(f.q); rows=(S.plist||[]).filter(p=>(!f.status||p.PatientStatus===f.status)&&(!f.mine||String(p.AssignedToUserID).toLowerCase()===S.user.username.toLowerCase())&&(!q||norm(p.FullName+' '+p.HN+' '+p.NAPNo).indexOf(q)>=0)); }
  $('ptTable').innerHTML=`<div class="table-wrap"><table class="t"><thead><tr><th>ผู้ป่วย</th><th>สถานะ</th><th>ผู้รับผิดชอบ</th><th>นัดถัดไป</th><th>Lab ล่าสุด</th><th>รับยาล่าสุด</th><th>LINE</th></tr></thead><tbody>${rows.length?rows.map(p=>`<tr class="click" onclick="openFile('${esc(p.ARVPatientID)}','patients')">
    <td><b>${esc(p.FullName)}</b><small>HN ${esc(p.HN||'-')} · NAP ${esc(p.NAPMasked||'-')} · ${esc([p.Age!==''?p.Age+' ปี':'',p.SexTh].filter(Boolean).join(' '))}</small></td>
    <td>${chip(p.PatientStatusLabel||'-','info')}${p.missedOpen?' '+chip('ขาดนัด '+p.missedOpen,'danger'):''}</td><td>${esc(p.AssignedToName||'-')}</td>
    <td>${p.nextAppt?`<b>${apDT(p.nextAppt)}</b><small>${esc(p.nextAppt.AppointmentTypeLabel)} · ${esc(p.nextAppt.ConfirmationLabel)}</small>`:'<span class="muted">-</span>'}</td>
    <td>${p.lastLab?esc(shortDate(p.lastLab.date))+'<small>'+esc(p.lastLab.statusLabel)+'</small>':'<span class="muted">-</span>'}</td>
    <td>${p.lastMed?esc(shortDate(p.lastMed.date))+'<small>'+esc(p.lastMed.regimen)+'</small>':'<span class="muted">-</span>'}</td><td>${lineChip(p.line)}</td></tr>`).join(''):emptyRow(7,'ไม่พบผู้ป่วย')}</tbody></table></div>`;
}

/* ---------- เปิดทะเบียน: ค้นเวชระเบียนกลาง → ข้อมูลบุคคล + ข้อมูล ARV ---------- */
async function ensureComms(){ if(S.comms) return; try{ S.comms=await api('apiCommunities'); }catch(e){ S.comms=[]; } }
async function ensureKit(){ await ensureComms(); if(!S.pkLists){ try{ S.pkLists=await api('apiPatientKitLists'); }catch(e){ S.pkLists=null; } } PK.setLists(S.pkLists); }
function kitComm(v){ return { list:(S.comms||[]).map(c=>({CommunityName:c.CommunityName, SubDistrict:c.SubDistrict})), value:v }; }
function regSearch(){
  S.add={ pick:null, isNew:false, rows:[] };
  openModal('เปิดทะเบียนผู้ป่วย ARV', `<p class="muted small" style="margin:0 0 8px">ขั้นที่ 1 ค้นหาผู้ป่วยในเวชระเบียนกลาง (HN / เลขบัตรประชาชน / ชื่อ)</p>
    <div class="toolbar"><input class="phc-input grow" id="psKey" placeholder="พิมพ์ HN / เลขบัตร / ชื่อ แล้วกด Enter" onkeydown="if(event.key==='Enter')regFind()"><button class="phc-btn" id="psBtn" onclick="regFind()">🔍 ค้นหา</button></div><div id="psRes"></div>`, '', 'lg');
  setTimeout(()=>{ const k=$('psKey'); if(k) k.focus(); },50);
}
async function regFind(){
  const k=val('psKey'), b=$('psBtn'); if(k.length<2){ toast('กรุณาพิมพ์อย่างน้อย 2 ตัวอักษร',true); return; }
  setBusy(b,true,'กำลังค้น…'); $('psRes').innerHTML=phcSk(3);
  try{
    const rows=await api('apiSearchCentral',k); S.add.rows=rows;
    $('psRes').innerHTML=`${rows.length?`<div class="stack" style="gap:6px">${rows.map((r,i)=>{ const p=r.patient, g=r.registered;
      return `<div class="pick" onclick="regPick(${i})"><div><b>${esc(p.FullName)}</b><span>HN ${esc(p.HN||'-')} · ${esc(p.CIDMasked||'ไม่มีเลขบัตร')} · ${esc([r.age!==''?r.age+' ปี':'',SEX_TH[p.Sex]||''].filter(Boolean).join(' '))}</span></div>${g?chip(g.visible?'มีทะเบียน ARV แล้ว — เปิดแฟ้ม':'มีทะเบียนแล้ว (ผู้รับผิดชอบอื่น)',g.visible?'info':'warning'):''}</div>`; }).join('')}</div>`:'<p class="muted">ไม่พบในเวชระเบียนกลาง</p>'}
      <div style="margin-top:10px"><button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="regPerson(null,true)">➕ ไม่พบ — เพิ่มผู้ป่วยใหม่ (เพิ่มเข้าเวชระเบียนกลางด้วย)</button></div>`;
  }catch(e){ $('psRes').innerHTML=errHtml(e.message); } finally{ setBusy(b,false); }
}
function regPick(i){ const r=S.add.rows[i]; if(r.registered){ if(r.registered.visible){ closeModal(); openFile(r.registered.ARVPatientID,'patients'); } else toast('ผู้ป่วยรายนี้มีทะเบียน ARV แล้ว โดยมีผู้รับผิดชอบอื่น — ติดต่อผู้ดูแลระบบ',true); return; } S.add.pick=r.patient; regPerson(r.patient,false); }
function personHtml(x,isNew){ return `<div class="sub">ข้อมูลผู้ป่วย ${isNew?'<span class="chip tone-warning">ผู้ป่วยใหม่ — เพิ่มเข้าเวชระเบียนกลาง</span>':'<span class="chip tone-info">จากเวชระเบียนกลาง HN '+esc(x.HN||'-')+' · แก้แล้วส่งกลับเวชระเบียนกลาง</span>'}</div>${PK.formHtml('pk',x,{mode:isNew?'new':'edit',community:kitComm(x.CommunityName||'')})}`; }
async function personnelOpts(cur){ if(!S.personnel){ try{ S.personnel=await api('apiPersonnel'); }catch(e){ S.personnel=[]; } } const has=!cur||S.personnel.some(p=>p.username===cur); return opt('','— ผู้บันทึกเป็นผู้รับผิดชอบ —',!cur)+S.personnel.map(p=>opt(p.username,p.fullName+(p.position?' · '+p.position:''),p.username===cur)).join('')+(has?'':opt(cur,cur,true)); }
async function regFields(p){ p=p||{};
  const prior=['PREVIOUS','เคยรับยา'].indexOf(p.PriorARVStatus)>=0, other=['OTHER','อื่นๆ','อื่น ๆ'].indexOf(p.RiskFactorCode)>=0;

    ${field('สถานะผู้ป่วย',`<select class="phc-select" id="rStatus">${lookupOpts('PATIENT_STATUS',p.PatientStatus,'เลือกสถานะ')}</select>`,'',true)}
    ${field('ประวัติการรับยา',`<select class="phc-select" id="rPrior" onchange="regPriorToggle()">${lookupOpts('PRIOR_ARV_STATUS',p.PriorARVStatus,'เลือกประวัติ')}</select>`,'',true)}
    ${field('คู่',`<select class="phc-select" id="rPartner">${lookupOpts('PARTNER_STATUS',p.HasPartner,'เลือก')}</select>`,'',true)}
    <div class="phc-field ${prior?'':'hidden'}" id="rPriorDateBox"><label class="phc-label">วันที่รับยาครั้งล่าสุด <span class="phc-required">*</span></label>${dateField('rLastDate',p.LastARVDateBeforeEnrollment||'',{max:todayKey(),typed:true})}</div>
    <div class="phc-field ${prior?'':'hidden'}" id="rPriorRegBox"><label class="phc-label">สูตรยาครั้งล่าสุด <span class="phc-required">*</span></label><select class="phc-select" id="rLastReg">${regimenOpts(p.LastRegimenBeforeEnrollment)}</select></div>
    ${field('ปัจจัยเสี่ยง',`<select class="phc-select" id="rRisk" onchange="regRiskToggle()">${lookupOpts('RISK_FACTOR',p.RiskFactorCode,'เลือกปัจจัยเสี่ยง')}</select>`,'',true)}
    <div class="phc-field ${other?'':'hidden'}" id="rRiskOtherBox"><label class="phc-label">อื่น ๆ ระบุ <span class="phc-required">*</span></label><input class="phc-input" id="rRiskOther" value="${esc(p.RiskFactorOther||'')}"></div>
    ${isAdmin()?field('ผู้รับผิดชอบ',`<select class="phc-select" id="rAssign">${await personnelOpts(p.AssignedToUserID||'')}</select>`,'full'):field('ผู้รับผิดชอบ',`<div class="phc-input" aria-readonly="true">${esc(p.AssignedToName||S.user.fullName)}</div>`,'full')}
    ${field('หมายเหตุ',`<textarea class="phc-input" id="rNotes" rows="2">${esc(p.Notes||'')}</textarea>`,'full')}</div>`;

function drawLineSide(){ const L=S.line||{}, b=$('lineSide'); if(!b) return; b.classList.toggle('hidden',!L.linkReady); b.classList.toggle('on',!!L.linked); $('lineSideText').textContent=L.linked?'LINE: '+(L.lineName||'เชื่อมแล้ว'):'เชื่อม LINE รับแจ้งเตือน'; }
function lineBanner(){ const L=S.line||{}; if(!L.linkReady||L.linked) return ''; return `<div class="line-banner"><span style="font-size:22px">💬</span><div class="grow"><b>เชื่อม LINE เพื่อรับแจ้งเตือน</b><div class="small muted">แจ้งเมื่อผู้ป่วยที่คุณรับผิดชอบมีนัด · ใกล้ถึงนัด · ขาดนัด · ขอเลื่อน/ยกเลิก ทาง LINE ${esc(L.oaName||'')}</div></div><button class="phc-btn phc-btn--sm" onclick="lineModal()">เชื่อม LINE</button></div>`; }
function loadQrLib(){ if(window.qrcode) return Promise.resolve(true); return new Promise(res=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; s.onload=()=>res(!!window.qrcode); s.onerror=()=>res(false); document.head.appendChild(s); }); }
async function drawQr(id, url){ const el=$(id); if(!el) return; const ok=await loadQrLib(); if(!ok||!window.qrcode){ el.innerHTML='<span class="small muted">แสดง QR ไม่ได้ ใช้ลิงก์แทน</span>'; return; } const q=window.qrcode(0,'M'); q.addData(url); q.make(); el.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true}); }

function rgForm(id){ const x=id?S.settings.regimens.filter(r=>r.id===id)[0]:null;
  openModal((x?'แก้ไข':'เพิ่ม')+'สูตรยา',`<div class="form-grid">${field('รหัสสูตรยา',`<input class="phc-input" id="sCode" value="${esc(x?x.code:'')}">`,'',true)}${field('ชื่อสูตรยา',`<input class="phc-input" id="sLabel" value="${esc(x?x.label:'')}">`,'',true)}${field('ชื่อภาษาอังกฤษ',`<input class="phc-input" id="sEn" value="${esc(x?x.nameEN:'')}">`,'')}${field('ลำดับ',`<input class="phc-input" id="sOrder" inputmode="numeric" value="${esc(x?x.order:'')}">`,'')}${field('รายละเอียด',`<input class="phc-input" id="sDesc" value="${esc(x?x.description:'')}">`,'full')}${field('สถานะ',activeSeg(x?x.active:true),'')}</div><div id="sErr"></div>`,
    `<button class="phc-btn phc-btn--secondary" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" id="sBtn" onclick="setSave('apiSaveRegimen',{id:'${esc(id||'')}',rowVersion:${x?x.rowVersion:0},code:val('sCode'),label:val('sLabel'),nameEN:val('sEn'),order:val('sOrder'),description:val('sDesc'),active:val('sActive')==='1'})">💾 บันทึก</button>`,''); }
function ltForm(id){ const x=id?S.settings.tests.filter(r=>r.id===id)[0]:null, n=v=>v==null?'':v;
  openModal((x?'แก้ไข':'เพิ่ม')+'รายการตรวจ Lab',`<div class="form-grid">${field('รหัส (A-Z 0-9 _)',`<input class="phc-input" id="sCode" value="${esc(x?x.code:'')}">`,'',true)}${field('ชื่อรายการตรวจ',`<input class="phc-input" id="sLabel" value="${esc(x?x.nameTH:'')}">`,'',true)}
    ${field('ชนิดผล',`<select class="phc-select" id="sType">${pairOpts(S.settings.resultTypes,x?x.resultType:'numeric')}</select>`,'',true)}${field('กติกาแปลผล',`<select class="phc-select" id="sRule">${pairOpts(S.settings.rules,x?x.rule:'')}</select>`,'')}
    ${field('หน่วย',`<input class="phc-input" id="sUnit" value="${esc(x?x.unit:'')}">`,'')}${field('ลำดับ',`<input class="phc-input" id="sOrder" inputmode="numeric" value="${esc(x?x.order:'')}">`,'')}
    ${field('ค่าต่ำสุด (ชาย)',`<input class="phc-input" id="sMinM" inputmode="decimal" value="${esc(x?n(x.minMale):'')}">`,'')}${field('ค่าสูงสุด (ชาย)',`<input class="phc-input" id="sMaxM" inputmode="decimal" value="${esc(x?n(x.maxMale):'')}">`,'')}
    ${field('ค่าต่ำสุด (หญิง)',`<input class="phc-input" id="sMinF" inputmode="decimal" value="${esc(x?n(x.minFemale):'')}">`,'')}${field('ค่าสูงสุด (หญิง)',`<input class="phc-input" id="sMaxF" inputmode="decimal" value="${esc(x?n(x.maxFemale):'')}">`,'')}
    ${field('ข้อความช่วงอ้างอิง',`<input class="phc-input" id="sRef" value="${esc(x?x.referenceText:'')}">`,'full')}${field('สถานะ',activeSeg(x?x.active:true),'')}</div><div id="sErr"></div>`,
    `<button class="phc-btn phc-btn--secondary" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" id="sBtn" onclick="setSave('apiSaveLabTest',{id:'${esc(id||'')}',rowVersion:${x?x.rowVersion:0},code:val('sCode'),nameTH:val('sLabel'),resultType:val('sType'),rule:val('sRule'),unit:val('sUnit'),order:val('sOrder'),minMale:val('sMinM'),maxMale:val('sMaxM'),minFemale:val('sMinF'),maxFemale:val('sMaxF'),referenceText:val('sRef'),active:val('sActive')==='1'})">💾 บันทึก</button>`,'lg'); }
async function setSave(fn, p){ const b=$('sBtn'); setBusy(b,true);
  try{ S.settings=await api(fn,p); toast('บันทึกแล้ว'); closeModal(); drawSettings(); try{ const r=await api('apiReference'); S.lookups=r.lookups; S.regimens=r.regimens; S.tests=r.tests; }catch(e){} }
  catch(e){ setBusy(b,false); $('sErr').innerHTML=errHtml(e.message); } }
async function staffInvite(u){ try{ const r=await api('apiLineInvite','STAFF',u);
  openModal('ใบเชิญเชื่อม LINE เจ้าหน้าที่',`<p style="margin-top:0">สำหรับ <b>${esc(r.name)}</b> · ใช้ได้ครั้งเดียว หมดอายุ ${esc(dtTh(r.expiresAt))}</p><div class="line-step"><div><h4><span class="line-num">1</span>เพิ่มเพื่อน ${esc(r.oaName)}</h4></div><div class="qr" id="qrOa"></div></div><div class="line-step"><div><h4><span class="line-num">2</span>สแกนเพื่อเชื่อม LINE</h4></div><div class="qr" id="qrLink"></div></div>`,`<button class="phc-btn" onclick="closeModal();drawSettings()">ปิด</button>`,'');
  drawQr('qrOa',r.addFriendUrl); drawQr('qrLink',r.url); }catch(e){ toast(e.message,true); } }
async function regRestore(id){ if(!await confirmBox('กู้คืนทะเบียนผู้ป่วย','ผู้ป่วยจะกลับมาในทุกหน้า · นัดที่ยกเลิกไปแล้วไม่กลับมา · LINE ต้องเชื่อมใหม่','กู้คืน')) return;
  try{ await api('apiRestoreRegistry',{ ARVPatientID:id }); toast('กู้คืนแล้ว'); S.plist=null; S.dash=null; drawSettings(); }catch(e){ toast(e.message,true); } }
async function staffUnlink(u){ if(!await confirmBox('ยกเลิกการเชื่อม LINE',esc(u)+' จะไม่ได้รับแจ้งเตือนทาง LINE','ยกเลิกการเชื่อม',true)) return; try{ await api('apiLineUnlink','STAFF',u); toast('ยกเลิกแล้ว'); drawSettings(); }catch(e){ toast(e.message,true); } }

boot();
</script>
