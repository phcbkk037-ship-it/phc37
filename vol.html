<script>
/* PHC37 PWA 2.6.0 — หน้า อสส. กรอกแบบสำรวจลูกน้ำยุงลายเอง (LVS1-2.1.1) บนระบบใหม่ · ไม่ต้องเข้าสู่ระบบ
 * google.script.run.<ฟังก์ชันเดิม>(...) → Edge lvs.pub (ตรรกะเดิมทุกบรรทัด: กันส่งซ้ำ ClientKey/EditKey · 20 แผ่นต่อเครื่องต่อวัน · รอรับรองไม่เกิน 500) */
(function () {
  var CFG = window.PHC37_CONFIG || {};
  function send(fn, args) {
    if (!CFG.API_URL) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ config.js'));
    var ctrl = ('AbortController' in window) ? new AbortController() : null, timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);
    return fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'lvs.pub', data: { fn: fn, args: args } }),
      signal: ctrl ? ctrl.signal : undefined }).then(function (r) { clearTimeout(timer); return r.json(); });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (t, k) {
      if (k === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (k === 'withFailureHandler') return function (f) { return runner(ok, f); };
      if (k === 'withUserObject') return function () { return runner(ok, fail); };
      return function () {
        var args = [].slice.call(arguments);
        send(String(k), args).then(function (r) {
          if (r && r.ok === false && r.code === 'not_live') r = { ok: false, off: true, message: 'ระบบใหม่ยังไม่เปิดรับแบบสำรวจ กรุณาใช้ลิงก์เดิมไปก่อน' };
          if (ok) ok(r);
        }, function (e) { if (fail) fail(e); });
      };
    } });
  }
  window.google = { script: { run: runner(null, null), host: { close: function () {} } } };
})();
</script>

/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';

}
function bump(kind, i, n) { var tg = target(kind), cur = kind.charAt(1) === 't' ? tg.t[i] : tg.f[i]; setCount(kind, i, (cur || 0) + n); var el = $(kind + i); if (el) el.value = kind.charAt(1) === 't' ? tg.t[i] : tg.f[i]; }
function typed(kind, i, el) { var s = String(el.value || ''), o = ''; for (var k = 0; k < s.length; k++) if (s[k] >= '0' && s[k] <= '9') o += s[k]; setCount(kind, i, o === '' ? 0 : Number(o)); }
function checkHouse() {
  var d = V.draft, r = d.rows[d.cur];
  if (!rowUsed(r)) return true;
  var m = houseErr(); if (m) { var el = $('hNo'); if (el) { el.focus(); } vibrate(40); return false; }
  return true;
}
function goHouse(i) { if (!checkHouse()) return; dropBlankExcept(i); housesScreen(); }
function dropBlankExcept(i) {
  var d = V.draft, keep = d.rows[i], cur = d.rows[d.cur];
  if (cur !== keep && !rowUsed(cur) && d.rows.length > 1) d.rows.splice(d.cur, 1);
  d.cur = Math.max(0, d.rows.indexOf(keep)); touch();
}
function nextHouse() {
  var d = V.draft; if (!checkHouse()) return;
  var r = d.rows[d.cur];
  if (d.cur === d.rows.length - 1) { if (!rowUsed(r)) { var el = $('hNo'); if (el) el.focus(); $('hErr').textContent = 'กรอก' + unitName() + 'ของ' + (isComm() ? 'บ้าน' : 'จุด') + 'นี้ก่อน'; return; } if (d.rows.length >= (V.data.maxRows || 300)) { ask('1 แผ่นกรอกได้ไม่เกิน ' + V.data.maxRows + ' หลัง กรุณาส่งแผ่นนี้ก่อน'); return; } d.rows.push(blankHouse()); d.cur = d.rows.length - 1; }
  else d.cur++;
  touch(); housesScreen();
}
function prevHouse() { var d = V.draft; if (!d.cur) return; if (!checkHouse()) return; var cur = d.rows[d.cur]; d.cur--; if (!rowUsed(cur) && d.rows.length > 1) d.rows.splice(d.cur + 1, 1); touch(); housesScreen(); }
async function delHouse() {
  var d = V.draft, r = d.rows[d.cur];
  if (rowUsed(r) && !await ask('ลบ' + (isComm() ? 'บ้าน' : 'จุด') + ' ' + (String(r.HouseNo).trim() || ('ที่ ' + (d.cur + 1))) + ' ?', 'ลบ', true)) return;
  d.rows.splice(d.cur, 1); if (!d.rows.length) d.rows.push(blankHouse()); if (d.cur >= d.rows.length) d.cur = d.rows.length - 1; touch(); housesScreen();
}

/* ---------- ขั้นที่ 3: ตรวจและส่ง ---------- */
function toReview() {
  var d = V.draft; if (!checkHouse()) return;
  var cur = d.rows[d.cur]; if (!rowUsed(cur) && d.rows.length > 1) { d.rows.splice(d.cur, 1); d.cur = Math.max(0, d.cur - 1); }
  for (var i = 0; i < d.rows.length; i++) { if (rowUsed(d.rows[i]) && (!String(d.rows[i].HouseNo || '').trim() || dupIdx(i) >= 0)) { d.cur = i; housesScreen(); checkHouse(); return; } }
  touch(); reviewScreen();
}
function vacHtml() {
  var v = V.draft.vacant;
  if (!V.draft.showVac) return '<button class="big sec mid" onclick="V.draft.showVac=true;touch();reviewScreen()">+ มีสถานที่รกร้าง / ว่างเปล่า</button>';
  return '<div class="card"><h3>สถานที่รกร้าง / ว่างเปล่า</h3><div class="vcount"><div class="step"><span>เข้าไปสำรวจได้ (แห่ง)</span><div class="stepper"><button type="button" onclick="vacN(\'inCount\',-1)">−</button><input type="number" inputmode="numeric" enterkeyhint="done" id="vIn" value="' + (v.inCount || 0) + '" onfocus="this.select()" oninput="vacTyped(\'inCount\',this)"><button type="button" onclick="vacN(\'inCount\',1)">+</button></div></div>'
    + '<div class="step"><span>เข้าไม่ได้ (แห่ง)</span><div class="stepper"><button type="button" onclick="vacN(\'outCount\',-1)">−</button><input type="number" inputmode="numeric" enterkeyhint="done" id="vOut" value="' + (v.outCount || 0) + '" onfocus="this.select()" oninput="vacTyped(\'outCount\',this)"><button type="button" onclick="vacN(\'outCount\',1)">+</button></div></div></div>'
    + '<p class="muted small" style="margin:8px 0 0">ภาชนะของที่เข้าได้ (รวมทุกแห่ง)</p>' + contHtml(v, 'v') + '<div id="vErr" class="err-msg"></div></div>';
}
function vacN(k, n) { var v = V.draft.vacant; v[k] = Math.max(0, Math.min(999, (Number(v[k]) || 0) + n)); var el = $(k === 'inCount' ? 'vIn' : 'vOut'); if (el) el.value = v[k]; vacSum(); touch(); }
function vacTyped(k, el) { var s = String(el.value || ''), o = ''; for (var i = 0; i < s.length; i++) if (s[i] >= '0' && s[i] <= '9') o += s[i]; V.draft.vacant[k] = Math.min(999, Number(o || 0)); vacSum(); touch(); }
function vacSum() { var v = V.draft.vacant, e = $('vErr'); if (e) e.textContent = !Number(v.inCount) && sum(v.t) ? 'มีจำนวนภาชนะ แต่ยังไม่ระบุจำนวนแห่งที่เข้าได้' : ''; var r = $('revRes'); if (r) r.innerHTML = resHtml(); }
function lvOf(m, val) { var c = V.data.levels && V.data.levels[m]; if (val === '' || val == null) return 'NONE'; var v = Number(val); if (v <= 0) return 'SAFE'; if (!c) return 'NONE'; var hit = function(t, op) { return op === 'GT' ? v > Number(t) : v >= Number(t); }; return hit(c.vhigh, c.vhighOp) ? 'VHIGH' : (hit(c.high, c.highOp) ? 'HIGH' : 'LOW'); }
function resHtml() { var c = calc(); return '<div class="res"><div><span>HI</span><b>' + esc(showPct(c.HI)) + '</b></div><div><span>CI</span><b>' + esc(showPct(c.CI)) + '</b></div><div><span>BI</span><b>' + esc(showPct(c.BI)) + '</b></div></div><p class="center" style="margin:10px 0 0">' + lvPair({ levelHI: c.units ? lvOf('HI', c.HI === '' ? 0 : c.HI) : 'NONE', levelCI: c.cont ? lvOf('CI', c.CI) : (c.units ? 'SAFE' : 'NONE') }) + '</p><p class="muted small center" style="margin:8px 0 0">สำรวจ ' + c.units + ' หน่วย · พบลูกน้ำ ' + c.unitsPos + ' หน่วย · ภาชนะ ทั้งหมด/พบ ' + c.cont + ' / ' + c.contPos + '</p>'; }
function reviewScreen() {
  V.screen = 'review'; window.scrollTo(0, 0);
  var d = V.draft, p = place(d.PlaceKey), rows = d.rows.filter(rowUsed), word = isComm() ? 'บ้าน' : 'จุด', placeName = draftPlaceName(d);
  setHead('ตรวจก่อนส่ง', 'ขั้นที่ 3 จาก 3', true);
  var h = '<div class="card"><dl class="kv"><dt>ชุมชน</dt><dd>' + esc(placeName || '-') + '</dd><dt>วันที่สำรวจ</dt><dd>' + esc(thDate(d.SurveyDate)) + '</dd><dt>ผู้สำรวจ</dt><dd>' + esc(surveyorName(d)) + '</dd>' + (d.SurveyNo ? '<dt>แก้ไขแผ่น</dt><dd>' + esc(d.SurveyNo) + '</dd>' : '') + '</dl><button class="btn" style="margin-top:10px" onclick="headScreen()">แก้ชุมชน / ผู้สำรวจ / วันที่</button></div>'
    + '<div class="card"><h3>ผลรวม</h3><div id="revRes">' + resHtml() + '</div></div>'
    + '<div class="card"><h3>รายการ' + word + ' (' + rows.length + ')</h3>' + (rows.length ? '<table class="sum"><thead><tr><th>' + esc(unitName()) + '</th><th class="n">ภาชนะ</th><th class="n">พบลูกน้ำ</th><th></th></tr></thead><tbody>' + d.rows.map(function(r, i) { if (!rowUsed(r)) return ''; return '<tr class="' + (sum(r.f) ? 'pos' : '') + '"><td>' + esc(r.HouseNo) + '</td><td class="n">' + sum(r.t) + '</td><td class="n">' + sum(r.f) + '</td><td class="n"><button class="btn" style="min-height:38px" onclick="V.draft.cur=' + i + ';housesScreen()">แก้</button></td></tr>'; }).join('') + '</tbody></table>' : '<p class="muted">ยังไม่มี' + word + ' (กรอกอย่างน้อย 1 ' + word + ' หรือสถานที่รกร้างที่เข้าได้)</p>') + '</div>'
    + '<div style="margin-bottom:14px">' + vacHtml() + '</div>'
    + '<div class="card"><label class="lab" style="margin-top:0" for="fNote">หมายเหตุ <span class="muted small">(ไม่บังคับ)</span></label><textarea class="inp" id="fNote" maxlength="500" oninput="V.draft.Note=this.value;touch()">' + esc(d.Note || '') + '</textarea></div><div id="revErr"></div>';
  $('box').innerHTML = h;
  bar('<button class="big" id="sendBtn" onclick="send()">📤 ส่งแบบสำรวจ</button>');
}

/* ---------- ส่ง (กันกดซ้ำ + ส่งซ้ำได้ปลอดภัย) ---------- */
function payload() {
  var d = V.draft;
  var rows = d.rows.filter(rowUsed).map(function(r) { return { HouseNo: String(r.HouseNo).trim(), t: r.t.map(Number), f: r.f.map(Number) }; });
  var v = d.vacant, vin = Number(v.inCount) || 0;
  return { ClientKey: d.ClientKey, DeviceID: device(), keys: sentKeys(), SurveyID: d.SurveyID || '', Version: d.Version || '', EditKey: d.SurveyID ? d.EditKey : '', PlaceKey: d.PlaceKey, PlaceName: draftPlaceName(d), VolID: d.VolID || '', SurveyorName: d.VolID ? '' : surveyorName(d),
    SurveyDate: d.SurveyDate, CommunityType: d.CommunityType || '', Note: String(d.Note || '').trim(),
    rows: rows, vacant: { inCount: vin, outCount: Number(v.outCount) || 0, t: vin ? v.t.map(Number) : zeros(), f: vin ? v.f.map(Number) : zeros() } };
}
function send() {
  if (V.send) return;
  var d = V.draft, p = payload();
  var vin = Number(d.vacant.inCount) || 0;
  if (!p.rows.length && !vin) { $('revErr').innerHTML = '<div class="st err">ยังไม่มีข้อมูล กรุณากรอกอย่างน้อย 1 ' + (isComm() ? 'บ้าน' : 'จุด') + '</div>'; return; }
  if (!vin && sum(d.vacant.t) && d.showVac) { $('revErr').innerHTML = '<div class="st err">สถานที่รกร้าง: มีจำนวนภาชนะ แต่ยังไม่ระบุจำนวนแห่งที่เข้าได้</div>'; return; }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  putDraft(d);
  V.send = { draft: d, payload: p, tries: 0, done: false, seq: 0 };
  sendingOver(false);
  attempt();
}
function sendingOver(slow) { over('<div class="ring"></div><h2>' + (slow ? 'สัญญาณช้า ระบบกำลังส่งให้อยู่' : 'กำลังส่ง…') + '</h2><p>กรุณารอสักครู่</p><p><b>อย่าปิดหน้านี้</b></p>'); }
function attempt() {
  var S = V.send; if (!S || S.done) return;
  S.tries++; var seq = ++S.seq;
  clearTimeout(S.slowT); clearTimeout(S.hardT);
  S.slowT = setTimeout(function() { if (V.send === S && !S.done) sendingOver(true); }, 8000);
  S.hardT = setTimeout(function() { if (V.send === S && !S.done && S.seq === seq) failScreen('ยังไม่ได้รับคำตอบจากระบบ', true); }, 45000);
  run('apiVolSubmit', [S.payload]).then(function(r) {
    if (S.done) return;
    if (r.ok) { finish(S, r.data); return; }
    if (S.seq !== seq) return;
    clearTimeout(S.slowT); clearTimeout(S.hardT);
    if (r.retry && S.tries < 3) { sendingOver(true); setTimeout(attempt, 2000 * S.tries); return; }
    if (r.retry || r.network) { failScreen(r.network ? 'สัญญาณมือถือหลุด' : 'ระบบไม่ว่างชั่วคราว', true); return; }
    S.done = true; V.send = null; over('');
    if (V.screen !== 'review') reviewScreen();
    $('revErr').innerHTML = '<div class="st err">ส่งไม่ได้: ' + esc(r.message) + '</div>'; $('revErr').scrollIntoView({ block: 'center' }); vibrate([60, 60, 60]);
  });
}
function failScreen(why, canRetry) {
  var S = V.send; if (!S) return;
  clearTimeout(S.slowT); clearTimeout(S.hardT);
  over('<div class="failmark">!</div><h2>ยังส่งไม่ได้</h2><p>' + esc(why) + '</p><p><b>ข้อมูลยังอยู่ในเครื่อง ไม่หาย</b></p><div class="stack" style="width:min(420px,100%);margin-top:18px">'
    + (canRetry ? '<button class="big" onclick="retrySend()">ส่งอีกครั้ง</button>' : '') + '<button class="big sec mid" onclick="leaveSend()">กลับหน้าแรก (ส่งทีหลัง)</button></div><p class="xs" style="margin-top:14px">ส่งซ้ำได้ ระบบจะไม่บันทึกซ้ำ</p>');
  vibrate([60, 60, 60]);
}
function retrySend() { var S = V.send; if (!S) return; S.tries = 0; sendingOver(false); attempt(); }
function leaveSend() { var S = V.send; if (S) { S.done = true; } V.send = null; over(''); home(); }
function finish(S, data) {
  S.done = true; clearTimeout(S.slowT); clearTimeout(S.hardT); V.send = null;
  addSent(S.draft.ClientKey); dropDraft(S.draft.id); V.draft = null;
  if (data.mine) V.data.mine = data.mine;
  var s = data.survey, word = isComm2(s) ? 'หลัง' : 'จุด';
  vibrate(120); bar('');
  V.screen = 'done';
  over('<div class="okmark">✓</div><h2>ส่งเรียบร้อย</h2><p>' + esc(s.PlaceName) + ' · ครั้งที่ ' + esc(s.RoundNo) + '</p><p>เลขที่ <b>' + esc(s.SurveyNo) + '</b> · ' + esc(s.Houses) + ' ' + word + ' · HI ' + esc(showPct(s.HI)) + ' · CI ' + esc(showPct(s.CI)) + '</p><p class="small">เจ้าหน้าที่จะตรวจและรับรองผล</p>'
    + '<div class="stack" style="width:min(420px,100%);margin-top:18px"><button class="big" onclick="over(\'\');home()">กลับหน้าแรก</button><button class="big sec mid" onclick="over(\'\');startNew()">เริ่มแบบสำรวจใหม่</button></div>');
}
function isComm2(s) { var p = place(s && s.PlaceKey); return !p || p.PlaceType === 'COMMUNITY'; }

window.addEventListener('beforeunload', function(e) { if (V.send && !V.send.done) { e.preventDefault(); e.returnValue = ''; } else if (V.draft) putDraft(V.draft); });
document.addEventListener('visibilitychange', function() { if (document.hidden && V.draft) putDraft(V.draft); });
if (!renderStatic()) { device(); boot(); }
</script>
</body>
</html>
