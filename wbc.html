/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';

function isDayKey(v){ if(typeof v!=='string'||v.length!==10||v.charAt(4)!=='-'||v.charAt(7)!=='-') return false; const a=v.split('-'); return a.every(x=>x!==''&&!isNaN(Number(x))); }

function keyOf(v){ if(!v) return ''; if(isDayKey(v)) return v; const d=new Date(v); if(isNaN(d)) return ''; return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); }
function thDate(v,full){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-').map(Number); return d+' '+(full?TH_M:TH_MS)[m-1]+' '+(y+543); }
function shortDate(v){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-'); return d+'/'+m+'/'+(Number(y)+543); }
function thDateTime(v){ if(!v) return '-'; const d=new Date(v); if(isNaN(d)) return '-'; const t=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); return shortDate(v)+' '+t+' น.'; }
function todayKey(){ return keyOf(new Date()); }
function mk(y,m,d){ const t=new Date(Date.UTC(y,m-1,d)); return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0'); }
function addDays(k,n){ const [y,m,d]=k.split('-').map(Number); return mk(y,m,d+n); }
function addMonths(k,n){ const [y,m,d]=k.split('-').map(Number); const t=new Date(Date.UTC(y,m-1+n,1)); const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate(); return mk(t.getUTCFullYear(),t.getUTCMonth()+1,Math.min(d,last)); }
function weekday(k){ const [y,m,d]=k.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function dayLabel(k){ return 'วัน'+DAY_TH[weekday(k)]+' '+thDate(k); }

/* ---------- เรียกเซิร์ฟเวอร์ ---------- */
function callRaw_(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(r=>{
      if(!r){ reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); return; }
      if(!r.ok){ { const m0=String(r.message||''); if(m0.indexOf('Session')>=0||m0.indexOf('เปิดระบบใหม่')>=0) sessionLost(); } reject(new Error(r.message||'เกิดข้อผิดพลาด')); return; }
      resolve(r.data !== undefined ? r.data : r);
    }).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}
function call(fn, ...args){
  const L=window.PHC37Load; if(L) L.line.start();
  return callRaw_(fn, ...args).then(v=>{ if(L) L.line.done(); return v; }, e=>{ if(L) L.line.fail(); throw e; });
}

/** งานบันทึกที่อาจมีคำเตือน: แสดงคำเตือน → ยืนยัน → ส่งซ้ำพร้อม confirm */
async function apiConfirm(fn, p, btn, okText){
  let r=await api(fn,p);
  if(r && r.needConfirm){
    if(btn) setBusy(btn,false);
    const go=await confirmBox('ตรวจสอบก่อนบันทึก',`<p style="margin-top:0">ระบบพบข้อควรระวัง:</p><ul class="warn-list">${r.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><p class="muted small">ถ้าถูกต้องแล้ว กด "${esc(okText||'ยืนยันบันทึก')}"</p>`,okText||'ยืนยันบันทึก');
    if(!go) return null;
    if(btn) setBusy(btn,true);
    r=await api(fn,Object.assign({},p,{confirm:true}));
  }
  return r;
}

/** ข้อความ → yyyy-MM-dd ('' = ไม่ถูกต้อง) · ปี > 2400 = พ.ศ. */
function parseThaiDate(t){ t=String(t||'').trim(); let parts=[], cur='';
  for(let i=0;i<t.length;i++){ if(isDigitCh(t[i])) cur+=t[i]; else { if(cur) parts.push(cur); cur=''; } } if(cur) parts.push(cur);
  if(parts.length===1&&parts[0].length===8) parts=[parts[0].slice(0,2),parts[0].slice(2,4),parts[0].slice(4)];
  if(parts.length!==3||parts[0].length>2||parts[1].length>2||parts[2].length!==4) return '';
  let y=Number(parts[2]); const mo=Number(parts[1]), d=Number(parts[0]); if(y>2400) y-=543; if(y<1900||y>2200) return '';
  const dt=new Date(Date.UTC(y,mo-1,d)); if(dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return '';
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

  <div class="grid g4" style="margin-bottom:14px">
    <div class="stat link" onclick="go('registry')"><span>เด็กในทะเบียน</span><b>${d.active}</b><i>ทั้งหมด ${d.total} คน (รวมปิดแฟ้ม)</i></div>
    <div class="stat"><span>มารับบริการ ปีงบ ${d.fy}</span><b>${d.kidsFy}</b><i>คน · ${d.visitsFy} ครั้ง</i></div>
    <div class="stat link" onclick="S.weekOf='${t}';go('appts')"><span>นัดวันนี้</span><b>${todayDay.rows.length}</b><i>${todayDay.rows.filter(r=>r.State==='ATTENDED').length} มาแล้ว</i></div>
    <div class="stat link ${f.missed?'bad':''}" onclick="S.followTab='missed';go('follow')"><span>ผิดนัด (ยังไม่ติดตาม)</span><b>${f.missed||0}</b><i>คน</i></div>
  </div>
  <div class="split">
    <div class="stack">
      <div class="card"><h3>งานที่ต้องทำ</h3><div class="grid" style="gap:8px">${todo.map(x=>`<div class="alert-row ${x[0]}"><b>${esc(x[1])}</b>${x[2]?`<span class="muted">${esc(x[2])}</span>`:''}${x[3]?`<button class="phc-btn phc-btn--secondary phc-btn--sm go" onclick="${x[3]}">${esc(x[4])}</button>`:''}</div>`).join('')}</div></div>
      <div class="card"><h3>นัดวันนี้ ${prep.length?'<span class="muted small">· เตรียมวัคซีน</span>':''}</h3>${prep.length?`<div class="due-chips">${prep.map(k=>chip(k+' × '+todayDay.vaccines[k],'info')).join('')}</div>`:''}
        ${todayDay.rows.length?`<div class="table-wrap"><table class="t rt"><thead><tr><th>เด็ก</th><th>นัดเพื่อ</th><th>สถานะ</th></tr></thead><tbody>${todayDay.rows.map(r=>`<tr class="click" onclick="openChild('${r.ChildID}')"><td>${kidCell(r.child)}</td><td>${esc(r.TypesTH)}${r.PlannedLabel?`<small>${esc(r.PlannedLabel)}</small>`:''}</td><td>${apptChip(r)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่มีนัดวันนี้</div>'}</div>
    </div>
    <div class="stack">
      <div class="card"><h3>วันคลินิกถัดไป</h3><div class="grid" style="gap:10px">${(d.nextDays||[]).map(x=>`<div class="pick" onclick="S.weekOf='${x.key}';go('appts')"><div><b>${esc(dayLabel(x.key))}</b><span>${x.holiday?'⚠️ วันหยุด: '+esc(x.holiday):'นัดแล้ว '+x.count+' / '+x.capacity+' ราย'}</span></div><div style="width:110px">${prog(x.count,x.capacity)}</div></div>`).join('')||'<div class="empty">-</div>'}</div></div>
    </div>
  </div>`;
}

async function regSearch(fromFlag, quiet){

  if(!q&&!F.flag){ if(fromFlag){ S.reg=null; $('rgBody').innerHTML='<div class="card empty">พิมพ์ HN / ชื่อ / เลขบัตรประชาชน แล้วกด “ค้นหา” หรือเลือกรายชื่อตามเงื่อนไข</div>'; return; } toast('พิมพ์ HN / ชื่อ / เลขบัตรประชาชน หรือเลือกเงื่อนไข',true); return; }
  const btn=$('rgGo'); if(!quiet) setBusy(btn,true,'กำลังค้นหา…'); if($('rgBody')) $('rgBody').innerHTML=phcSk(5);
  try{ const d=await api('apiRegistrySearch',{q:q,st:F.st,flag:F.flag}); S.reg=Object.assign(d,{q:q,st:F.st,flag:F.flag}); S.regStale=false; if(S.page==='registry') drawRegistry(); }

function drawRegistry(){
  const R=S.reg, el=$('rgBody'); if(!el||!R) return;
  const fl=(REG_FLAGS.find(x=>x[0]===R.flag)||['',''])[1];
  const what=[R.q?(R.by==='CID'?'เลขบัตรประชาชน':'“'+R.q+'”'):'', R.flag?fl:'', R.st?(R.st==='ACTIVE'?'อยู่ในทะเบียน':'ปิดแฟ้มแล้ว'):''].filter(Boolean).join(' · ');

  el.innerHTML=R.rows.length?head+`<div class="table-wrap"><table class="t rt"><thead><tr><th>ชื่อ-สกุล</th><th>มาล่าสุด</th><th>นัดถัดไป</th><th>เบอร์โทร</th><th></th></tr></thead><tbody>${R.rows.map(r=>`<tr class="click" onclick="openChild('${r.ChildID}')"><td>${kidCell(r)}</td><td>${r.LastVisit?esc(shortDate(r.LastVisit)):'-'} ${nutChip(r.LastNut)}</td><td>${r.NextAppt?esc(shortDate(r.NextAppt)):'-'}</td><td>${esc(r.Phone||'-')}</td><td>${r.Status==='CLOSED'?chip('ปิดแฟ้ม','neutral'):''}${r.Missed?chip('ผิดนัด','danger'):''}${r.LateVaccines?chip('วัคซีนค้าง '+r.LateVaccines,'warning'):''}</td></tr>`).join('')}</tbody></table></div>`
    :`<div class="card empty">ไม่พบเด็กตามเงื่อนไข${R.by==='CID'?' (เลขบัตรนี้ยังไม่มีแฟ้ม WBC — ลงทะเบียนได้ที่ปุ่ม “ลงทะเบียนเด็ก”)':''}${R.st==='ACTIVE'?' · ลองเลือก “ทุกสถานะ”':''}</div>`;
}
/** พิมพ์ทะเบียน: ทั้งทะเบียนตามสถานะ / เงื่อนไขที่เลือก (ไม่ใช้คำค้น) */
function regRows(){
  const F=S.filters;
  return (S.list||[]).filter(r=>(!F.st||r.Status===F.st)
    &&(!F.flag||F.flag==='all'||(F.flag==='missed'&&r.Missed)||(F.flag==='late'&&r.LateVaccines)||(F.flag==='noappt'&&!r.NextAppt&&r.Status==='ACTIVE')||(F.flag==='u12'&&r.AgeMonths!==null&&r.AgeMonths<12)));
}

async function regDetail(i){

async function saveRegister(i, force){
  const nw=i<0, r=PK.read('pk',{mode:nw?'new':'edit'}); if(r.err){ toast(r.err,true); return; }
  if(!r.person.BirthDate){ toast('กรุณาระบุวันเกิดของเด็ก',true); return; }
  if(['ชาย','หญิง'].indexOf(r.person.Gender)<0){ toast('กรุณาเลือกเพศของเด็ก',true); return; }
  const p={ person:r.person, phones:r.phones, RegisteredDate:dateVal('rgDate'), PolioScheme:$('rgPolio').value, Note:$('rgNote').value.trim() };
  if(!nw) p.patient=S.ptRows[i].patient; else { p.newPatient=true; if(force===true) p.forceCreate=true; }
  doRegister(p);
}
async function doRegister(p){
  const b=$('rgSave'); setBusy(b,true);
  try{ const d=await api('apiRegister',p);
    if(d.duplicate){ setBusy(b,false); const ch=await dupBox(d); if(!ch) return;
      if(ch.act==='open'){ closeModal(); openChild(ch.cid); return; }
      if(ch.act==='use'){ const q=Object.assign({},p,{newPatient:false,patient:d.matches[ch.i].patient}); delete q.forceCreate; doRegister(q); return; }
      if(ch.act==='force'){ doRegister(Object.assign({},p,{forceCreate:true})); return; } return; }
    closeModal(); toast('ลงทะเบียนแล้ว · ขั้นต่อไป: บันทึกการมารับบริการ'); if(d.warn) toast(d.warn,true);
    dirty(); S.detail=d.detail; S.childTab='vaccine'; showChild(); }
  catch(e){ toast(e.message,true); setBusy(b,false); }
}
function dupBox(d){
  return new Promise(res=>{
    const root=document.createElement('div');
    const rows=d.matches.map((m,i)=>{ const p=m.patient; return `<div class="pick" style="cursor:default"><div><b>${esc(p.FullName)}</b><span>${esc(m.reason||'')} · HN ${esc(p.HN||'-')}${p.BirthDate?' · เกิด '+esc(shortDate(p.BirthDate)):''}</span></div>${m.registered?`<button class="phc-btn phc-btn--secondary phc-btn--sm" data-a="open" data-r="${esc(m.registered.ChildID)}">มีแฟ้มแล้ว · เปิด</button>`:`<button class="phc-btn phc-btn--sm" data-a="use" data-i="${i}">ใช่ คนนี้</button>`}</div>`; }).join('');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>พบข้อมูลที่อาจซ้ำในเวชระเบียนกลาง</h3></div><div class="modal-body"><p class="small" style="margin-top:0">${esc(d.message||'')}${d.canForceCreate===false?'<br><b>HN/เลขบัตรซ้ำกับคนเดิม — เลือกคนเดิมเท่านั้น</b>':''}</p><div class="grid" style="gap:8px">${rows}</div></div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="cancel">ย้อนกลับไปแก้</button>${d.canForceCreate===false?'':'<button class="phc-btn phc-btn--danger-soft" data-a="force">ไม่ใช่ — ยืนยันเพิ่มเด็กใหม่</button>'}</div></div></div>`;
    document.body.appendChild(root);
    root.addEventListener('click',e=>{ const el=e.target.closest&&e.target.closest('[data-a]'); if(!el) return; const a=el.getAttribute('data-a'); root.remove();
      if(a==='use') res({act:'use',i:Number(el.getAttribute('data-i'))}); else if(a==='open') res({act:'open',cid:el.getAttribute('data-r')}); else if(a==='force') res({act:'force'}); else res(null); });
  });
}
</script>
<script>
/* =====================================================================
 * แฟ้มเด็ก
 * ===================================================================== */
const CHILD_TABS=[['vaccine','💉 วัคซีน'],['visits','🩺 การมารับบริการ'],['nutrition','⚖️ โภชนาการ'],['dev','🧩 พัฒนาการ'],['anemia','🩸 ภาวะซีด'],['appts','📅 นัดหมาย']];
async function openChild(id, keepTab){
  closeModal();
  if(!keepTab) S.childTab='vaccine';
  S.page='child'; try{ sessionStorage.setItem('wbc1.page','child'); sessionStorage.setItem('wbc1.child',id); }catch(e){}
  document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='registry'));
  $('pageTitle').textContent=TITLES.child; loading('กำลังเปิดแฟ้ม…'); window.scrollTo(0,0);
  try{ S.detail=await api('apiChild',id); }catch(e){ errBox(e); try{ sessionStorage.setItem('wbc1.page','registry'); }catch(x){} return; }
  if(S.page==='child') renderChild();
}
/** แสดงแฟ้มจากข้อมูลที่ได้กลับมาหลังบันทึก */
function showChild(){ if(S.page!=='child'){ S.page='child'; try{ sessionStorage.setItem('wbc1.page','child'); sessionStorage.setItem('wbc1.child',S.detail.child.ChildID); }catch(e){} document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='registry')); $('pageTitle').textContent=TITLES.child; } renderChild(); }
function afterChildWrite(r, msg){ if(r&&r.detail){ S.detail=r.detail; } dirty(); if(msg) toast(msg); if(S.page==='child') renderChild(); }
function renderChild(){
  const D=S.detail; if(!D){ go('registry'); return; }
  const c=D.child, open=c.Status==='ACTIVE';
  const sync=D.sync?(D.sync.ok?`<div class="sync-line ok">✓ ข้อมูลตรงกับเวชระเบียนกลาง${D.sync.changed&&D.sync.changed.length?' (ปรับ '+D.sync.changed.length+' ช่องให้แล้ว)':''}</div>`:`<div class="sync-line warn">⚠️ ${esc(D.sync.message)}</div>`):'';
  const pol=D.vaccine.polio;
  const tabCount={appts:D.appts.filter(a=>a.State==='SCHEDULED'||a.State==='MISSED'&&a.Status==='SCHEDULED').length, dev:D.dev.filter(x=>x.State==='WAIT_REASSESS'||x.State==='NEED_REFER').length, anemia:D.anemia.filter(x=>x.State==='WAIT').length, nutrition:D.nut.filter(x=>x.Status==='OPEN').length};
  $('content').innerHTML=`<div class="actions" style="margin-bottom:10px"><button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="go('registry')">‹ ทะเบียนเด็ก</button></div>
  <div class="card" style="margin-bottom:14px"><div class="kid-head"><div class="avatar lg">${c.Sex==='หญิง'?'👧':'👦'}</div><div><h2>${esc(c.ChildName)}</h2><div class="sub">${chip('HN '+(c.HN||'-'),'neutral')}${chip(c.Sex||'-','info')}${chip(c.AgeText,'success')}${open?'':chip('ปิดแฟ้ม: '+(c.CloseReason||''),'danger')}</div></div>
    <div class="acts">${open&&can('add')?`<button class="phc-btn" onclick="openVisitForm()">➕ บันทึกการมารับบริการ</button><button class="phc-btn phc-btn--secondary" onclick="apptForm()">📅 นัดหมาย</button>`:''}${can('add')?`<button class="phc-btn phc-btn--edit" onclick="editChild()">✏️ แก้ไขข้อมูล</button>`:''}${can('edit')?(open?`<button class="phc-btn phc-btn--danger-soft" onclick="closeChild()">ปิดแฟ้ม</button>`:`<button class="phc-btn phc-btn--secondary" onclick="reopenChild()">เปิดแฟ้มอีกครั้ง</button>`):''}${open&&S.line&&S.line.linkReady?`<button class="phc-btn phc-btn--secondary" onclick="lineParent()">💬 LINE ผู้ปกครอง${D.lineLinks?' ('+D.lineLinks+')':''}</button>`:''}<button class="phc-btn phc-btn--ghost" onclick="printChild()">🖨️ พิมพ์</button></div></div>
    <div class="kv"><div><span>วันเกิด</span><b>${esc(thDate(c.BirthDate,true))}</b></div><div><span>เบอร์โทร</span><b>${telLink(c.Phone)}</b></div><div><span>สิทธิ</span><b>${esc(c.MainRight||'-')}</b></div><div><span>ลงทะเบียน</span><b>${esc(shortDate(c.RegisteredDate))}</b></div>
      <div><span>โปลิโอ</span><b>${pol.scheme==='NEW'?'สูตรใหม่ 2 IPV + 3 OPV':'สูตรเดิม'}${pol.auto?' <span class="muted xs">(อัตโนมัติ: '+esc(pol.reason)+')</span>':''}</b></div><div><span>นมแม่ 6 ด.</span><b>${esc(c.Breastfeed6m||'-')}</b></div><div><span>ยาธาตุเหล็กครั้งแรก</span><b>${c.IronFirstDate?esc(shortDate(c.IronFirstDate)):'-'}</b></div><div style="grid-column:1/-1"><span>ที่อยู่</span><b>${esc(c.AddressText||'-')}</b></div>${c.Note?`<div style="grid-column:1/-1"><span>หมายเหตุ</span><b>${esc(c.Note)}</b></div>`:''}</div>${sync}</div>
  <div class="tabs">${CHILD_TABS.map(t=>`<button class="tab ${S.childTab===t[0]?'on':''}" onclick="S.childTab='${t[0]}';renderChild()">${t[1]}${tabCount[t[0]]?'<span class="pill-n">'+tabCount[t[0]]+'</span>':''}</button>`).join('')}</div>
  <div id="childTab"></div>`;
  ({vaccine:tabVaccine,visits:tabVisits,nutrition:tabNutrition,dev:tabDev,anemia:tabAnemia,appts:tabAppts}[S.childTab]||tabVaccine)();
}

/* ---------- แท็บวัคซีน (1.1.0: ตารางรายวัคซีน / รายละเอียดตามนัด + ควรฉีดวันนี้ + สรุปรายวัคซีน) ---------- */
const VSTATE={CLINIC:['vs-cl','ฉีดที่คลินิก'],OTHER:['vs-ot','ฉีดที่อื่น'],DUE:['vs-du','ถึงกำหนด'],LATE:['vs-la','เลยกำหนด'],UP:['vs-up','ยังไม่ถึง'],EXP:['vs-ex','เลยช่วงอายุ'],SKIP:['vs-up','ไม่มีบันทึก']};
function vacLegend(){ return `<div class="legend2">${['CLINIC','OTHER','DUE','LATE','UP','EXP'].map(k=>`<span><i class="${VSTATE[k][0]}"></i>${VSTATE[k][1]}${k==='LATE'?' > 30 วัน':''}</span>`).join('')}</div>`; }
function vacCell(r,c){
  const cls=VSTATE[c.state]?VSTATE[c.state][0]:'vs-up', del=c.given&&isAdm()?`<button class="x" title="ลบเข็มนี้" aria-label="ลบเข็มนี้" onclick="delDose('${c.given.DoseID}','${esc(doseLabel(r.code,c.dose))} ${esc(shortDate(c.given.GivenDate))}')">×</button>`:'';
  let txt;
  if(c.given) txt=esc(shortDate(c.given.GivenDate))+(c.state==='OTHER'?' · ที่อื่น':'');
  else if(c.state==='DUE') txt='ถึงกำหนดแล้ว';
  else if(c.state==='LATE') txt='เลยกำหนด '+esc(shortDate(c.dueKey));
  else if(c.state==='EXP') txt='เลยช่วงอายุที่ให้ได้';
  else if(c.state==='SKIP') txt='ไม่มีบันทึก';
  else txt=esc(shortDate(c.dueKey||c.recKey));
  return `<span class="vcell ${cls}">${del}<b>ครั้งที่ ${c.dose} · ${esc(c.recLabel)}</b>${txt}</span>`;
}
function vacTable(V){
  const maxCols=Math.max(1,...V.rows.map(r=>r.cols.length));
  const body=V.rows.map(r=>{
    let tds=r.cols.map(c=>`<td>${vacCell(r,c)}</td>`).join(''); for(let i=r.cols.length;i<maxCols;i++) tds+='<td></td>';
    const ex=r.extra.length?`<tr><td></td><td colspan="${maxCols}">${r.extra.map(g=>`<span class="vcell ${g.Source==='CLINIC'?'vs-cl':'vs-ot'}" style="display:inline-block;margin:2px 4px 2px 0">${isAdm()?`<button class="x" aria-label="ลบเข็มนี้" onclick="delDose('${g.DoseID}','${esc(doseLabel(r.code,g.DoseNo))} ${esc(shortDate(g.GivenDate))}')">×</button>`:''}<b>ครั้งที่ ${g.DoseNo}</b>${esc(shortDate(g.GivenDate))}</span>`).join('')}<span class="muted xs">นอกตาราง</span></td></tr>`:'';
    return `<tr><td class="vn">${esc(r.name)}${r.active?'':' <span class="muted xs">(ปิดใช้)</span>'}</td>${tds}</tr>${ex}`;
  }).join('');
  const sea=(V.seasonal||[]).map(f=>`<tr><td class="vn">${esc(f.name)}</td><td colspan="${maxCols}"><div class="zline">${f.given.map(g=>`<span class="vcell ${g.Source==='CLINIC'?'vs-cl':'vs-ot'}" style="display:inline-block">${isAdm()?`<button class="x" aria-label="ลบเข็มนี้" onclick="delDose('${g.DoseID}','${esc(f.name)} ${esc(shortDate(g.GivenDate))}')">×</button>`:''}<b>เข็ม ${g.DoseNo}</b>${esc(shortDate(g.GivenDate))}</span>`).join('')}${f.next?`<span class="vcell ${f.next.status==='DUE'?'vs-du':'vs-up'}" style="display:inline-block"><b>เข็ม ${f.next.dose}</b>${f.next.status==='DUE'?'ให้ได้แล้ว':'ให้ได้ '+esc(shortDate(f.next.dueKey))}</span>`:''}<span class="muted small">ปีละครั้ง · ${esc(f.range)}${f.firstDoses>1?' · ครั้งแรก '+f.firstDoses+' เข็ม ห่าง '+esc(f.firstGap):''}</span></div></td></tr>`).join('');
  return `<div class="table-wrap"><table class="vgrid"><thead><tr><th>วัคซีน</th>${Array.from({length:maxCols},(_,i)=>`<th>ครั้ง ${i+1}</th>`).join('')}</tr></thead><tbody>${body}${sea}</tbody></table></div>`;
}
function vacDetail(V){
  const ST={DONE:['ครบ','success','vt-done'],DUE:['ถึงกำหนด','warning','vt-due'],UP:['ยังไม่ถึง','neutral','vt-up']};
  const pts=V.points.map((p,i)=>{ const st=ST[p.state], last=i===V.points.length-1;
    const cnt=p.items.filter(x=>x.state==='CLINIC'||x.state==='OTHER').length, due=p.items.filter(x=>x.state==='DUE'||x.state==='LATE');
    const head=p.state==='DONE'?(p.items.some(x=>x.state==='EXP')?'ได้ '+cnt+' · เลยช่วงอายุ '+p.items.filter(x=>x.state==='EXP').length:'ครบ '+cnt+' วัคซีน'):(p.state==='DUE'?'ถึงกำหนด '+due.length+' วัคซีน':(cnt?'ได้แล้ว '+cnt+' · รออายุ '+p.items.filter(x=>x.state==='UP').length:'รออายุ'));
    return `<div class="vt-step ${st[2]}"><div class="vt-age">${esc(p.label)}<small>${esc(shortDate(p.state==='DONE'&&p.givenDate?p.givenDate:p.dateKey))}</small></div><div class="vt-rail"><span class="vt-dot"></span>${last?'':'<span class="vt-line"></span>'}</div>
      <div class="vt-box"><div class="vt-bh"><b>${esc(head)}</b>${chip(st[0],st[1])}</div><div class="vt-chips">${p.items.map(x=>`<span class="vt-ch ${VSTATE[x.state]?VSTATE[x.state][0]:'vs-up'}" title="${esc(VSTATE[x.state]?VSTATE[x.state][1]:'')}${x.givenDate?' '+esc(shortDate(x.givenDate)):''}">${esc(x.name)} ${x.dose}</span>`).join('')}</div>${p.state==='DUE'?'<div class="small" style="color:#6B4200">เลือกเข็มที่จะฉีดในกล่อง "ควรฉีดวันนี้"</div>':''}</div></div>`; }).join('');
  return `<div class="vt">${pts||'<div class="card empty">ยังไม่มีตารางวัคซีน</div>'}</div>`;
}
function vacSide(V, open){
  const due=V.dueNow||[], P=V.progress||{done:0,total:0}, pct=P.total?Math.round(P.done*100/P.total):0;
  const dueBox=open&&can('add')?`<div class="card vac-due"><h3 style="margin:0">ควรฉีดวันนี้</h3><div class="muted small">อายุ ${esc(S.detail.child.AgeText)} · ติ๊กเข็มที่จะฉีด แล้วกดบันทึก</div>
    ${due.length?due.map((d,i)=>`<label class="vac-ck"><input type="checkbox" data-dn="${i}" ${d.kind==='SEASONAL'?'':'checked'}> ${esc(doseLabel(d.code,d.dose))}${d.status==='LATE'?' <span class="chip tone-danger">เลยกำหนด</span>':''}${d.kind==='SEASONAL'?' <span class="muted xs">(ตามความสมัครใจ)</span>':''}</label>`).join('')+`<button class="phc-btn" onclick="visitWithDue()">บันทึกการมารับบริการ</button><div class="muted xs">ฟอร์มจะเปิดพร้อมวัคซีนที่เลือก · ชั่งน้ำหนัก วัดส่วนสูง และนัดครั้งถัดไปในฟอร์มเดียว</div>`:'<div class="empty" style="padding:10px">ไม่มีวัคซีนถึงกำหนดวันนี้</div>'}</div>`:'';
  const sum=V.rows.map(r=>{ const st=r.next?(r.next.status==='UPCOMING'?'ครั้งที่ '+r.next.dose+' · '+shortDate(r.next.dueKey):'ครั้งที่ '+r.next.dose+(r.next.status==='LATE'?' เลยกำหนด':' ถึงกำหนด')):(r.expired?'เลยช่วงอายุที่ให้ได้':(r.waitReq?'ครั้งที่ '+r.waitReq.dose+' · รอ '+r.waitReq.name+' ครั้งที่ '+r.waitReq.dose0:'ครบแล้ว'));
    return `<div class="vs-row"><b>${esc(r.name)}</b><span class="vs-dots">${r.cols.map(c=>`<i class="${VSTATE[c.state]?VSTATE[c.state][0]:'vs-up'}" title="ครั้งที่ ${c.dose}: ${esc(VSTATE[c.state]?VSTATE[c.state][1]:'')}"></i>`).join('')}</span><small>${esc(st)}</small></div>`; }).join('')
    +(V.seasonal||[]).map(f=>`<div class="vs-row"><b>${esc(f.name)}</b>${f.next&&f.next.status==='DUE'?chip('ให้ได้แล้ว','warning'):''}<small>ปีละครั้ง · ${esc(f.range)}</small></div>`).join('');
  return `<div class="vac-side">${dueBox}<div class="card"><div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0;flex:1">ความคืบหน้า</h3><b style="color:var(--phc-primary)">${P.done} / ${P.total} เข็ม</b></div><div class="prog" style="margin-top:8px;height:10px"><div style="width:${pct}%"></div></div></div><div class="card"><h3>สรุปรายวัคซีน</h3>${sum}</div></div>`;
}
function tabVaccine(){
  const V=S.detail.vaccine, open=S.detail.child.Status==='ACTIVE', view=S.vacView||'table';
  $('childTab').innerHTML=`<div class="toolbar"><div class="seg"><button type="button" class="${view==='table'?'on':''}" onclick="S.vacView='table';tabVaccine()">ตารางรายวัคซีน</button><button type="button" class="${view==='detail'?'on':''}" onclick="S.vacView='detail';tabVaccine()">รายละเอียดตามนัด</button></div><span style="flex:1"></span>${open&&can('add')?`<button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="historyDoseForm()">➕ บันทึกวัคซีนย้อนหลัง / ฉีดที่อื่น</button>`:''}${can('add')?`<button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="polioForm()">⚙️ สูตรโปลิโอ</button>`:''}</div>
    <div class="vac-wrap"><div class="vac-main">${view==='table'?vacTable(V):vacDetail(V)}${vacLegend()}<p class="muted small">ระบบนับต่อจากครั้งสูงสุดที่บันทึกไว้ (ไม่ต้องเริ่มใหม่) · ระยะห่างขั้นต่ำระหว่างครั้ง ${esc(V.minGap)} (ค่ากลาง) · ตารางวัคซีนแก้ได้ที่ ตั้งค่า → วัคซีน</p></div>${vacSide(V,open)}</div>`;
}
function visitWithDue(){
  const due=S.detail.vaccine.dueNow||[], pick=[];
  document.querySelectorAll('.vac-due input[data-dn]').forEach(cb=>{ if(cb.checked){ const d=due[Number(cb.dataset.dn)]; if(d) pick.push({Vaccine:d.code,DoseNo:d.dose}); } });
  openVisitForm(pick);
}
async function delDose(id,label){
  const reason=await confirmBox('ลบเข็มวัคซีน','ลบ <b>'+esc(label)+'</b> ออกจากประวัติ?','ลบ',true,true); if(!reason) return;
  try{ const r=await api('apiDeleteDose',{DoseID:id,Reason:reason}); afterChildWrite(r,'ลบแล้ว'); }catch(e){ toast(e.message,true); }
}
function polioForm(){
  const c=S.detail.child;
  openModal('สูตรวัคซีนโปลิโอ',`${field('สูตร',polioSelect('plS',c.PolioScheme))}<p class="muted small">อัตโนมัติ: ได้ IPV ก่อนอายุ 3 เดือน = สูตรใหม่ · ได้ OPV ก่อนอายุ 5 เดือน = สูตรเดิม · ยังไม่มีประวัติ = ดูจากวันเกิด (ตั้งแต่ ${esc(shortDate(S.settings.POLIO_NEW_FROM_BIRTH))} = สูตรใหม่)</p>`,
    `<button class="phc-btn phc-btn--secondary" onclick="closeModal()">ยกเลิก</button><button class="phc-btn" id="plB" onclick="savePolio()">บันทึก</button>`,'sm');
}
async function savePolio(){ const b=$('plB'); setBusy(b,true); try{ const r=await api('apiUpdateChild',{ChildID:S.detail.child.ChildID,PolioScheme:$('plS').value}); closeModal(); afterChildWrite(r,'บันทึกแล้ว'); }catch(e){ toast(e.message,true); setBusy(b,false); } }

/* ---------- วัคซีนย้อนหลัง ---------- */
let HD=[];
function historyDoseForm(){

/* ---------- แท็บโภชนาการ (กราฟ + ติดตาม) ---------- */
function growthSvg(G, kind){
  const ref=kind==='w'?G.ref.wfa:G.ref.lhfa, pts=G.points.filter(p=>kind==='w'?p.w:p.l).map(p=>[p.m,kind==='w'?p.w:p.l,p.date]);
  if(!ref.length) return '<div class="empty">ไม่ทราบเพศ</div>';
  const maxM=Math.min(60,Math.max(24,Math.ceil(((pts.length?Math.max(...pts.map(p=>p[0])):0)+6)/6)*6));
  const R=ref.filter(r=>r[0]<=maxM), W=640,H=300,L=44,B=30,T=10,Rt=10;
  let lo=Math.min(...R.map(r=>r[1]),...pts.map(p=>p[1])), hi=Math.max(...R.map(r=>r[3]),...pts.map(p=>p[1]));
  lo=Math.floor(lo*0.95); hi=Math.ceil(hi*1.03);
  const X=m=>L+(m/maxM)*(W-L-Rt), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const line=i=>R.map((r,j)=>(j?'L':'M')+X(r[0]).toFixed(1)+' '+Y(r[i]).toFixed(1)).join(' ');
  const band='M'+R.map(r=>X(r[0]).toFixed(1)+' '+Y(r[3]).toFixed(1)).join(' L')+' L'+R.slice().reverse().map(r=>X(r[0]).toFixed(1)+' '+Y(r[1]).toFixed(1)).join(' L')+' Z';
  let grid='';
  for(let m=0;m<=maxM;m+=6) grid+=`<line x1="${X(m)}" x2="${X(m)}" y1="${T}" y2="${H-B}" stroke="#EEF1EF"/><text x="${X(m)}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="#5B6B63">${m}</text>`;
  const step=kind==='w'?(hi-lo>15?5:2):10;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step) grid+=`<line x1="${L}" x2="${W-Rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEF1EF"/><text x="${L-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#5B6B63">${v}</text>`;
  const pl=pts.length>1?`<path d="${pts.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="#1D4ED8" stroke-width="2"/>`:'';
  const dots=pts.map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4" fill="#1D4ED8"><title>${shortDate(p[2])} · ${p[1]} ${kind==='w'?'กก.':'ซม.'}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${kind==='w'?'กราฟน้ำหนักตามอายุ':'กราฟความยาว/ส่วนสูงตามอายุ'}">${grid}<path d="${band}" fill="#E7F4EA"/><path d="${line(1)}" fill="none" stroke="#C2410C" stroke-dasharray="4 3"/><path d="${line(3)}" fill="none" stroke="#C2410C" stroke-dasharray="4 3"/><path d="${line(2)}" fill="none" stroke="#15703A" stroke-width="1.5"/>${pl}${dots}<text x="${W-Rt}" y="${H-4}" font-size="11" text-anchor="end" fill="#5B6B63">อายุ (เดือน)</text></svg>`;
}

<script>

const FOLLOW_TABS=[['missed','📵 ผิดนัด'],['vaccine','💉 วัคซีนค้าง (ไม่มีนัด)'],['anemia','🩸 ซีด รอเจาะซ้ำ'],['development','🧩 พัฒนาการ'],['nutrition','⚖️ โภชนาการ']];

  if(t==='development') body=F.development.map(d=>row(d.child,`<b>ช่วง ${d.AgePoint} เดือน · ${esc(d.StateTH)}</b><small>ประเมิน ${esc(shortDate(d.AssessDate))}${d.State==='WAIT_REASSESS'?' · ครบประเมินซ้ำ '+esc(shortDate(d.ReassessDue))+(d.Overdue?' (เลยกำหนด)':''):' · ประเมินซ้ำ '+esc(shortDate(d.ReassessDate))}</small>`,can('add')?(d.State==='WAIT_REASSESS'?`<button class="phc-btn phc-btn--sm" onclick="devForm('reassess','${d.DevID}')">ประเมินซ้ำ</button>`:`<button class="phc-btn phc-btn--sm" onclick="referForm('${d.DevID}')">บันทึกส่งต่อ</button>`):'')).join('');
  if(t==='nutrition') body=F.nutrition.map(n=>row(n.child,`<b>${esc(n.FoundResult)} · พบ ${esc(shortDate(n.FoundDate))}</b><small>ครบติดตาม ${esc(shortDate(n.DueDate))}${n.Overdue?' (เลยกำหนด)':(n.Due?' (ใกล้ครบ)':'')} · ให้ความรู้ ${n.EduDate?esc(shortDate(n.EduDate)):'-'} · นมผง ${n.MilkDate?esc(shortDate(n.MilkDate)):'-'}</small>`,can('add')?`<button class="phc-btn phc-btn--sm" onclick="nutForm('${n.FollowID}')">บันทึกติดตาม</button>`:'')).join('');
  $('content').innerHTML=`<div class="page-head"><div><h2>ต้องติดตาม</h2><p>เด็กที่อยู่ในทะเบียน · แตะชื่อเพื่อเปิดแฟ้ม</p></div><div class="actions"><button class="phc-btn phc-btn--secondary" onclick="printFollow()">🖨️ พิมพ์รายการนี้</button><button class="phc-btn phc-btn--ghost" onclick="S.follow=null;renderFollow()">↻ โหลดใหม่</button></div></div>
    <div class="tabs">${FOLLOW_TABS.map(x=>`<button class="tab ${t===x[0]?'on':''}" onclick="S.followTab='${x[0]}';renderFollow()">${x[1]} <span class="n">(${F.counts[x[0]]||0})</span></button>`).join('')}</div>
    ${body?`<div class="table-wrap"><table class="t rt"><thead><tr><th>เด็ก</th><th>รายละเอียด</th><th>เบอร์โทร</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`:'<div class="card empty">✅ ไม่มีรายการ</div>'}`;

/* =====================================================================

function fyRange(off){ const t=todayKey(), [y,m]=t.split('-').map(Number), fy=(m>=10?y+1:y)+(off||0); return {from:(fy-1)+'-10-01', to:fy+'-09-30', label:'ปีงบ '+(fy+543)}; }

async function runReport(){
  S.repFrom=dateVal('rpFrom'); S.repTo=dateVal('rpTo'); if(!S.repFrom||!S.repTo){ toast('เลือกช่วงวันที่',true); return; }
  const b=$('rpRun'); setBusy(b,true,'กำลังคำนวณ…'); $('repBody').innerHTML=phcSk(8);

}

function csvReport(){
  const R=S.report; if(!R) return;
  const q=v=>'"'+String(v==null?'':v).split('"').join('""')+'"';
  const lines=[['ข้อ','กิจกรรม','หน่วย','ผล','ครั้ง','ร้อยละของกลุ่ม','วิธีนับ'].map(q).join(',')];
  R.sections.forEach(s=>{ lines.push(q(s.title)); s.rows.forEach(r=>lines.push([r.no,r.label,r.unit,repVal(r),r.times!==undefined?r.times:'',r.pctOf!==undefined?r.pctOf:'',r.note||''].map(q).join(','))); });
  const blob=new Blob([String.fromCharCode(0xFEFF)+lines.join(String.fromCharCode(13,10))],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='WBC_report_'+R.from+'_'+R.to+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

/* ---------- ระยะเวลา (ตัวเลข + หน่วย: d วัน · w สัปดาห์ · m เดือน · y ปี) ---------- */
const DUR_U={d:'วัน',w:'สัปดาห์',m:'เดือน',y:'ปี'};
function durParse(t){ t=String(t||'').split(' ').join('').toLowerCase(); if(t.length<2) return null; const u=t.charAt(t.length-1), n=Number(t.slice(0,-1)); if(!DUR_U[u]||!(n>=0)||Math.floor(n)!==n) return null; return {n,u}; }
function durText(t){ const d=durParse(t); return d?d.n+' '+DUR_U[d.u]:''; }
function durShortT(t){ const d=durParse(t); return d?d.n+' '+({d:'วัน',w:'สัปดาห์',m:'ด.',y:'ปี'})[d.u]:''; }
function durField(id,val,ph){ const d=durParse(val)||{n:'',u:'m'}; return `<div class="dur"><input class="phc-input" id="${id}_n" type="number" min="0" step="1" value="${esc(d.n)}" placeholder="${esc(ph||'')}" aria-label="จำนวน"><select class="phc-select" id="${id}_u" aria-label="หน่วย">${Object.keys(DUR_U).map(u=>opt(u,DUR_U[u],u===d.u)).join('')}</select></div>`; }
function durVal(id){ const n=$(id+'_n'), u=$(id+'_u'); if(!n||n.value==='') return ''; return Math.floor(Number(n.value))+u.value; }

/* ---------- ตั้งค่าวัคซีน ---------- */
function vacDoseSummary(v){
  if(v.kind==='SEASONAL') return 'ปีละครั้ง · '+durShortT(v.seasonFrom)+' – '+(v.seasonTo?'ต่ำกว่า '+durShortT(v.seasonTo):'ไม่จำกัด')+(v.firstDoses>1?' · ครั้งแรก '+v.firstDoses+' เข็ม ห่าง '+durText(v.firstGap||S.vacCfg.minGap):'');
  const SO={ALL:0,NEW:1,OLD:2};
  return v.doses.slice().sort((a,b)=>SO[a.scheme]-SO[b.scheme]||a.dose-b.dose).map(d=>(d.active?'':'(ปิด) ')+d.dose+': '+durShortT(d.rec)+(d.scheme!=='ALL'?' ['+(d.scheme==='NEW'?'ใหม่':'เดิม')+']':'')).join(' · ');
}
function vacCfgHtml(){

      ${field('หมายเหตุ',`<input class="phc-input" id="veNote" value="${esc(v?v.note:'')}">`,'full')}</div>

      ${field('ฉีดซ้ำทุก',durField('veSE',v.seasonEvery||'12m'),'',1,'ห่างจากเข็มล่าสุดเท่านี้จึงเสนอเข็มปีถัดไป')}${field('ครั้งแรกในชีวิตให้กี่เข็ม',`<input class="phc-input" id="veFD" type="number" min="1" max="3" value="${esc(v.firstDoses||2)}">`)}
      ${field('ระยะห่างของเข็มครั้งแรก',durField('veFG',v.firstGap||'','ว่าง'),'','','ว่าง = ค่ากลาง '+esc(gap))}${field('ใช้กติกาครั้งแรกกับเด็กอายุต่ำกว่า',durField('veFU',v.firstUnder||'9y'))}</div></div>`;

    <div class="form-sec"><h4>ครั้งที่ฉีด <span class="muted small">ระยะห่างที่เว้นว่าง = ค่ากลาง ${esc(gap)}</span></h4>
    ${VE.doses.map((d,i)=>`<div class="vd-card ${d.Active!==false?'':'off'}"><div class="vd-top"><label class="vd-no">ครั้งที่ <input class="phc-input" id="ve_no${i}" type="number" min="1" max="9" value="${esc(d.DoseNo)}" aria-label="ครั้งที่"></label>
        <select class="phc-select" id="ve_sc${i}" aria-label="ใช้กับ" style="width:auto">${opt('ALL','ใช้กับทุกคน',d.Scheme==='ALL')}${opt('NEW','เฉพาะโปลิโอสูตรใหม่',d.Scheme==='NEW')}${opt('OLD','เฉพาะโปลิโอสูตรเดิม',d.Scheme==='OLD')}</select>
        <label class="vd-ac"><input type="checkbox" id="ve_ac${i}" ${d.Active!==false?'checked':''}> ใช้ครั้งนี้</label><button class="xbtn" onclick="veCollect();VE.doses.splice(${i},1);veDraw()" aria-label="ลบครั้งนี้">×</button></div>
      <div class="vd-grid">${field('อายุแนะนำ',durField('ve_ra'+i,d.RecAge),'',1)}${field('ให้ได้เร็วสุด',durField('ve_mi'+i,d.MinAge,'ว่าง'))}${field('ให้ได้ไม่เกินอายุ',durField('ve_mx'+i,d.MaxAge,'ว่าง'))}
        ${field('ห่างจากครั้งก่อนอย่างน้อย',durField('ve_gp'+i,d.MinGap,'ว่าง'))}${field('ต้องได้วัคซีนนี้ก่อน',reqSel(i,d.Requires))}${field('ห่างจากวัคซีนนั้นอย่างน้อย',durField('ve_rg'+i,d.RequiresGap,'ว่าง'))}</div></div>`).join('')}
    <button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="veCollect();const L=VE.doses[VE.doses.length-1];VE.doses.push({DoseNo:L?Number(L.DoseNo)+1:1,Scheme:L?L.Scheme:'ALL',RecAge:'',MinAge:'',MaxAge:'',MinGap:'',Requires:'',RequiresGap:'',Active:true});veDraw()">➕ เพิ่มครั้ง</button>

}
function veCollect(){
  if(VE.kind==='SEASONAL'||!$('ve_no0')&&!VE.doses.length) return;
  VE.doses=VE.doses.map((d,i)=>{ if(!$('ve_no'+i)) return d; const rq=$('ve_rq'+i).value, rn=$('ve_rn'+i).value;
    return {DoseNo:$('ve_no'+i).value,Scheme:$('ve_sc'+i).value,RecAge:durVal('ve_ra'+i),MinAge:durVal('ve_mi'+i),MaxAge:durVal('ve_mx'+i),MinGap:durVal('ve_gp'+i),Requires:rq&&rn?rq+':'+rn:'',RequiresGap:durVal('ve_rg'+i),Active:$('ve_ac'+i).checked}; });
}
async function vacSave(){
  veCollect();
  const p={isNew:VE.isNew,Code:$('veCode').value.trim().toUpperCase(),Name:$('veName').value.trim(),Kind:VE.system&&VE.v?VE.v.kind:$('veKind').value,SortOrder:Number($('veSort').value)||999,Active:$('veActive').checked,Note:$('veNote').value.trim(),
    Days:Array.from(document.querySelectorAll('#veDays input:checked')).map(x=>Number(x.value))};
  if(!p.Days.length){ toast('เลือกวันที่ฉีดอย่างน้อย 1 วัน',true); return; }
  if(p.Kind==='SEASONAL') Object.assign(p,{SeasonFrom:durVal('veSF'),SeasonTo:durVal('veST'),SeasonEvery:durVal('veSE'),FirstCourseDoses:Number($('veFD').value)||1,FirstCourseGap:durVal('veFG'),FirstCourseUnder:durVal('veFU'),doses:[]});
  else Object.assign(p,{StartBy:durVal('veSB'),MaxAge:durVal('veMA'),doses:VE.doses});
  const b=$('veB'); setBusy(b,true);
  try{ const r=await api('apiSaveVaccine',p); S.vacCfg=r.config; S.fixed.vaccines=r.vaccines; dirty(); closeModal(); toast('บันทึกตารางวัคซีนแล้ว'); drawSettings(); }catch(e){ toast(e.message,true); setBusy(b,false); }
}
async function vacDelete(){

}

function tplCopy(o){ return JSON.parse(JSON.stringify(o)); }

    <p class="small" style="margin:10px 0 0">${E.isNew?chip('ปีใหม่ ยังไม่บันทึก','warning'):chip('บันทึกแล้ว รุ่นที่ '+E.rev,'success')} ${E.dirty?chip('มีการแก้ที่ยังไม่บันทึก','warning'):''} <span class="muted">· รายงานใช้แบบฟอร์มของปีงบที่ “วันเริ่ม” อยู่ (ไม่มีปีนั้นใช้ปีก่อนหน้า)</span></p>
    <p class="muted xs" style="margin:6px 0 0">ชนิดรายการ: หัวหมวด · หัวข้อย่อย · นับจากข้อมูล (เลือกตัวนับและเงื่อนไข) · คำนวณจากข้ออื่น (ร้อยละ / ผลรวม / ผลต่าง) · กรอกเอง (กรอกตัวเลขในหน้ารายงาน) · ตารางเสริม — ปิด “แสดง” = ไม่แสดงในรายงาน แต่ยังใช้คำนวณข้ออื่นได้ (ปิดที่หัวหมวด = ซ่อนทั้งหมวด) · ข้อมูลชนิดใหม่ที่ระบบยังไม่มีช่องบันทึก ใช้ “กรอกเอง”</p></div>
    <div class="table-wrap"><table class="t tpl-t"><colgroup><col style="width:64px"><col><col style="width:30%"><col style="width:64px"><col style="width:232px"></colgroup><thead><tr><th>ข้อ</th><th>รายการ</th><th>ที่มาของตัวเลข</th><th>แสดง</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>

function tplAgeText(P){ return (P.fromOp==='gt'?'เกิน ':'')+P.fromM+' ด. – '+(P.toOp==='le'?'ถึง ':'ต่ำกว่า ')+P.toM+' ด.'; }
function tplNoOf(id){ const it=S.tplEdit.items.find(x=>x.ItemID===id); return it?(it.No||'('+String(it.Label).slice(0,18)+'…)'):'?'; }
function tplSrc(it){
  const P=it.Params||{}, C=S.tpl.catalog;
  if(it.Kind==='METRIC'){ const d=C.find(x=>x.code===it.Metric); if(!d) return esc(it.Metric);
    const ex=[]; if(d.age) ex.push(tplAgeText(P));
    d.params.forEach(x=>{ const v=P[x.k]; if(x.type==='vac') ex.push(v?vName(v)+(P.dose?' ครั้งที่ '+P.dose:''):'ทุกวัคซีน'); else if(x.type==='vaclist') ex.push('อายุครบ '+P.months+' ด. ได้ '+v); else if(x.type==='point') ex.push(v?'DSPM '+v+' ด.':'ทุกช่วงอายุ'); else if(x.type==='select') ex.push(x.options[v]||v); });
    return `<b>${esc(d.name)}</b><small>${esc(d.fields[P.field]||P.field)}${P.den?' ÷ '+esc(d.fields[P.den])+' × 100':''}${P.inline?' · (%) ของ '+esc(d.fields[P.inline]):''}${P.times?' · แสดงครั้ง':''}${ex.length?' · '+esc(ex.filter(x=>x!=='').join(' · ')):''}</small>`; }
  if(it.Kind==='FORMULA'){ const a=(P.a||[]).map(tplNoOf).join(' + '), b=(P.b||[]).map(tplNoOf).join(' + ');
    return `<b>${P.op==='sum'?'ผลรวม':P.op==='diff'?'ผลต่าง':'ร้อยละ'}</b><small>${P.op==='sum'?esc(a):P.op==='diff'?'('+esc(a)+') − ('+esc(b)+')':'('+esc(a)+') ÷ ('+esc(b)+') × 100'}</small>`; }
  if(it.Kind==='MANUAL') return '<b>กรอกเอง</b><small>กรอกตัวเลขในหน้ารายงาน แยกตามช่วงรายงาน</small>';
  if(it.Kind==='TABLE') return '<b>ตารางเสริม</b><small>'+esc(S.tpl.tables[it.Metric]||it.Metric)+'</small>';
  if(it.Kind==='HEAD') return '<small class="muted">หัวข้อย่อย</small>';
  return '';
}
function tplRow(it,i){
  const n=S.tplEdit.items.length;
  const acts=`<div class="row-acts"><button class="phc-btn phc-btn--ghost phc-btn--sm" ${i?'':'disabled'} onclick="tplMove(${i},-1)" aria-label="เลื่อนขึ้น">↑</button><button class="phc-btn phc-btn--ghost phc-btn--sm" ${i<n-1?'':'disabled'} onclick="tplMove(${i},1)" aria-label="เลื่อนลง">↓</button><button class="phc-btn phc-btn--edit phc-btn--sm" onclick="tplForm(${i})">แก้</button><button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="tplForm(-1,${i})" aria-label="เพิ่มต่อจากรายการนี้">➕</button><button class="phc-btn phc-btn--danger-soft phc-btn--sm" onclick="tplRemove(${i})" aria-label="ลบรายการ">ลบ</button></div>`;

function tplReadForm(){
  const T=S.tplDraft, D=T.D, g=id=>$(id)?$(id).value:undefined;
  if($('tfNo')) D.No=g('tfNo').trim(); if($('tfLabel')) D.Label=g('tfLabel').trim(); if($('tfUnit')) D.Unit=g('tfUnit').trim(); if($('tfNote')) D.Note=g('tfNote').trim();
  if($('tfAct')) D.Active=$('tfAct').checked;
  const k=g('tfKind'); if(k&&k!==D.Kind){ D.Kind=k; D.Params={}; if(k==='METRIC') D.Metric='VISIT'; if(k==='TABLE') D.Metric='VAC_TABLE'; return D; }
  if(D.Kind==='METRIC'){ const m=g('tfMetric'); if(m&&m!==D.Metric){ D.Metric=m; D.Params={}; return D; }
    const d=S.tpl.catalog.find(x=>x.code===D.Metric), P={};
    if(d.age){ P.fromM=Number(g('tfFromM')); P.fromOp=g('tfFromOp'); P.toM=Number(g('tfToM')); P.toOp=g('tfToOp'); }
    d.params.forEach(x=>{ const v=g('tfP_'+x.k); P[x.k]=(x.type==='int'||x.type==='point')?Number(v):v; });
    P.field=g('tfField'); if(g('tfDen')) P.den=g('tfDen'); if(g('tfInl')) P.inline=g('tfInl'); if($('tfTimes')&&$('tfTimes').checked) P.times=true;
    D.Params=P; }
  if(D.Kind==='FORMULA'){ const pick=nm=>Array.prototype.slice.call(document.querySelectorAll('input[name="'+nm+'"]:checked')).map(x=>x.value);
    const op=g('tfOp')||'pct', prev=D.Params||{}; D.Params={ op:op, a:$('tfBody').querySelector('input[name="tfA"]')?pick('tfA'):(prev.a||[]), b:$('tfBody').querySelector('input[name="tfB"]')?pick('tfB'):(prev.b||[]) }; }
  if(D.Kind==='TABLE') D.Metric=g('tfTable')||D.Metric;
  return D;
}
function tplAutoNote(){ const D=tplReadForm(), P=D.Params, a=(P.a||[]).map(tplNoOf), b=(P.b||[]).map(tplNoOf);

function tplFormApply(){

      <div class="phc-p-section"><h2>วัคซีน</h2><table class="phc-p-table"><thead><tr><th>วัคซีน</th><th>ได้รับแล้ว</th><th>ครั้งถัดไป</th></tr></thead><tbody>${vac}</tbody></table></div>
      <div class="phc-p-section"><h2>การมารับบริการ (ล่าสุด 20 ครั้ง)</h2><table class="phc-p-table"><thead><tr><th>วันที่</th><th>อายุ</th><th>น้ำหนัก</th><th>ยาว/สูง</th><th>โภชนาการ</th><th>วัคซีน</th></tr></thead><tbody>${vis||'<tr><td colspan="6">-</td></tr>'}</tbody></table></div>` });
