/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}
.phc-table .phc-num{text-align:right;font-variant-numeric:tabular-nums}
.phc-empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 20px;border:1px dashed var(--phc-border-input);border-radius:var(--phc-radius);background:var(--phc-surface);color:var(--phc-ink-2)}

/* ---------- หน้ายืนยัน ---------- */
.phc-dialog{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:20px;box-shadow:var(--phc-shadow-lg);display:flex;flex-direction:column;gap:12px}
.phc-dialog-title{margin:0;font-size:var(--phc-text-lg);font-weight:700}
.phc-dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){.phc-btn{transition:none}}
</style>

    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){
    var compact = o.density === 'compact';
    var landscape = o.orientation === 'landscape';
    var a5 = String(o.paper || '').toUpperCase() === 'A5';
    var body = a5 ? (compact ? '10.5px' : '12px') : (compact ? '12px' : '16px');
    var footerLeft = systemShort(o) + ' · พิมพ์' + (o.printedBy ? 'โดย ' + o.printedBy + ' ' : ' ') + (o.printedAt || thaiNow()) + ' · ' + CONFIDENTIAL;
    var margin = a5 ? '7mm 8mm 12mm' : (compact ? '12mm 12mm 16mm' : '18mm 18mm 20mm');
    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)
    var footStyle = ';font-family:Sarabun,serif;font-size:' + footFont + ';color:#4A5550;line-height:1.25;vertical-align:top;padding-top:' + (a5 ? '2.5mm' : '3.5mm');
    return ''
      + '@page{size:' + (a5 ? 'A5 ' : 'A4 ') + (landscape ? 'landscape' : 'portrait') + ';margin:' + margin + ';'
      +   '@bottom-left{content:' + cssStr(footerLeft) + footStyle + ';width:86%}'
      +   '@bottom-right{content:"หน้า " counter(page) "/" counter(pages)' + footStyle + ';white-space:nowrap}'
      + '}'
      + '*{box-sizing:border-box}'
      + 'html,body{margin:0;background:#fff}'
      + 'body{font-family:var(--phc-font-print,"Sarabun","TH Sarabun New",serif);font-family:"Sarabun","TH Sarabun New",serif;color:#17201A;font-size:' + body + ';line-height:' + (compact ? '1.35' : '1.5') + ';-webkit-print-color-adjust:exact;print-color-adjust:exact}'
      + '.phc-p-page{width:100%}'
      + 'table.phc-p-frame{width:100%;border-collapse:collapse;border:0;margin:0}'
      + 'table.phc-p-frame>thead>tr>td,table.phc-p-frame>tbody>tr>td{padding:0!important;border:0!important;background:none!important;vertical-align:top;text-align:left}'
      + 'table.phc-p-frame>thead{display:table-header-group}'
      + '.phc-p-head{display:flex;align-items:center;gap:' + (compact ? '10px' : '16px') + ';padding-bottom:' + (compact ? '6px' : '10px') + ';border-bottom:2px solid #15703A;margin-bottom:' + (compact ? '8px' : '12px') + '}'
      + '.phc-p-logo{width:' + (compact ? '48px' : '64px') + ';height:' + (compact ? '48px' : '64px') + ';object-fit:contain;flex:0 0 auto}'
      + '.phc-p-org{display:flex;flex-direction:column;flex:1;line-height:1.3;min-width:0}'
      + '.phc-p-org b{font-size:' + (compact ? '15px' : '19px') + ';color:#0E5A2E}'
      + '.phc-p-org span{font-size:' + (compact ? '12px' : '15px') + '}'
      + '.phc-p-org small{font-size:12px;color:#4A5550}'
      + '.phc-p-ref{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:12px;text-align:right;white-space:nowrap}'
      + '.phc-p-ref b{font-weight:700}'
      + '.phc-p-title{margin:' + (compact ? '2px 0 8px' : '4px 0 14px') + ';text-align:center;font-size:' + (compact ? '18px' : '24px') + ';line-height:1.3;font-weight:700}'
      + 'h2,.phc-p-section>h2{font-size:' + (compact ? '13px' : '18px') + ';font-weight:700;color:#0E5A2E;margin:' + (compact ? '6px 0 3px' : '12px 0 6px') + '}'
      + 'table{width:100%;border-collapse:collapse}'
      + '.phc-p-kv th,.phc-p-kv td,.phc-p-table th,.phc-p-table td{border:1px solid #A9B3AD;padding:' + (compact ? '3px 6px' : '5px 8px') + ';text-align:left;vertical-align:top}'
      + '.phc-p-kv th{width:26%;background:#F4F6F4;font-weight:600}'
      + '.phc-p-table th{background:#F4F6F4;font-weight:700}'
      + '.phc-p-num,.phc-p-table .phc-p-num,.phc-p-kv .phc-p-num{text-align:right;font-variant-numeric:tabular-nums}'
      + '.phc-p-grid2{display:grid;grid-template-columns:1fr 1fr;gap:' + (compact ? '8px' : '14px') + ';align-items:start}'
      + '.phc-p-avoid,.phc-p-section{break-inside:avoid;page-break-inside:avoid}'
      + '.phc-p-note{font-size:12px;color:#4A5550}'

  function a5Css(){

      + '.phc-p-logo{width:34px;height:34px}'
      + '.phc-p-org b{font-size:12px}.phc-p-org span{font-size:9.5px}.phc-p-org small{font-size:8.5px}'
      + '.phc-p-ref{font-size:9px}'
      + '.phc-p-title{font-size:14px;margin:0 0 5px}'
      + 'h2,.phc-p-section>h2{font-size:11px;margin:4px 0 2px}'
      + '.phc-p-note{font-size:9px}'
      + '.phc-p-sign{gap:20px;margin-top:12px}.phc-p-sign div{font-size:10px}';
  }

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';
  }

  function documentHtml(o){
    o = o || {};
    if (!o.title) throw new Error('PHC37Print.document: ต้องระบุ title');
    return '<!doctype html><html lang="th"><head><meta charset="utf-8">'
      + '<title>' + esc(o.title) + (o.docNo ? ' ' + esc(o.docNo) : '') + '</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">'
      + '<style>' + baseCss(o) + (o.extraCss || '') + '</style></head><body>'
      + '<div class="phc-p-page">'
      // หัวกระดาษอยู่ใน thead: เบราว์เซอร์พิมพ์ซ้ำทุกหน้า
      + '<table class="phc-p-frame" role="presentation"><thead><tr><td>' + letterhead(o) + '</td></tr></thead><tbody><tr><td>'
      + '<h1 class="phc-p-title">' + esc(o.title) + '</h1>'
      + (o.bodyHtml || '')
      + signatures(o.signatures)
      + '</td></tr></tbody></table>'
      + '</div></body></html>';
  }

  // พิมพ์ผ่าน iframe ซ่อน รอฟอนต์โหลดก่อนสั่งพิมพ์ (ฟอนต์ไม่มาภายใน 2.5 วินาทีก็พิมพ์ต่อ)
  function printHtml(html, opts){
    opts = opts || {};
    var frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('title', 'พิมพ์เอกสาร');
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(frame);
    var doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    var done = false;
    var go = function(){
      if (done) return; done = true;
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
        if (typeof opts.onDone === 'function') opts.onDone(null);
      } catch (err) {
        if (typeof opts.onDone === 'function') opts.onDone(err);
      }
      setTimeout(function(){ try { frame.remove(); } catch (e) {} }, 60000);
    };
    var waitFonts = function(){
      try {
        if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function(){ setTimeout(go, 50); });
        else setTimeout(go, 400);
      } catch (e) { setTimeout(go, 400); }
      setTimeout(go, 2500);
    };
    if (doc.readyState === 'complete') waitFonts();
    else frame.onload = waitFonts;
  }

  window.PHC37Print = {
    VERSION: 'PHC37-PRINT-1.0.3',
    CONFIDENTIAL: CONFIDENTIAL,
    ORG: ORG,
    LOGO: LOGO,
    esc: esc,
    thaiNow: thaiNow,
    document: documentHtml,
    print: printHtml
  };
})();
</script>

function refcParseHistoryHash_(hash){
  const raw=String(hash||'').replace(/^#/,'');
  if(!raw)return {token:'',view:{}};
  try{
    const p=new URLSearchParams(raw);
    return {
      token:String(p.get('rr')||''),
      view:{
        page:String(p.get('p')||''),
        workspaceRole:String(p.get('wr')||''),
        workspaceStatus:String(p.get('ws')||''),
        detailKey:String(p.get('d')||''),
        reportSection:String(p.get('rs')||'')
      }
    };
  }catch(e){return {token:'',view:{}}}
}

function refcBuildHistoryHash_(){
  const v=refcResumeViewObject_();
  const p=new URLSearchParams();
  if(REFC_REFRESH_RESUME_TOKEN)p.set('rr',REFC_REFRESH_RESUME_TOKEN);
  p.set('p',v.page||'dashboard');
  p.set('wr',v.workspaceRole||'received');
  if(v.workspaceStatus)p.set('ws',v.workspaceStatus);
  if(v.detailKey)p.set('d',v.detailKey);
  if(v.reportSection)p.set('rs',v.reportSection);
  return p.toString();

function refcHistorySync_(){

    detailKey:String(u.detailKey||local.detailKey||''),
    reportSection:String(u.reportSection||local.reportSection||'inbound')

function run(fn,args,options){
  options=options||{}; const showBusy=!options.background; const started=Date.now(); if(showBusy)setBusy(true);
  const L=window.PHC37Load, rel=(L&&showBusy)?L.clicked():function(){}; if(L&&showBusy)L.line.start();

  const kind=refcCallKind_(fn), limit=Number(options.timeoutMs)||REFC_TIMEOUT[kind], tries=kind==='read'?2:1;

    let settled=false, attempt=0, timer=null;
    const done=(res,err)=>{
      if(settled)return; settled=true; if(timer)clearTimeout(timer);
      const okFlag=!err&&(!!(res&&(res.success||res.ok))||!(res&&res.success===false));
      fin(okFlag); if(showBusy)setBusy(false);
      if(options.observe!==false)refcObserveCall_(fn,started,err?null:res,{});
      if(err)reject(err); else { if(!options.background)refcStallHide_(); resolve(res); }
    };
    const go=()=>{
      attempt++; const mine=attempt;

        e.code='REFC_TIMEOUT'; e.fn=fn;
        if(kind!=='boot'&&!options.background)refcStallNotice_(kind);
        done(null,e);

        google.script.run.withSuccessHandler(res=>done(res,null)).withFailureHandler(err=>{
          if(settled)return;
          if(mine===attempt&&attempt<tries&&kind==='read'){ if(timer)clearTimeout(timer); go(); return; }
          if(mine!==attempt)return;
          done(null,err);
        })[fn].apply(null,args||[]);
      }catch(e){ done(null,e); }
    };

}

async function init(){
  try{
    hydrateIcons(document);
    if(window.PHC37Load) PHC37Load.boot.show('กำลังตรวจสอบ Session ผ่าน PHC37 Gateway…','ระบบส่งต่อกลาง');
    loading('กำลังตรวจสอบ Session...');

    const topLocation=await refcGetTopLocation_();
    const hashState=refcParseHistoryHash_(topLocation&&topLocation.hash||'');
    REFC_URL_RESUME_VIEW=hashState.view||{};

    const launchToken=String(BOOT.launchToken||'').trim();
    const initialView=refcPickResumeView_(hashState.view||{});
    let res=null;

    // P4 composite resume: security validation + first useful page data in one round-trip.
    if(hashState.token){
      try{ res=await run('refcUiResumeWithRefreshToken',[hashState.token,initialView]); }
      catch(resumeErr){ if(!(resumeErr&&resumeErr.code==='REFC_TIMEOUT'))throw resumeErr; res=null; } /* REFC_UX_V1: ตอบช้า = เปิดใหม่ผ่าน Gateway */
    }

    // First launch from Gateway: consume one-time launch token only once + preload Dashboard.
    if(!ok(res)&&launchToken){
      res=await run('refcUiBootstrap',[launchToken,initialView]);
    }


    if(!ok(res)){refcResumeFailed_();return;}
    state.sessionToken=res.sessionToken||'';
    state.user=res.user||{};
    state.userProfile=res.userProfile||{};
    state.permission=res.permission||{};
    state.lists=res.lists||state.lists;
    REFC_REFRESH_RESUME_TOKEN=String(res.refreshResumeToken||hashState.token||'').trim();
    refcPrimeRuntimeBundle_(res.runtimeBundle);
    if(!state.user.workGroup&&state.userProfile.workGroup)state.user.workGroup=state.userProfile.workGroup;
    $('userBox').innerHTML=`${esc(state.user.fullName||state.user.username||'ผู้ใช้งาน')}<br>${esc(state.user.role||'')}${state.user.workGroup?` · ${esc(state.user.workGroup)}`:''}`;
    alertBox('');
    if(window.PHC37Load) PHC37Load.boot.hide();
    await refcRestoreResumeView_(REFC_URL_RESUME_VIEW);
  }catch(err){
    alertBox(err.message||String(err),'err');
    if(window.PHC37Load && !state.sessionToken){
      const slow=err&&err.code==='REFC_TIMEOUT';
      PHC37Load.boot.fail(slow?'ระบบตอบช้าเกินไป กรุณาเปิดระบบส่งต่อใหม่จาก Gateway':((err&&err.message)||'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ'), slow?goGateway:function(){ location.reload(); });
      try{ const act=document.querySelector('.phc-ld-act'); if(act&&slow){ const g=document.createElement('button'); g.type='button'; g.className='phc-btn phc-btn--secondary'; g.textContent='↻ ลองใหม่ในหน้านี้'; g.onclick=function(){ location.reload(); }; act.appendChild(g); } }catch(e2){}
    }
  }
}

function pickPatient(p){ ['PatientID','HN','CID','PatientName','PatientPhone'].forEach(k=>{ if($(k)) $(k).value = p[k] || ''; }); if($('AddressText')) $('AddressText').value = p.AddressText || buildPatientAddressClient(p);

function buildPatientAddressClient(p){ p=p||{}; const parts=[]; const direct=p.AddressText||p.Address||p.address||''; if(direct)parts.push(direct); const add=(label,v)=>{v=String(v||'').trim();if(v&&!parts.join(' ').includes(v))parts.push(label+v)}; add('บ้านเลขที่ ',p.HouseNo||p.houseNo); add('หมู่ ',p.Moo||p.moo); add('ซอย ',p.Soi||p.soi); add('ถนน ',p.Road||p.road); add('แขวง/ตำบล ',p.SubDistrict||p.subDistrict); add('เขต/อำเภอ ',p.District||p.district); add('จังหวัด ',p.Province||p.province); add('',p.ZipCode||p.zipCode); return parts.join(' ').replace(/\s+/g,' ').trim(); }

function renderBatchTimeline(activities,pullLogs,batch){

function batchTimelineSortValue(value){

}

function timelineDateParts(value){

}

function printHtmlByIframe(html, mode, fileName){

  frame.style.right = '0';
  frame.style.bottom = '0';
  frame.style.width = '0';
  frame.style.height = '0';

    let doc = PHC37Print.document({
      title: o.title,
      systemName: REFC_PRINT_SYSTEM_NAME,
      docNo: o.docNo || '',
      docDate: o.docDate || '',
      meta: o.meta || [],
      printedBy: o.printedBy || '',
      printedAt: o.printedAt || '',
      orientation: 'landscape',
      density: 'compact',
      bodyHtml: o.bodyHtml || '',
      paper: o.pageMode === 'A5' ? 'A5' : 'A4',
      extraCss: o.extraCss || ''
    });
    const docTitle = String(o.fileName || o.title || 'เอกสาร').replace(/\.pdf$/i,'');
    doc = doc.replace(/<title>[\s\S]*?<\/title>/,'<title>'+esc(docTitle)+'</title>');
    PHC37Print.print(doc,{onDone:function(err){
      if(err) alertBox('เปิดหน้าพิมพ์ไม่สำเร็จ: '+(err && err.message ? err.message : String(err)),'err');
      else alertBox('เปิดหน้าพิมพ์แล้ว กรุณาเลือก Destination เป็น Save as PDF','ok');

  }
}

function submitActionDialog(){
  const options = actionDialogState.options || {};
  if(options.showInput){
    const input = $('actionDialogInput');
    const value = String(input ? input.value : '').trim();
    if(options.required && !value){
      const err = $('actionDialogError');
      if(err) err.textContent = 'กรุณาระบุข้อมูลก่อนยืนยัน';
      if(input) input.focus();
      return;
    }
    closeActionDialog(value);
    return;
  }
  closeActionDialog(true);
}
function closeActionDialog(result){
  const resolve = actionDialogState.resolve;
  actionDialogState.resolve = null;
  actionDialogState.options = null;
  if($('actionModalHost')) $('actionModalHost').innerHTML = '';
  if(resolve) resolve(result);
}
document.addEventListener('keydown', function(event){

});

function refcPrefillResultForm_(prefill){
  Object.keys(prefill||{}).forEach(k=>{
    const v=prefill[k]; const el=document.getElementById('rf_'+k); if(!el) return;
    if(el.getAttribute('data-thai-date')==='1'){ const iso=String(v||'').slice(0,10); if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){ el.value=iso; const d=$('rf_'+k+'Display'); if(d) d.value=fmtDateBE(iso); } return; }
    if(el.matches('input,select,textarea')){ el.value=Array.isArray(v)?v.join(', '):String(v==null?'':v); return; }
    const vals=(Array.isArray(v)?v:[v]).map(String);
    el.querySelectorAll('input').forEach(x=>{ x.checked=vals.indexOf(String(x.value))>=0; });
  });

function thaiDateInputHtml_(id,attr,ph){
  return `<div class="thai-date-field"><input id="${id}Display" placeholder="${esc(ph||'วว/ดด/ปปปป พ.ศ.')}" inputmode="numeric" autocomplete="off" onchange="thaiDateTyped_('${id}')" onclick="openThaiReportCalendar('${id}','${id}Display')"><input type="hidden" ${attr} data-thai-date="1" id="${id}" value=""><button type="button" class="thai-date-trigger" onclick="openThaiReportCalendar('${id}','${id}Display')">▦</button></div>`;
}
function thaiDateTyped_(id){
  const shown=$(id+'Display'),hidden=$(id); if(!shown||!hidden) return;
  const m=String(shown.value||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(!m){ hidden.value=''; if(shown.value) alertBox('รูปแบบวันที่ต้องเป็น วว/ดด/ปปปป พ.ศ. เช่น 06/10/2569','err'); return; }
  let y=Number(m[3]); if(y>2400) y-=543; const mo=Number(m[2]),d=Number(m[1]); const dt=new Date(y,mo-1,d,12);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d){ hidden.value=''; alertBox('วันที่ไม่ถูกต้อง','err'); return; }
  hidden.value=`${y}-${pad2(mo)}-${pad2(d)}`; shown.value=fmtDateBE(hidden.value); alertBox('');
}

function renderDynamicField(f){
  const key = esc(f.FieldKey || 'field');
  const label = esc(f.FieldLabel || key);
  const req = f.RequiredBool || String(f.Required||'').toLowerCase()==='true';
  const type = String(f.FieldType || 'text').toLowerCase();
  const ph = esc(f.Placeholder || '');
  const help = f.HelpText ? `<div class="field-help">${esc(f.HelpText)}</div>` : '';
  const mark = req ? '<span class="required-mark">*</span>' : '';
  const attr = `data-field-key="${key}" data-required="${req?'1':'0'}"`;
  let input = '';
  if(type === 'textarea') input = `<textarea ${attr} id="rf_${key}" placeholder="${ph}"></textarea>`;
  else if(type === 'select'){
    let opts = Array.isArray(f.Options) ? f.Options : [];
    if((f.FieldKey||'') === 'community' && (!opts || !opts.length)) opts = (state.lists.communities||[]).map(x=>({value:x.value||x.community||x.label,label:x.label||x.community||x.value}));
    input = `<select ${attr} id="rf_${key}"><option value="">เลือก${label}</option>${opts.map(o=>`<option value="${esc(o.value||o.label||o)}">${esc(o.label||o.value||o)}</option>`).join('')}</select>`;
  } else if(type === 'radio'){
    const opts = Array.isArray(f.Options) ? f.Options : [];
    input = `<div class="radio-row" ${attr} id="rf_${key}">${opts.map((o,i)=>`<label class="choice-chip"><input type="radio" name="rf_${key}" value="${esc(o.value||o.label||o)}">${esc(o.label||o.value||o)}</label>`).join('')}</div>`;
  } else if(type === 'checkbox'){
    const opts = Array.isArray(f.Options) ? f.Options : [];
    input = `<div class="check-row" ${attr} id="rf_${key}">${opts.map((o,i)=>`<label class="choice-chip"><input type="checkbox" name="rf_${key}" value="${esc(o.value||o.label||o)}">${esc(o.label||o.value||o)}</label>`).join('')}</div>`;
  } else if(type === 'date'){
    // REFC_FORMS_FY_V1: วันที่ dd/mm/yyyy พ.ศ. (ค่าที่ส่งยังเป็น yyyy-mm-dd แบบเดิม)
    input = thaiDateInputHtml_('rf_'+key, attr, ph);
  } else {
    const htmlType = ['number','tel','email','time'].includes(type) ? type : 'text';
    input = `<input type="${htmlType}" ${attr} id="rf_${key}" placeholder="${ph}">`;
  }
  const col = f.ColClass || (type === 'textarea' ? 'col-12' : 'col-6');
  return `<div class="${col} dynamic-field"><label>${label}${mark}</label>${input}${help}</div>`;
}
function collectResultFormPayload(){
  const payload = {};
  const missing = [];
  document.querySelectorAll('#modalHost [data-field-key]').forEach(el => {
    const key = el.getAttribute('data-field-key');
    const req = el.getAttribute('data-required') === '1';
    let val = '';
    // REFC_RESULT_FORM_FIX_V1 (07/10/2569): แยก 3 กรณี ช่องวันที่ พ.ศ. / ช่องกรอกทั่วไป / กลุ่มช่องติ๊ก
    if(el.getAttribute('data-thai-date')==='1'){
      val = el.value || '';
      const shown=$(el.id+'Display'); if(shown&&shown.value&&!val){ missing.push(key+':date'); }
    } else if(el.matches('input,select,textarea')){
      val = el.value || '';
    } else {
      const checked = Array.from(el.querySelectorAll('input:checked')).map(x=>x.value);
      val = checked.length > 1 ? checked : (checked[0] || '');
    }
    payload[key] = val;
    if(req && (!val || (Array.isArray(val) && !val.length))) missing.push(key);
  });
  return { payload, missing };
}

  const res = await run('refcUiCompleteReferral',[state.sessionToken, referralID, {TemplateID: formValue('ResultTemplateID'), ResultStatus:'completed', ResultSummary:summary, ResultNote:summary, ResultPayloadJSON:data.payload}]);
  if(!ok(res)){ $('resultFormMsg').innerHTML = `<div class="alert err">${esc(res.message||'บันทึกไม่สำเร็จ')}</div>`; return; }

function openThaiReportCalendar(hiddenId,displayId){
  const hidden=$(hiddenId),display=$(displayId); if(!hidden||!display) return;
  const m=String(hidden.value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const base=m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12):new Date();
  reportThaiCalendarState={hiddenId,displayId,year:base.getFullYear(),month:base.getMonth()};
  renderThaiReportCalendar();

function renderThaiReportCalendar(){
  if(!reportThaiCalendarState) return;

function collectReportFilters(){

    status:value('rptStatus'), priority:value('rptPriority'), mode:value('rptMode'),
    overdue:value('rptOverdue'), pulledBack:value('rptPulledBack'), keyword:value('rptKeyword'),

  if(!/^\d{4}$/.test(filter.fiscalYearBE||'')){ alertBox('กรุณาเลือกปีงบประมาณ','err'); return; }
  { const fy=Number(filter.fiscalYearBE)-543, fyStart=`${fy-1}-10-01`, fyEnd=`${fy}-09-30`;
    if((filter.dateFrom&&(filter.dateFrom<fyStart||filter.dateFrom>fyEnd))||(filter.dateTo&&(filter.dateTo<fyStart||filter.dateTo>fyEnd))){ alertBox(`ช่วงวันที่ต้องอยู่ในปีงบประมาณ ${filter.fiscalYearBE} (01/10/${Number(filter.fiscalYearBE)-1} – 30/09/${filter.fiscalYearBE})`,'err'); return; } }
  if(filter.dateFrom&&filter.dateTo&&filter.dateFrom>filter.dateTo){ alertBox('วันที่เริ่มต้นต้องไม่เกินวันที่สิ้นสุด','err'); return; }

}

async function loadReportData(force){
  if(!state.reportHasSearched){ renderReportIdle(); return; }
  try{
    if(!$('reportContent')) renderReportsPageShell();
    const section=state.reportSection||'inbound'; state.reportFilter=state.reportFilter||{}; state.reportFilter.page=state.reportPage||1; if(!state.reportFilter.pageSize)state.reportFilter.pageSize=50;
    const cacheKey='report|'+section+'|'+refcStableKey_(state.reportFilter); const reqScope='report'; const req=refcNextRequest_(reqScope); const cached=!force?refcCacheGet_(cacheKey):null;
    if(!cached)$('reportContent').innerHTML=inlineLoading(`กำลังโหลด${REPORT_SECTION_META[section].title}...`);
    const fn=force?'refcUiRefreshReportSection':'refcUiGetReportSection';
    const res=cached||await refcRunCached_(fn,[state.sessionToken,section,state.reportFilter],{key:cacheKey,ttl:REFC_RUNTIME_TTL.report,force:!!force});
    if(!refcIsLatestRequest_(reqScope,req)){REFC_RUNTIME_METRICS.staleDrops++;return;}
    if(!ok(res)){ $('reportContent').innerHTML=`<div class="alert err">${esc(res&&res.message||'โหลดรายงานไม่สำเร็จ')}</div>`; return; }
    state.reportData=res; state.reportAccess=res.access||state.reportAccess||reportClientAccess();
    state.reportFilter=Object.assign({},res.filter||state.reportFilter,{page:state.reportPage||1,pageSize:state.reportFilter.pageSize||50});

}

function changeReportPage(delta){
  const p = state.reportData && state.reportData.pagination;
  if(!p) return;
  const next = Math.max(1,Math.min(p.totalPages,(p.page||1)+delta));

  state.reportPage = next;
  state.reportFilter.page = next;
  loadReportData(false);
}

async function openReportDetail(kind,id){

function reportPrintFilterText(filter){
  filter=filter||{};
  const items=[];
  const add=(label,value)=>{ if(value&&value!=='all') items.push(`${label}: ${value}`); };
  add('ปีงบประมาณ',filter.fiscalYearBE?`พ.ศ. ${filter.fiscalYearBE}`:'');
  add('ตั้งแต่',filter.dateFrom?fmtDateBE(filter.dateFrom):'');
  add('ถึง',filter.dateTo?fmtDateBE(filter.dateTo):'');
  add('ต้นทาง',filter.fromWorkGroup); add('ปลายทาง',filter.toWorkGroup);
  add('สถานะ',filter.status?statusText(filter.status):'');
  add('ความสำคัญ',filter.priority?reportPriorityLabel(filter.priority):'');
  add('รูปแบบ',filter.mode==='batch'?'กลุ่ม':(filter.mode==='individual'?'รายบุคคล':''));
  add('กำหนดเวลา',filter.overdue==='overdue'?'เกินกำหนด':(filter.overdue==='not_overdue'?'ไม่เกินกำหนด':''));
  add('การดึงผล',filter.pulledBack==='YES'?'ดึงผลแล้ว':(filter.pulledBack==='NO'?'ยังไม่ดึงผล':''));
  add('คำค้น',filter.keyword);
  return items.join(' · ') || 'ทุกข้อมูลตามขอบเขตสิทธิ์';
}

    headers=['ลำดับ','เลขกลุ่ม / ชื่อกลุ่ม','ปลายทาง','รายการ','ค้าง','เสร็จ','ดึงผล','เกินกำหนด','สถานะ'];
    cells=(r,i)=>[i+1,`${r.BatchSN||'-'}\n${r.BatchName||''}`,r.ToWorkGroup,r.TotalItems,r.PendingCount,r.CompletedCount,r.PulledBackCount,r.OverdueCount,r.StatusTH||statusText(r.Status)];
  }else if(section==='results'){

    cells=(r,i)=>[i+1,`${r.ReferralSN||'-'}\n${r.CreatedAtBE||''}`,`${r.HN||'-'}\n${r.CIDMasked||'-'}`,r.PatientName,r.ToWorkGroup,r.ResultSummary,r.CreatedByName];
  }else if(section==='quality'){
    headers=['ลำดับ','ประเด็น','เลขอ้างอิง','HN / CID / ชื่อ','กลุ่มงาน','รายละเอียด'];
    cells=(r,i)=>[i+1,r.IssueLabel,`${r.ReferralSN||r.BatchSN||'-'}`,`${r.HN||'-'}\n${r.CIDMasked||'-'}\n${r.PatientName||'-'}`,r.ToWorkGroup,r.Detail];
  }else{
    headers=['ลำดับ','เลขส่งต่อ / วันที่','HN / CID / ผู้รับบริการ','เส้นทางงาน','ความสำคัญ / สถานะ','กำหนดเวลา'];
    cells=(r,i)=>[i+1,`${r.ReferralSN||'-'}\n${r.ReferralDateBE||r.CreatedAtBE||''}`,`${r.HN||'-'}\n${r.CIDMasked||'-'}\n${r.PatientName||'-'}`,`${r.FromWorkGroup||'-'} → ${r.ToWorkGroup||'-'}`,`${r.PriorityTH||'-'}\n${r.ReferralStatusTH||'-'}`,`${r.DueDateBE||'ไม่ระบุ'}${r.OverdueDays?`\nเกิน ${r.OverdueDays} วัน`:''}`];
  }
  if(!rows.length) return '<div class="print-empty">ไม่มีรายการตามตัวกรอง</div>';
  return `<table class="data-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${cells(r,i).map(v=>`<td>${esc(v==null?'':v).replace(/\\n/g,'<br>')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function refcP6Visible_(el){
  if(!el)return false;

function refcP6DialogHost_(dialog){return dialog&&dialog.closest('#actionModalHost')?$('actionModalHost'):$('modalHost');}
function refcP6EnhanceDialog_(host){
  if(!host)return;

  if(!dialog)return;
  if(!REFC_P6_DIALOG_FOCUS.has(host))REFC_P6_DIALOG_FOCUS.set(host,document.activeElement&&document.activeElement!==document.body?document.activeElement:null);
  dialog.setAttribute('role','dialog'); dialog.setAttribute('aria-modal','true'); dialog.setAttribute('tabindex','-1');
  let title=dialog.querySelector('.action-modal-title,.modal-title');
  if(title){ if(!title.id)title.id='refcP6DialogTitle'+(++REFC_P6_TITLE_SEQ); dialog.setAttribute('aria-labelledby',title.id); }

      const preferred=dialog.querySelector('textarea,input:not([type="hidden"]),select,[data-autofocus]');

function refcP6RestoreFocus_(host){
  if(!host)return;
  const previous=REFC_P6_DIALOG_FOCUS.get(host); REFC_P6_DIALOG_FOCUS.delete(host);
  if(!$('modalHost')?.querySelector('.modal')&&!$('actionModalHost')?.querySelector('.action-modal-card'))document.body.classList.remove('refc-modal-open');

function refcP6TrapFocus_(event,dialog){
  if(event.key!=='Tab'||!dialog)return false;
  const items=refcP6Focusables_(dialog); if(!items.length){event.preventDefault();dialog.focus();return true;}
  const first=items[0],last=items[items.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();return true;}
  if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();return true;}
  return false;
}
