(function () {
  var P = null; try { P = window.parent && window.parent !== window ? window.parent.PHC37 : null; } catch (e) { P = null; }
  function send(fn, args) {
    if (!P) return Promise.reject(new Error('เปิดหน้านี้จากแอป PHC37 เท่านั้น'));
    return P.api('oss.call', { token: P.token(), fn: fn, args: args }).then(function (r) {

      return r;
    });
  }
  function runner(ok, fail) {

      if (k === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (k === 'withFailureHandler') return function (f) { return runner(ok, f); };
      if (k === 'withUserObject') return function () { return runner(ok, fail); };
      return function () {
        var args = [].slice.call(arguments);

/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}
.phc-table th{background:var(--phc-ground);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--phc-border);white-space:nowrap}
.phc-table td{padding:12px 16px;border-bottom:1px solid #EEF1EF;vertical-align:top}
.phc-table .phc-num{text-align:right;font-variant-numeric:tabular-nums}
.phc-empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 20px;border:1px dashed var(--phc-border-input);border-radius:var(--phc-radius);background:var(--phc-surface);color:var(--phc-ink-2)}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';
  }

  function documentHtml(o){
    o = o || {};
    if (!o.title) throw new Error('PHC37Print.document: ต้องระบุ title');
    return '<!doctype html><html lang="th"><head><meta charset="utf-8">'
      + '<title>' + esc(o.title) + (o.docNo ? ' ' + esc(o.docNo) : '') + '</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">'
      + '<style>' + baseCss(o) + (o.extraCss || '') + '</style></head><body>'
      + '<div class="phc-p-page">'
      // หัวกระดาษอยู่ใน thead: เบราว์เซอร์พิมพ์ซ้ำทุกหน้า
      + '<table class="phc-p-frame" role="presentation"><thead><tr><td>' + letterhead(o) + '</td></tr></thead><tbody><tr><td>'
      + '<h1 class="phc-p-title">' + esc(o.title) + '</h1>'
      + (o.bodyHtml || '')
      + signatures(o.signatures)
      + '</td></tr></tbody></table>'
      + '</div></body></html>';
  }

  // พิมพ์ผ่าน iframe ซ่อน รอฟอนต์โหลดก่อนสั่งพิมพ์ (ฟอนต์ไม่มาภายใน 2.5 วินาทีก็พิมพ์ต่อ)
  function printHtml(html, opts){
    opts = opts || {};
    var frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('title', 'พิมพ์เอกสาร');
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(frame);
    var doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    var done = false;
    var go = function(){
      if (done) return; done = true;
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
        if (typeof opts.onDone === 'function') opts.onDone(null);
      } catch (err) {
        if (typeof opts.onDone === 'function') opts.onDone(err);
      }
      setTimeout(function(){ try { frame.remove(); } catch (e) {} }, 60000);
    };
    var waitFonts = function(){
      try {
        if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function(){ setTimeout(go, 50); });
        else setTimeout(go, 400);
      } catch (e) { setTimeout(go, 400); }
      setTimeout(go, 2500);
    };
    if (doc.readyState === 'complete') waitFonts();
    else frame.onload = waitFonts;
  }

  window.PHC37Print = {
    VERSION: 'PHC37-PRINT-1.0.3',
    CONFIDENTIAL: CONFIDENTIAL,
    ORG: ORG,
    LOGO: LOGO,
    esc: esc,
    thaiNow: thaiNow,
    document: documentHtml,
    print: printHtml
  };
})();
</script>

<script>
const BOOT = {"version":"OSS2-1.0.3","appName":"ระบบประเมินสุขภาพ อสส.","launchToken":"","returnUrl":""};
const S = { token:'', user:null, dash:null, page:'dashboard', settings:{}, text:{}, endReasons:[], fyOptions:[], list:null, listAt:0, comms:null,
  board:null, boardFy:0, boardTab:'all', follow:null, followTab:'open', report:null, reportFy:0, file:null, fileFy:0, fileTab:'summary', back:'registry',
  filters:{q:'',c:'',s:'ACTIVE',a:''}, bf:{q:'',c:''}, ff:{q:'',c:''} };
const TH_M = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TITLES = {dashboard:'ภาพรวม',registry:'ทะเบียน อสส.',board:'ประเมินประจำปี',follow:'ต้องติดตาม',reports:'รายงาน',settings:'ตั้งค่า',file:'แฟ้ม อสส.'};
const SEX_TH = {MALE:'ชาย',FEMALE:'หญิง'};
const $ = id => document.getElementById(id);
const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = v => { const t=String(v == null ? '' : v); let o=''; for(let i=0;i<t.length;i++){ const c=t[i]; o+=ESC_MAP[c]||c; } return o; };
/* text helpers without regex literals (Apps Script page transform safety) */
function isDigit(c){ return c>='0'&&c<='9'; }
function digits(t){ t=String(t==null?'':t); let o=''; for(let i=0;i<t.length;i++) if(isDigit(t[i])) o+=t[i]; return o; }
function allDigits(t,n){ t=String(t==null?'':t); if(n!==undefined&&t.length!==n) return false; if(!t.length) return false; for(let i=0;i<t.length;i++) if(!isDigit(t[i])) return false; return true; }
function isKeyStr(v){ return typeof v==='string'&&v.length===10&&v[4]==='-'&&v[7]==='-'&&allDigits(v.slice(0,4))&&allDigits(v.slice(5,7))&&allDigits(v.slice(8,10)); }

/* ---------- dates ---------- */
function keyOf(v){ if(!v) return ''; if(isKeyStr(v)) return v; const d=new Date(v); if(isNaN(d)) return ''; return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); }
function thDate(v,full){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-').map(Number); return d+' '+(full?TH_M:TH_MS)[m-1]+' '+(y+543); }
function shortDate(v){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-'); return d+'/'+m+'/'+(Number(y)+543); }
function thDateTime(v){ if(!v) return '-'; const d=new Date(v); if(isNaN(d)) return '-'; const t=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); return shortDate(v)+' '+t+' น.'; }
function todayKey(){ return keyOf(new Date()); }
function fyOf(k){ const [y,m]=k.split('-').map(Number); return y+543+(m>=10?1:0); }
function ageAt(birth, at){ if(!birth||!at) return ''; const [by,bm,bd]=birth.split('-').map(Number), [ay,am,ad]=at.split('-').map(Number); let a=ay-by; if(am<bm||(am===bm&&ad<bd)) a--; return a; }

/* ---------- server ---------- */
function callRaw_(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(r=>{
      if(!r){ reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); return; }
      if(!r.ok){ { const mm=String(r.message||''); if(mm.indexOf('Session')>=0||mm.indexOf('เปิดระบบใหม่')>=0) sessionLost(); } reject(new Error(r.message||'เกิดข้อผิดพลาด')); return; }
      resolve(r.data !== undefined ? r.data : r);
    }).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}
/* PHC37Load (UI Kit 1.2.0): เส้นวิ่งด้านบนระหว่างรอเซิร์ฟเวอร์ (ขึ้นเมื่อรอเกิน 0.3 วินาที) */
function call(fn, ...args){
  const L=window.PHC37Load; if(L) L.line.start();
  return callRaw_(fn, ...args).then(v=>{ if(L) L.line.done(); return v; }, e=>{ if(L) L.line.fail(); throw e; });
}
/* โครงเทาแบบรายการ (UI Kit 1.2.0) */
function phcSk(n){ let h='<div class="phc-sk-lines" aria-busy="true"><span class="sr-only" role="status">กำลังโหลด…</span>'; const W=[92,78,85,70,88,64]; for(let k=0;k<(n||4);k++) h+='<span class="phc-sk" style="height:16px;width:'+W[k%W.length]+'%"></span>'; return h+'</div>'; }
function api(fn, ...args){ return call(fn, S.token, ...args); }
function sessionLost(){ try{ sessionStorage.removeItem('oss2.session'); }catch(e){} }

/* ---------- common ---------- */
function toast(msg, err){ const el=document.createElement('div'); el.className='phc-toast'+(err?' err':''); el.textContent=msg; $('toasts').appendChild(el); setTimeout(()=>el.remove(), err?7000:3800); }
function setBusy(btn, on, text){ if(!btn) return;
  if(on){ if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.setAttribute('aria-busy','true');
    const plain=btn.classList.contains('phc-btn--secondary')||btn.classList.contains('phc-btn--ghost')||btn.classList.contains('phc-btn--edit')||btn.classList.contains('phc-btn--danger-soft')||!btn.classList.contains('phc-btn');
    const t=text||'กำลังบันทึก…'; btn.innerHTML=String(t).indexOf('spinner')>=0?t:'<span class="phc-spin'+(plain?'':' phc-spin--light')+'" aria-hidden="true"></span> '+t; }
  else { btn.disabled=false; btn.removeAttribute('aria-busy'); delete btn.dataset.busy; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }
function openModal(title, body, foot, size){ $('modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal ${size||''}" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button class="xbtn" type="button" onclick="closeModal()" aria-label="ปิด">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`; }
function closeModal(){ closeCal(); $('modalRoot').innerHTML=''; }
function confirmBox(title, html, okText, danger){
  return new Promise(res=>{
    const root=document.createElement('div');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body">${html}</div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="0">ยกเลิก</button><button class="phc-btn ${danger?'phc-btn--danger':''}" data-a="1">${esc(okText||'ยืนยัน')}</button></div></div></div>`;
    document.body.appendChild(root);
    root.addEventListener('click',e=>{ const a=e.target.getAttribute&&e.target.getAttribute('data-a'); if(a===null||a===undefined) return; root.remove(); res(a==='1'); });
  });
}
function reasonBox(title, html, label, ph, okText, min){
  min=min||3;
  return new Promise(res=>{
    const root=document.createElement('div');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body"><div style="margin:0 0 10px">${html}</div><label class="phc-label">${esc(label)} <span class="phc-required">*</span></label><textarea class="phc-input" data-r="1" rows="3" placeholder="${esc(ph||'')}"></textarea><div data-err="1" style="color:#B42318;font-size:13px;min-height:18px"></div></div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="0">ยกเลิก</button><button class="phc-btn phc-btn--danger" data-a="1">${esc(okText||'ยืนยัน')}</button></div></div></div>`;
    document.body.appendChild(root);
    const ta=root.querySelector('[data-r]'); setTimeout(()=>ta.focus(),50);
    root.addEventListener('click',e=>{ const a=e.target.getAttribute&&e.target.getAttribute('data-a'); if(a===null||a===undefined) return; if(a==='0'){ root.remove(); res(null); return; } const v=ta.value.trim(); if(v.length<min){ root.querySelector('[data-err]').textContent='กรุณาระบุเหตุผลอย่างน้อย '+min+' ตัวอักษร'; return; } root.remove(); res(v); });
  });
}
function avatarChar(n){ n=String(n||'?').trim(); const pre=['นางสาว','นาย','นาง','ดร.']; for(const p of pre){ if(n.indexOf(p)===0){ n=n.slice(p.length).trim(); break; } } return n.charAt(0)||'?'; }

function opt(v,t,sel){ return `<option value="${esc(v)}" ${sel?'selected':''}>${esc(t)}</option>`; }
function aChip(st, done, req){ if(st==='COMPLETE') return chip('ครบแล้ว','success'); if(st==='INCOMPLETE') return chip('ยังไม่ครบ '+(done||0)+'/'+(req||0),'warning'); return chip('ยังไม่ประเมิน','neutral'); }
function prChip(p){ return p==='URGENT'?chip('เร่งด่วน','danger'):(p==='HIGH'?chip('ควรติดตามเร็ว','warning'):chip('ติดตามตามปกติ','info')); }
function resChip(r){ return ({NORMAL:chip('ปกติ','success'),RISK:chip('เสี่ยง','warning'),ABNORMAL:chip('ผิดปกติ','danger'),UNABLE:chip('ประเมินไม่ได้','neutral'),REDO:chip('ต้องบันทึกใหม่','warning')})[r]||chip('ยังไม่บันทึก','neutral'); }
function commNames(rows){ return [...new Set(rows.map(r=>r.CommunityName||'ไม่ระบุชุมชน'))].sort((a,b)=>a.localeCompare(b,'th')); }
function norm(s){ s=String(s||'').toLowerCase(); let o=''; for(let i=0;i<s.length;i++){ const c=s[i]; if(c!==' '&&c!=='\t'&&c!=='\n'&&c!=='\r'&&c!=='\u00a0') o+=c; } return o; }

/* ---------- Thai calendar (B.E.) ---------- */
let CAL=null;
function dateField(id, key, opts){ opts=opts||{}; const typed=!!opts.typed;
  return `<div class="date-field"><input class="phc-input ${typed?'typed':''}" id="${id}" data-key="${esc(key||'')}" data-max="${esc(opts.max||'')}" data-min="${esc(opts.min||'')}" value="${key?esc(shortDate(key)):''}" ${typed?`inputmode="numeric" oninput="typedDate('${id}')" onblur="typedDate('${id}',1)"`:`readonly onclick="openCal('${id}')"`} placeholder="วว/ดด/ปปปป (พ.ศ.)">${typed?`<button type="button" class="cal-btn" onclick="openCal('${id}')" aria-label="เลือกจากปฏิทิน">📅</button>`:''}</div>`; }
function parseThai(t){ t=String(t||'').trim(); const parts=[]; let cur=''; for(let i=0;i<t.length;i++){ if(isDigit(t[i])) cur+=t[i]; else { parts.push(cur); cur=''; } } parts.push(cur); if(parts.length!==3||parts[0].length<1||parts[0].length>2||parts[1].length<1||parts[1].length>2||parts[2].length!==4) return ''; const m=[t,parts[0],parts[1],parts[2]]; let y=Number(m[3]); if(y>2400) y-=543; const mo=Number(m[2]), d=Number(m[1]); const dt=new Date(Date.UTC(y,mo-1,d)); if(dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return ''; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function typedDate(id, final){ const el=$(id); const k=parseThai(el.value); el.dataset.key=k; if(final&&k) el.value=shortDate(k); el.style.borderColor=(el.value&&!k)?'#B42318':''; el.dispatchEvent(new Event('change')); }
function dateVal(id){ const el=$(id); return el?(el.dataset.key||''):''; }
function setDate(id,k){ const el=$(id); if(!el) return; el.dataset.key=k||''; el.value=k?shortDate(k):''; el.style.borderColor=''; el.dispatchEvent(new Event('change')); closeCal(); }
function openCal(id){ closeCal(); const el=$(id); const k=el.dataset.key||el.dataset.max&&el.dataset.max<todayKey()&&el.dataset.max||todayKey(); const [y,m]=k.split('-').map(Number); CAL={id,y,m}; renderCal(); }
function closeCal(){ const c=document.getElementById('calPop'); if(c) c.remove(); CAL=null; }
function calMove(n){ let m=CAL.m+n,y=CAL.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;} CAL.y=y; CAL.m=m; renderCal(); }
function calSet(y,m){ if(y) CAL.y=Number(y); if(m) CAL.m=Number(m); renderCal(); }
function renderCal(){
  let c=document.getElementById('calPop'); if(!c){ c=document.createElement('div'); c.id='calPop'; c.className='cal'; document.body.appendChild(c); }
  const el=$(CAL.id), sel=el.dataset.key, t=todayKey(), mx=el.dataset.max||'', mn=el.dataset.min||'', first=new Date(Date.UTC(CAL.y,CAL.m-1,1)).getUTCDay(), days=new Date(Date.UTC(CAL.y,CAL.m,0)).getUTCDate();
  const ty=Number(t.slice(0,4)), y0=mn?Number(mn.slice(0,4)):ty-100, y1=mx?Number(mx.slice(0,4)):ty+1, ys=[]; for(let y=Math.max(y1,CAL.y);y>=Math.min(y0,CAL.y);y--) ys.push(y);
  let h=`<div class="cal-head"><button type="button" onclick="calMove(-1)">‹</button><div class="mid"><select onchange="calSet(0,this.value)" aria-label="เดือน">${TH_MS.map((x,i)=>`<option value="${i+1}" ${i+1===CAL.m?'selected':''}>${x}</option>`).join('')}</select><select onchange="calSet(this.value,0)" aria-label="ปี พ.ศ.">${ys.map(y=>`<option value="${y}" ${y===CAL.y?'selected':''}>${y+543}</option>`).join('')}</select></div><button type="button" onclick="calMove(1)">›</button></div><div class="cal-grid">`+['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<span>${x}</span>`).join('');
  for(let i=0;i<first;i++) h+='<span></span>';
  for(let d=1;d<=days;d++){ const k=`${CAL.y}-${String(CAL.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, w=(first+d-1)%7, dis=(mx&&k>mx)||(mn&&k<mn); h+=`<button type="button" ${dis?'disabled':''} class="${k===sel?'sel':''} ${k===t?'today':''} ${w===0||w===6?'we':''}" onclick="setDate('${CAL.id}','${k}')">${d}</button>`; }
  h+=`</div><div class="cal-foot"><button type="button" class="phc-btn phc-btn--ghost phc-btn--sm" ${(mx&&t>mx)||(mn&&t<mn)?'disabled':''} onclick="setDate('${CAL.id}','${t}')">วันนี้</button><button type="button" class="phc-btn phc-btn--secondary phc-btn--sm" onclick="closeCal()">ปิด</button></div>`;
  c.innerHTML=h;
  const r=el.getBoundingClientRect(); let top=r.bottom+4, left=r.left; if(top+350>innerHeight) top=Math.max(8,r.top-354); if(left+300>innerWidth) left=Math.max(8,innerWidth-308); c.style.top=top+'px'; c.style.left=left+'px';
}
document.addEventListener('mousedown',e=>{ const c=document.getElementById('calPop'); if(c&&!c.contains(e.target)&&!(e.target.closest&&e.target.closest('.date-field'))) closeCal(); });

/* ---------- boot ---------- */
function phcRetryBoot(){ $('errGate').classList.add('hidden'); $('gate').classList.remove('hidden'); boot(); }
async function boot(){
  let stored=''; try{ stored=sessionStorage.getItem('oss2.session')||''; }catch(e){}
  try{
    const r=await call('apiBootstrap',{launchToken:BOOT.launchToken, sessionToken:stored});
    S.token=r.sessionToken; S.ruleVersion=r.ruleVersion; S.user=r.user; S.dash=r.dashboard; S.settings=r.settings; S.text=r.text; S.fyOptions=r.fyOptions||[]; S.endReasons=r.endReasons||[];
    try{ sessionStorage.setItem('oss2.session',S.token); }catch(e){}
    $('uName').textContent=S.user.fullName; $('uMeta').textContent=[S.user.workGroup, S.user.canEdit?'แก้ไขได้':(S.user.canAdd?'บันทึกได้':'ดูอย่างเดียว')].filter(Boolean).join(' · '); $('avatar').textContent=avatarChar(S.user.fullName);
    document.querySelectorAll('.role-edit').forEach(b=>b.classList.toggle('hidden',!S.user.canEdit));
    document.querySelectorAll('#nav button[data-page]').forEach(b=>b.addEventListener('click',()=>{ toggleSide(false); go(b.dataset.page); }));
    window.__ossBooted=true; $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
    let last='dashboard', fileId=''; try{ last=sessionStorage.getItem('oss2.page')||'dashboard'; fileId=sessionStorage.getItem('oss2.file')||''; }catch(e){}
    updateBadges();
    if(last==='file'&&fileId) openFile(fileId,0,'registry'); else go(TITLES[last]&&last!=='file'&&(last!=='settings'||S.user.canEdit)?last:'dashboard');
  }catch(e){ $('gate').classList.add('hidden'); $('errText').textContent=e.message; $('errGate').classList.remove('hidden'); }
}
function updateBadges(){
  const d=S.dash||{}; if(!d.fy) return;
  $('fyBadge').textContent='ปีงบประมาณ '+d.fy;
  const set=(id,n,warn)=>{ const el=$(id); el.textContent=n||''; el.classList.toggle('hidden',!n); el.style.background=warn?'var(--phc-warning)':''; };
  set('cntBoard',(d.stats.none||0)+(d.stats.incomplete||0),true);
  set('cntFollow',d.follow.open||0,!d.follow.urgent);
}
function setNav(page){ document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page)); $('pageTitle').textContent=TITLES[page]; }
function go(page){
  if(S.page==='file'&&!S._leaving&&hasDrafts()){ confirmLeave().then(ok=>{ if(ok){ S._leaving=true; try{ go(page); } finally{ S._leaving=false; } } }); return; }
  if(S.page==='file') clearDrafts();
  S.page=page; try{ sessionStorage.setItem('oss2.page',page); }catch(e){}
  setNav(page); closeModal(); window.scrollTo(0,0);
  ({dashboard:()=>renderDashboard(false),registry:renderRegistry,board:renderBoard,follow:renderFollow,reports:renderReports,settings:renderSettings}[page])();
}
function loading(msg){ const m=(typeof msg!=='undefined'&&msg)||'กำลังโหลด…'; let rows=''; for(let k=0;k<6;k++) rows+='<span class="phc-sk" style="height:16px;width:'+[92,78,85,70,88,64][k]+'%"></span>';
  $('content').innerHTML='<div aria-busy="true" style="display:flex;flex-direction:column;gap:16px"><span class="sr-only" role="status">'+esc(m)+'</span>'
    +'<span class="phc-sk" style="height:22px;width:220px"></span>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">'+[1,2,3].map(()=>'<div class="phc-sk-card" style="min-height:92px"><span class="phc-sk" style="width:60%"></span><span class="phc-sk" style="height:26px;width:35%"></span></div>').join('')+'</div>'
    +'<div class="card" style="display:flex;flex-direction:column;gap:14px">'+rows+'</div></div>'; }
function errBox(e){ $('content').innerHTML=`<div class="card empty"><p>${esc(e.message||e)}</p><button class="phc-btn phc-btn--secondary" onclick="go(S.page==='file'?S.back:S.page)">ลองใหม่</button></div>`; }

async function renderDashboard(fromCache){

  if(S.page!=='dashboard') return;
  const d=S.dash, s=d.stats, f=d.follow;
  const todo=[];
  if(f.urgent) todo.push(['d','🚨 เร่งด่วน '+f.urgent+' เรื่อง','ต้องดำเนินการทันที',`S.followTab='urgent';go('follow')`,'ดูรายการ']);
  if(f.high) todo.push(['w','⚠️ ควรติดตามเร็ว '+f.high+' เรื่อง','เช่น น้ำตาลในเลือดต่ำ',`S.followTab='open';go('follow')`,'ดูรายการ']);

  if(!todo.length) todo.push(['s','✅ ไม่มีงานค้าง','','','']);
  const cov=s.coverage==null?'-':s.coverage+'%';
  $('content').innerHTML=`<div class="page-head"><div><h2>ภาพรวม</h2><p>ปีงบประมาณ ${d.fy} (${esc(shortDate(d.fyRange.from))} – ${esc(shortDate(d.fyRange.to))})</p></div>
    <div class="actions">${can('add')?'<button class="phc-btn" onclick="volForm()">➕ ขึ้นทะเบียน อสส.</button>':''}</div></div>
    <div class="grid g4">
      <div class="stat link" onclick="S.boardTab='all';go('board')"><span>ต้องประเมินปีงบนี้</span><b>${s.total} คน</b><i>อายุ ≥ ${S.settings.GERIATRIC_AGE} ปี ${s.geriatric} คน (ต้องทำ 9 ด้าน)</i></div>
      <div class="stat link ${s.coverage===100?'good':'warn'}" onclick="S.boardTab='COMPLETE';go('board')"><span>ประเมินครบแล้ว</span><b>${s.complete} คน</b><i>ความครอบคลุม ${cov}</i></div>
      <div class="stat link ${s.incomplete+s.none?'warn':'good'}" onclick="S.boardTab='${s.incomplete?'INCOMPLETE':'NONE'}';go('board')"><span>ยังไม่ครบ / ยังไม่ประเมิน</span><b>${s.incomplete} / ${s.none}</b><i>คน</i></div>
      <div class="stat link ${f.urgent?'bad':(f.open?'warn':'good')}" onclick="S.followTab='open';go('follow')"><span>รอติดตาม</span><b>${f.open} เรื่อง</b><i>${f.persons} คน · เร่งด่วน ${f.urgent}</i></div>

      <div class="card"><h3>สิ่งที่ต้องทำ</h3><div class="grid" style="gap:8px">${todo.map(t=>`<div class="alert-row ${t[0]}"><b>${esc(t[1])}</b>${t[2]?`<span>${esc(t[2])}</span>`:''}${t[3]?`<button class="phc-btn phc-btn--secondary phc-btn--sm go" onclick="${t[3]}">${esc(t[4])}</button>`:''}</div>`).join('')}</div>

async function openFile(id, fy, from){

  S.back=from||(S.page==='file'?S.back:S.page); S.page='file'; setNav('file'); closeModal(); window.scrollTo(0,0);
  try{ sessionStorage.setItem('oss2.page','file'); sessionStorage.setItem('oss2.file',id); }catch(e){}
  if(!S.file||S.file.volunteer.VolunteerID!==id) loading('กำลังเปิดแฟ้ม…');
  try{ const f=await api('apiVolunteerFile',id); showFile(f, fy, S.back); }catch(e){ errBox(e); }
}
function showFile(file, fy, back, keepTab){
  const same=S.file&&S.file.volunteer.VolunteerID===file.volunteer.VolunteerID;
  S.file=file; S.back=back||S.back; S.page='file'; setNav('file');
  try{ sessionStorage.setItem('oss2.page','file'); sessionStorage.setItem('oss2.file',file.volunteer.VolunteerID); }catch(e){}
  const years=file.assessments.map(a=>a.FiscalYearBE);
  if(fy) S.fileFy=fy; else if(!same||!years.includes(S.fileFy)) S.fileFy=years.includes(file.fy)?file.fy:(years[0]||file.fy);
  if(!keepTab) S.fileTab=same?S.fileTab:'summary';
  renderFile();
}
function curA(){ return S.file&&S.file.assessments.find(a=>a.FiscalYearBE===S.fileFy)||null; }

      ${v.AddressText?`<div class="vmeta"><span>ที่อยู่ ${esc(v.AddressText)}</span></div>`:''}${!active?`<div class="vmeta"><span>พ้นสภาพ ${esc(shortDate(v.EndDate))} · ${esc(v.EndReason||'')}</span></div>`:''}${v.Note?`<div class="vmeta"><span>หมายเหตุ ${esc(v.Note)}</span></div>`:''}</div>

/* ----- assessment workspace ----- */
function reqSections(a){ return ['BASIC','FBS'].concat(a.Geriatric?['D1','D2','D3','D4','D5','D6','D7','D8','D9']:[]); }
function secDone(a,s){ const x=a.sections[s]; return !!x&&x.Result!=='REDO'; }
const TAB_SECS={ main:['BASIC','FBS'], domains:['D1','D2','D3','D4','D5','D6','D7','D8','D9'] };
function tabOfSec(s){ return s.charAt(0)==='D'?'domains':'main'; }
/* unsaved form values per assessment (kept across tab switches and failed saves) */
function draftsFor(a){ if(!S.drafts||S.drafts.aid!==(a&&a.AssessID)) { S.drafts={ aid:a?a.AssessID:'', secs:{} }; S.secErr={}; } return S.drafts.secs; }
/* D3 needs only weight: carried weight from BASIC counts as an answer, so an unsaved D3 is saved with the tab */
function baseVals(a, sec){ const x=a.sections[sec]; if(x) return Object.assign({},x.input); if(sec==='D3') return {}; return prefill(a,sec); }
function sameVal(x,y){ const f=v=>v===true?'true':(v===false||v===undefined||v===null?'':String(v)); return f(x)===f(y); }
function isDirty(a, sec, raw){ const b=baseVals(a,sec); return FS[sec].some(f=>f.k&&!sameVal(raw[f.k],b[f.k])); }
function captureDrafts(){ const a=curA(); if(!a||S.page!=='file') return; const d=draftsFor(a); document.querySelectorAll('#tabBody .ff[data-sec]').forEach(el=>{ const sec=el.dataset.sec, raw=rawFF(el); if(isDirty(a,sec,raw)) d[sec]=raw; else { delete d[sec]; if(S.secErr) delete S.secErr[sec]; } }); }
function hasDrafts(){ if(S.page==='file') captureDrafts(); return !!(S.drafts&&Object.keys(S.drafts.secs).length); }
function clearDrafts(){ S.drafts=null; S.secErr={}; }
function confirmLeave(){ if(!hasDrafts()) return Promise.resolve(true); const n=Object.keys(S.drafts.secs).length; return confirmBox('ยังไม่ได้บันทึก','มีข้อมูลที่กรอกแล้วยังไม่ได้บันทึก '+n+' หัวข้อ ('+Object.keys(S.drafts.secs).map(k=>esc(S.text.sectionShort[k])).join(', ')+') ออกจากหน้านี้ข้อมูลจะหาย','ออกโดยไม่บันทึก',true).then(ok=>{ if(ok) clearDrafts(); return ok; }); }
function switchTab(t){ captureDrafts(); S.fileTab=t; renderFile(); }
function switchFy(y){ confirmLeave().then(ok=>{ if(!ok) return; S.fileFy=y; S.fileTab='summary'; renderFile(); }); }
function gotoSec(s){ captureDrafts(); S.fileTab=tabOfSec(s); renderFile(); setTimeout(()=>{ const el=$('blk_'+s); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60); }
window.addEventListener('beforeunload',e=>{ try{ if(hasDrafts()){ e.preventDefault(); e.returnValue=''; } }catch(x){} });

function assessHtml(a){
  draftsFor(a);
  const nDom=TAB_SECS.domains.filter(s=>secDone(a,s)).length, pct=Math.round(a.DoneCount*100/(a.RequiredCount||1));
  const tabs=[['summary','สรุป'],['main','สุขภาพพื้นฐาน + FBS'+(secDone(a,'BASIC')&&secDone(a,'FBS')?' ✓':' ('+['BASIC','FBS'].filter(s=>secDone(a,s)).length+'/2)')]];
  if(a.Geriatric) tabs.push(['domains','9 ด้าน ('+nDom+'/9)'+(nDom===9?' ✓':'')]);
  if(S.fileTab==='domains'&&!a.Geriatric) S.fileTab='summary';
  if(['summary','main','domains'].indexOf(S.fileTab)<0) S.fileTab=S.fileTab&&S.fileTab.charAt(0)==='D'?'domains':(S.fileTab==='BASIC'||S.fileTab==='FBS'?'main':'summary');

  return `<div class="card"><div class="ahead"><div class="grow"><b>ประเมินวันที่ ${esc(thDate(a.AssessDate,true))}</b> · อายุ ${esc(a.AgeYears)} ปี ณ วันที่ประเมิน ${a.Geriatric?chip('ต้องประเมิน 9 ด้าน','info'):chip('สุขภาพพื้นฐาน + FBS','neutral')} ${aChip(a.Status,a.DoneCount,a.RequiredCount)} ${a.Urgent?chip('มีเรื่องเร่งด่วน','danger'):''}
      <div class="progress"><div style="width:${pct}%"></div></div><small class="muted">${a.Status==='COMPLETE'?'บันทึกครบ '+a.DoneCount+'/'+a.RequiredCount+' หัวข้อ เมื่อ '+esc(thDateTime(a.CompletedAt)):'บันทึกแล้ว '+a.DoneCount+'/'+a.RequiredCount+' หัวข้อ · ยังขาด '+esc(a.MissingText)}</small></div>
      <div class="actions">${canChange(a)?'<button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="dateForm()">📅 เปลี่ยนวันที่ประเมิน</button>':''}<button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="printAssess()">🖨️ พิมพ์ผลประเมิน</button>${can('admin')?'<button class="phc-btn phc-btn--danger phc-btn--sm" onclick="delAssess()">ลบการประเมิน</button>':''}</div></div>
    ${ro?`<div class="alert-row i" style="margin-bottom:10px">${a.Status==='COMPLETE'?'การประเมินนี้บันทึกครบแล้ว การแก้ไขต้องได้สิทธิ์ "แก้ไข"':'บัญชีนี้ดูได้อย่างเดียว'}</div>`:(a.Status==='COMPLETE'?'<div class="alert-row w" style="margin-bottom:10px">บันทึกครบแล้ว — ถ้าแก้ไขผล ระบบจะถามเหตุผลครั้งเดียวและเก็บในประวัติ</div>':'')}
    <div class="tabs">${tabs.map(t=>`<button class="tab ${S.fileTab===t[0]?'on':''}" onclick="switchTab('${t[0]}')">${t[1]}</button>`).join('')}</div>
    <div id="tabBody">${tabHtml(a)}</div></div>`;
}
function secState(a, s){ const x=a.sections[s]; if(S.secErr&&S.secErr[s]) return 'err'; if(S.drafts&&S.drafts.secs[s]) return 'dirty'; if(x&&x.Result==='REDO') return 'redo'; return x?'ok':'none'; }
function blockHtml(a, sec, ro){

function bindTab(a){
  const body=$('tabBody'); if(!body) return; const c=ctxOf(a);
  body.querySelectorAll('.sec-block').forEach(el=>{ const ff=el.querySelector('.ff[data-sec]'); if(!ff) return; const sec=ff.dataset.sec; bindFF(el, sec, c); const e=S.secErr&&S.secErr[sec]; if(e&&e.miss) markMiss(ff, e.miss); });
  clearTimeout(S._dt); const upd=()=>{ clearTimeout(S._dt); S._dt=setTimeout(()=>dirtyInfo(curA()),150); };
  body.addEventListener('input',upd); body.addEventListener('click',upd); dirtyInfo(a);
}
function dirtyInfo(a){
  a=curA(); const el=$('dirtyInfo'); if(!el||!a) return; const n=[];
  document.querySelectorAll('#tabBody .ff[data-sec]').forEach(ff=>{ const sec=ff.dataset.sec, d=isDirty(a,sec,rawFF(ff)); if(d) n.push(S.text.sectionShort[sec]);
    const b=document.querySelector('#jump button[onclick*="'+sec+'"]'); if(b&&!(S.secErr&&S.secErr[sec])){ const x=a.sections[sec]; b.className=d?'dirty':(x&&x.Result!=='REDO'?'ok':(x?'redo':'none')); } });
  el.textContent=n.length?('แก้ไขแล้วยังไม่บันทึก: '+n.join(', ')):'ยังไม่มีการเปลี่ยนแปลง';

function markMiss(ff, keys){ (keys||[]).forEach(k=>{ const t=ff.querySelector('[data-k="'+k+'"]'); const w=t&&t.closest('[data-i]'); if(w) w.classList.add('miss'); }); }

    ${a.sections.BASIC?`<h3 style="margin-top:14px">ค่าวัดร่างกาย</h3><dl class="kv"><dt>น้ำหนัก / ส่วนสูง</dt><dd>${esc(a.WeightKg)} กก. / ${esc(a.HeightCm)} ซม.</dd><dt>BMI</dt><dd>${esc(a.BMI)} · ${esc(S.text.bmi[a.BMIGroup]||'-')}</dd><dt>รอบเอว</dt><dd>${a.WaistCm!==''?esc(a.WaistCm)+' ซม.'+(a.WaistOver?' (เกินเกณฑ์)':''):'-'}</dd><dt>ความดันเฉลี่ย</dt><dd>${esc(a.BPSys)}/${esc(a.BPDia)} mmHg · ${esc(S.text.bp[a.BPGroup]||'-')}</dd>${a.FBS!==''?`<dt>FBS</dt><dd>${esc(a.FBS)} mg/dL · ${esc(S.text.fbs[a.FBSResult]||'-')}</dd>`:''}</dl>`:''}</div></div>`;

function rcText(f){ const o=f.RecheckOutcome?S.text.recheck[f.RecheckOutcome]:''; const val=f.RecheckSys!==''&&f.RecheckSys!=null&&f.RecheckSys!==undefined&&String(f.RecheckSys)!==''?f.RecheckSys+'/'+f.RecheckDia:(f.RecheckFbs!==''&&f.RecheckFbs!=null&&String(f.RecheckFbs)!==''?'FBS '+f.RecheckFbs:''); return esc([val,o].filter(Boolean).join(' → ')); }
function followRow(f, inFile){

function prefill(a, sec){
  const b=(a.sections.BASIC&&a.sections.BASIC.input)||(S.drafts&&S.drafts.secs.BASIC)||{};
  if(sec==='BASIC') return { serviceLocation:S.settings.SERVICE_LOCATION||'', measurementPosition:'SITTING', armSide:'RIGHT' };
  if(sec==='FBS') return { fastingStatus:'FASTING', specimenMethod:'CAPILLARY_METER' };
  if(sec==='D3') return { weightKg:b.weightKg||'' };
  if(sec==='D6') return { weightKg:b.weightKg||'', heightCm:b.heightCm||'' };
  return {};
}
function missingKeys(sec, raw, c){ return FS[sec].filter(f=>f.k&&f.req&&f.t!=='chk'&&(!f.show||f.show(raw,c))&&(raw[f.k]===undefined||raw[f.k]===null||raw[f.k]==='')).map(f=>f.k); }
/* find field key named in a server message: text inside double quotes */
function keyFromMsg(sec, msg){ const i=msg.indexOf('"'), j=msg.indexOf('"',i+1); if(i<0||j<0) return []; const lab=msg.slice(i+1,j); const f=FS[sec].find(x=>x.k&&x.l&&(x.l===lab||x.l.indexOf(lab)===0||lab.indexOf(x.l)===0)); return f?[f.k]:[]; }
async function saveTab(tab, btn){
  const a=curA(); if(!a) return; captureDrafts();
  const c=ctxOf(a), d=S.drafts.secs, secs=TAB_SECS[tab].filter(s=>d[s]&&(s.charAt(0)!=='D'||a.Geriatric));
  if(!secs.length){ toast('ยังไม่มีการเปลี่ยนแปลง'); return; }
  const items=[], bad=[];
  secs.forEach(s=>{ const raw=d[s], miss=missingKeys(s,raw,c); if(miss.length){ S.secErr[s]={ msg:'ยังตอบไม่ครบ '+miss.length+' ข้อ (กรอบสีแดง) — หัวข้อนี้ยังไม่ถูกบันทึก', miss }; bad.push(s); } else { delete S.secErr[s]; items.push({ Section:s, data:filterVisible(s,raw,c) }); } });
  if(!items.length){ renderFile(); scrollFirstErr(); toast('ยังบันทึกไม่ได้: ตอบไม่ครบ '+bad.length+' หัวข้อ ('+bad.map(s=>S.text.sectionShort[s]).join(', ')+')',true); return; }
  let reason='';
  if(a.Status==='COMPLETE'){ reason=await reasonBox('แก้ไขผลที่บันทึกครบแล้ว','แก้ '+items.map(x=>'<b>'+esc(S.text.sectionShort[x.Section])+'</b>').join(', ')+' ของการประเมินที่บันทึกครบแล้ว','เหตุผลที่แก้ไข','เช่น พิมพ์ค่าผิด / วัดซ้ำ','บันทึกการแก้ไข'); if(!reason) return; }
  setBusy(btn,true);
  try{
    const res=await api('apiSaveSections',{ AssessID:a.AssessID, Version:a.Version, items, reason });
    const r=res.result; S.board=null; S.list=null; S.follow=null;
    r.saved.forEach(x=>{ delete d[x.section]; delete S.secErr[x.section]; });
    r.errors.forEach(e=>{ S.secErr[e.section]={ msg:e.message+' — หัวข้อนี้ยังไม่ถูกบันทึก', miss:keyFromMsg(e.section,e.message) }; });
    const na=res.file.assessments.find(x=>x.AssessID===a.AssessID);
    const anyErr=Object.keys(S.secErr).some(s=>TAB_SECS[tab].indexOf(s)>=0);
    if(tab==='main'&&!anyErr&&na&&na.Geriatric&&TAB_SECS.domains.some(s=>!secDone(na,s))) S.fileTab='domains';
    showFile(res.file, a.FiscalYearBE, S.back, true);
    const flags=[].concat(...r.saved.map(x=>x.flags||[]));
    let msg=(r.justCompleted?'🎉 การประเมินครบทุกหัวข้อแล้ว · ':'')+'บันทึกแล้ว '+r.saved.length+' หัวข้อ ('+r.saved.map(x=>S.text.sectionShort[x.section]).join(', ')+')';
    const nb=bad.length+r.errors.length; if(nb) msg+=' · ยังไม่บันทึก '+nb+' หัวข้อ (แถบแดง)';
    toast(msg, !!nb);
    if(flags.some(f=>f.priority==='URGENT')) toast('🚨 พบเรื่องเร่งด่วน: '+flags.filter(f=>f.priority==='URGENT').map(f=>f.title).join(', ')+' — ดำเนินการตามแนวทางทันที',true);
    if(nb) scrollFirstErr(); else window.scrollTo(0,0);
    api('apiDashboard').then(afterDash).catch(()=>{});
  }catch(e){ toast(e.message,true); setBusy(btn,false); }
}

function nut(v,c){ const w=nv(v.weightKg),h=nv(v.heightCm),d=nv(v.demiSpanCm); if(!(w>0&&h>0&&d>0)) return null; const bmi=bmiOf(w,h), m=c.sex==='MALE', idx=Math.round((m?w/Math.pow(d/100,2):w/(d/100))*100)/100; return { bmi, idx, type:m?'Demiquet':'Mindex', q61:bmi<18.5||(m?idx<76:idx<56) }; }
function ffVal(vals,k){ const x=vals[k]; return x===undefined||x===null?'':String(x); }
function renderFF(sec, vals, ro){ const spec=FS[sec]; return `<div class="ff ${ro?'ro':''}" data-sec="${sec}">${spec.map((f,i)=>ffItem(f,i,vals)).join('')}</div>`; }
function ffItem(f,i,vals){
  const a=`data-i="${i}"${f.nr===true?' data-nr="1"':''}`, lab=esc(f.l||'')+(f.req?' <span class="req">*</span>':''), v=ffVal(vals,f.k), id='ff_'+f.k;
  if(f.h) return `<h4 ${a}>${esc(f.h)}</h4>`;
  if(f.t==='info') return `<div ${a} class="info"></div>`;
  if(f.t==='chk') return `<label ${a} class="chk-row full"><input type="checkbox" class="chk" data-k="${f.k}" ${v==='true'?'checked':''}> ${esc(f.l)}</label>`;
  if(f.t==='seg'||f.t==='yn'){ const o=f.t==='yn'?YN:f.o; return `<div ${a} class="q ${f.wide?'wide':''} ${f.full?'full':''}"><span>${lab}</span><div class="seg" data-k="${f.k}" role="group">${o.map(x=>`<button type="button" data-v="${esc(x[0])}" class="${String(x[0])===v?'on':''}">${esc(x[1])}</button>`).join('')}</div></div>`; }
  if(f.t==='area') return `<div ${a} class="phc-field full"><label class="phc-label" for="${id}">${lab}</label><textarea class="phc-input" rows="2" id="${id}" data-k="${f.k}">${esc(v)}</textarea></div>`;
  return `<div ${a} class="phc-field ${f.full?'full':''}"><label class="phc-label" for="${id}">${lab}</label><input class="phc-input" id="${id}" data-k="${f.k}" value="${esc(v)}" ${f.t==='num'?'inputmode="decimal"':''}></div>`;
}
function rawFF(root){ const v={}; root.querySelectorAll('[data-k]').forEach(el=>{ const k=el.dataset.k; if(el.classList.contains('seg')){ const b=el.querySelector('button.on'); v[k]=b?b.dataset.v:''; } else if(el.type==='checkbox') v[k]=el.checked; else v[k]=el.value.trim(); }); return v; }
function readFF(root, sec){ return filterVisible(sec, rawFF(root), ctxOf(curA())); }
function filterVisible(sec, raw, c){ const spec=FS[sec], out={}; spec.forEach(f=>{ if(!f.k) return; if(f.show&&!f.show(raw,c)) return; if(f.t==='chk'){ if(raw[f.k]) out[f.k]=true; return; } out[f.k]=raw[f.k]; }); return out; }
function refreshFF(root, sec, c){ const spec=FS[sec], v=rawFF(root); root.querySelectorAll('[data-i]').forEach(el=>{ const f=spec[Number(el.dataset.i)]; const show=!f.show||f.show(v,c); el.classList.toggle('hidden',!show); el.classList.toggle('nr', typeof f.nr==='function'?!!f.nr(v,c):!!f.nr); if(f.t==='info'&&show){ const r=f.html(v,c)||{}; el.innerHTML=r.html||''; el.className='info'+(r.tone?' '+r.tone:''); } }); }
function bindFF(container, sec, c){
  const root=container.querySelector('.ff'); if(!root) return;
  const ro=root.classList.contains('ro');
  root.querySelectorAll('input,textarea').forEach(el=>{ if(ro) el.disabled=true; });
  root.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('.seg button'); if(!b||ro) return; const w=b.closest('[data-i]'); if(w) w.classList.remove('miss'); b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); refreshFF(root,sec,c); });
  root.addEventListener('input',e=>{ const w=e.target.closest&&e.target.closest('[data-i]'); if(w) w.classList.remove('miss'); refreshFF(root,sec,c); }); root.addEventListener('change',()=>refreshFF(root,sec,c));
  refreshFF(root,sec,c);
}

async function renderFollow(){

}
function fMatch(r,t){ if(t==='open') return r.Status==='OPEN'; if(t==='urgent') return r.Status==='OPEN'&&r.Priority==='URGENT'; return r.Status==='DONE'; }
function drawFollowShell(){
  const L=S.follow.rows, f=S.ff, comms=commNames(L), tabs=[['open','รอติดตาม'],['urgent','เร่งด่วน'],['done','ติดตามแล้ว']];

    <div class="tabs">${tabs.map(t=>`<button class="tab ${S.followTab===t[0]?'on':''}" onclick="S.followTab='${t[0]}';drawFollowShell()">${t[1]} <span class="n">(${L.filter(r=>fMatch(r,t[0])).length})</span></button>`).join('')}</div>

}
function followRows(){ const f=S.ff, q=norm(f.q); return S.follow.rows.filter(r=>fMatch(r,S.followTab)&&(!f.c||(r.CommunityName||'ไม่ระบุชุมชน')===f.c)&&(!q||norm(r.FullName+' '+r.Title).includes(q))); }
function drawFollow(){
  const rows=followRows(), el=$('fList'); if(!el) return;

function findFollow(id){ let f=null; if(S.follow) f=S.follow.rows.find(x=>x.FollowID===id); if(!f&&S.file) S.file.assessments.forEach(a=>(a.follow||[]).forEach(x=>{ if(x.FollowID===id) f=x; })); return f; }
function followForm(id, inFile){

function rcKind(f){ return String(f.Code||'').indexOf('BP_')===0?'BP':(String(f.Code||'').indexOf('FBS_')===0?'FBS':'OTHER'); }

function segToggle(b){ const on=b.classList.contains('on'); b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on')); if(!on) b.classList.add('on'); }
function rcPreview(){ const el=$('fuPrev'); if(!el) return; if($('fuSys')){ const s1=Number($('fuSys').value), d1=Number($('fuDia').value); el.textContent=s1>0&&d1>0?('ระดับ: '+S.text.bp[bpGroup(s1,d1)]):''; } else if($('fuFbs')){ const g=Number($('fuFbs').value); el.textContent=g>0?('ผล: '+S.text.fbs[g<70?'LOW':g<=100?'NORMAL':g<=125?'RISK':'HIGH']):''; } }
async function saveFollow(id, inFile){

async function renderCompare(){

  if(!S.cmp) loading('กำลังเทียบข้อมูล…');
  try{ S.cmp=await api('apiCompare',p); S.cmpFy=S.cmp.fy; S.cmpBase=S.cmp.baseFy; }catch(e){ if(!S.cmp){ errBox(e); return; } toast(e.message,true); }
  if(S.page==='reports'&&S.reportTab==='compare') drawCompare();
}

      <h4 class="sub">ค่าเฉลี่ยที่เปลี่ยน (ปี ${C.fy} − ปี ${C.baseFy})</h4><div class="grid g3">${C.means.map(x=>`<div class="stat"><span>${esc(x.label)}</span><b>${x.change==null?'-':(x.change>0?'+':'')+x.change}</b><i>${x.n} คน</i></div>`).join('')}</div>
      <div class="actions" style="margin-top:12px"><button class="phc-btn phc-btn--secondary" onclick="worseModal()">👀 รายชื่อคนที่แย่ลง (${C.worseList.length})</button></div></div>
    <div class="card" style="margin-top:14px"><h3>ค. ผลของการติดตาม: ผิดปกติในปี ${C.baseFy} → ปี ${C.fy}</h3><div class="table-wrap"><table class="t"><thead><tr><th>เรื่อง</th><th class="num">ผิดปกติปี ${C.baseFy}</th><th class="num">ติดตามแล้ว</th><th class="num">ประเมินปีนี้แล้ว</th><th class="num">ปีนี้ปกติ</th><th class="num">ในกลุ่มที่ติดตาม ปีนี้ปกติ</th></tr></thead><tbody>${C.follow.map(o=>`<tr><td>${esc(o.label)}</td><td class="num">${o.flagged}</td><td class="num">${o.followed}</td><td class="num">${o.assessedNow}</td><td class="num"><b>${o.normalNow}</b>${o.normalPct==null?'':`<small>${o.normalPct}%</small>`}</td><td class="num">${o.followedNormalNow}/${o.followedAssessedNow}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted small">ความดัน "ปกติ" = ต่ำกว่า 140/90 · FBS "ปกติ" = 70–100</p></div>`;
}
function worseModal(){
  const L=S.cmp.worseList;
  openModal('คนที่มีตัวชี้วัดแย่ลง (ปี '+S.cmp.baseFy+' → '+S.cmp.fy+')',L.length?`<div class="table-wrap"><table class="t"><thead><tr><th>ชื่อ-สกุล</th><th>แย่ลง</th></tr></thead><tbody>${L.map(w=>`<tr class="click" onclick="closeModal();openFile('${w.VolunteerID}',${S.cmp.fy},'reports')"><td><b>${esc(w.FullName)}</b><small>${esc(w.CommunityName||'-')}${w.Phone?' · '+esc(w.Phone):''}</small></td><td>${w.items.map(i=>`<div>${esc(i.label)}: ${esc(i.from)} → <b>${esc(i.to)}</b></div>`).join('')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">ไม่มี</p>',
    `<button class="phc-btn phc-btn--secondary" onclick="printWorse()">🖨️ พิมพ์รายชื่อ</button><button class="phc-btn" onclick="closeModal()">ปิด</button>`);
}
function printWorse(){ const C=S.cmp; kitPrint({ title:'รายชื่อ อสส. ที่ตัวชี้วัดแย่ลง ปีงบ '+C.baseFy+' → '+C.fy, docDate:shortDate(todayKey()), meta:[['ชุมชน',C.community||'ทุกชุมชน']], bodyHtml:`<table class="phc-p-table"><thead><tr><th>ที่</th><th>ชื่อ-สกุล</th><th>ชุมชน / โทร</th><th>ตัวชี้วัดที่แย่ลง</th></tr></thead><tbody>${C.worseList.map((w,i)=>`<tr class="phc-p-avoid"><td class="phc-p-num">${i+1}</td><td>${esc(w.FullName)}</td><td>${esc(w.CommunityName||'-')}<br>${esc(w.Phone||'')}</td><td>${w.items.map(x=>esc(x.label)+': '+esc(x.from)+' → '+esc(x.to)).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="4">ไม่มี</td></tr>'}</tbody></table>` }); }
function printCompare(){
  const C=S.cmp, pp=v=>v==null?'-':v+'%';
  const ov=g=>C.overview.filter(o=>o.group===g).map(o=>`<tr><td>${esc(o.label)}</td><td class="phc-p-num">${pp(o.base.pct)} (${o.base.n}/${o.base.d})</td><td class="phc-p-num">${pp(o.cur.pct)} (${o.cur.n}/${o.cur.d})</td><td class="phc-p-num">${o.diff==null?'-':(o.diff>0?'+':'')+o.diff}</td><td>${o.trend==='BETTER'?'ดีขึ้น':o.trend==='WORSE'?'แย่ลง':o.trend==='SAME'?'คงเดิม':'-'}</td></tr>`).join('');
  const pr=g=>C.paired.filter(o=>o.group===g).map(o=>`<tr><td>${esc(o.label)}</td><td class="phc-p-num">${o.n}</td><td class="phc-p-num">${o.IMPROVED}</td><td class="phc-p-num">${o.SAME}</td><td class="phc-p-num">${o.WORSE}</td></tr>`).join('');
  const ovh=`<thead><tr><th>ตัวชี้วัด</th><th>ปี ${C.baseFy}</th><th>ปี ${C.fy}</th><th>เปลี่ยน (จุด%)</th><th>แนวโน้ม</th></tr></thead>`, prh='<thead><tr><th>ตัวชี้วัด</th><th>คน</th><th>ดีขึ้น</th><th>คงเดิม</th><th>แย่ลง</th></tr></thead>';
  kitPrint({ title:'รายงานเทียบผลการประเมินสุขภาพ อสส. ปีงบ '+C.fy+' กับ '+C.baseFy, docDate:shortDate(todayKey()), meta:[['ชุมชน',C.community||'ทุกชุมชน']],
    bodyHtml:`<div class="phc-p-section"><h2>สรุป</h2><table class="phc-p-kv"><tbody><tr><th>ต้องประเมิน</th><td>ปี ${C.baseFy}: ${C.roster.base} คน · ปี ${C.fy}: ${C.roster.cur} คน</td></tr><tr><th>ประเมินครบ</th><td>${pp(C.coverage.base.pct)} → ${pp(C.coverage.cur.pct)}</td></tr><tr><th>เทียบรายคนได้</th><td>${C.pairs} คน · มีตัวชี้วัดแย่ลง ${C.worseList.length} คน</td></tr></tbody></table></div>
      <div class="phc-p-section"><h2>ก. ภาพรวม — สุขภาพพื้นฐาน + FBS</h2><table class="phc-p-table">${ovh}<tbody>${ov('BASIC')}</tbody></table></div>
      <div class="phc-p-section"><h2>ก. ภาพรวม — 9 ด้าน</h2><table class="phc-p-table">${ovh}<tbody>${ov('DOMAIN')}</tbody></table></div>
      <div class="phc-p-section"><h2>ข. รายคน (${C.pairs} คน)</h2><table class="phc-p-table">${prh}<tbody>${pr('BASIC')}${pr('DOMAIN')}</tbody></table><p class="phc-p-note">ค่าเฉลี่ยที่เปลี่ยน: ${C.means.map(x=>esc(x.label)+' '+(x.change==null?'-':(x.change>0?'+':'')+x.change)).join(' · ')}</p></div>
      <div class="phc-p-section"><h2>ค. ผลของการติดตาม</h2><table class="phc-p-table"><thead><tr><th>เรื่อง</th><th>ผิดปกติปี ${C.baseFy}</th><th>ติดตามแล้ว</th><th>ประเมินปีนี้</th><th>ปีนี้ปกติ</th></tr></thead><tbody>${C.follow.map(o=>`<tr><td>${esc(o.label)}</td><td class="phc-p-num">${o.flagged}</td><td class="phc-p-num">${o.followed}</td><td class="phc-p-num">${o.assessedNow}</td><td class="phc-p-num">${o.normalNow}</td></tr>`).join('')}</tbody></table></div>`,
    signatures:['ผู้รายงาน','หัวหน้ากลุ่มงาน'] });
}

/* =====================================================================
 * settings
 * ===================================================================== */
function renderSettings(){
  const s=S.settings;
  $('content').innerHTML=`<div class="page-head"><div><h2>ตั้งค่า</h2><p>ค่ากติกาของระบบ</p></div></div>
    <div class="grid g2" style="align-items:start"><div class="card"><div class="form-grid">${field('อายุที่ต้องประเมิน 9 ด้าน (ปี ณ วันที่ประเมิน)',`<input class="phc-input" type="number" min="40" max="90" id="setAge" value="${esc(s.GERIATRIC_AGE)}">`,'full')}${field('สถานที่ให้บริการตั้งต้น',`<input class="phc-input" id="setLoc" value="${esc(s.SERVICE_LOCATION)}">`,'full')}</div>
      <p class="muted small">เปลี่ยนอายุ มีผลกับการประเมินที่เริ่มใหม่ (การประเมินที่เริ่มแล้วคงเกณฑ์เดิม)</p><div class="actions" style="margin-top:12px"><button class="phc-btn" id="setSave" onclick="saveSettings()">บันทึก</button></div></div>
    <div class="card"><h3>เกณฑ์ที่ระบบใช้ (${esc(S.ruleVersion||'')})</h3><ul class="crit">
      <li>ประเมินปีละ 1 ครั้งต่อคน ตามปีงบประมาณของวันที่ประเมิน · ทุกคน: สุขภาพพื้นฐาน + FBS · อายุ ≥ ${esc(s.GERIATRIC_AGE)} ปี: เพิ่ม 9 ด้าน</li>
      <li>BMI (คนเอเชีย): &lt; 18.5 น้อย · 18.5–22.9 ปกติ · 23–24.9 เกิน · 25–29.9 อ้วน 1 · ≥ 30 อ้วน 2 · รอบเอวเกิน ชาย ≥ 90 / หญิง ≥ 80 ซม.</li>
      <li>ความดันเฉลี่ย: ≥ 140/90 ต้องติดตาม · ≥ 180/110 เร่งด่วน</li>
      <li>FBS (อดอาหาร): &lt; 70 ต่ำ · 70–100 ปกติ · 101–125 เสี่ยง · ≥ 126 ต้องตรวจยืนยัน · ไม่ได้อดอาหาร = ต้องตรวจซ้ำ</li>
      <li>ADL &lt; 12 · OSTA ≤ −1 · ยาเกิน 4 รายการ + มีอาการ · TUG ≥ 14 วินาที หรือแรงบีบมือ &lt; 28 (ชาย) / 18 (หญิง) กก.</li>
      <li>โภชนาการ: BMI &lt; 18.5 หรือ Demiquet &lt; 76 (ชาย) / Mindex &lt; 56 (หญิง) และ น้ำหนักลดหรือเบื่ออาหาร</li>
      <li>ช่องปาก: มีปัญหาอย่างน้อย 1 ข้อ · 2Q เสี่ยง → 9Q → 8Q (9Q ≥ 7 หรือข้อ 9 &gt; 0) · ข้อ 9 หรือ 8Q &gt; 0 = เร่งด่วน</li>
      <li>Mini-Cog ≤ 2 ผิดปกติ · อาการทางตา/ระบบประสาทเร่งด่วน = เร่งด่วน · ประเมินไม่ได้ = ต้องติดตาม</li></ul></div></div>`;
}
async function saveSettings(){ const b=$('setSave'); setBusy(b,true);
  try{ const d=await api('apiSaveSettings',{GERIATRIC_AGE:$('setAge').value.trim(), SERVICE_LOCATION:$('setLoc').value.trim()}); S.settings=d.settings; afterDash(d.dashboard); S.list=null; S.board=null; toast('บันทึกการตั้งค่าแล้ว'); renderSettings(); }
  catch(e){ toast(e.message,true); setBusy(b,false); } }

/* =====================================================================
 * print (PHC37Print)
 * ===================================================================== */
function kitPrint(o){ if(!window.PHC37Print){ toast('ไม่พบชุดพิมพ์มาตรฐาน',true); return; } PHC37Print.print(PHC37Print.document(Object.assign({systemName:'ระบบประเมินสุขภาพ อสส.',systemShort:'อสส.',printedBy:S.user.fullName},o)),{onDone:e=>{ if(e) toast('เปิดหน้าพิมพ์ไม่สำเร็จ: '+e.message,true); }}); }
function ynTh(v){ return v==='YES'?'ใช่':v==='NO'?'ไม่ใช่':'-'; }
function printAssess(){
  const a=curA(), v=S.file.volunteer, sec=a.sections, b=(sec.BASIC&&sec.BASIC.input)||{}, fb=(sec.FBS&&sec.FBS.input)||{};
  const lab=(f,val)=>{ if(f.t==='yn') return ynTh(val); if(f.t==='seg'){ const o=f.o.find(x=>String(x[0])===String(val)); return o?o[1]:(val||'-'); } return val===''||val===undefined?'-':val; };
  const kvSec=(s)=>{ const x=sec[s]; if(!x) return '<p class="phc-p-note">ยังไม่บันทึก</p>'; const raw=x.input, c={sex:v.Sex,age:a.AgeYears}; const rows=FS[s].filter(f=>f.k&&f.t!=='chk'&&(!f.show||f.show(raw,c))&&raw[f.k]!==undefined&&raw[f.k]!=='').map(f=>`<tr><th>${esc(f.l)}</th><td>${esc(lab(f,raw[f.k]))}</td></tr>`).join(''); return `<table class="phc-p-kv"><tbody>${x.input.unableToAssess?`<tr><th>ประเมินไม่ได้</th><td>${esc(S.text.unable[x.input.unableReasonCode]||'')} ${esc(x.input.unableReasonDetail||'')}</td></tr>`:rows}<tr><th>ผล</th><td><b>${esc(x.Summary)}</b></td></tr></tbody></table>`; };
  const fl=(a.follow||[]).filter(f=>f.Status!=='CANCELLED');
  const doms=a.Geriatric?['D1','D2','D3','D4','D5','D6','D7','D8','D9'].map(s=>`<div class="phc-p-section"><h2>${esc(S.text.section[s])}</h2>${kvSec(s)}</div>`).join(''):'';
  kitPrint({ title:'แบบบันทึกผลการประเมินสุขภาพ อสส. ปีงบประมาณ '+a.FiscalYearBE, docNo:v.VolunteerNo, docDate:shortDate(a.AssessDate), density:'compact',
    meta:[['ชื่อ-สกุล',v.FullName],['อายุ',a.AgeYears+' ปี ('+(SEX_TH[v.Sex]||'')+')'],['ชุมชน',v.CommunityName||'-']],
    bodyHtml:`<div class="phc-p-section"><h2>สรุปผล</h2><table class="phc-p-kv"><tbody><tr><th>สถานะ</th><td>${esc(S.text.status[a.Status])} (${a.DoneCount}/${a.RequiredCount} หัวข้อ)${a.MissingText?' · ยังขาด '+esc(a.MissingText):''}</td></tr><tr><th>ค่าวัดร่างกาย</th><td>${a.sections.BASIC?`น้ำหนัก ${esc(a.WeightKg)} กก. · ส่วนสูง ${esc(a.HeightCm)} ซม. · BMI ${esc(a.BMI)} ${esc(S.text.bmi[a.BMIGroup]||'')} · รอบเอว ${a.WaistCm!==''?esc(a.WaistCm)+' ซม.':'-'} · ความดันเฉลี่ย ${esc(a.BPSys)}/${esc(a.BPDia)} mmHg`:'-'}</td></tr><tr><th>FBS</th><td>${a.FBS!==''?esc(a.FBS)+' mg/dL · '+esc(S.text.fbs[a.FBSResult]||''):'-'}</td></tr><tr><th>ผลผิดปกติ / ต้องติดตาม</th><td>${fl.length?fl.map(f=>esc(f.Title)+(f.Priority==='URGENT'?' (เร่งด่วน)':'')+(f.Status==='DONE'?' — '+esc(S.text.action[f.ActionType]||'')+' '+esc(shortDate(f.ActionDate)):'')).join('<br>'):'ไม่พบ'}</td></tr></tbody></table></div>
      <div class="phc-p-section"><h2>สุขภาพพื้นฐาน</h2>${kvSec('BASIC')}</div><div class="phc-p-section"><h2>น้ำตาลในเลือด (FBS)</h2>${kvSec('FBS')}</div>${doms}`,
    signatures:['ผู้ประเมิน','ผู้รับการประเมิน'] });
}

boot();
</script>
