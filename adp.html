  --phc-primary:#15703A;

  --phc-brand:#3DA852;            /* ตกแต่งเท่านั้น ห้ามใช้เป็นสีตัวอักษรบนพื้นขาว */

  /* สีพื้นและตัวอักษร */

  --phc-neutral:#4A5550; --phc-neutral-bg:#EEF1EF;

/* ---------- พื้นฐาน (ใช้เฉพาะคลาส phc- ไม่แตะ element ทั่วไปของระบบเดิม) ---------- */
.phc-app{font-family:var(--phc-font);color:var(--phc-ink);background:var(--phc-ground);font-size:var(--phc-text-md);line-height:1.6}
.phc-app :focus-visible{outline:none;box-shadow:var(--phc-focus)}

/* ---------- ตรา ---------- */
.phc-brand-mark{display:inline-block;width:36px;height:36px;flex:0 0 auto;background:var(--phc-logo-mark) center/contain no-repeat}
.phc-appbar{display:flex;align-items:center;gap:var(--phc-space-3);padding:10px 20px;background:var(--phc-surface);border-bottom:1px solid var(--phc-border);box-shadow:inset 0 4px 0 var(--phc-brand)}
.phc-appbar-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.phc-appbar-title b{font-size:16px;font-weight:700}
.phc-appbar-title span{font-size:var(--phc-text-xs);color:var(--phc-ink-2)}

/* ---------- ปุ่ม ---------- */
.phc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--phc-touch);padding:0 20px;border:1px solid transparent;border-radius:var(--phc-radius-sm);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--phc-primary);color:#fff;transition:background-color .15s}
.phc-btn:hover{background:var(--phc-primary-hover)}
.phc-btn:focus-visible{outline:none;box-shadow:var(--phc-focus)}
.phc-btn--secondary{background:var(--phc-surface);color:var(--phc-ink);border-color:var(--phc-border-input)}
.phc-btn--secondary:hover{background:var(--phc-surface-2)}
.phc-btn--ghost{background:transparent;color:var(--phc-primary);padding:0 12px}
.phc-btn--ghost:hover{background:var(--phc-primary-tint)}
.phc-btn--danger{background:var(--phc-danger);color:#fff}
.phc-btn--danger:hover{background:var(--phc-danger-hover)}
.phc-btn--sm{min-height:36px;padding:0 14px;font-size:14px}
.phc-btn--icon{width:var(--phc-touch);padding:0}
.phc-btn--sm.phc-btn--icon{width:36px}
.phc-btn--edit{background:var(--phc-warning-bg);color:var(--phc-warning);border-color:#E8C48F}
.phc-btn--edit:hover{background:#FDE8C8}
.phc-btn--danger-soft{background:var(--phc-danger-bg);color:var(--phc-danger);border-color:#F5C2BD}
.phc-btn--danger-soft:hover{background:#F9DAD7}
.phc-btn:disabled,.phc-btn[aria-disabled="true"]{background:var(--phc-disabled-bg);color:var(--phc-ink-2);border-color:transparent;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.phc-field{display:flex;flex-direction:column;gap:6px}
.phc-label{font-size:14px;font-weight:600;color:var(--phc-ink)}
.phc-required{color:var(--phc-danger)}
.phc-input,.phc-select,.phc-textarea{min-height:var(--phc-touch);padding:0 12px;border:1px solid var(--phc-border-input);border-radius:var(--phc-radius-sm);font:inherit;color:var(--phc-ink);background:var(--phc-surface);box-sizing:border-box;width:100%}
.phc-textarea{padding:10px 12px;resize:vertical}
.phc-input:focus,.phc-select:focus,.phc-textarea:focus{outline:none;border-color:var(--phc-primary);box-shadow:var(--phc-focus)}
.phc-input[aria-invalid="true"],.phc-select[aria-invalid="true"],.phc-textarea[aria-invalid="true"]{border:2px solid var(--phc-danger)}
.phc-help{font-size:var(--phc-text-sm);color:var(--phc-ink-2)}
.phc-error{font-size:var(--phc-text-sm);color:var(--phc-danger);font-weight:600}

/* ---------- ป้ายสถานะ ---------- */
.phc-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:var(--phc-radius-pill);font-size:var(--phc-text-sm);font-weight:700;line-height:1.6;white-space:nowrap;background:var(--phc-neutral-bg);color:var(--phc-neutral)}
.phc-badge--info{background:var(--phc-info-bg);color:var(--phc-info)}
.phc-badge--warning{background:var(--phc-warning-bg);color:var(--phc-warning)}
.phc-badge--danger{background:var(--phc-danger-bg);color:var(--phc-danger)}
.phc-badge--success{background:var(--phc-success-bg);color:var(--phc-success)}

/* ---------- ข้อความแจ้ง ---------- */
.phc-alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;color:var(--phc-ink);background:var(--phc-info-bg)}
.phc-alert b{color:var(--phc-info)}
.phc-alert--success{background:var(--phc-success-bg)}.phc-alert--success b{color:var(--phc-success)}
.phc-alert--warning{background:var(--phc-warning-bg)}.phc-alert--warning b{color:var(--phc-warning)}
.phc-alert--danger{background:var(--phc-danger-bg)}.phc-alert--danger b{color:var(--phc-danger)}
.phc-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;background:var(--phc-ink);color:#fff;font-size:14px;box-shadow:var(--phc-shadow-lg)}
.phc-toast a{color:#9FE0AE;font-weight:600}

/* ---------- การ์ด / ตาราง ---------- */
.phc-card{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);padding:var(--phc-space-5)}
.phc-stat{display:flex;flex-direction:column;gap:4px}
.phc-stat-label{font-size:14px;color:var(--phc-ink-2)}
.phc-stat-value{font-size:32px;line-height:40px;font-weight:700}
.phc-table-wrap{background:var(--phc-surface);border:1px solid var(--phc-border);border-radius:var(--phc-radius);overflow-x:auto}
.phc-table{width:100%;border-collapse:collapse;font-size:14px}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ข้อความใน CSS content: "..." (หลบ \ และ ")
  function cssStr(v){
    return '"' + String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ') + '"';
  }
  // ชื่อย่อระบบในท้ายกระดาษ: systemShort > ข้อความในวงเล็บท้าย systemName > systemName
  function systemShort(o){
    if (o.systemShort) return String(o.systemShort);
    var n = String(o.systemName || 'ระบบ ศบส.37');
    var m = n.match(/\(([^()]+)\)\s*$/);
    return m ? m[1] : n;
  }
  function thaiNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function baseCss(o){

    var footFont = a5 ? '6.8pt' : '7.5pt';
    // ท้ายกระดาษทุกหน้า: บรรทัดเดียว ตัวเล็ก ชิดด้านบนของขอบล่าง (ห่างขอบกระดาษ)

    return ''

  function letterhead(o){
    var ref = '';
    if (o.docNo) ref += '<b>เลขที่ ' + esc(o.docNo) + '</b>';
    if (o.docDate) ref += '<span>วันที่ ' + esc(o.docDate) + '</span>';
    (o.meta || []).forEach(function(m){
      if (m && m[1] != null && String(m[1]).trim() !== '') ref += '<span>' + esc(m[0]) + ' ' + esc(m[1]) + '</span>';
    });
    return '<header class="phc-p-head">'
      + '<img class="phc-p-logo" src="' + LOGO + '" alt="ตรา ศบส.37">'
      + '<div class="phc-p-org"><b>' + esc(ORG.name) + '</b><span>' + esc(ORG.parent) + '</span>'
      + '<small>' + esc(ORG.address) + ' · โทร ' + esc(ORG.phone) + '</small></div>'
      + (ref ? '<div class="phc-p-ref">' + ref + '</div>' : '')
      + '</header>';
  }

  function signatures(list){
    if (!list || !list.length) return '';
    return '<div class="phc-p-sign" style="--phc-p-sign-cols:' + Math.min(list.length, 3) + '">'
      + list.map(function(role){
          return '<div><span>ลงชื่อ ........................................ </span>'
            + '<span>( ........................................ )</span>'
            + '<span>' + esc(role) + '</span>'
            + '<span>วันที่ ....... / ....... / ...........</span></div>';
        }).join('')
      + '</div>';

<script>
const BOOT = {"version":"ADP3-1.2.0","appName":"ระบบสนับสนุนผ้าอ้อมผู้ใหญ่","launchToken":"","returnUrl":""};
const S = { token:'', user:null, dash:null, page:'dashboard', settings:{}, text:{}, list:null, listAt:0, sel:'', detail:null, comms:null, board:null, assessTab:'queue', roundsFy:0, round:null, follow:null, followTab:'all', report:null, fyOptions:[], closeReasons:[], filters:{q:'',g:'',c:'',s:''} };
const TH_M = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TITLES = {dashboard:'ภาพรวม',registry:'ทะเบียนผู้รับ',reserve:'รายชื่อสำรอง',assess:'ส่งประเมิน',rounds:'รอบแจก',follow:'ต้องติดตาม',reports:'รายงาน',settings:'ตั้งค่า'};
const GROUP_TH = {A:'กลุ่ม A',B:'กลุ่ม B',ALL:'ทุกกลุ่ม'};
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- วันที่ ---------- */
function keyOf(v){ if(!v) return ''; if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v; const d=new Date(v); if(isNaN(d)) return ''; return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); }
function thDate(v,full){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-').map(Number); return d+' '+(full?TH_M:TH_MS)[m-1]+' '+(y+543); }
function shortDate(v){ const k=keyOf(v); if(!k) return '-'; const [y,m,d]=k.split('-'); return d+'/'+m+'/'+(Number(y)+543); }
function thDateTime(v){ if(!v) return '-'; const d=new Date(v); if(isNaN(d)) return '-'; const t=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(d); return shortDate(v)+' '+t+' น.'; }
function todayKey(){ return keyOf(new Date()); }

/* ---------- เรียกเซิร์ฟเวอร์ ---------- */
function callRaw_(fn, ...args){
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(r=>{
      if(!r){ reject(new Error('ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์')); return; }
      if(!r.ok){ if(/Session|เปิดระบบใหม่/.test(r.message||'')) sessionLost(); reject(new Error(r.message||'เกิดข้อผิดพลาด')); return; }
      resolve(r.data !== undefined ? r.data : r);
    }).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e))))[fn](...args);
  });
}
/* PHC37Load (UI Kit 1.2.0): เส้นวิ่งด้านบนระหว่างรอเซิร์ฟเวอร์ (ขึ้นเมื่อรอเกิน 0.3 วินาที) */
function call(fn, ...args){
  const L=window.PHC37Load; if(L) L.line.start();
  return callRaw_(fn, ...args).then(v=>{ if(L) L.line.done(); return v; }, e=>{ if(L) L.line.fail(); throw e; });
}
/* โครงเทาแบบรายการ (UI Kit 1.2.0) */
function phcSk(n){ let h='<div class="phc-sk-lines" aria-busy="true"><span class="sr-only" role="status">กำลังโหลด…</span>'; const W=[92,78,85,70,88,64]; for(let k=0;k<(n||4);k++) h+='<span class="phc-sk" style="height:16px;width:'+W[k%W.length]+'%"></span>'; return h+'</div>'; }
/* 1.2.0 คำสั่งอ่าน (ไม่ล้างแคชแฟ้มผู้รับ) · คำสั่งอื่นถือว่าเป็นการบันทึก = ล้างแคชแฟ้มและกระดานลำดับ */
const READ_API={apiDashboard:1,apiRecipients:1,apiRecipient:1,apiCommunities:1,apiPatientAddress:1,apiSearchPatients:1,apiPatientKitLists:1,apiCentralPerson:1,apiSlotOverview:1,apiSlotBoard:1,apiReserveList:1,apiAssessBoard:1,apiRounds:1,apiRoundView:1,apiFollowList:1,apiReport:1,apiPrintRecipients:1};
function api(fn, ...args){ return call(fn, S.token, ...args).then(v=>{ if(!READ_API[fn]){ S.dcache={}; S.boards={}; } return v; }); }
function sameData(a,b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; } }
function sessionLost(){ try{ sessionStorage.removeItem('adp3.session'); }catch(e){} }

/* ---------- ทั่วไป ---------- */
function toast(msg, err){ const el=document.createElement('div'); el.className='phc-toast'+(err?' err':''); el.textContent=msg; $('toasts').appendChild(el); setTimeout(()=>el.remove(), err?7000:3500); }
function setBusy(btn, on, text){ if(!btn) return;
  if(on){ if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.setAttribute('aria-busy','true');
    const plain=btn.classList.contains('phc-btn--secondary')||btn.classList.contains('phc-btn--ghost')||btn.classList.contains('phc-btn--edit')||btn.classList.contains('phc-btn--danger-soft')||!btn.classList.contains('phc-btn');
    const t=text||'กำลังบันทึก…'; btn.innerHTML=String(t).indexOf('spinner')>=0?t:'<span class="phc-spin'+(plain?'':' phc-spin--light')+'" aria-hidden="true"></span> '+t; }
  else { btn.disabled=false; btn.removeAttribute('aria-busy'); delete btn.dataset.busy; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }
function openModal(title, body, foot, size){ $('modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal ${size||''}" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button class="xbtn" type="button" onclick="closeModal()" aria-label="ปิด">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`; }
function closeModal(){ closeCal(); $('modalRoot').innerHTML=''; }
function confirmBox(title, html, okText, danger){
  return new Promise(res=>{
    const root=document.createElement('div');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body">${html}</div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="0">ยกเลิก</button><button class="phc-btn ${danger?'phc-btn--danger':''}" data-a="1">${esc(okText||'ยืนยัน')}</button></div></div></div>`;
    document.body.appendChild(root);
    root.addEventListener('click',e=>{ const a=e.target.getAttribute&&e.target.getAttribute('data-a'); if(a===null||a===undefined) return; root.remove(); res(a==='1'); });
  });
}
function chip(text, tone){ return `<span class="chip tone-${esc(tone||'neutral')}">${esc(text)}</span>`; }
function grp(g){ return `<span class="chip grp-${esc(g)}">${esc(GROUP_TH[g]||g)}</span>`; }
function stChip(st){ return chip(st.label, st.tone)+(st.sub?`<small>${esc(st.sub)}</small>`:''); }
function prog(count,max){ const p=Math.min(100,Math.round((count||0)*100/(max||6))); return `<div class="prog" title="${count}/${max}"><div style="width:${p}%"></div></div><small>รับแล้ว ${count||0}/${max||6}</small>`; }

function goGateway(){ try{ sessionStorage.removeItem('adp3.session'); }catch(e){} const url=BOOT.returnUrl; if(/^https:\/\/script\.google\.com\//.test(url||'')) window.open(url,'_top'); }

function field(label, inner, cls, req){ return `<div class="phc-field ${cls||''}"><label class="phc-label">${esc(label)}${req?' <span class="phc-required">*</span>':''}</label>${inner}</div>`; }
function opt(v,t,sel){ return `<option value="${esc(v)}" ${sel?'selected':''}>${esc(t)}</option>`; }

/* ---------- ปฏิทิน พ.ศ. ---------- */
let CAL=null;
function dateField(id, key, opts){ opts=opts||{}; return `<div class="date-field"><input class="phc-input" id="${id}" data-key="${esc(key||'')}" data-max="${esc(opts.max||'')}" data-min="${esc(opts.min||'')}" value="${key?esc(shortDate(key)):''}" readonly placeholder="วว/ดด/ปปปป" onclick="openCal('${id}')"></div>`; }
function dateVal(id){ const el=$(id); return el?(el.dataset.key||''):''; }
function setDate(id,k){ const el=$(id); if(!el) return; el.dataset.key=k||''; el.value=k?shortDate(k):''; el.dispatchEvent(new Event('change')); closeCal(); }
function openCal(id){ closeCal(); const el=$(id); const k=el.dataset.key||todayKey(); const [y,m]=k.split('-').map(Number); CAL={id,y,m}; renderCal(); }
function closeCal(){ const c=document.getElementById('calPop'); if(c) c.remove(); CAL=null; }
function calMove(n){ let m=CAL.m+n,y=CAL.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;} CAL.y=y; CAL.m=m; renderCal(); }
function renderCal(){
  let c=document.getElementById('calPop'); if(!c){ c=document.createElement('div'); c.id='calPop'; c.className='cal'; document.body.appendChild(c); }
  const el=$(CAL.id), sel=el.dataset.key, t=todayKey(), mx=el.dataset.max||'', mn=el.dataset.min||'', first=new Date(Date.UTC(CAL.y,CAL.m-1,1)).getUTCDay(), days=new Date(Date.UTC(CAL.y,CAL.m,0)).getUTCDate();
  let h=`<div class="cal-head"><button type="button" onclick="calMove(-1)">‹</button><b>${TH_M[CAL.m-1]} ${CAL.y+543}</b><button type="button" onclick="calMove(1)">›</button></div><div class="cal-grid">`+['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<span>${x}</span>`).join('');
  for(let i=0;i<first;i++) h+='<span></span>';
  for(let d=1;d<=days;d++){ const k=`${CAL.y}-${String(CAL.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, w=(first+d-1)%7, dis=(mx&&k>mx)||(mn&&k<mn); h+=`<button type="button" ${dis?'disabled':''} class="${k===sel?'sel':''} ${k===t?'today':''} ${w===0||w===6?'we':''}" onclick="setDate('${CAL.id}','${k}')">${d}</button>`; }
  h+=`</div><div class="cal-foot"><button type="button" class="phc-btn phc-btn--ghost phc-btn--sm" ${(mx&&t>mx)||(mn&&t<mn)?'disabled':''} onclick="setDate('${CAL.id}','${t}')">วันนี้</button><button type="button" class="phc-btn phc-btn--secondary phc-btn--sm" onclick="closeCal()">ปิด</button></div>`;
  c.innerHTML=h;
  const r=el.getBoundingClientRect(); let top=r.bottom+4, left=r.left; if(top+340>innerHeight) top=Math.max(8,r.top-344); if(left+300>innerWidth) left=Math.max(8,innerWidth-308); c.style.top=top+'px'; c.style.left=left+'px';
}
document.addEventListener('mousedown',e=>{ const c=document.getElementById('calPop'); if(c&&!c.contains(e.target)&&!(e.target.closest&&e.target.closest('.date-field'))) closeCal(); });

function phcRetryBoot(){ $('errGate').classList.add('hidden'); $('gate').classList.remove('hidden'); boot(); }
async function boot(){
  let stored=''; try{ stored=sessionStorage.getItem('adp3.session')||''; }catch(e){}
  try{
    const r=await call('apiBootstrap',{launchToken:BOOT.launchToken, sessionToken:stored});
    S.token=r.sessionToken; S.user=r.user; S.dash=r.dashboard; S.settings=r.settings; S.text=r.text; S.fyOptions=r.fyOptions||[]; S.closeReasons=r.closeReasons||[]; S.rights=r.rights||{main:[],sub:[]}; S.lists=r.lists||{}; if(r.dashboard&&r.dashboard.slots) S.ov=r.dashboard.slots;
    try{ sessionStorage.setItem('adp3.session',S.token); }catch(e){}
    $('uName').textContent=S.user.fullName; $('uMeta').textContent=[S.user.workGroup, S.user.canEdit?'แก้ไขได้':(S.user.canAdd?'บันทึกได้':'ดูอย่างเดียว')].filter(Boolean).join(' · '); $('avatar').textContent=(S.user.fullName||'?').replace(/^(นาย|นางสาว|นาง|ดร\.)\s*/,'').charAt(0);
    document.querySelectorAll('.role-edit').forEach(b=>b.classList.toggle('hidden',!S.user.canEdit));
    document.querySelectorAll('#nav button[data-page]').forEach(b=>b.addEventListener('click',()=>{ toggleSide(false); go(b.dataset.page); }));
    window.__adpBooted=true; $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
    let last='dashboard'; try{ last=sessionStorage.getItem('adp3.page')||'dashboard'; }catch(e){}
    updateBadges(); go(TITLES[last]&&(last!=='settings'||S.user.canEdit)?last:'dashboard');
    syncResults(false);
  }catch(e){ $('gate').classList.add('hidden'); $('errText').textContent=e.message; $('errGate').classList.remove('hidden'); }
}
/** ตรวจผลประเมินจากระบบส่งต่อกลาง (เบื้องหลัง ไม่บล็อกหน้าจอ) */
async function syncResults(force, btn){
  if(btn) setBusy(btn,true,'<span class="spinner sm"></span> กำลังตรวจผล…');
  try{
    const r=await api('apiSyncAssess',{force:!!force, withBoard:S.page==='assess', withDashboard:S.page==='dashboard'});
    S.lastSync=r.result&&r.result.lastSyncAt;
    if(r.dashboard){ S.dash=r.dashboard; updateBadges(); if(S.page==='dashboard') renderDashboard(true); }
    if(r.board){ S.board=r.board; if(S.page==='assess') drawAssess(); }
    const x=r.result||{};
    if(!x.skipped && (x.passed||x.notPassed||x.returned)){ toast('ผลประเมินใหม่: ผ่าน '+(x.passed||0)+' · ไม่ผ่าน/ยังไม่สรุป '+(x.notPassed||0)+(x.returned?' · ส่งกลับ '+x.returned:'')); S.list=null; if(S.page==='registry') loadRegistry(); }
    else if(force) toast(x.errors&&x.errors.length?('ตรวจผลไม่ครบ: '+x.errors[0]):'ตรวจผลแล้ว ไม่มีผลใหม่', !!(x.errors&&x.errors.length));
  }catch(e){ if(force) toast(e.message,true); }
  finally{ if(btn) setBusy(btn,false); }
}
function updateBadges(){
  const d=S.dash||{}; if(!d.fy) return;
  $('fyBadge').textContent='ปีงบประมาณ '+d.fy;
  const set=(id,n)=>{ const el=$(id); el.textContent=n||''; el.classList.toggle('hidden',!n); };
  set('cntFollow', (d.owedPersons||0)+(d.assessOverdue||0)+(d.expired||0));
  set('cntAssess', (d.renewDue||0)+(d.expired||0)+(d.newWait||0));
  set('cntRounds', (d.needClose||[]).length);
  if(d.slots){ S.ov=d.slots; set('cntReserve', d.slots.reserve||0); }
}
function go(page){
  document.body.classList.remove('m-lock');
  S.page=page; try{ sessionStorage.setItem('adp3.page',page); }catch(e){}
  document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  $('pageTitle').textContent=TITLES[page]; closeModal();
  ({dashboard:()=>renderDashboard(false),registry:renderRegistry,reserve:renderReserve,assess:renderAssess,rounds:renderRounds,follow:renderFollow,reports:renderReports,settings:renderSettings}[page])();
}
function loading(msg){ const m=(typeof msg!=='undefined'&&msg)||'กำลังโหลด…'; let rows=''; for(let k=0;k<6;k++) rows+='<span class="phc-sk" style="height:16px;width:'+[92,78,85,70,88,64][k]+'%"></span>';
  $('content').innerHTML='<div aria-busy="true" style="display:flex;flex-direction:column;gap:16px"><span class="sr-only" role="status">'+esc(m)+'</span>'
    +'<span class="phc-sk" style="height:22px;width:220px"></span>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">'+[1,2,3].map(()=>'<div class="phc-sk-card" style="min-height:92px"><span class="phc-sk" style="width:60%"></span><span class="phc-sk" style="height:26px;width:35%"></span></div>').join('')+'</div>'
    +'<div class="card" style="display:flex;flex-direction:column;gap:14px">'+rows+'</div></div>'; }
function errBox(e){ $('content').innerHTML=`<div class="card empty"><p>${esc(e.message||e)}</p><button class="phc-btn phc-btn--secondary" onclick="go(S.page)">ลองใหม่</button></div>`; }

async function renderDashboard(fromCache){
  if(!fromCache){
    if(S.dash){ const old=S.dash; renderDashboard(true);
      try{ const d=await api('apiDashboard'); S.dash=d; updateBadges(); if(S.page==='dashboard'&&!sameData(old,d)) renderDashboard(true); }catch(e){}
      return; }
    loading(); try{ S.dash=await api('apiDashboard'); updateBadges(); }catch(e){ errBox(e); return; } }
  if(S.page!=='dashboard') return;
  const d=S.dash, s=d.stats||{}, el=(d.eligible.A||0)+(d.eligible.B||0);
  const todo=[];
  if(d.needClose.length) d.needClose.forEach(r=>todo.push(['w','📦 '+r.label+' ยังไม่ปิดรอบ','ยังไม่บันทึก '+(r.counts.pending||0)+' คน',`openRound('${r.RoundID}')`,'เปิดรอบ']));
  if(d.owedPersons) todo.push(['d','🚩 ค้างรับ '+d.owedPersons+' คน ('+d.owedTimes+' ครั้ง)','สิทธิ์ยังอยู่ — โทรติดตาม / แจกนอกรอบ',`go('follow')`,'ดูรายชื่อ']);
  if(d.assessOverdue) todo.push(['w','⏳ ผลประเมินค้างเกิน '+S.settings.ASSESS_OVERDUE_DAYS+' วัน '+d.assessOverdue+' คน','ส่งเยี่ยมบ้านแล้วยังไม่มีผล',`S.assessTab='pending';go('assess')`,'ดูรายการ']);
  if(d.expired) todo.push(['d','⛔ สิทธิ์หมด ยังไม่ส่งประเมิน '+d.expired+' คน','ไม่มีชื่อในรอบแจกจนกว่าจะประเมินผ่าน',`S.assessTab='queue';go('assess')`,'ไปส่งประเมิน']);
  if(d.renewDue) todo.push(['w','🔁 สิทธิ์จะหมดใน '+S.settings.RENEW_LEAD_DAYS+' วัน '+d.renewDue+' คน','ควรส่งประเมินใหม่ล่วงหน้า',`S.assessTab='queue';go('assess')`,'ไปส่งประเมิน']);
  if(d.newWait) todo.push(['i','🆕 ลงทะเบียนใหม่รอส่งประเมิน '+d.newWait+' คน','',`S.assessTab='queue';go('assess')`,'ไปส่งประเมิน']);
  if(d.yearEnd && d.owedPersons) todo.push(['d','📅 ใกล้สิ้นปีงบ '+d.fy,'ค้างรับต้องชดเชยก่อน 30 ก.ย. (ข้ามปีงบไม่ได้)',`S.followTab='yearEnd';go('follow')`,'ดูรายชื่อ']);
  if(!todo.length) todo.push(['s','✅ ไม่มีงานค้าง','','','']);
  const cov=s.coverage==null?'-':s.coverage+'%';
  const rounds=(d.rounds||[]).map(r=>`<tr class="click" onclick="openRound('${r.RoundID}')"><td><b>${esc(shortDate(r.RoundDate))}</b><small>${esc(r.RoundTime||'')} · ${esc(r.Place||'')}</small></td><td>${grp(r.GroupCode)}</td><td>${r.counts.total} คน${r.counts.grace?`<small>รับระหว่างรอผล ${r.counts.grace}</small>`:''}${r.counts.held?`<small>ค้างรอผล ${r.counts.held}</small>`:''}</td><td>${r.inDays===0?chip('วันนี้','success'):chip('อีก '+r.inDays+' วัน','info')}</td></tr>`).join('');
  const sug=(d.suggest||[]).map(x=>`<tr><td><b>${x.suggestDate?esc(shortDate(x.suggestDate)):'-'}</b><small>${x.lastDate?'รอบล่าสุด '+esc(shortDate(x.lastDate))+' + 2 เดือน':'ยังไม่เคยสร้างรอบ'}</small></td><td>${grp(x.GroupCode)}</td><td class="muted">ยังไม่สร้างรอบ</td><td>${can('add')?`<button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="roundForm(null,'${x.GroupCode}','${x.suggestDate||''}')">➕ สร้างรอบ</button>`:''}</td></tr>`).join('');
  $('content').innerHTML=`<div class="page-head"><div><h2>ภาพรวม</h2><p>ปีงบประมาณ ${d.fy} (${esc(shortDate(d.fyRange.from))} – ${esc(shortDate(d.fyRange.to))})</p></div>
    <div class="actions"><span class="muted small" id="syncInfo">${S.lastSync?'ตรวจผลประเมินล่าสุด '+esc(thDateTime(S.lastSync)):''}</span><button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="syncResults(true,this)">🔄 ตรวจผลจาก Refer</button></div></div>

      <div class="stat link ${d.owedTimes?'bad':'good'}" onclick="go('follow')"><span>ค้างรับ</span><b>${d.owedTimes||0} ครั้ง</b><i>${d.owedPersons||0} คน · ชดเชยด้วยแจกนอกรอบ</i></div>
    </div>
    <div style="margin-top:12px">${quotaCards(d.slots)}</div>
    <div class="grid g2" style="margin-top:14px;align-items:start">
      <div class="card"><h3>สิ่งที่ต้องทำ</h3><div class="grid" style="gap:8px">${todo.map(t=>`<div class="alert-row ${t[0]}"><b>${esc(t[1])}</b>${t[2]?`<span>${esc(t[2])}</span>`:''}${t[3]?`<button class="phc-btn phc-btn--secondary phc-btn--sm go" onclick="${t[3]}">${esc(t[4])}</button>`:''}</div>`).join('')}</div></div>
      <div class="card"><h3>รอบแจกถัดไป</h3><div class="table-wrap"><table class="t"><thead><tr><th>วันที่</th><th>กลุ่ม</th><th>รายชื่อ</th><th></th></tr></thead><tbody>${rounds}${sug}${!rounds&&!sug?'<tr><td colspan="4" class="empty">ยังไม่มีรอบแจก</td></tr>':''}</tbody></table></div>
        <div class="actions" style="margin-top:10px">${can('add')?'<button class="phc-btn phc-btn--secondary phc-btn--sm" onclick="roundForm()">➕ สร้างรอบแจก</button>':''}<button class="phc-btn phc-btn--ghost phc-btn--sm" onclick="go(\'rounds\')">ดูรอบแจกทั้งหมด</button></div></div>
    </div>`;
}

/* ---------- 1.1.0: ลำดับในกลุ่ม · รายชื่อสำรอง · ฟอร์มเวชระเบียนกลาง · เบอร์หลายเบอร์ ---------- */
function setList(x){ if(!x) return; if(Array.isArray(x)) S.list=x; else { S.list=x.rows||[]; if(x.overview) S.ov=x.overview; } let n=0; S.list.forEach(r=>{ r._ro=r.Status==='RESERVE'?(++n):0; }); S.listAt=Date.now(); }
function digits(s){ return String(s==null?'':s).split('').filter(ch=>ch>='0'&&ch<='9').join(''); }
function cidOk(c){ c=digits(c); if(c.length!==13) return false; let t=0; for(let i=0;i<12;i++) t+=Number(c[i])*(13-i); return (11-t%11)%10===Number(c[12]); }
function slotLbl(g,n){ const s=String(n||''); if(!n) return ''; return g+'-'+(s.length<3?('000'+s).slice(-3):s); }
function slotChip(r){
  if(r.Status==='RESERVE'){ const o=r.ReserveOrder||r._ro||r.order; return `<span class="chip tone-neutral slot">สำรอง${o?' #'+o:''}</span>`; }
  if(!r.SlotLabel) return r.GroupCode?grp(r.GroupCode):'';
  return `<span class="chip grp-${esc(r.GroupCode)} slot" title="${esc(GROUP_TH[r.GroupCode]||'')} ลำดับที่ ${esc(r.GroupSlot||'')}">${esc(r.SlotLabel)}</span>`;
}
async function freshOv(){ try{ S.ov=await api('apiSlotOverview'); }catch(e){} return S.ov; }
function birthKeyFromBE(t){ t=String(t||'').trim(); if(!t) return ''; const p=t.split('/'); if(p.length!==3) return null; let d=Number(p[0]),m=Number(p[1]),y=Number(p[2]); if(!d||!m||!y) return null; if(y>2400) y-=543; if(y<1890||m<1||m>12||d<1||d>31) return null; const k=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); const dt=new Date(Date.UTC(y,m-1,d)); if(dt.getUTCDate()!==d) return null; return k; }
function ageOf(k){ if(!k) return ''; const [y,m,d]=k.split('-').map(Number), [ty,tm,td]=todayKey().split('-').map(Number); const a=ty-y-((tm<m||(tm===m&&td<d))?1:0); return a>=0?a+' ปี':''; }

    ${field('สถานภาพสมรส',sel('Mar',L.marital,d.MaritalStatus))}
    ${field('สิทธิการรักษา',`<select class="phc-select" id="${px}Main" onchange="subFill('${px}','')">${opt('','ไม่ระบุ')}${R.main.map(x=>opt(x,x,x===d.MainRight)).join('')}</select>`)}
    ${field('สิทธิย่อย',`<select class="phc-select" id="${px}Sub"></select>`)}

    ${field('ซอย',inp('Soi',d.Soi))}${field('ถนน',inp('Road',d.Road))}
    ${field('แขวง / ตำบล',inp('Sub2',d.SubDistrict))}${field('เขต / อำเภอ',inp('Dist',d.District))}

  </div>`;

function subFill(px, cur){ const m=$(px+'Main'), s=$(px+'Sub'); if(!m||!s) return; const R=S.rights||{sub:[]}; const list=R.sub.filter(x=>!m.value||x.parent===m.value);

function stMatch(r, s){
  const c=r.st.code;
  if(!s) return r.Status!=='CLOSED';
  if(s==='ok') return ['VALID','RENEW','GRACE'].includes(c);
  if(s==='owed') return r.st.owed>0;
  if(s==='renew') return ['RENEW','EXPIRED','HELD','GRACE'].includes(c);
  if(s==='wait') return ['NOT_ASSESSED','WAIT_FIRST'].includes(c);
  if(s==='bad') return c==='NOT_PASSED';
  if(s==='full') return c==='FULL';
  if(s==='closed') return c==='CLOSED';
  return true;
}

async function bgSync(id){

  S.syncing=null;
  if(d&&d.detail){ putDetail(d.detail); if(d.list){ setList(d.list); if(S.page==='registry') drawRegistry(); } }
  else if(d&&d.sync){ const c=(S.dcache||{})[id]; if(c) c.sync=d.sync; }

async function saveRegister(i, force){
  const t=tpVal('rg'); if(!t){ toast('กรุณาเลือกกลุ่ม A / B หรือรายชื่อสำรอง',true); return; } if(t.err){ toast(t.err,true); return; }
  const nw=i<0, r=PK.read('pk',{mode:nw?'new':'edit'}); if(r.err){ toast(r.err,true); return; }
  const commName=$('rgComm').value, comm=(S.comms||[]).find(c=>c.CommunityName===commName)||{};
  const p={ Target:t, CommunityName:commName, CommunityID:comm.CommunityID||commName, SubDistrict:comm.SubDistrict||r.person.SubDistrict||'', person:r.person, phones:r.phones, AddressText:r.person.AddressText||'', Note:$('rgNote').value.trim() };
  if(!nw) p.patient=S.ptRows[i].patient; else { p.newPatient=true; if(force===true) p.forceCreate=true; }
  if(force!==true){ const ok=await confirmBox('ยืนยันการลงทะเบียน',`ลงทะเบียนเข้า <b>${esc(tpText(t))}</b>${t.Kind==='GROUP'?'<br><span class="muted small">ย้ายกลุ่ม A ↔ B ภายหลังไม่ได้</span>':''}`,'ลงทะเบียน'); if(!ok) return; }

}
async function doRegister(p){
  const b=$('rgSave'); setBusy(b,true);
  try{ const d=await api('apiRegister',p);
    if(d.duplicate){ setBusy(b,false); const ch=await dupBox(d); if(!ch) return;
      if(ch.act==='open'){ closeModal(); openRecipient(ch.rid); return; }
      if(ch.act==='use'){ const q=Object.assign({},p,{newPatient:false,patient:d.matches[ch.i].patient}); delete q.person; delete q.forceCreate; delete q.AddressText; doRegister(q); return; }
      if(ch.act==='force'){ doRegister(Object.assign({},p,{forceCreate:true})); return; } return; }
    closeModal(); const r=d.detail.recipient;
    toast('ลงทะเบียนแล้ว · '+(r.Status==='RESERVE'?'รายชื่อสำรองลำดับที่ '+(r.ReserveOrder||''):'ลำดับ '+r.SlotLabel)+' · ขั้นต่อไป: ส่งประเมิน');
    if(d.warn) toast(d.warn,true);
    S.sel=d.RecipientID; S.reserve=null; S.regTarget=null; afterRecipient(d); if(S.page!=='registry'){ S.wantOpen=true; go('registry'); } else openRecipient(d.RecipientID,true); }
  catch(e){ toast(e.message,true); setBusy(b,false); }
}
/** เวชระเบียนกลางพบคนที่อาจซ้ำ: เลือกคนเดิม / เปิดแฟ้ม / ยืนยันเพิ่มใหม่ */
function dupBox(d){
  return new Promise(res=>{
    const root=document.createElement('div');
    const rows=d.matches.map((m,i)=>`<div class="pick" style="cursor:default"><div><b>${esc(m.PatientName)}</b><span>${esc(m.reason||'')} · HN ${esc(m.HN||'-')} · ${esc(m.CIDMasked||'')}${m.BirthDate?' · เกิด '+esc(shortDate(m.BirthDate)):''}${m.AddressText?' · '+esc(m.AddressText):''}</span></div>${m.registered?`<button class="phc-btn phc-btn--secondary phc-btn--sm" data-a="open" data-r="${esc(m.registered.RecipientID)}">ลงทะเบียนแล้ว · เปิดแฟ้ม</button>`:`<button class="phc-btn phc-btn--sm" data-a="use" data-i="${i}">ใช่ คนนี้</button>`}</div>`).join('');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>พบข้อมูลที่อาจซ้ำในเวชระเบียนกลาง</h3></div><div class="modal-body"><p class="small" style="margin-top:0">${esc(d.message||'')}${d.canForceCreate===false?'<br><b>เลขบัตร/HN ซ้ำกับคนเดิม — เลือกคนเดิมเท่านั้น</b>':''}</p><div class="grid" style="gap:8px">${rows}</div><p class="muted small">ถ้าเป็นคนเดียวกัน กด "ใช่ คนนี้" (ไม่เพิ่มซ้ำในเวชระเบียนกลาง)</p></div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="cancel">ย้อนกลับไปแก้</button>${d.canForceCreate===false?'':'<button class="phc-btn phc-btn--danger-soft" data-a="force">ไม่ใช่ — ยืนยันเพิ่มผู้ป่วยใหม่</button>'}</div></div></div>`;
    document.body.appendChild(root);
    root.addEventListener('click',e=>{ const el=e.target.closest&&e.target.closest('[data-a]'); if(!el) return; const a=el.getAttribute('data-a'); root.remove();
      if(a==='use') res({act:'use',i:Number(el.getAttribute('data-i'))}); else if(a==='open') res({act:'open',rid:el.getAttribute('data-r')}); else if(a==='force') res({act:'force'}); else res(null); });
  });
}
function segPick(b){ b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }
function segVal(id){ const b=document.querySelector('#'+id+' button.on'); return b?b.dataset.v:''; }

function curOf(x){ const e=S.edits[x.RecipientID]; if(e) return e; const rc=x.record; return rc?{Status:rc.Status,ReceiverType:rc.ReceiverType||'SELF',ProxyName:rc.ProxyName||'',Note:rc.Note||''}:{Status:'',ReceiverType:'SELF',ProxyName:'',Note:''}; }

  return `<tr class="${dirty?'row-dirty':''}" id="rr_${id}"><td>${who}</td><td>${seg}</td><td>${w}</td><td class="hide-sm"><input class="phc-input note-in" value="${esc(cur.Note)}" ${lock?'disabled':''} placeholder="หมายเหตุ" oninput="rEdit('${id}','Note',this.value,true)"></td></tr>`;

function rEdit(id,k,v,quiet){
  const x=S.round.rows.find(r=>r.RecipientID===id); const cur=Object.assign({},curOf(x)); cur[k]=v; S.edits[id]=cur;

}
function dirtyInfo(){ const el=$('dirtyInfo'); if(!el) return; const n=Object.keys(S.edits||{}).length; el.textContent=n?('มีการเปลี่ยนแปลง '+n+' รายการ ยังไม่บันทึก'):'คลิก "รับแล้ว" / "ไม่มารับ" ทีละคน แล้วกดบันทึกผลครั้งเดียว'; }

function reasonBox(title, html, label, ph, okText){
  return new Promise(res=>{
    const root=document.createElement('div');
    root.innerHTML=`<div class="modal-wrap" style="z-index:250"><div class="modal sm"><div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body"><p style="margin:0 0 10px">${html}</p><label class="phc-label">${esc(label)} <span class="phc-required">*</span></label><textarea class="phc-input" data-r="1" rows="3" placeholder="${esc(ph||'')}"></textarea><div data-err="1" style="color:#B42318;font-size:13px;min-height:18px"></div></div><div class="modal-foot"><button class="phc-btn phc-btn--secondary" data-a="0">ยกเลิก</button><button class="phc-btn phc-btn--danger" data-a="1">${esc(okText||'ยืนยัน')}</button></div></div></div>`;

  });
}

    <div class="card" style="margin-top:14px"><h3>แยกตามชุมชน</h3><div class="table-wrap"><table class="t"><thead><tr><th>ชุมชน</th><th class="num">ผู้รับ</th><th class="num">ครั้งที่มีสิทธิ์</th><th class="num">แจกจริง</th><th class="num">ค้างรับ</th><th>ความครอบคลุม</th></tr></thead><tbody>${R.communities.map(c=>`<tr><td>${esc(c.CommunityName)}</td><td class="num">${c.recipients}</td><td class="num">${c.base}</td><td class="num">${c.received}</td><td class="num">${c.owed}</td><td>${pctBar(c.coverage)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">ไม่มีข้อมูล</td></tr>'}</tbody></table></div></div>
    <div class="card" style="margin-top:14px"><h3>รอบแจก</h3><div class="table-wrap"><table class="t"><thead><tr><th>รอบ</th><th class="num">รายชื่อ</th><th class="num">รับแล้ว</th><th class="num">ไม่มารับ</th><th class="num">ค้างรอผล</th></tr></thead><tbody>${R.rounds.map(r=>`<tr><td>${esc(r.label)}</td><td class="num">${r.counts.total}</td><td class="num">${r.counts.received}</td><td class="num">${r.counts.absent}</td><td class="num">${r.counts.held}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">ไม่มีรอบแจก</td></tr>'}</tbody></table></div></div>`;
}

/* =====================================================================
 * ตั้งค่า
 * ===================================================================== */
function renderSettings(){
  const s=S.settings, f=[['MAX_PER_YEAR','รับได้กี่ครั้งต่อปีงบประมาณ','ครั้ง'],['VALID_MONTHS','สิทธิ์ใช้ได้กี่เดือนนับจากวันประเมินผ่าน','เดือน'],['RENEW_LEAD_DAYS','ส่งประเมินซ้ำล่วงหน้ากี่วันก่อนสิทธิ์หมด','วัน'],['ASSESS_OVERDUE_DAYS','ส่งประเมินแล้วกี่วันยังไม่มีผล ให้เตือน','วัน'],['GRACE_ROUNDS','ผู้รับรายเดิม รับระหว่างรอผลประเมินได้กี่รอบ','รอบ'],['YEAR_END_MONTH','เริ่มเตือนใกล้สิ้นปีงบตั้งแต่เดือนที่ 1-9 (8 = ส.ค.)',''],['QUOTA_A','จำนวนผู้รับกลุ่ม A สูงสุด','คน'],['QUOTA_B','จำนวนผู้รับกลุ่ม B สูงสุด','คน'],['QUOTA_RESERVE','จำนวนรายชื่อสำรองสูงสุด','คน']];
  $('content').innerHTML=`<div class="page-head"><div><h2>ตั้งค่า</h2><p>ค่ากติกาของระบบ (มีผลกับการคำนวณสิทธิ์ทันที)</p></div></div>
    <div class="card" style="max-width:760px"><div class="form-grid">${f.map(x=>field(x[1]+(x[2]?' ('+x[2]+')':''),`<input class="phc-input" type="number" min="0" id="set_${x[0]}" value="${esc(s[x[0]])}">`)).join('')}${field('สถานที่แจกตั้งต้น',`<input class="phc-input" id="set_ROUND_PLACE" value="${esc(s.ROUND_PLACE)}">`)}${field('เวลาแจกตั้งต้น',`<input class="phc-input" id="set_ROUND_TIME" value="${esc(s.ROUND_TIME)}">`)}</div>
    <div class="actions" style="margin-top:14px"><button class="phc-btn" id="setSave" onclick="saveSettings()">บันทึก</button></div></div>`;
}
async function saveSettings(){ const p={}; ['MAX_PER_YEAR','VALID_MONTHS','RENEW_LEAD_DAYS','ASSESS_OVERDUE_DAYS','GRACE_ROUNDS','YEAR_END_MONTH','QUOTA_A','QUOTA_B','QUOTA_RESERVE','ROUND_PLACE','ROUND_TIME'].forEach(k=>p[k]=$('set_'+k).value.trim()); const b=$('setSave'); setBusy(b,true);
  try{ const d=await api('apiSaveSettings',p); S.settings=d.settings; S.dash=d.dashboard; updateBadges(); toast('บันทึกการตั้งค่าแล้ว'); S.list=null; S.reserve=null; }catch(e){ toast(e.message,true); } finally{ setBusy(b,false); } }

/* =====================================================================
 * พิมพ์ (PHC37Print)
 * ===================================================================== */
function kitPrint(o){ if(!window.PHC37Print){ toast('ไม่พบชุดพิมพ์มาตรฐาน',true); return; } PHC37Print.print(PHC37Print.document(Object.assign({systemName:'ระบบสนับสนุนผ้าอ้อมผู้ใหญ่',systemShort:'ผ้าอ้อม',printedBy:S.user.fullName},o)),{onDone:e=>{ if(e) toast('เปิดหน้าพิมพ์ไม่สำเร็จ: '+e.message,true); }}); }
function printRound(){
  const v=S.round, r=v.round;
  const rows=v.rows.map((x,i)=>{ const rc=x.record; let note=[]; if(x.owed) note.push('ค้าง '+x.owed+' ครั้ง'); if(x.mode==='GRACE'||(rc&&rc.Grace)) note.push('รับระหว่างรอผล'); if((rc&&rc.Status==='HELD')||(!rc&&x.mode==='HELD')) note.push('ค้างรับ (รอผลประเมิน) ยังแจกไม่ได้'); if(rc&&rc.Kind==='OFFROUND') note.push('รับนอกรอบแล้ว '+shortDate(rc.DistDate));
    const got=rc&&rc.Status==='RECEIVED'?(rc.ReceiverType==='PROXY'?'ญาติ'+(rc.ProxyName?' ('+rc.ProxyName+')':''):'รับแล้ว'):(rc&&rc.Status==='ABSENT'?'ไม่มารับ':'');
    return `<tr class="phc-p-avoid"><td class="phc-p-num">${i+1}</td><td class="phc-p-num">${esc(x.SlotLabel||'-')}</td><td>${esc(x.PatientName)}<br><span style="font-size:8pt">HN ${esc(x.HN||'-')}</span></td><td>${esc(x.CommunityName||'-')}</td><td>${esc(x.Phone||'-')}</td><td>${esc(note.join(' · '))}${got?'<br><b>'+esc(got)+'</b>':''}</td><td style="width:26%"></td></tr>`; }).join('');
  kitPrint({ title:'รายชื่อผู้รับผ้าอ้อมผู้ใหญ่ รอบ '+shortDate(r.RoundDate)+' '+GROUP_TH[r.GroupCode], docNo:'รอบที่ '+r.seqNo+'/'+r.seqTotal+' ปีงบ '+r.fy, docDate:shortDate(r.RoundDate), meta:[['เวลา',(r.RoundTime||'')+' น.'],['สถานที่',r.Place||'']],
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>ที่</th><th>ลำดับ</th><th>ชื่อ-สกุล</th><th>ชุมชน</th><th>โทร</th><th>หมายเหตุ</th><th>ลงชื่อผู้รับ (ถ้าญาติรับแทน ระบุความสัมพันธ์)</th></tr></thead><tbody>${rows||'<tr><td colspan="7">ไม่มีรายชื่อ</td></tr>'}</tbody></table><p class="phc-p-note">รวม ${v.rows.length} คน · ค้าง = ยังมีรอบที่ไม่ได้รับ ชดเชยได้ด้วยการแจกนอกรอบ</p>`,
    signatures:['ผู้จ่าย','ผู้ตรวจสอบ'] });
}
function printFollow(){
  const L=S.followRows||[], T=S.text;
  kitPrint({ title:'รายชื่อผู้รับผ้าอ้อมที่ต้องติดตาม', docDate:shortDate(todayKey()), bodyHtml:`<table class="phc-p-table"><thead><tr><th>ที่</th><th>ชื่อ-สกุล</th><th>โทร</th><th>กลุ่ม / ชุมชน</th><th>เหตุ</th><th>ติดตามล่าสุด</th><th>ผลการโทร</th></tr></thead><tbody>${L.map((f,i)=>`<tr class="phc-p-avoid"><td class="phc-p-num">${i+1}</td><td>${esc(f.PatientName)}</td><td>${esc(f.Phone||'-')}</td><td>${esc(GROUP_TH[f.GroupCode]||'')} · ${esc(f.CommunityName||'-')}</td><td>${esc(f.text)}</td><td>${f.last?esc(f.last.OutcomeTH)+(f.last.AppointDate?' '+esc(shortDate(f.last.AppointDate)):''):'-'}</td><td style="width:18%"></td></tr>`).join('')||'<tr><td colspan="7">ไม่มีรายการ</td></tr>'}</tbody></table>` });
}
async function printRegistry(){
  await loadRegistry(); const rows=S.filters.s==='vacant'?S.list.filter(r=>r.Status!=='CLOSED'):regRows();
  const ov=S.ov||{groups:{}}, q=k=>(ov.groups[k]||{});
  kitPrint({ title:'ทะเบียนผู้รับผ้าอ้อมผู้ใหญ่', docDate:shortDate(todayKey()), orientation:'landscape',
    meta:[['กลุ่ม A',(q('A').active||0)+' / '+(q('A').quota||0)+' คน'],['กลุ่ม B',(q('B').active||0)+' / '+(q('B').quota||0)+' คน'],['รายชื่อสำรอง',(ov.reserve||0)+' / '+((ov.quota||{}).RESERVE||0)+' คน']],
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>ลำดับ</th><th>เลขทะเบียน</th><th>ชื่อ-สกุล</th><th>HN</th><th>โทร</th><th>ชุมชน</th><th>สิทธิการรักษา</th><th>สถานะ</th><th>ปีงบนี้</th></tr></thead><tbody>${rows.map(r=>`<tr class="phc-p-avoid"><td class="phc-p-num">${esc(r.Status==='RESERVE'?'สำรอง '+r._ro:(r.SlotLabel||r.GroupCode||'-'))}</td><td>${esc(r.RecipientNo)}</td><td>${esc(r.PatientName)}</td><td>${esc(r.HN||'-')}</td><td>${esc(r.Phone||'-')}</td><td>${esc(r.CommunityName||'-')}</td><td>${esc(r.SubRight||r.MainRight||'-')}</td><td>${esc(r.st.label)}</td><td class="phc-p-num">${r.Status==='RESERVE'?'-':r.st.count+'/'+r.st.max}</td></tr>`).join('')}</tbody></table><p class="phc-p-note">รวม ${rows.length} คน</p>` });
}
function printReserve(){
  const R=S.reserve||{rows:[]}, ov=R.overview||{};
  kitPrint({ title:'รายชื่อสำรอง — ผ้าอ้อมผู้ใหญ่', docDate:shortDate(todayKey()), meta:[['จำนวน',(ov.reserve||R.rows.length)+' / '+((ov.quota||{}).RESERVE||'-')+' คน']],
    bodyHtml:`<table class="phc-p-table"><thead><tr><th>ลำดับ</th><th>ชื่อ-สกุล</th><th>HN</th><th>โทร</th><th>ชุมชน</th><th>ลงทะเบียน</th><th>ผลประเมิน</th></tr></thead><tbody>${R.rows.map((x,i)=>`<tr class="phc-p-avoid"><td class="phc-p-num">${i+1}</td><td>${esc(x.PatientName)}</td><td>${esc(x.HN||'-')}</td><td>${esc(x.Phone||'-')}</td><td>${esc(x.CommunityName||'-')}</td><td>${esc(shortDate(x.RegisteredDate))}</td><td>${esc(x.assess.text)}</td></tr>`).join('')||'<tr><td colspan="7">ไม่มีรายชื่อ</td></tr>'}</tbody></table><p class="phc-p-note">เรียงตามลำดับสำรอง · เข้ากลุ่มเมื่อมีลำดับว่าง</p>` });
}
function printReport(){
  const R=S.report, t=R.total, A=R.assess, pc=v=>v==null?'-':v+'%';
  const g=x=>{ const s=R.groups[x]; return `<tr><td>${GROUP_TH[x]}</td><td class="phc-p-num">${s.recipients}</td><td class="phc-p-num">${s.base}</td><td class="phc-p-num">${s.received}</td><td class="phc-p-num">${s.offRound}</td><td class="phc-p-num">${s.owed}</td><td class="phc-p-num">${s.waived}</td><td class="phc-p-num">${pc(s.coverage)}</td></tr>`; };
  kitPrint({ title:'รายงานการสนับสนุนผ้าอ้อมผู้ใหญ่ ปีงบประมาณ '+R.fy, docDate:shortDate(todayKey()), meta:[['ช่วงเวลา',shortDate(R.range.from)+' – '+shortDate(R.range.to)]],
    bodyHtml:`<div class="phc-p-section"><h2>สรุป</h2><table class="phc-p-kv"><tbody><tr><th>ผู้รับในปีงบ</th><td>${R.recipients} คน (กลุ่ม A ${R.groups.A.recipients} · กลุ่ม B ${R.groups.B.recipients})</td></tr><tr><th>แจกจริง</th><td>${t.received} ครั้ง (ในรอบ ${t.inRound} · นอกรอบ ${t.offRound} · ชดเชย ${t.compensate} · ญาติรับแทน ${t.proxy})</td></tr><tr><th>ความครอบคลุม</th><td>${pc(t.coverage)} (แจกจริง ${t.received} ÷ ครั้งที่มีสิทธิ์ ${t.base})</td></tr><tr><th>ค้างรับคงเหลือ</th><td>${t.owed} ครั้ง (ชดเชยแล้ว ${t.compensated} · สละสิทธิ์ ${t.waived})</td></tr></tbody></table></div>
      <div class="phc-p-section"><h2>แยกตามกลุ่ม</h2><table class="phc-p-table"><thead><tr><th>กลุ่ม</th><th>ผู้รับ</th><th>ครั้งที่มีสิทธิ์</th><th>แจกจริง</th><th>นอกรอบ</th><th>ค้างรับ</th><th>สละสิทธิ์</th><th>ความครอบคลุม</th></tr></thead><tbody>${g('A')}${g('B')}</tbody></table></div>
      <div class="phc-p-section"><h2>แยกตามชุมชน</h2><table class="phc-p-table"><thead><tr><th>ชุมชน</th><th>ผู้รับ</th><th>ครั้งที่มีสิทธิ์</th><th>แจกจริง</th><th>ค้างรับ</th><th>ความครอบคลุม</th></tr></thead><tbody>${R.communities.map(c=>`<tr><td>${esc(c.CommunityName)}</td><td class="phc-p-num">${c.recipients}</td><td class="phc-p-num">${c.base}</td><td class="phc-p-num">${c.received}</td><td class="phc-p-num">${c.owed}</td><td class="phc-p-num">${pc(c.coverage)}</td></tr>`).join('')}</tbody></table></div>
      <div class="phc-p-section"><h2>รายเดือน</h2><table class="phc-p-table"><thead><tr>${R.months.map(m=>`<th>${esc(m.label)}</th>`).join('')}</tr></thead><tbody><tr>${R.months.map(m=>`<td class="phc-p-num">${m.inRound+m.offRound}</td>`).join('')}</tr></tbody></table></div>
      <div class="phc-p-section"><h2>การประเมินสิทธิ์</h2><table class="phc-p-kv"><tbody><tr><th>ส่งประเมิน</th><td>${A.sent}</td></tr><tr><th>ผ่าน / ไม่ผ่าน</th><td>${A.passed} / ${A.notPassed}</td></tr><tr><th>ยังไม่สรุป / ส่งกลับ / รอผล</th><td>${A.incomplete} / ${A.returned} / ${A.pending}</td></tr><tr><th>เวลาเฉลี่ยจนได้ผล</th><td>${A.avgDays==null?'-':A.avgDays+' วัน'}</td></tr></tbody></table></div>`,
    signatures:['ผู้รายงาน','หัวหน้ากลุ่มงาน'] });
}

boot();
</script>
